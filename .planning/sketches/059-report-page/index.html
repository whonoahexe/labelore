<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 059 — Report page</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* Sketch 059: the report page (VIEW-18, Phase 11 D-03, D-16). The session report (reports/SESSION_REPORT.md,
   reports/{date}-session-report.md) and the milestone summary (reports/MILESTONE_SUMMARY-v{V}.md) are two files GSD
   writes into reports/. Three pictures of their own numbers and lists: a time ruler (A), a scorecard rail with the
   shipped status-meter (B), phase lanes (C). Each variant carries BOTH files, so the sketch settles whether they share
   one frame. Text is MADE UP (Lendshed), in the layout GSD's session-report and milestone-summary workflows wrote.
   Tokens come from ../themes/default.css; every colour is a token or a colour-mix of tokens. Four font sizes only:
   --fs-display-3 (the h1), --fs-7, --fs-4, --fs-2. */
:root {
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --veil: color-mix(in oklch, var(--muted) 55%, transparent);
  --neutral-fill: color-mix(in oklch, var(--muted-foreground) 70%, transparent);
  --hatch: repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px var(--space-1-5));
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --sq: var(--space-2-5);
  --page: calc(var(--space-8) * 40);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-4); font-weight: var(--fw-medium); line-height: var(--lh-normal); overflow-x: hidden; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--font-mono); font-size: inherit; padding: 0 var(--space-0-5); background: var(--veil); overflow-wrap: anywhere; }
[hidden] { display: none !important; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* ---------- sketch chrome (not part of the app) ---------- */
#sketch-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
#sketch-bar .lbl { color: var(--muted-foreground); white-space: nowrap; }
#sketch-bar .grp { display: flex; flex: none; gap: var(--space-1); align-items: center; }
#sketch-bar .grp + .grp { padding-left: var(--space-3); border-left: 1px solid var(--border); }
#sketch-bar .grp.line { flex-basis: 100%; padding-left: 0; border-left: 0; }
#sketch-bar a, #sketch-bar button { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; color: var(--muted-foreground); white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; }
#sketch-bar a:hover, #sketch-bar button:hover { color: var(--foreground); background: var(--state-hover); }
#sketch-bar .on { color: var(--foreground); border-color: var(--border); background: var(--state-hover); }
#sketch-bar .name { color: var(--muted-foreground); padding-inline: var(--space-1); }
@media (max-width: 42rem) { #sketch-bar { flex-wrap: nowrap; overflow-x: auto; } #sketch-bar .grp.line { flex-basis: auto; } }
#toast { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 99; max-width: 90vw; padding: var(--space-2) var(--space-3); background: var(--foreground); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); opacity: 0; pointer-events: none; }
#toast.on { opacity: 1; }

/* ---------- app shell header (outside the page, drawn as today) ---------- */
.app-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-fluid-3); border-bottom: 1px solid var(--border); }
.app-brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.app-brand i { width: var(--space-5); height: var(--space-5); background: var(--primary); }
.brand-trigger { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: var(--space-1) var(--space-2); border: 1px solid transparent; font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.app-nav { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-left: auto; }
.app-nav a { padding: var(--space-1-5) var(--space-2-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
@media (max-width: 42rem) { .app-nav { display: none; } }

/* ---------- page atoms (the four sizes: display h1 / heading fs-7 / body fs-4 / label fs-2) ---------- */
.page { display: grid; gap: var(--space-8); align-content: start; width: min(var(--page), 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); }
.crumbs [aria-current] { color: var(--foreground); overflow-wrap: anywhere; }
.heading-block { display: grid; gap: var(--space-3); min-width: 0; }
.eyebrow { display: flex; gap: var(--space-2); align-items: center; color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
h1 { font-size: var(--fs-display-3); font-weight: var(--fw-semibold); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); overflow-wrap: anywhere; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); min-width: 0; }
.meta { color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); }
.micro-label { margin: 0; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
h2.sh { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); }
.sentence { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); overflow-wrap: anywhere; }
.btn-xs { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1-5); min-height: var(--space-7); padding-inline: var(--space-3); border: 1px solid var(--border); font-family: var(--font-sans); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.btn-xs:hover { background: var(--state-hover); }
.btn-xs[aria-pressed='true'] { background: var(--muted); }
@media (pointer: coarse) { .btn-xs { min-height: var(--space-10); } }
.seg { display: inline-flex; }
.seg .btn-xs + .btn-xs { border-left: 0; }
.text-link { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.text-link:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: var(--space-0-5); }
.status-chip { display: inline-flex; gap: var(--space-1-5); align-items: center; width: fit-content; max-width: 100%; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--veil); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; white-space: nowrap; }
.status-chip[data-tone='complete'] { border-color: var(--primary-border); background: var(--primary-tint); color: var(--primary); }
.status-chip[data-tone='in-flight'] { border-color: var(--in-flight-border); color: var(--in-flight-fill); }
.status-chip[data-tone='quiet'] { color: var(--muted-foreground); border-style: dashed; background: transparent; }
.sq { display: inline-block; width: var(--sq); height: var(--sq); flex: none; border: 1px solid var(--border); }
.sq[data-tone='complete'] { background: var(--primary); border-color: var(--primary); }
.sq[data-tone='in-flight'] { background: var(--in-flight-fill); border-color: var(--in-flight-fill); }
.sq[data-tone='quiet'] { background: transparent; border: 1px dashed var(--muted-foreground); }
.sq[data-tone='neutral'] { background: var(--neutral-fill); border-color: var(--muted-foreground); }
.source-note { color: var(--muted-foreground); }
.prose { max-width: 62ch; }
.mono { font-family: var(--font-mono); }
.ellip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* closed bars (shared with every earlier sketch) */
.bars { display: grid; border-top: 1px solid var(--border); }
.bar { border-bottom: 1px solid var(--border); }
.bar > summary { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); min-height: var(--space-10); padding-inline: var(--space-2); cursor: pointer; list-style: none; font-weight: var(--fw-semibold); min-width: 0; }
.bar > summary::-webkit-details-marker { display: none; }
.bar > summary:hover { background: var(--state-hover); }
.bar[open] > summary .chev { transform: rotate(90deg); }
.bar > summary .n { margin-left: auto; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.bar-body { display: grid; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-6) calc(var(--icon) + var(--space-4)); min-width: 0; }
@media (max-width: 42rem) { .bar-body { padding-left: var(--space-2); } }


/* the reference list (shared): only a reference that resolves is a link */
.ref-list { display: grid; gap: var(--space-2); }
.ref-list li { display: grid; grid-template-columns: var(--sq) minmax(0, 1fr); gap: var(--space-2); align-items: baseline; min-width: 0; }
.ref-list .sq { transform: translateY(var(--space-0-5)); }
.ref-list .path { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.ref-list a.path { text-decoration: underline; text-underline-offset: var(--space-0-5); text-decoration-color: var(--border); }
.ref-list a.path:hover { text-decoration-color: var(--foreground); }
.ref-list .why { display: block; color: var(--muted-foreground); }
.dots { display: grid; gap: var(--space-2); }
.dots li { display: grid; grid-template-columns: var(--sq) minmax(0, 1fr); gap: var(--space-2); align-items: baseline; min-width: 0; }
.dots li::before { content: ''; width: var(--space-1-5); height: var(--space-1-5); margin: var(--space-1-5) var(--space-1); background: var(--muted-foreground); grid-column: 1; }
.dots li > span { grid-column: 2; min-width: 0; overflow-wrap: anywhere; }
.page section { display: grid; gap: var(--space-3); min-width: 0; align-content: start; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-8); align-items: start; }
.cols > div { display: grid; gap: var(--space-6); min-width: 0; align-content: start; }
@media (max-width: 52rem) { .cols { grid-template-columns: minmax(0, 1fr); gap: var(--space-6); } }


/* ---------- additions for sketch 059 ---------- */
.sq[data-tone='missing'] { background: transparent; border: 2px solid var(--missing-fill); }
.numeral { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); overflow-wrap: anywhere; }
.num { display: grid; gap: var(--space-1); min-width: 0; align-content: start; }
.num .meta { overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.olr { display: grid; gap: var(--space-2-5); counter-reset: o; }
.olr li { display: grid; grid-template-columns: var(--space-6) minmax(0, 1fr); gap: var(--space-2); align-items: baseline; min-width: 0; }
.olr li::before { counter-increment: o; content: counter(o); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--muted-foreground); }
.olr li > span { min-width: 0; overflow-wrap: anywhere; }
.flagbox { display: grid; gap: var(--space-2-5); padding: var(--space-3) var(--space-4); border: 1px solid var(--in-flight-border); border-left: 4px solid var(--in-flight-fill); background: var(--veil); min-width: 0; }
.flagbox ul { display: grid; gap: var(--space-2-5); }
.flagbox li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-2); align-items: baseline; min-width: 0; }
.flagbox li > span:last-child { overflow-wrap: anywhere; }
.clearbox { display: flex; gap: var(--space-2); align-items: baseline; padding: var(--space-3) var(--space-4); border: 1px dashed var(--muted-foreground); color: var(--muted-foreground); }
.insdel { display: grid; gap: var(--space-1-5); }
.insdel .bar2 { display: flex; height: var(--space-3); border: 1px solid var(--border); }
.insdel .bar2 i { display: block; height: 100%; }
.insdel .bar2 .ins { background: var(--foreground); }
.insdel .bar2 .del { background: var(--hatch); }
.dirs { display: grid; gap: var(--space-2); }
.dirs li { display: grid; gap: var(--space-0-5); min-width: 0; }
.dirs code { font-size: var(--fs-2); font-weight: var(--fw-semibold); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { text-align: left; padding: var(--space-1-5) var(--space-2); border-bottom: 1px solid var(--border-faint); vertical-align: top; }
.tbl th { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.tbl .id { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); white-space: nowrap; }
.fold-scroll { overflow-x: auto; max-height: calc(var(--space-8) * 14); border: 1px solid var(--border-faint); }
.idx { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.idx a { display: inline-flex; gap: var(--space-1-5); align-items: center; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.idx a:hover { background: var(--state-hover); }
.idx a b { font-weight: var(--fw-semibold); color: var(--muted-foreground); }
.drow { display: grid; grid-template-columns: var(--sq) minmax(0, 1fr); gap: var(--space-2) var(--space-3); align-items: baseline; padding: var(--space-2-5) 0; border-top: 1px solid var(--border-faint); min-width: 0; }
.drow:first-child { border-top: 0; }
.drow .sq { transform: translateY(var(--space-0-5)); }
.drow .t { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); align-items: baseline; font-weight: var(--fw-semibold); }
.drow p { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.creq { display: grid; gap: var(--space-2-5); }
.creq .row { display: grid; grid-template-columns: var(--sq) minmax(0, 1fr); gap: var(--space-2) var(--space-3); align-items: baseline; min-width: 0; }
.creq .row .sq { transform: translateY(var(--space-0-5)); }
.creq .nm { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); align-items: baseline; font-weight: var(--fw-semibold); }
.ids { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); margin-top: var(--space-1); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); }
.ids span { display: inline-flex; align-items: center; gap: var(--space-1); }
.ids .sq { --sq: var(--space-2); }
.verdict { padding-top: var(--space-2); color: var(--muted-foreground); }
.pbars { display: grid; gap: var(--space-1-5); }
.pbars li { display: grid; grid-template-columns: calc(var(--space-8) * 2.5) minmax(0, 1fr) var(--space-6); gap: var(--space-2); align-items: center; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); }
.pbars .b { height: var(--space-2-5); background: var(--primary); }
.pbars .n { text-align: right; font-weight: var(--fw-semibold); }
.stack { display: grid; gap: var(--space-8); min-width: 0; }
.stack > section { display: grid; gap: var(--space-3); }

/* =====================================================================
   A: Time ruler — a ruler of the session's own clock (first to last commit on a 24 hour axis), or of the milestone's
   calendar with a tick where each phase was delivered; the numerals above it, a phase strip under it
   ===================================================================== */
.a-card { border: 1px solid var(--border); background: var(--card); min-width: 0; }
.a-card > section { padding: var(--space-4) var(--space-5); }
.a-card > section + section { border-top: 1px solid var(--border-faint); }
.a-nums { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: var(--space-5) var(--space-6); }
.axis { position: relative; height: calc(var(--space-8) * 2); margin-inline: var(--space-3); }
.axis .base { position: absolute; left: 0; right: 0; top: var(--space-6); border-top: 2px solid var(--muted-foreground); }
.axis .base.ghost { border-top-style: dashed; }
.axis .tk { position: absolute; top: calc(var(--space-6) - var(--space-1-5)); height: var(--space-1-5); border-left: 1px solid var(--muted-foreground); }
.axis .tk.major { top: calc(var(--space-6) - var(--space-2)); height: var(--space-2); border-left-width: 2px; }
.axis .tl { position: absolute; top: calc(var(--space-6) + var(--space-2)); transform: translateX(-50%); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); white-space: nowrap; }
.axis .tl.up { top: 0; }
.axis .tl.l { transform: none; }
.axis .tl.r { transform: translateX(-100%); }
.axis .span { position: absolute; top: calc(var(--space-6) - var(--space-3)); height: var(--space-3); background: var(--foreground); }
.axis .sl { position: absolute; top: 0; line-height: var(--space-4); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); white-space: nowrap; }
.axis .sl.s { transform: translateX(-100%); padding-right: var(--space-1); }
.axis .sl.e { transform: none; padding-left: var(--space-1); }
.axis .none { position: absolute; left: 50%; top: calc(var(--space-6) - var(--space-3)); transform: translateX(-50%); background: var(--background); }
.axis .mk { position: absolute; top: calc(var(--space-6) - var(--space-2-5)); width: var(--space-5); height: var(--space-5); transform: translateX(-50%); display: grid; place-items: center; background: var(--primary); border: 2px solid var(--background); outline: 1px solid var(--primary); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); color: var(--background); }
.axis .mk.last { transform: translateX(-100%); }
.axis .md { position: absolute; top: calc(var(--space-6) + var(--space-3)); transform: translateX(-50%); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); white-space: nowrap; }
.axis .md.r { transform: translateX(-100%); }
.a-phases { display: grid; grid-template-columns: repeat(var(--np, 4), minmax(0, 1fr)); gap: var(--space-1-5); }
.a-phases .ph { display: grid; gap: var(--space-1-5); padding: var(--space-2) var(--space-3); border: 1px dashed var(--muted-foreground); min-width: 0; }
.a-phases .ph[data-tone='complete'] { border: 1px solid var(--primary-border); background: var(--primary-tint); }
.a-phases .ph.touch { outline: 2px solid var(--foreground); outline-offset: 1px; }
.a-phases .ph .micro-label { color: inherit; }
.a-phases .ph .w { color: var(--muted-foreground); }
.a-cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-8); align-items: start; }
.a-cols > div { display: grid; gap: var(--space-6); min-width: 0; align-content: start; }
@media (max-width: 52rem) { .a-cols { grid-template-columns: minmax(0, 1fr); gap: var(--space-6); } .a-nums { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* =====================================================================
   B: Scorecard rail — the shipped status-meter in a narrow rail of headline numbers, the body streaming beside it
   ===================================================================== */
.b-grid { display: grid; grid-template-columns: calc(var(--space-8) * 10) minmax(0, 1fr); gap: var(--space-8); align-items: start; }
.b-rail { display: grid; gap: 0; border: 1px solid var(--border); background: var(--card); position: sticky; top: calc(var(--space-10) + var(--space-8)); min-width: 0; }
.b-rail > div { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); min-width: 0; align-content: start; }
.b-rail > div + div { border-top: 1px solid var(--border-faint); }

}).join('')}</div><p class="verdict"><strong>Audit verdict:</strong> ${esc(MS.verdict)}</p></section>`;
const decisionsFold = () => `<section id="sec-5"><h2 class="sh">Key decisions</h2><ul class="pbars" aria-label="Decisions per phase">${[1, 2, 3, 4].map((p) => `<li><span>Phase ${p}</span><i class="b" style="width:${pct(decCount(p) / 5)}"></i><span class="n">${decCount(p)}</span></li>`).join('')}</ul>
  <details class="bar"><summary>${ICON.chev}<span>Every decision, in the file’s order</span><span class="n">${MS.decisions.length} rows</span></summary><div class="bar-body"><div class="fold-scroll"><table class="tbl"><thead><tr><th>ID</th><th>Phase</th><th>Decision</th><th>Rationale</th></tr></thead><tbody>${MS.decisions.map((d) => `<tr><td class="id">${d[0]}</td><td class="id">${d[1]}</td><td>${esc(d[2])}</td><td class="source-note">${esc(d[3])}</td></tr>`).join('')}</tbody></table></div></div></details></section>`;
const debtSec = () => `<section id="sec-6"><h2 class="sh">Tech debt and deferred</h2>
  <ul class="dots">${MS.debt.items.map((d) => `<li><span>${esc(d)}</span></li>`).join('')}</ul>
  <p class="prose"><strong>Verification gaps:</strong> ${esc(MS.debt.gaps)}</p><p class="prose"><strong>Lessons:</strong> ${esc(MS.debt.lessons)}</p><p class="prose"><strong>Deferred ideas:</strong> ${esc(MS.debt.ideas)}</p></section>`;
const overviewBar = () => `<details class="bar" id="sec-1"><summary>${ICON.chev}<span>1 · Project overview</span></summary><div class="bar-body"><p class="prose">${esc(MS.overview.lede)}</p><ul class="dots">${MS.overview.items.map((i) => `<li><span><strong>${i[0]}:</strong> ${esc(i[1])}</span></li>`).join('')}</ul></div></details>`;
const archBar = () => `<details class="bar" id="sec-2"><summary>${ICON.chev}<span>2 · Architecture and technical decisions</span><span class="n">${MS.arch.length} decisions</span></summary><div class="bar-body"><ul class="dots">${MS.arch.map((a) => `<li><span><strong>${esc(a[0])}</strong> ${esc(a[1])} <span class="status-chip">Phase ${a[2]}</span></span></li>`).join('')}</ul></div></details>`;
const startBar = () => `<details class="bar" id="sec-7"><summary>${ICON.chev}<span>7 · Getting started</span></summary><div class="bar-body"><ul class="dots">${MS.start.map((s) => `<li><span><strong>${s[0]}:</strong> ${s[1]}</span></li>`).join('')}</ul></div></details>`;
const msFolds = () => `<div class="bars">${overviewBar()}${archBar()}${startBar()}</div>`;
const statsCells = () => [stat('Timeline', `${MS.stats.days} days`, `${MS.stats.from} → ${MS.stats.to}`), stat('Phases', MS.stats.phases.split(' ')[0] + ' / ' + MS.stats.phases.split(' ')[2], 'complete'), stat('Commits', MS.stats.commits), stat('Files changed', MS.stats.fileN, MS.stats.files), stat('Contributors', '2', MS.stats.who)];

const VIEWS = {}; const ACTS = {};

// ---------- A: Time ruler ----------
function clockAxis(r) {
  const d = r.duration;
  const major = [0, 6, 12, 18, 24].map((h) => `<i class="tk major" style="left:${pct(h / 24)}"></i><span class="tl${h === 0 ? ' l' : h === 24 ? ' r' : ''}" style="left:${pct(h / 24)}">${String(h).padStart(2, '0')}:00</span>`).join('');
  const minor = Array.from({ length: 23 }, (_, i) => i + 1).filter((h) => h % 6).map((h) => `<i class="tk" style="left:${pct(h / 24)}"></i>`).join('');
  if (!d.stamps) return `<div class="axis" role="img" aria-label="No first and last commit stamps in the file"><i class="base ghost"></i>${minor}${major}<span class="none status-chip" data-tone="quiet">${esc(d.text)}</span></div>`;
  const hm = (s) => { const [h, m] = s.split(':').map(Number); return (h + m / 60) / 24; };
  const a = hm(d.from); const b = hm(d.to);
  return `<div class="axis" role="img" aria-label="First commit ${d.from}, last commit ${d.to}"><i class="base"></i>${minor}${major}<i class="span" style="left:${pct(a)};width:${pct(b - a)}"></i><span class="sl s" style="left:${pct(a)}">${d.from}</span><span class="sl e" style="left:${pct(b)}">${d.to}</span></div>`;
}
function calAxis() {
  const total = MS.stats.days;
  const months = [['Feb', '2026-02-01'], ['Mar', '2026-03-01']].map(([n, iso]) => `<i class="tk major" style="left:${pct(dayN(iso) / total)}"></i><span class="tl up" style="left:${pct(dayN(iso) / total)}">${n}</span>`).join('');
  const ends = `<span class="tl l" style="left:0">${MS.stats.from}</span><span class="tl r" style="left:100%">${MS.stats.to}</span>`;
  const marks = MS.phases.map((p, i) => { const x = dayN(p[3]) / total; const last = x >= 0.999; return `<span class="mk${last ? ' last' : ''}" style="left:${pct(x)}" title="Phase ${p[0]} ${p[3]}">${p[0]}</span><span class="md${last ? ' r' : ''}" style="left:${pct(x)}">${p[3].slice(5)}</span>`; }).join('');
  return `<div class="axis" role="img" aria-label="Timeline ${MS.stats.from} to ${MS.stats.to}, ${MS.stats.days} days, a mark where each phase was delivered"><i class="base"></i>${months}${marks}</div>`;
}
function phaseStrip(r) {
  const n = r.phases.total;
  return `<div class="a-phases" style="--np:${n}" role="img" aria-label="${r.phases.done} of ${n} phases done">${Array.from({ length: n }, (_, i) => { const ph = i + 1; const done = ph <= r.phases.done; const t = r.phases.touched.includes(ph); return `<div class="ph${t ? ' touch' : ''}" data-tone="${done ? 'complete' : 'quiet'}"><span class="micro-label">Phase ${ph}</span><span class="w">${done ? 'done' : 'not done'}${t ? ' · touched' : ''}</span></div>`; }).join('')}</div>`;
}
VIEWS.a = () => {
  const r = cur();
  if (r.kind === 'milestone') {
    return `<div class="page">${head(r)}${sectionIndex()}
      <div class="a-card" id="sec-8">
        <section><div class="a-nums" style="--cols:5">${statsCells().join('')}</div></section>
        <section><span class="micro-label">Calendar · a mark where each phase was delivered</span>${calAxis()}</section>
      </div>
      <div class="a-cols"><div>${phaseRows()}${debtSec()}</div><div>${reqRows()}${decisionsFold()}</div></div>
      ${msFolds()}</div>`;
  }
  return `<div class="page">${head(r)}
    <div class="a-card">
      <section><div class="a-nums">${numDuration(r)}${numCommits(r)}${numPlans(r)}</div></section>
      <section><span class="micro-label">${r.duration.stamps ? 'First to last commit · a 24 hour day' : 'No commit stamps in the file'}</span>${clockAxis(r)}</section>
      <section><span class="micro-label">Phase progress</span>${phaseStrip(r)}<p class="prose source-note">${esc(r.progress)}</p></section>
    </div>
    <div class="a-cols"><div>${outcomesSec(r)}${touchedSec(r)}${decisionsSec(r)}</div><div>${blockersSec(r)}${sessionFolds(r)}</div></div></div>`;
};

// ---------- B: Scorecard rail ----------
const meter = (items, label, cap, large) => `<div class="status-meter" data-size="${large ? 'large' : 'default'}" role="img" aria-label="${esc(label)}"><span class="status-meter-cap" aria-hidden="true">${cap}</span><span class="status-meter-cells" aria-hidden="true">${items.map((t) => `<i class="sq status-meter-sq" data-tone="${t}"></i>`).join('')}</span></div>`;
const tally = (n) => `<span class="tally" role="img" aria-label="${n} commits">${Array.from({ length: n }, (_, i) => `<i${(i + 1) % 5 === 0 && i + 1 < n ? ' class="five"' : ''}></i>`).join('')}</span>`;
VIEWS.b = () => {
  const r = cur();
  if (r.kind === 'milestone') {
    const rail = `<aside class="b-rail" id="sec-8" aria-label="Stats">
      <div>${stat('Timeline', `${MS.stats.days} days`, `${MS.stats.from} → ${MS.stats.to}`)}</div>
      <div>${stat('Phases', '4 / 4', 'complete')}${meter([1, 2, 3, 4].map(() => 'complete'), '4 of 4 phases complete', '4 of 4 phases', true)}</div>
      <div>${stat('Commits', MS.stats.commits)}</div>
      <div>${stat('Files changed', MS.stats.fileN)}<div class="insdel"><div class="bar2"><i class="ins" style="width:${pct(9840 / (9840 + 1206))}"></i><i class="del" style="width:${pct(1206 / (9840 + 1206))}"></i></div><span class="meta">9,840 insertions(+), 1,206 deletions(-)</span></div></div>
      <div>${stat('Contributors', '2', MS.stats.who)}</div></aside>`;
    return `<div class="page">${head(r)}${sectionIndex()}<div class="b-grid">${rail}<div class="b-stream">${phaseRows()}${reqRows()}${decisionsFold()}${debtSec()}${msFolds()}</div></div></div>`;
  }
  const p = r.phases;
  const ph = Array.from({ length: p.total }, (_, i) => (i < p.done ? 'complete' : 'quiet'));
  const pl = Array.from({ length: r.planTotal }, () => 'complete');
  const from = r.duration.stamps ? r.duration.from : null;
  const clock = from ? (() => { const hm = (s) => { const [h, m] = s.split(':').map(Number); return (h + m / 60) / 24; }; const a = hm(r.duration.from); const b = hm(r.duration.to); return `<div class="clockmini" role="img" aria-label="First commit ${r.duration.from}, last commit ${r.duration.to} on a 24 hour day"><i style="left:${pct(a)};width:${pct(b - a)}"></i></div>`; })() : `<div class="clockmini" style="border-style:dashed" role="img" aria-label="No commit stamps in the file"></div>`;
  const rail = `<aside class="b-rail" aria-label="Headline numbers">
      <div>${numDuration(r)}${clock}</div>
      <div>${numCommits(r)}${tally(r.commits)}</div>
      <div>${numPlans(r)}${meter(pl, `${r.planTotal} of ${r.planTotal} plans executed in Phase ${r.planPhase}`, `Phase ${r.planPhase} · ${r.planTotal} of ${r.planTotal} plans`)}</div>
      <div><span class="micro-label">Phase progress</span>${meter(ph, `${p.done} of ${p.total} phases done`, `${p.done} of ${p.total} phases`, true)}</div></aside>`;
  return `<div class="page">${head(r)}<div class="b-grid">${rail}<div class="b-stream">${blockersSec(r)}${outcomesSec(r)}${touchedSec(r)}${progressSentence(r) ? `<section><h2 class="sh">Phase progress</h2>${progressSentence(r).replace('<span class="micro-label">Phase progress</span><br>', '')}</section>` : ''}${decisionsSec(r)}${sessionFolds(r)}</div></div></div>`;
};

// ---------- C: Phase lanes ----------
function sessionLanes(r) {
  const total = r.phases.total;
  const rows = Array.from({ length: total }, (_, i) => {
    const ph = i + 1; const t = r.touched.find((x) => x.ph === ph); const bl = r.blockers.filter((b) => b.ph === ph);
    const done = ph <= r.phases.done;
    if (!t && !bl.length) return `<div class="lane ghost"><div class="lbl">${sq(done ? 'complete' : 'quiet')}<span class="ph-name">Phase ${ph}</span></div><div><span class="meta">${done ? 'Done, not touched this session' : 'Not touched this session'}</span></div><div></div></div>`;
    const planChips = ph === r.planPhase ? `<div class="planrow">${r.plans.ids.map((id) => `<span class="status-chip" data-tone="complete">${esc(id)}</span>`).join('')}</div><span class="meta">${r.plans.n} of ${r.planTotal} plans this session</span>` : '';
    return `<div class="lane"><div><div class="lbl">${sq(done ? 'complete' : 'quiet')}<span class="ph-name">Phase ${ph}${t ? ` — ${esc(t.name)}` : ''}</span></div><span class="status-chip" data-tone="${done ? 'complete' : 'quiet'}">${done ? 'Complete' : 'Touched'}</span></div>
      <div>${planChips}${t ? `<p class="prose">${esc(t.text)}</p>` : ''}</div>
      <div>${bl.map((b) => `<div class="lane-flag">${sq('in-flight')}<span>${esc(b.t)}</span></div>`).join('')}</div></div>`;
  });
  const whole = r.blockers.filter((b) => !b.ph);
  if (whole.length) rows.push(`<div class="lane"><div><div class="lbl">${sq('quiet')}<span class="ph-name">Whole project</span></div></div><div><span class="meta">Not tied to a phase</span></div><div>${whole.map((b) => `<div class="lane-flag">${sq('in-flight')}<span>${esc(b.t)}</span></div>`).join('')}</div></div>`);
  return `<div class="c-lanes"><div class="lane-head"><span class="micro-label">Phase</span><span class="micro-label">Plans and work</span><span class="micro-label">Blockers and open items</span></div>${rows.join('')}</div>`;
}
function msLanes() {
  const rows = MS.phases.map((p) => {
    const rq = MS.reqs.find((x) => x[4] === p[0]); const ids = reqIds(rq); const all = ids.every((x) => x.ok);
    return `<div class="lane"><div><div class="lbl">${sq('complete')}<span class="ph-name">Phase ${p[0]} — ${esc(p[1])}</span></div><div class="chips"><span class="status-chip" data-tone="complete">${esc(p[2])}</span><span class="meta">${esc(p[3])}</span></div></div>
      <div><p class="prose">${esc(p[4])}</p><span class="meta">${decCount(p[0])} decisions in the log</span></div>
      <div><div class="chips"><span class="micro-label">${esc(rq[0])}</span>${covChip(all)}</div><div class="reqsq">${ids.map((x) => `<span>${sq(x.ok ? 'complete' : 'quiet')}${x.id}</span>`).join('')}</div></div></div>`;
  });
  return `<div class="c-lanes" id="sec-3"><div class="lane-head"><span class="micro-label">Phases delivered</span><span class="micro-label">What shipped</span><span class="micro-label">Requirements coverage</span></div>${rows.join('')}</div>`;
}
VIEWS.c = () => {
  const r = cur();
  if (r.kind === 'milestone') {
    return `<div class="page">${head(r)}${sectionIndex()}
      <div class="c-strip" id="sec-8" style="--cols:5">${statsCells().join('')}</div>
      ${msLanes()}
      <p class="prose" id="sec-4"><span class="micro-label">Audit verdict</span><br>${esc(MS.verdict)}</p>
      <div class="c-below"><div>${decisionsFold()}</div><div>${debtSec()}</div></div>
      ${msFolds()}</div>`;
  }
  return `<div class="page">${head(r)}
    <div class="c-strip">${numDuration(r)}${numCommits(r)}${numPlans(r)}</div>
    ${sessionLanes(r)}
    ${r.blockers.length ? '' : blockersSec(r)}
    <div class="c-below"><div>${outcomesSec(r)}</div><div>${decisionsSec(r)}${progressSentence(r) ? `<section><h2 class="sh">Phase progress</h2>${progressSentence(r).replace('<span class="micro-label">Phase progress</span><br>', '')}</section>` : ''}${sessionFolds(r)}</div></div></div>`;
};

// ---------- render orchestration ----------
const pickVariant = () => { const h = location.hash.slice(1); return ['a', 'b', 'c'].includes(h) ? h : 'a'; };
function render() {
  const y = window.scrollY; const v = pickVariant();
  document.documentElement.classList.toggle('dark', theme === 'dark');
  document.getElementById('apphead').innerHTML = header();
  document.querySelectorAll('[data-variant]').forEach((el) => { el.hidden = el.dataset.variant !== v; if (el.dataset.variant !== v) el.innerHTML = ''; });
  document.querySelector(`[data-variant="${v}"]`).innerHTML = VIEWS[v]();
  document.querySelectorAll('#tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === v));
  document.querySelectorAll('#sketch-bar [data-theme]').forEach((b) => b.classList.toggle('on', b.dataset.theme === theme));
  document.querySelectorAll('#sketch-bar [data-state]').forEach((b) => b.classList.toggle('on', b.dataset.state === S.state));
  window.scrollTo(0, y);
}
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1600); }
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act], [data-state], [data-theme]');
  if (!el) return;
  if (el.dataset.theme) { theme = el.dataset.theme; return render(); }
  if (el.dataset.state) { S.state = el.dataset.state; return render(); }
  const act = el.dataset.act;
  if (act === 'noop') {
    e.preventDefault();
    const href = el.getAttribute('href');
    if (href && href.startsWith('#sec-')) { const t = document.querySelector(href); if (t) { if (t.tagName === 'DETAILS') t.open = true; t.scrollIntoView({ block: 'start' }); } return; }
    toast('Sketch only'); return;
  }
  if (ACTS[act]) { e.preventDefault(); ACTS[act](el, e); }
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
