<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const state = { dg: 'b', tr: 'b', doc: 'lab02', theme: 'dark', width: 'full', fit: false, grid: false, overlay: false, changedOnly: false, collapsed: new Set() };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function md(src) {
  if (src == null) return '';
  let s = esc(String(src).replace(/\[(VERIFIED|CITED|ASSUMED)(?::[^\]]*)?\]/g, ''));
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
}
const txt = id => document.getElementById(id).textContent;
const BOX = '─│┌┐└┘├┤┬┴┼', ARW = '▼▲►◄→←↑↓';

/* ---------- A: framed ASCII ---------- */
const glyphs = t => t.split('\n').map(l => `<span class="ln">${glyphsLine(l) || ' '}</span>`).join('');
const glyphsLine = t => esc(t).replace(/([─│┌┐└┘├┤┬┴┼]+)/g, '<span class="g-line">$1</span>').replace(/([▼▲►◄→←↑↓])/g, '<span class="g-arrow">$1</span>');

/* ---------- B: lifted ----------
   1. Pad the text into a char grid.
   2. Boxes: every ┌ that closes into a ┐ / └ / ┘ rectangle becomes a card; its border glyphs are
      blanked (the card draws the border) except where a connector meets it.
   3. Box-less diagrams: text runs (split on 2+ spaces or arrows outside brackets) become nodes;
      vertically adjacent runs that overlap in columns merge into one node card.
   4. Text outside any card in a boxed diagram is annotation → muted italic. */
function liftModel(text) {
  const lines = text.split('\n'); const W = Math.max(...lines.map(l => [...l].length));
  const g = lines.map(l => { const a = [...l]; while (a.length < W) a.push(' '); return a; });
  const H = g.length, at = (r, c) => (g[r] && g[r][c]) || ' ';
  const boxes = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (at(r, c) !== '┌') continue;
    let c2 = c + 1; while (c2 < W && '─┬┴┼'.includes(at(r, c2))) c2++;
    if (at(r, c2) !== '┐') continue;
    let r2 = r + 1; while (r2 < H && '│├┤┼'.includes(at(r2, c))) r2++;
    if (at(r2, c) !== '└' || at(r2, c2) !== '┘') continue;
    boxes.push({ r1: r, c1: c, r2, c2, kind: 'box' });
  }
  const inBox = (r, c) => boxes.some(b => r > b.r1 && r < b.r2 && c > b.c1 && c < b.c2);
  const onBorder = (r, c) => boxes.some(b => ((r === b.r1 || r === b.r2) && c >= b.c1 && c <= b.c2) || ((c === b.c1 || c === b.c2) && r >= b.r1 && r <= b.r2));
  // blank borders; keep a connector stub where a line leaves the box (┬ ┴ ├ ┤ → │/─ outside only)
  boxes.forEach(b => {
    for (let c = b.c1; c <= b.c2; c++) { for (const r of [b.r1, b.r2]) { g[r][c] = ' '; } }
    for (let r = b.r1; r <= b.r2; r++) { for (const c of [b.c1, b.c2]) { if (BOX.includes(g[r][c])) g[r][c] = ' '; } }
  });
  // text runs
  const runs = [];
  for (let r = 0; r < H; r++) {
    let c = 0;
    while (c < W) {
      const ch = g[r][c];
      if (ch === ' ' || BOX.includes(ch) || ARW.includes(ch) || ch === '•') { c++; continue; }
      let e = c, depth = 0, gap = 0;
      while (e < W) {
        const x = g[r][e];
        if (x === '(' || x === '{' || x === '[') depth++;
        if (x === ')' || x === '}' || x === ']') depth = Math.max(0, depth - 1);
        if (BOX.includes(x) || (ARW.includes(x) && depth === 0)) break;
        if (x === ' ') { gap++; if (gap >= 2 && depth === 0) break; } else gap = 0;
        e++;
      }
      let end = e; while (end > c && g[r][end - 1] === ' ') end--;
      runs.push({ r, c1: c, c2: end - 1, box: inBox(r, c) });
      c = e;
    }
  }
  // a source line that overruns its box by a char or two (e.g. BROADCAST BUS) widens that box only
  boxes.forEach(b => { const c0 = b.c2; runs.forEach(run => { if (run.r > b.r1 && run.r < b.r2 && run.c1 > b.c1 && run.c1 < c0 && run.c2 >= c0 && run.c2 <= c0 + 2) b.c2 = Math.max(b.c2, run.c2 + 2); });
    for (let r = b.r1 + 1; r < b.r2; r++) for (let c = c0 + 1; c <= b.c2; c++) if (BOX.includes(g[r][c])) g[r][c] = ' '; });
  const nodes = [];
  if (!boxes.length) {
    runs.forEach(run => {
      const n = nodes.find(n => n.r2 === run.r - 1 && run.c1 <= n.c2 + 1 && run.c2 >= n.c1 - 1);
      if (n) { n.r2 = run.r; n.c1 = Math.min(n.c1, run.c1); n.c2 = Math.max(n.c2, run.c2); n.lines.push(run); }
      else nodes.push({ r1: run.r, r2: run.r, c1: run.c1, c2: run.c2, lines: [run], kind: 'node' });
    });
  }
  return { g, H, W, boxes, nodes, runs };
}
function liftHTML(text) {
  const m = liftModel(text);
  const cls = Array.from({ length: m.H }, () => Array(m.W).fill(''));
  m.runs.forEach(run => {
    const node = m.nodes.find(n => run.r >= n.r1 && run.r <= n.r2 && run.c1 >= n.c1 && run.c2 <= n.c2);
    const k = run.box ? (m.boxes.find(b => run.r === b.r1 + 1 && run.c1 > b.c1 && run.c1 < b.c2) ? 't-node' : '') : node ? (node.r1 === run.r ? 't-node' : 't-sub') : m.boxes.length ? 'g-note' : 't-node';
    for (let c = run.c1; c <= run.c2; c++) cls[run.r][c] = k;
  });
  const html = m.g.map((row, r) => {
    let out = '', cur = null, buf = '';
    const flush = () => { if (buf) out += cur ? `<span class="${cur}">${esc(buf)}</span>` : esc(buf); buf = ''; };
    row.forEach((ch, c) => {
      const k = BOX.includes(ch) ? 'g-line' : ARW.includes(ch) ? 'g-arrow' : cls[r][c];
      if (k !== cur) { flush(); cur = k; }
      buf += ch;
    });
    flush();
    return `<span class="ln">${out.replace(/\s+$/, '') || ' '}</span>`;
  }).join('');
  return { html, cards: [...m.boxes, ...m.nodes] };
}
function placeCards(host) {
  const pre = host.querySelector('pre'); const cards = JSON.parse(host.dataset.cards);
  const probe = document.createElement('span'); probe.textContent = 'M'.repeat(100); probe.style.visibility = 'hidden'; pre.appendChild(probe);
  const cw = probe.getBoundingClientRect().width / 100; probe.remove();
  const lh = pre.querySelector('.ln').getBoundingClientRect().height;
  host.querySelectorAll('.lift-card').forEach(x => x.remove());
  cards.forEach((b, i) => {
    const d = document.createElement('div'); d.className = 'lift-card ' + b.kind; d.dataset.i = i;
    if (b.kind === 'box') Object.assign(d.style, { left: (b.c1 + 0.5) * cw + 'px', top: (b.r1 + 0.5) * lh + 'px', width: (b.c2 - b.c1) * cw + 'px', height: (b.r2 - b.r1) * lh + 'px' });
    else Object.assign(d.style, { left: (b.c1 - 0.7) * cw + 'px', top: (b.r1 - 0.22) * lh + 'px', width: (b.c2 - b.c1 + 2.4) * cw + 'px', height: (b.r2 - b.r1 + 1.44) * lh + 'px' });
    host.insertBefore(d, pre);
  });
}

/* ---------- trees ---------- */
function parseTree(text) {
  const rows = [];
  text.split('\n').forEach(line => {
    const m = line.match(/^([\s│├└─]*)([^#\s][^#]*?)?\s*(?:#\s*(.*))?$/);
    if (!m) return;
    if (!m[2] && m[3] && rows.length) { rows[rows.length - 1].note += ' ' + m[3].trim(); return; }
    if (!m[2]) return;
    const prefix = m[1] || '';
    rows.push({ depth: Math.round([...prefix].length / 4), prefix, name: m[2].trim(), note: (m[3] || '').trim(), dir: /\/$/.test(m[2].trim()) });
  });
  rows.forEach(r => { const b = r.note.match(/^(NEW|EXTEND|EXISTING)\b[:\s—-]*/); if (b) { r.badge = b[1]; r.note = r.note.slice(b[0].length); } });
  rows.forEach((r, i) => { r.parent = null; for (let j = i - 1; j >= 0; j--) if (rows[j].depth < r.depth) { r.parent = j; break; } });
  return rows;
}
const badge = b => b ? `<span class="chip" data-tone="${{ NEW: 'active', EXTEND: 'in-flight', EXISTING: 'quiet' }[b]}">${b.toLowerCase()}</span>` : '';
const hidden = (rows, i, id) => { let p = rows[i].parent; while (p != null) { if (state.collapsed.has(id + ':' + p)) return true; p = rows[p].parent; } return false; };
function treeA(d) {
  const rows = parseTree(txt(d.treeId));
  return `<div class="tree">${rows.map((r, i) => hidden(rows, i, d.treeId) ? '' : `<div class="tree-row"><span class="tree-name"><span class="guide">${esc(r.prefix)}</span>${r.dir ? `<button class="dir" data-collapse="${d.treeId}:${i}" aria-expanded="${!state.collapsed.has(d.treeId + ':' + i)}"><span class="chev">▾</span>${esc(r.name)}</button>` : esc(r.name)}</span><span class="tree-note">${badge(r.badge)}${md(r.note)}</span></div>`).join('')}</div>`;
}
const I_DIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
const I_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';
function treeB(d) {
  const rows = parseTree(txt(d.treeId));
  const hasBadges = rows.some(r => r.badge && r.badge !== 'EXISTING');
  const keep = new Set();
  if (state.changedOnly) rows.forEach((r, i) => { if (r.badge === 'NEW' || r.badge === 'EXTEND') { keep.add(i); let p = r.parent; while (p != null) { keep.add(p); p = rows[p].parent; } } });
  return `<div class="tb-tools">
      ${hasBadges ? `<button class="chip" data-changed="1" aria-pressed="${state.changedOnly}">Changed only · ${rows.filter(r => r.badge === 'NEW' || r.badge === 'EXTEND').length}</button>` : `<span class="mono-note">No NEW / EXTEND markers in this tree</span>`}
      <span class="mono-note" style="margin-left:auto">${rows.filter(r => !r.dir).length} files · ${rows.filter(r => r.dir).length} folders</span></div>
    <ul class="tb">${rows.map((r, i) => {
      if (hidden(rows, i, d.treeId)) return '';
      const dim = state.changedOnly && !keep.has(i);
      if (state.changedOnly && dim && r.dir) return '';
      if (dim) return '';
      const pad = `padding-left:${r.depth * 1.4}rem`;
      return `<li data-badge="${r.badge || ''}"><span class="nm" style="${pad}">${r.dir ? `<button class="dir" data-collapse="${d.treeId}:${i}" aria-expanded="${!state.collapsed.has(d.treeId + ':' + i)}" style="display:flex;gap:var(--space-2);align-items:baseline">${I_DIR}<span class="is-dir">${esc(r.name)}</span></button>` : `${I_FILE}<span class="f">${esc(r.name)}</span>`}</span><span class="nt">${badge(r.badge)}${md(r.note)}</span></li>`;
    }).join('')}</ul>`;
}
function treeC(d) {
  const rows = parseTree(txt(d.treeId));
  const roots = rows.map((r, i) => [r, i]).filter(([r]) => r.depth === 0);
  const cards = [], loose = [];
  roots.forEach(([root, ri]) => {
    rows.forEach((r, i) => {
      if (r.parent !== ri) return;
      if (r.dir) {
        const kids = [];
        const walk = (pi, lvl) => rows.forEach((k, ki) => { if (k.parent === pi) { kids.push({ ...k, lvl }); if (k.dir) walk(ki, lvl + 1); } });
        walk(i, 0);
        cards.push({ root: root.name, dir: r, kids });
      } else loose.push({ root: root.name, r });
    });
  });
  return `<div class="tc">
    ${cards.map(c => `<section class="tc-card"><div class="tc-head"><span class="p">${esc(c.root)}</span><span class="n">${esc(c.dir.name)}</span>${c.kids.length ? `<span class="c">${c.kids.filter(k => !k.dir).length || c.kids.length}</span>` : ''}${c.dir.note && c.kids.length ? `<span class="d note">${badge(c.dir.badge)}${md(c.dir.note)}</span>` : ''}</div>
      <ul>${c.kids.length ? c.kids.map(k => `<li style="padding-left:${k.lvl * 1}rem"><span class="f"><span class="${k.dir ? 'sub' : ''}">${esc(k.name)}</span>${badge(k.badge)}</span>${k.note ? `<span class="d">${md(k.note)}</span>` : ''}</li>`).join('') : `<li><span class="d">${md(c.dir.note) || '—'}</span></li>`}</ul></section>`).join('')}
    ${loose.length ? `<section class="tc-card"><div class="tc-head"><span class="p">${esc(loose[0].root)}</span><span class="n">top-level files</span><span class="c">${loose.length}</span></div><ul>${loose.map(({ r }) => `<li><span class="f">${esc(r.name)}${badge(r.badge)}</span>${r.note ? `<span class="d">${md(r.note)}</span>` : ''}</li>`).join('')}</ul></section>` : ''}
  </div>`;
}

/* ---------- page ---------- */
function diagram(d) {
  const T = { a: 'A · framed ASCII', b: 'B · lifted', c: 'C · Mermaid redraw' }[state.dg];
  let body;
  if (state.dg === 'a') body = `<div class="ascii"><pre>${glyphs(txt(d.diagramId))}</pre></div>`;
  else if (state.dg === 'b') { const L = liftHTML(txt(d.diagramId)); body = `<div class="ascii lifted" data-cards='${esc(JSON.stringify(L.cards))}'><pre>${L.html}</pre></div>`; }
  else body = `<div class="mermaid-wrap"><pre class="mermaid">${esc(txt(d.diagramId.replace('diagram', 'mermaid')))}</pre></div>`;
  const tools = state.dg === 'c' ? '' : `<button class="chip" data-fit="1" aria-pressed="${state.fit}">${state.fit ? 'Fit to width' : 'Actual size'}</button><button class="chip" data-grid="1" aria-pressed="${state.grid}">Grid</button>`;
  return `<figure class="figure">
    <div class="figure-bar"><span class="t">System architecture</span>${tools}<button class="chip" data-overlay="1">Expand ⤢</button></div>
    <div class="figure-body ${state.grid && state.dg !== 'c' ? 'grid-paper' : ''}" data-fitbox="1">${body}</div>
    <figcaption class="figure-cap">${md(d.diagramNote)}</figcaption></figure>
    ${state.dg === 'c' ? `<p class="caveat" style="margin-top:var(--space-3)"><strong>Hand-converted.</strong> Both RESEARCH files use a <code>text</code> fence; Labelore cannot turn ASCII into Mermaid reliably. C shows what the chapter gets when the source already has a <code>mermaid</code> fence (the app renders those today) — it is the comparison point, not something the parser can produce.</p>` : ''}
    ${state.dg === 'b' ? `<p class="caveat" style="margin-top:var(--space-3)"><strong>Generic.</strong> Cards are found by the page, not hand-placed: <code>┌…┐└…┘</code> rectangles become cards (studio-portal), and in a box-less diagram (labelore) text runs are clustered into nodes. Connectors stay the author's ASCII. Hover a card.</p>` : ''}`;
}
function render() {
  const d = DOCS[state.doc];
  const TT = { a: 'A · ASCII guides', b: 'B · clean list', c: 'C · directory cards' }[state.tr];
  document.getElementById('root').innerHTML = `<div class="page fade">
    <p class="ref-note">${d.project} · ${d.file} · 008-A frame · … 01 Standard stack above …</p>
    <div class="section-heading"><h2><span class="num">02</span>Architecture</h2></div>
    <section>${diagram(d)}</section>
    <section><p class="label">Directory structure</p>${{ a: treeA, b: treeB, c: treeC }[state.tr](d)}
      <p style="margin-top:var(--space-3);font-size:var(--fs-3);color:var(--muted-foreground);max-width:72ch">${md(d.treeNote)}</p></section>
    <p class="ref-note">… Patterns ⇄ Anti-patterns · Don't hand-roll · 03 Common pitfalls below …</p>
  </div>${state.overlay ? `<div class="overlay" data-close="1"><div class="figure" style="display:grid"><div class="figure-bar"><span class="t">System architecture</span><button class="chip" data-close="1">Close ✕</button></div><div class="figure-body">${state.dg === 'b' ? (() => { const L = liftHTML(txt(d.diagramId)); return `<div class="ascii lifted" style="--dg-size:0.95rem" data-cards='${esc(JSON.stringify(L.cards))}'><pre>${L.html}</pre></div>`; })() : state.dg === 'a' ? `<div class="ascii" style="--dg-size:0.95rem"><pre>${glyphs(txt(d.diagramId))}</pre></div>` : `<div class="mermaid-wrap"><pre class="mermaid">${esc(txt(d.diagramId.replace('diagram', 'mermaid')))}</pre></div>`}</div></div></div>` : ''}`;
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const f = document.getElementById('frame');
  f.style.maxWidth = state.width === 'full' ? 'none' : state.width + 'px';
  f.classList.toggle('narrow-frame', state.width !== 'full');
  document.querySelectorAll('[data-dg]').forEach(t => t.classList.toggle('active', t.dataset.dg === state.dg));
  document.querySelectorAll('[data-tr]').forEach(t => t.classList.toggle('active', t.dataset.tr === state.tr));
  document.querySelectorAll('#sketch-tools button').forEach(b => b.classList.toggle('on', b.dataset.doc === state.doc || b.dataset.theme === state.theme || b.dataset.width === state.width));
  if (state.fit) document.querySelectorAll('[data-fitbox] .ascii').forEach(a => { const box = a.parentElement; const avail = box.clientWidth - 48; a.style.setProperty('--dg-size', '0.8rem'); const w = a.scrollWidth; if (w > avail) a.style.setProperty('--dg-size', (0.8 * avail / w).toFixed(3) + 'rem'); });
  document.querySelectorAll('.ascii.lifted').forEach(placeCards);
  if (document.querySelector('pre.mermaid') && window.mermaid) {
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: state.theme === 'dark' ? 'dark' : 'neutral', fontFamily: 'ui-monospace, DejaVu Sans Mono, monospace', themeVariables: { fontSize: '15px' }, flowchart: { htmlLabels: true, curve: 'basis', useMaxWidth: true, nodeSpacing: 34, rankSpacing: 38 } });
    mermaid.run({ querySelector: 'pre.mermaid' }).catch(e => console.error(e));
  }
}
document.addEventListener('mouseover', e => { const host = e.target.closest('.ascii.lifted'); if (!host) return; const pre = host.querySelector('pre'); const r = pre.getBoundingClientRect(); host.querySelectorAll('.lift-card').forEach(c => { const b = c.getBoundingClientRect(); c.classList.toggle('hot', e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom); }); });
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1400); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.overlay) { state.overlay = false; render(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-close]');
  if (!t) return;
  if (t.dataset.close && (e.target === t || t.tagName === 'BUTTON')) { state.overlay = false; }
  else if (t.dataset.dg) state.dg = t.dataset.dg;
  else if (t.dataset.tr) { state.tr = t.dataset.tr; state.changedOnly = false; }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; state.collapsed.clear(); state.changedOnly = false; }
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.fit) state.fit = !state.fit;
  else if (t.dataset.grid) state.grid = !state.grid;
  else if (t.dataset.overlay) state.overlay = true;
  else if (t.dataset.changed) state.changedOnly = !state.changedOnly;
  else if (t.dataset.collapse) { const k = t.dataset.collapse; state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k); }
  else return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
window.addEventListener('resize', () => { if (state.fit) render(); else document.querySelectorAll('.ascii.lifted').forEach(placeCards); });
document.fonts ? document.fonts.ready.then(render) : render();
</script>
