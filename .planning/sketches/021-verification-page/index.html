/* Sketch 021: the VERIFICATION page. Shared vocabulary as 013–020 (eyebrow + date meta row, View/Source, chips, tones, modals, back-matter rows); fresh structure per variant. Data: ./data.js from real VERIFICATION.md files + one synthetic template-shaped report (gen-data.mjs). */
*, *::before, *::after { box-sizing: border-box; }
:root { --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border)); --missing-border: color-mix(in oklch, var(--missing-fill) 50%, var(--border)); --in-flight-tint: color-mix(in oklch, var(--in-flight-fill) 9%, transparent); --missing-tint: color-mix(in oklch, var(--missing-fill) 9%, transparent); --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border)); }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-5); line-height: var(--lh-normal); padding-top: 3rem; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--font-mono); font-size: 0.86em; padding: 0 0.2em; background: color-mix(in oklch, var(--muted) 70%, transparent); overflow-wrap: anywhere; }
.dark code { background: color-mix(in oklch, var(--foreground) 9%, transparent); }
strong { font-weight: var(--fw-semibold); }
#variant-nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; gap: var(--space-1); align-items: center; padding: var(--space-2) var(--space-4); background: var(--background); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; overflow-x: auto; }
#variant-nav .lbl { color: var(--muted-foreground); margin-right: var(--space-2); white-space: nowrap; }
.variant-tab { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; background: none; white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; color: var(--muted-foreground); transition: all .15s ease; }
.variant-tab:hover { color: var(--foreground); background: var(--state-hover); }
.variant-tab.active { color: var(--primary); border-color: var(--primary-border); background: var(--primary-tint); }
#frame { margin: 0 auto; container-type: inline-size; transition: max-width .2s ease; background: var(--background); min-height: 100vh; }
#frame.narrow-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.page { width: min(78rem, 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); display: grid; gap: var(--space-10); grid-template-columns: minmax(0, 1fr); }
.page > * { min-width: 0; }
.fade { animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

/* ---------- shared vocabulary ---------- */
.eyebrow { color: var(--primary); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.kicker { color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.muted { color: var(--muted-foreground); }
.mono { font-family: var(--font-mono); }
.section-heading { display: flex; gap: var(--space-4); align-items: flex-end; justify-content: space-between; flex-wrap: wrap; padding-bottom: var(--space-3); margin-bottom: var(--space-5); border-bottom: 1px solid var(--border); }
.section-heading h2 { font-family: var(--font-mono); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.section-heading h2 .n { color: var(--muted-foreground); margin-right: var(--space-2); }
.section-heading .aside { display: flex; gap: var(--space-4); align-items: baseline; font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.chip { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0.1rem var(--space-1-5); border: 1px solid var(--border); font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); white-space: nowrap; background: none; transition: all .15s ease; }
.chip[data-tone='complete'] { color: var(--primary); border-color: var(--primary-border); background: var(--primary-tint); }
.chip[data-tone='in-flight'] { color: var(--in-flight-fill); border-color: var(--in-flight-border); }
.chip[data-tone='missing'] { color: var(--missing-fill); border-color: var(--missing-border); }
button.chip:hover { border-color: var(--primary-border); color: var(--foreground); }
.chip .k { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; }
.link-btn { padding: 0; border: 0; background: none; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; transition: color .15s ease; }
.link-btn:hover { color: var(--primary); }
.md { display: grid; gap: var(--space-2-5); font-size: var(--fs-4); min-width: 0; }
.md p, .md li { overflow-wrap: anywhere; }
.md ul, .md ol { padding-left: var(--space-5); display: grid; gap: var(--space-1-5); }
.md pre { margin: 0; padding: var(--space-3); background: var(--sidebar); border: 1px solid var(--border); overflow-x: auto; font-size: var(--fs-2); }
.md pre code { background: none; padding: 0; overflow-wrap: normal; white-space: pre; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); }
.md table { border-collapse: collapse; width: 100%; font-size: var(--fs-3); }
.md th, .md td { text-align: left; padding: var(--space-1-5) var(--space-2-5); border-bottom: 1px solid var(--border); vertical-align: top; }
.md th { font-family: var(--font-heading); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); font-weight: var(--fw-semibold); }
.md h4 { font-family: var(--font-heading); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); margin-top: var(--space-2); }
.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--primary); } 100% { box-shadow: 0 0 0 2px transparent; } }
.empty { padding: var(--space-4); border: 1px dashed var(--border); color: var(--muted-foreground); font-size: var(--fs-4); }
.prose { font-size: var(--fs-4); color: var(--muted-foreground); max-width: 70ch; overflow-wrap: anywhere; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* glyph squares (status) */
.sq { display: inline-block; width: 0.6rem; height: 0.6rem; flex: none; background: var(--muted-foreground); }
.sq[data-s='verified'] { background: var(--primary); }
.sq[data-s='coincidental'] { background: repeating-linear-gradient(45deg, var(--primary) 0 2px, transparent 2px 4px); outline: 1px solid var(--primary); outline-offset: -1px; }
.sq[data-s='override'] { background: none; outline: 1px solid var(--primary); outline-offset: -1px; }
.sq[data-s='failed'], .sq[data-s='blocked'], .sq[data-s='blocker'] { background: var(--missing-fill); }
.sq[data-s='unverified'], .sq[data-s='human'], .sq[data-s='warning'] { background: var(--in-flight-fill); }
.sq[data-s='uncertain'] { background: none; outline: 1px dashed var(--in-flight-fill); outline-offset: -1px; }
.sq[data-s='mixed'], .sq[data-s='partial'] { background: linear-gradient(135deg, var(--primary) 50%, var(--in-flight-fill) 50%); }
.sq[data-s='info'], .sq[data-s='clear'] { background: none; outline: 1px solid var(--muted-foreground); outline-offset: -1px; }

/* ---------- header (shared) ---------- */
.meta-row { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-5); align-items: center; justify-content: space-between; }
.meta-left { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: baseline; }
.date { font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.date b { color: var(--foreground); font-weight: var(--fw-medium); }
.doc-tools { display: flex; gap: var(--space-4); align-items: center; }
.icon-btn { display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; border: 0; background: none; color: var(--muted-foreground); transition: color .15s ease, background .15s ease; }
.icon-btn:hover { color: var(--foreground); background: var(--state-hover); }
.seg { display: inline-flex; }
.seg button { padding: var(--space-1) var(--space-3); border: 0; background: none; font-family: var(--font-mono); font-size: var(--fs-4); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); transition: all .15s ease; }
.seg button:hover { color: var(--foreground); }
.seg button[aria-pressed='true'] { color: var(--foreground); background: color-mix(in oklch, var(--muted) 85%, transparent); }
.dark .seg button[aria-pressed='true'] { background: color-mix(in oklch, var(--foreground) 12%, transparent); }
.head { display: grid; gap: var(--space-5); }
.head h1 { font-family: var(--font-sans); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: 1.2; max-width: 52rem; }
.goal { display: grid; gap: var(--space-1); max-width: 60rem; }
.goal p { font-size: var(--fs-fluid-1); line-height: 1.45; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.status-badge { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-2-5); border: 1px solid var(--border); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.status-badge::before { content: ''; width: 0.55rem; height: 0.55rem; background: currentColor; }
.status-badge[data-tone='complete'] { color: var(--primary); border-color: var(--primary-border); background: var(--primary-tint); }
.status-badge[data-tone='missing'] { color: var(--missing-fill); border-color: var(--missing-border); background: var(--missing-tint); }
.status-badge[data-tone='in-flight'] { color: var(--in-flight-fill); border-color: var(--in-flight-border); background: var(--in-flight-tint); }
.badge { display: inline-flex; align-items: baseline; gap: var(--space-1-5); padding: var(--space-1) var(--space-2-5); border: 1px solid var(--border); background: var(--card); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); white-space: nowrap; transition: all .15s ease; }
.badge .k { font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.badge b { color: var(--foreground); font-weight: var(--fw-medium); }
.badge b.bad { color: var(--missing-fill); }
.badge b.wait { color: var(--in-flight-fill); }
button.badge:hover { border-color: var(--primary-border); color: var(--foreground); }
.badge[data-tone='in-flight'] { border-color: var(--in-flight-border); }

/* human check card (shared) */
.hc { display: grid; gap: var(--space-3); padding: var(--space-4) var(--space-5); border: 1px solid var(--in-flight-border); border-left: 3px solid var(--in-flight-fill); background: var(--card); }
.hc-top { display: flex; gap: var(--space-3); align-items: baseline; justify-content: space-between; }
.hc-top h3 { font-family: var(--font-sans); font-size: var(--fs-5); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.hc-top .num { font-family: var(--font-mono); color: var(--in-flight-fill); margin-right: var(--space-2); }
.hc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
@container (max-width: 52rem) { .hc-grid { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); } }
.hc-grid > div { min-width: 0; display: grid; gap: var(--space-1); align-content: start; font-size: var(--fs-4); overflow-wrap: anywhere; }
.hc-grid .why { color: var(--muted-foreground); }
.note { font-size: var(--fs-4); color: var(--muted-foreground); padding-left: var(--space-3); border-left: 2px solid var(--border); max-width: 70ch; overflow-wrap: anywhere; }

/* truth inspector (shared) */
.insp { display: grid; gap: var(--space-3); padding: var(--space-4) var(--space-5); border: 1px solid var(--border); background: var(--card); }
.insp-top { display: flex; justify-content: space-between; gap: var(--space-3); align-items: baseline; flex-wrap: wrap; }
.insp h3 { font-family: var(--font-sans); font-size: var(--fs-6); font-weight: var(--fw-medium); line-height: 1.35; overflow-wrap: anywhere; }
.insp dl { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: var(--space-2) var(--space-4); font-size: var(--fs-4); }
@container (max-width: 40rem) { .insp dl { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
.insp dt { padding-top: 0.15rem; }
.insp dd { overflow-wrap: anywhere; }
.xlink { display: inline-flex; gap: var(--space-1-5); align-items: baseline; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: none; font-size: var(--fs-3); text-align: left; transition: all .15s ease; }
.xlink:hover { border-color: var(--primary-border); color: var(--primary); }
.xlink[data-tone='missing'] { border-color: var(--missing-border); }
.xlink[data-tone='in-flight'] { border-color: var(--in-flight-border); }

/* gap body + fix plan mapping (shared) */
.gap-body { display: grid; gap: var(--space-4); }
.gap-dl { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: var(--space-2-5) var(--space-4); font-size: var(--fs-4); }
@container (max-width: 40rem) { .gap-dl { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
.gap-dl dt { padding-top: 0.15rem; }
.gap-dl dd { overflow-wrap: anywhere; }
.gap-dl ul { margin: 0; padding-left: var(--space-5); display: grid; gap: var(--space-1); }
.where { display: grid; gap: var(--space-1); margin-top: var(--space-1-5); }
.where div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-2); font-size: var(--fs-3); color: var(--muted-foreground); }
.where code { color: var(--foreground); }
.fp { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1px solid var(--primary-border); background: color-mix(in oklch, var(--primary) 4%, var(--card)); }
.fp-top { display: flex; gap: var(--space-3); justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
.fp-top .t { font-size: var(--fs-4); font-weight: var(--fw-medium); }
.fp-top .t .file { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--primary); margin-right: var(--space-2); }
.fp ol { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-1-5); }
.fp li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: var(--space-2); font-size: var(--fs-3); color: var(--muted-foreground); align-items: baseline; overflow-wrap: anywhere; }
.fp li .i { font-family: var(--font-mono); font-size: var(--fs-2); }
.fp li[data-hit] { color: var(--foreground); }
.fp li[data-hit] .i { color: var(--primary); }
.fp li .tag { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--primary); white-space: nowrap; }
.fp .obj { font-size: var(--fs-3); color: var(--muted-foreground); }
.scope { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; padding: 0.05rem var(--space-1-5); border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
.scope b { color: var(--foreground); font-weight: var(--fw-medium); }

/* anti-patterns (shared parts) */
.ap-file { display: grid; gap: 0; border: 1px solid var(--border); background: var(--card); }
.ap-file > header { display: flex; justify-content: space-between; gap: var(--space-3); align-items: baseline; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); }
.ap-file > header code { background: none; padding: 0; font-size: var(--fs-3); }
.ap-row { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) minmax(0, 16rem); gap: var(--space-2) var(--space-4); padding: var(--space-2-5) var(--space-4); border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); font-size: var(--fs-3); align-items: baseline; }
.ap-row:last-child { border-bottom: 0; }
@container (max-width: 52rem) { .ap-row { grid-template-columns: 4.5rem minmax(0, 1fr); } .ap-row .imp { grid-column: 2; } }
.ap-row .ln { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); display: flex; gap: var(--space-1-5); align-items: center; }
.ap-row .pat { overflow-wrap: anywhere; }
.ap-row .imp { color: var(--muted-foreground); overflow-wrap: anywhere; }
.ap-row[data-sev='blocker'] { box-shadow: inset 3px 0 0 var(--missing-fill); }
.sev-sum { display: flex; gap: var(--space-4); flex-wrap: wrap; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); align-items: center; }
.sev-sum span { display: inline-flex; gap: var(--space-1-5); align-items: center; }
.sev-sum b { color: var(--foreground); font-weight: var(--fw-medium); }

/* back matter + source */
.source-only { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; padding: var(--space-3) 0; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
.source-only ul { display: flex; flex-wrap: wrap; gap: var(--space-1-5); margin: 0; padding: 0; list-style: none; }
.source-only .chip { cursor: pointer; text-transform: none; letter-spacing: 0; font-family: var(--font-sans); font-weight: var(--fw-medium); font-size: var(--fs-2); }
.loose { display: grid; gap: var(--space-2); }
.loose details { border: 1px solid var(--border); background: var(--card); }
.loose summary { list-style: none; cursor: pointer; display: flex; gap: var(--space-3); justify-content: space-between; align-items: baseline; padding: var(--space-2-5) var(--space-4); font-size: var(--fs-4); transition: background .15s ease; }
.loose summary::-webkit-details-marker { display: none; }
.loose summary:hover { background: var(--state-hover); }
.loose summary .t::before { content: '+ '; font-family: var(--font-mono); color: var(--muted-foreground); }
.loose details[open] summary .t::before { content: '− '; }
.loose .lb { padding: 0 var(--space-4) var(--space-4); }
.footer { display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; padding-top: var(--space-3); border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.raw { margin: 0; border: 1px solid var(--border); background: var(--sidebar); font-family: var(--font-mono); font-size: var(--fs-2); line-height: 1.6; overflow-x: auto; padding: var(--space-3) 0; }
.raw span { display: block; padding: 0 var(--space-4) 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.raw span::before { content: attr(data-n); display: inline-block; width: 3.5rem; padding-right: var(--space-3); text-align: right; color: var(--muted-foreground); opacity: .6; user-select: none; }
.raw span.hit { background: var(--primary-tint); }

/* modal */
dialog.modal { padding: 0; border: 1px solid var(--border); background: var(--card); color: var(--foreground); width: min(48rem, calc(100vw - 2rem)); max-height: min(80vh, 46rem); opacity: 0; transform: translateY(6px); transition: opacity .15s ease, transform .15s ease, overlay .15s allow-discrete, display .15s allow-discrete; }
dialog.modal[open] { opacity: 1; transform: none; }
@starting-style { dialog.modal[open] { opacity: 0; transform: translateY(6px); } }
dialog.modal::backdrop { background: color-mix(in oklch, var(--foreground) 22%, transparent); }
.m-head { position: sticky; top: 0; display: flex; justify-content: space-between; gap: var(--space-4); align-items: baseline; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); background: var(--card); }
.m-head h3 { font-family: var(--font-mono); font-size: var(--fs-6); font-weight: var(--fw-medium); }
.m-body { padding: var(--space-4) var(--space-5) var(--space-5); display: grid; gap: var(--space-3); }
.spot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); align-items: baseline; padding: var(--space-2) 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); font-size: var(--fs-3); }
.spot .cmd { grid-column: 2 / -1; color: var(--muted-foreground); font-size: var(--fs-2); }
.spot .res { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); text-align: right; }

/* ============ A — verdict sheet ============ */
.a-col { width: min(62rem, 100%); margin: 0 auto; display: grid; gap: var(--space-10); }
.a-hcs { display: grid; gap: var(--space-3); }
.score-line { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-8); align-items: end; margin-bottom: var(--space-5); }
.big-score { font-family: var(--font-mono); font-size: var(--fs-display-3); line-height: 1; font-weight: var(--fw-medium); letter-spacing: var(--ls-tighter); }
.big-score small { font-size: 0.45em; color: var(--muted-foreground); }
.score-cap { font-size: var(--fs-3); color: var(--muted-foreground); max-width: 34rem; }

.cells button[data-s='uncertain'] { background: repeating-linear-gradient(-45deg, var(--in-flight-fill) 0 3px, transparent 3px 6px); }

.wall-group { display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13.5rem), 1fr)); gap: var(--space-2); }
.tile { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-3); border: 1px solid var(--border); background: var(--card); text-align: left; font-size: var(--fs-3); min-height: 6.5rem; transition: all .15s ease; }

.rt { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-3) var(--space-4); border: 1px solid var(--border); border-top: 3px solid var(--muted-foreground); background: var(--card); text-align: left; transition: all .15s ease; }
.rt:hover { border-color: var(--primary-border); }

.rt[data-s='partial'] { border-top-color: color-mix(in oklch, var(--primary) 55%, var(--in-flight-fill)); }

.rt .top { display: flex; justify-content: space-between; gap: var(--space-2); align-items: baseline; }

.a-gaps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-6); align-items: start; }

.gap { border: 1px solid var(--border); background: var(--card); }
.gap > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto; gap: var(--space-2); align-items: baseline; padding: var(--space-3) var(--space-4); transition: background .15s ease; }

/* ============ B — console ============ */
.b-grid { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: var(--space-8); align-items: start; }

.b-rail { position: sticky; top: 4rem; display: grid; gap: var(--space-5); }
@container (max-width: 60rem) { .b-rail { position: static; grid-template-columns: auto minmax(0, 1fr); align-items: start; } }
.ring { position: relative; width: 11rem; height: 11rem; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .c b { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-medium); line-height: 1; }
.ring .c span { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); margin-top: var(--space-1); }
.legend { display: grid; gap: 2px; }
.legend button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; padding: var(--space-1) var(--space-2); border: 1px solid transparent; background: none; text-align: left; font-size: var(--fs-3); transition: all .15s ease; }
.legend button:hover { background: var(--state-hover); }
.legend button[aria-pressed='true'] { border-color: var(--primary-border); background: var(--primary-tint); }
.legend b { font-family: var(--font-mono); font-weight: var(--fw-medium); }
.toc { display: grid; gap: 0; border-top: 1px solid var(--border); }
@container (max-width: 60rem) { .toc { display: none; } }
.toc button { display: flex; justify-content: space-between; gap: var(--space-2); padding: var(--space-1-5) 0; border: 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); background: none; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); transition: color .15s ease; }
.toc button:hover { color: var(--primary); }
.toc button b { color: var(--foreground); font-weight: var(--fw-medium); }
.toc button b.bad { color: var(--missing-fill); }
.toc button b.wait { color: var(--in-flight-fill); }
.b-main { display: grid; gap: var(--space-10); min-width: 0; grid-template-columns: minmax(0, 1fr); }
.stepper { display: grid; grid-template-columns: 16rem minmax(0, 1fr); border: 1px solid var(--in-flight-border); background: var(--card); }
@container (max-width: 52rem) { .stepper { grid-template-columns: minmax(0, 1fr); } }
.stepper ol { list-style: none; margin: 0; padding: 0; border-right: 1px solid var(--border); }
@container (max-width: 52rem) { .stepper ol { border-right: 0; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; } }
.stepper li button { width: 100%; display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); gap: var(--space-2); padding: var(--space-2-5) var(--space-3); border: 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); background: none; text-align: left; font-size: var(--fs-3); transition: background .15s ease; }
@container (max-width: 52rem) { .stepper li button { min-width: 13rem; border-bottom: 0; border-right: 1px solid var(--border); } }
.stepper li button:hover { background: var(--state-hover); }
.stepper li button[aria-selected='true'] { background: var(--in-flight-tint); box-shadow: inset 3px 0 0 var(--in-flight-fill); }
.stepper li .i { font-family: var(--font-mono); color: var(--in-flight-fill); }
.step-pane { display: grid; gap: var(--space-4); padding: var(--space-4) var(--space-5); align-content: start; }
.step-pane h3 { font-size: var(--fs-6); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.step-pane .row { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: var(--space-3); font-size: var(--fs-4); overflow-wrap: anywhere; }
@container (max-width: 40rem) { .step-pane .row { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); } }
.step-nav { display: flex; gap: var(--space-2); justify-content: flex-end; }
.step-nav button { padding: var(--space-1) var(--space-2-5); border: 1px solid var(--border); background: none; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); transition: all .15s ease; }
.step-nav button:hover:not([disabled]) { color: var(--foreground); border-color: var(--primary-border); }
.step-nav button[disabled] { opacity: .4; cursor: default; }
.lanes { display: grid; grid-template-columns: repeat(var(--lanes, 4), minmax(0, 1fr)); gap: var(--space-3); align-items: start; }
@container (max-width: 60rem) { .lanes { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@container (max-width: 36rem) { .lanes { grid-template-columns: minmax(0, 1fr); } }
.lane { display: grid; gap: var(--space-2); align-content: start; }
.lane > header { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); padding-bottom: var(--space-2); border-bottom: 2px solid var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.lane[data-s='verified'] > header { border-bottom-color: var(--primary); }
.lane[data-s='failed'] > header, .lane[data-s='blocker'] > header { border-bottom-color: var(--missing-fill); }
.lane[data-s='open'] > header, .lane[data-s='warning'] > header { border-bottom-color: var(--in-flight-fill); }
.lane > header b { font-weight: var(--fw-medium); }
.lane .empty { padding: var(--space-3); font-size: var(--fs-3); }
.kcard { display: grid; gap: var(--space-1-5); padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: var(--card); text-align: left; font-size: var(--fs-3); transition: all .15s ease; }
.kcard:hover { border-color: var(--primary-border); }
.kcard[aria-pressed='true'] { outline: 2px solid var(--primary); outline-offset: -1px; }
.kcard .tt { display: flex; gap: var(--space-2); align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.kcard p { overflow-wrap: anywhere; }
.drawer { position: fixed; top: 3rem; right: 0; bottom: 0; z-index: 40; width: min(30rem, 100vw); border-left: 1px solid var(--border); background: var(--card); box-shadow: -12px 0 32px color-mix(in oklch, var(--foreground) 10%, transparent); overflow-y: auto; transform: translateX(100%); transition: transform .2s ease; }
.drawer.open { transform: none; }
.drawer .insp { border: 0; }
.drawer-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--card); }
.matrix { overflow-x: auto; border: 1px solid var(--border); }
.matrix table { border-collapse: collapse; width: 100%; font-size: var(--fs-3); }
.matrix th, .matrix td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); text-align: left; vertical-align: middle; }
.matrix thead th { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); font-weight: var(--fw-medium); white-space: nowrap; }
.matrix thead th.pc { text-align: center; padding: var(--space-2) var(--space-1); }
.matrix td.pc { text-align: center; padding: var(--space-2) var(--space-1); }
.matrix td.pc .dot { display: inline-block; width: 0.65rem; height: 0.65rem; background: var(--muted-foreground); }
.matrix tr[data-s='satisfied'] td.pc .dot { background: var(--primary); }
.matrix tr[data-s='partial'] td.pc .dot { background: linear-gradient(135deg, var(--primary) 50%, var(--in-flight-fill) 50%); }
.matrix tr[data-s='human'] td.pc .dot { background: var(--in-flight-fill); }
.matrix tr[data-s='blocked'] td.pc .dot { background: var(--missing-fill); }
.matrix tbody tr { cursor: pointer; transition: background .15s ease; }
.matrix tbody tr:hover { background: var(--state-hover); }
.matrix tbody tr[aria-selected='true'] { background: var(--primary-tint); }
.matrix .rid { font-family: var(--font-mono); white-space: nowrap; }
.matrix .rd { color: var(--muted-foreground); min-width: 14rem; }
.matrix tr.det td { cursor: default; background: var(--card); color: var(--muted-foreground); font-size: var(--fs-3); }
.gboard { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-4) var(--space-16, 4.5rem); align-items: start; }
@container (max-width: 56rem) { .gboard { grid-template-columns: minmax(0, 1fr); } .gboard svg.wires { display: none; } }
.gboard svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.gboard svg.wires path { fill: none; stroke: var(--border); stroke-width: 1.5; transition: stroke .15s ease, opacity .15s ease; }
.gboard svg.wires path.on { stroke: var(--primary); stroke-width: 2; }
.gboard svg.wires path.off { opacity: .25; }
.gstack { display: grid; gap: var(--space-2); align-content: start; }
.gstack .sub { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); padding: var(--space-2) 0 var(--space-1); }
.gcard { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); border-left: 3px solid var(--missing-fill); background: var(--card); text-align: left; transition: all .15s ease; }
.gcard[data-k='noncritical'] { border-left-color: var(--in-flight-fill); }
.gcard:hover { border-color: var(--primary-border); }
.gcard[aria-expanded='true'] { border-color: var(--primary-border); box-shadow: 0 0 0 1px var(--primary-border); }
.gcard .t { font-size: var(--fs-4); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.gcard .s { font-size: var(--fs-3); color: var(--muted-foreground); overflow-wrap: anywhere; }
.pcard { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); background: var(--card); transition: all .15s ease; }
.pcard.on { border-color: var(--primary-border); }
.pcard ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.pcard li { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: var(--space-2); padding: var(--space-1) var(--space-1-5); font-size: var(--fs-3); color: var(--muted-foreground); overflow-wrap: anywhere; transition: all .15s ease; }
.pcard li .i { font-family: var(--font-mono); font-size: var(--fs-2); }
.pcard li.on { color: var(--foreground); background: var(--primary-tint); }
.pcard li.on .i { color: var(--primary); }
.pcard li.loose-task { font-style: italic; }
.b-detail { margin-top: var(--space-4); }

/* ============ C — goal trace ============ */
.c-head { display: grid; grid-template-columns: minmax(0, 1fr) 19rem; gap: var(--space-8); align-items: start; }
@container (max-width: 56rem) { .c-head { grid-template-columns: minmax(0, 1fr); } }
.verdict { display: grid; gap: var(--space-3); padding: var(--space-4) var(--space-5); border: 1px solid var(--border); background: var(--card); }
.verdict[data-tone='missing'] { border-color: var(--missing-border); border-top: 3px solid var(--missing-fill); }
.verdict[data-tone='in-flight'] { border-color: var(--in-flight-border); border-top: 3px solid var(--in-flight-fill); }
.verdict[data-tone='complete'] { border-color: var(--primary-border); border-top: 3px solid var(--primary); }
.verdict .say { font-size: var(--fs-5); line-height: 1.4; }
.verdict .facts { display: grid; gap: var(--space-1-5); }
.verdict .facts div { display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--fs-3); align-items: baseline; }
.verdict .facts dt { color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.verdict .facts dd { font-family: var(--font-mono); font-size: var(--fs-3); text-align: right; }
.verdict .facts button { padding: 0; border: 0; background: none; font: inherit; color: var(--foreground); text-decoration: underline dotted; text-underline-offset: 3px; }
.todo { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(min(100%, 22rem), 1fr); gap: var(--space-3); overflow-x: auto; padding-bottom: var(--space-2); scroll-snap-type: x mandatory; }
.todo .hc { scroll-snap-align: start; }
.todo .hc .hc-grid { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
.meter { position: relative; display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
.meter .bar { display: flex; height: 0.75rem; border: 1px solid var(--border); }
.meter .bar span { height: 100%; }
.meter .lbls { display: flex; gap: var(--space-4); flex-wrap: wrap; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.meter .lbls span { display: inline-flex; gap: var(--space-1-5); align-items: center; }
.meter .lbls b { color: var(--foreground); font-weight: var(--fw-medium); }
.trace { position: relative; display: grid; gap: 0; padding-left: var(--space-6); }
.trace::before { content: ''; position: absolute; left: 0.45rem; top: 0; bottom: 0.8rem; width: 1px; background: var(--border); }
.trace .root { position: relative; padding: 0 0 var(--space-4); font-size: var(--fs-4); color: var(--muted-foreground); }
.trace .root::before { content: ''; position: absolute; left: calc(-1 * var(--space-6) + 0.1rem); top: 0.35rem; width: 0.75rem; height: 0.75rem; background: var(--foreground); }
.trace .grp { position: relative; display: grid; gap: 0; padding: var(--space-2) 0 var(--space-3); }
.trace .grp > .gl { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); padding: var(--space-1) 0; display: flex; gap: var(--space-3); align-items: center; }
.node { position: relative; width: calc(100% - var(--space-1)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); padding: var(--space-2) var(--space-3); margin-left: var(--space-1); border: 1px solid transparent; text-align: left; background: none; font-size: var(--fs-4); transition: all .15s ease; }
.node::before { content: ''; position: absolute; left: calc(-1 * var(--space-6) - var(--space-1) + 0.2rem); top: 0.9rem; width: 0.55rem; height: 0.55rem; background: var(--muted-foreground); }
.node::after { content: ''; position: absolute; left: calc(-1 * var(--space-6) - var(--space-1) + 0.75rem); top: 1.15rem; width: calc(var(--space-6) - 0.6rem); height: 1px; background: var(--border); }
.node[data-s='verified']::before { background: var(--primary); }
.node[data-s='coincidental']::before { background: repeating-linear-gradient(45deg, var(--primary) 0 2px, transparent 2px 4px); outline: 1px solid var(--primary); }
.node[data-s='override']::before { background: none; outline: 1px solid var(--primary); }
.node[data-s='failed']::before { background: var(--missing-fill); }
.node[data-s='unverified']::before, .node[data-s='mixed']::before { background: var(--in-flight-fill); }
.node[data-s='uncertain']::before { background: none; outline: 1px dashed var(--in-flight-fill); }
.node:hover { background: var(--state-hover); }
.node .t { overflow-wrap: anywhere; }
.node[data-s='verified'] .t, .node[data-s='coincidental'] .t, .node[data-s='override'] .t { color: var(--muted-foreground); }
.node[data-s='failed'] { border-color: var(--missing-border); background: var(--missing-tint); }
.node[data-s='unverified'], .node[data-s='uncertain'], .node[data-s='mixed'] { border-color: var(--in-flight-border); }
.node .st { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); white-space: nowrap; }
.node[data-s='failed'] .st { color: var(--missing-fill); }
.node[data-s='unverified'] .st, .node[data-s='uncertain'] .st, .node[data-s='mixed'] .st { color: var(--in-flight-fill); }
.node-x { grid-column: 1 / -1; margin-top: var(--space-2); }
.node-x .insp { padding: var(--space-3) var(--space-4); }
.collapsed-ok { position: relative; margin-left: var(--space-1); padding: var(--space-1-5) var(--space-3); border: 1px dashed var(--border); background: none; text-align: left; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); transition: all .15s ease; }
.collapsed-ok:hover { color: var(--primary); border-color: var(--primary-border); }
.collapsed-ok::before { content: ''; position: absolute; left: calc(-1 * var(--space-6) - var(--space-1) + 0.2rem); top: 0.65rem; width: 0.55rem; height: 0.55rem; background: var(--primary); }
.stack { display: flex; height: 2.5rem; border: 1px solid var(--border); margin-bottom: var(--space-3); }
.stack span { display: grid; place-items: center; height: 100%; font-family: var(--font-mono); font-size: var(--fs-3); color: var(--background); min-width: 1.75rem; transition: opacity .15s ease; overflow: hidden; }
.stack span[data-s='satisfied'] { background: var(--primary); }
.stack span[data-s='partial'] { background: color-mix(in oklch, var(--primary) 55%, var(--in-flight-fill)); }
.stack span[data-s='human'] { background: var(--in-flight-fill); }
.stack span[data-s='blocked'] { background: var(--missing-fill); }
.rchips { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.rchip { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--card); font-family: var(--font-mono); font-size: var(--fs-3); transition: all .15s ease; }
.rchip:hover, .rchip[aria-expanded='true'] { border-color: var(--primary-border); color: var(--primary); }
.rchip[data-s='blocked'] { border-color: var(--missing-border); }
.rpop { position: fixed; z-index: 10001; display: grid; width: min(24rem, calc(100vw - 2rem)); gap: var(--space-3); border: 1px solid var(--border); background: var(--card); padding: var(--space-4); box-shadow: 0 8px 24px color-mix(in oklch, var(--foreground) 14%, transparent); transition: opacity 120ms ease, transform 120ms ease; }
.rpop.enter { opacity: 0; transform: translateY(-0.25rem) scale(0.98); }
.rpop h2 { font-family: var(--font-mono); font-size: var(--fs-6); font-weight: var(--fw-medium); }
.rpop dl { display: grid; grid-template-columns: 5rem minmax(0, 1fr); gap: var(--space-2) var(--space-3); font-size: var(--fs-3); }
.rpop dt { color: var(--muted-foreground); font-weight: var(--fw-semibold); text-transform: uppercase; font-size: var(--fs-2); }
.rpop dd { overflow-wrap: anywhere; }
.ap-c { display: grid; gap: 0; border-top: 1px solid var(--border); }
.ap-c details { border-bottom: 1px solid var(--border); }
.ap-c summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2-5) var(--space-1); transition: background .15s ease; }
.ap-c summary::-webkit-details-marker { display: none; }
.ap-c summary:hover { background: var(--state-hover); }
.ap-c summary code { background: none; padding: 0; font-size: var(--fs-3); }
.ap-c .pips { display: flex; gap: 3px; }
.ap-c .ap-rows { padding: 0 0 var(--space-3); }
.ap-c .ap-row { border: 0; padding-left: var(--space-1); }
.ctabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: var(--space-5); overflow-x: auto; }
.ctabs button { border: 0; background: none; padding: var(--space-2) var(--space-3); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s ease; }
.ctabs button:hover { color: var(--foreground); }
.ctabs button[aria-selected='true'] { color: var(--foreground); border-bottom-color: var(--missing-fill); }
.ctabs button[data-k='noncritical'][aria-selected='true'] { border-bottom-color: var(--in-flight-fill); }
.ctabs .n { margin-left: var(--space-1); }
.cgap { display: grid; gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--border); }
.cgap-head { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; padding: 0; border: 0; background: none; text-align: left; }
.cgap-head .n { font-family: var(--font-mono); font-size: var(--fs-6); color: var(--missing-fill); line-height: 1.2; }
.cgap[data-k='noncritical'] .cgap-head .n { color: var(--in-flight-fill); }
.cgap-head .t { font-size: var(--fs-5); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.cgap-head:hover .t { color: var(--primary); }
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-left: 2.25rem; border: 1px solid var(--border); }
@container (max-width: 52rem) { .flow { grid-template-columns: minmax(0, 1fr); margin-left: 0; } }
.flow > div { position: relative; display: grid; gap: var(--space-1-5); align-content: start; padding: var(--space-3) var(--space-4); font-size: var(--fs-3); overflow-wrap: anywhere; border-right: 1px solid var(--border); }
.flow > div:last-child { border-right: 0; background: color-mix(in oklch, var(--primary) 4%, transparent); }
@container (max-width: 52rem) { .flow > div { border-right: 0; border-bottom: 1px solid var(--border); } .flow > div:last-child { border-bottom: 0; } }
.flow > div:not(:last-child)::after { content: '→'; position: absolute; right: -0.55rem; top: var(--space-3); font-family: var(--font-mono); color: var(--muted-foreground); background: var(--background); line-height: 1; z-index: 1; }
@container (max-width: 52rem) { .flow > div:not(:last-child)::after { content: '↓'; right: auto; left: var(--space-4); top: auto; bottom: -0.55rem; } }
.flow ul { margin: 0; padding-left: var(--space-4); display: grid; gap: var(--space-1); }
.cgap .fp { margin-left: 2.25rem; }
@container (max-width: 52rem) { .cgap .fp { margin-left: 0; } }

/* ================= ROUND 2 — shared ================= */
.shell-header { display: flex; align-items: center; gap: var(--space-4); height: 3.75rem; padding: 0 var(--space-4); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.brand-mark { width: 2.25rem; height: 2.25rem; background: var(--primary); display: grid; place-items: center; color: white; font-weight: 700; }
.head .disp, .disp { font-family: var(--font-sans); font-size: var(--fs-display-3); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); font-weight: var(--fw-medium); max-width: 20ch; overflow-wrap: anywhere; }
.disp-sub { font-size: var(--fs-fluid-1); line-height: 1.45; max-width: 58rem; color: var(--muted-foreground); overflow-wrap: anywhere; }
.disp-sub b { color: var(--foreground); font-weight: var(--fw-medium); }
.verdict-big { font-size: var(--fs-fluid-3); line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 30ch; overflow-wrap: anywhere; }
.verdict-big em { font-style: normal; color: var(--missing-fill); }
.verdict-big em.w { color: var(--in-flight-fill); }
.verdict-big em.ok { color: var(--primary); }
.verdict-sub { font-size: var(--fs-5); color: var(--muted-foreground); max-width: 46ch; overflow-wrap: anywhere; }
.status-badge.lg { font-size: var(--fs-3); padding: var(--space-1-5) var(--space-3); justify-self: start; }
.pins { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.pin { display: inline-flex; gap: var(--space-2); align-items: baseline; padding: var(--space-1-5) var(--space-3); border: 1px solid var(--missing-border); background: none; font-size: var(--fs-3); text-align: left; max-width: 100%; overflow-wrap: anywhere; transition: all .15s ease; }
.pin .k { font-family: var(--font-mono); color: var(--missing-fill); }
.pin[data-tone='in-flight'] { border-color: var(--in-flight-border); }
.pin[data-tone='in-flight'] .k { color: var(--in-flight-fill); }
.pin:hover { background: var(--state-hover); border-color: var(--foreground); }
.scope-m { display: inline-flex; gap: var(--space-1-5); align-items: center; font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); white-space: nowrap; }
.scope-m i { display: inline-block; width: 0.9rem; height: 0.45rem; border: 1px solid var(--primary-border); }
.scope-m i.f { background: var(--primary); border-color: var(--primary); }
.scope-m.unk i { border-style: dashed; border-color: var(--border); }
.scope-m b { color: var(--foreground); font-weight: var(--fw-medium); }
.caption { min-height: 1.6rem; font-size: var(--fs-4); color: var(--muted-foreground); overflow-wrap: anywhere; }
.caption b { color: var(--foreground); font-weight: var(--fw-medium); }

/* human steps (big numbers) */
.steps { display: grid; gap: 0; border: 1px solid var(--in-flight-border); background: linear-gradient(90deg, var(--in-flight-tint), transparent 60%); }
.step { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--space-5); padding: var(--space-5) var(--space-6) var(--space-5) var(--space-4); border-bottom: 1px solid var(--in-flight-border); }
.step:last-child { border-bottom: 0; }
@container (max-width: 40rem) { .step { grid-template-columns: 3.5rem minmax(0, 1fr); gap: var(--space-3); } }
.step .big { font-family: var(--font-mono); font-size: var(--fs-display-3); line-height: .85; color: var(--in-flight-fill); letter-spacing: var(--ls-tighter); text-align: right; }
@container (max-width: 40rem) { .step .big { font-size: var(--fs-7); } }
.step h3 { font-size: var(--fs-6); font-weight: var(--fw-medium); margin-bottom: var(--space-3); overflow-wrap: anywhere; }
.step .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
@container (max-width: 52rem) { .step .three { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); } }
.step .three > div { display: grid; gap: var(--space-1); align-content: start; font-size: var(--fs-4); min-width: 0; overflow-wrap: anywhere; }
.step .three .why { color: var(--muted-foreground); }

/* big gap panels */
.gpanels { display: grid; gap: var(--space-4); }
.gpanel { display: grid; grid-template-columns: 5rem minmax(0, 1fr); gap: var(--space-2) var(--space-5); padding: var(--space-5) var(--space-6) var(--space-5) var(--space-4); border: 1px solid var(--missing-border); background: linear-gradient(90deg, var(--missing-tint), transparent 55%); }
@container (max-width: 40rem) { .gpanel { grid-template-columns: minmax(0, 1fr); padding: var(--space-4); } }
.gpanel .big { font-family: var(--font-mono); font-size: var(--fs-display-3); line-height: .85; color: var(--missing-fill); letter-spacing: var(--ls-tighter); text-align: right; }
@container (max-width: 40rem) { .gpanel .big { text-align: left; font-size: var(--fs-7); } }
.gpanel h3 { font-size: var(--fs-6); font-weight: var(--fw-medium); line-height: 1.3; overflow-wrap: anywhere; }
.gpanel .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); margin-top: var(--space-3); }
@container (max-width: 56rem) { .gpanel .cols { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); } }
.gpanel .cols > div { display: grid; gap: var(--space-1); align-content: start; font-size: var(--fs-4); min-width: 0; overflow-wrap: anywhere; }
.gpanel .cols ul { margin: 0; padding-left: var(--space-4); display: grid; gap: var(--space-1); }
.gpanel .body { display: grid; gap: var(--space-4); min-width: 0; }
.ticket { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-4); align-items: start; padding: var(--space-3) var(--space-4); border: 1px solid var(--primary-border); border-left: 3px solid var(--primary); background: var(--card); }
.ticket .tt { display: grid; gap: var(--space-1); min-width: 0; }
.ticket .nm { font-size: var(--fs-4); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.ticket .nm .file { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--primary); margin-right: var(--space-2); }
.ticket .task { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); gap: var(--space-2); font-size: var(--fs-3); overflow-wrap: anywhere; }
.ticket .task .i { font-family: var(--font-mono); color: var(--primary); }
.ticket .task.v { color: var(--muted-foreground); }
.ticket .more { grid-column: 1 / -1; justify-self: start; margin-top: var(--space-1); }
.gpanel.minor { grid-template-columns: 5rem minmax(0, 1fr); border-color: var(--in-flight-border); background: none; padding-top: var(--space-3); padding-bottom: var(--space-3); cursor: pointer; transition: background .15s ease; }
.gpanel.minor:hover { background: var(--state-hover); }
.gpanel.minor .big { font-size: var(--fs-7); color: var(--in-flight-fill); }
.gpanel.minor h3 { font-size: var(--fs-5); }
.gpanel.minor[data-open] { background: linear-gradient(90deg, var(--in-flight-tint), transparent 55%); cursor: default; }

/* anti-patterns by severity */
.apb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: var(--space-3); margin-bottom: var(--space-4); }
.apb { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-4); border: 1px solid var(--missing-border); background: var(--missing-tint); }
.apb .where { margin: 0; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--missing-fill); overflow-wrap: anywhere; }
.apb .pat { font-family: var(--font-mono); font-size: var(--fs-4); line-height: 1.4; overflow-wrap: anywhere; }
.apb .pat code { background: none; padding: 0; }
.apb .imp { font-size: var(--fs-3); color: var(--muted-foreground); overflow-wrap: anywhere; }
.apw { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-2) var(--space-4); padding: var(--space-2-5) var(--space-3); border-left: 3px solid var(--in-flight-fill); font-size: var(--fs-3); background: var(--card); margin-bottom: 2px; overflow-wrap: anywhere; }
.apw[data-sev='info'] { border-left-color: var(--border); color: var(--muted-foreground); }
@container (max-width: 52rem) { .apw { grid-template-columns: minmax(0, 1fr); } }
.apw .f { font-family: var(--font-mono); font-size: var(--fs-2); }

/* ================= D — target ================= */
.d-hero { display: grid; grid-template-columns: minmax(18rem, 30rem) minmax(0, 1fr); gap: var(--space-fluid-8); align-items: center; }
@container (max-width: 860px) { .d-hero { grid-template-columns: minmax(0, 1fr); } .d-hero .tg-wrap { max-width: 26rem; margin: 0 auto; width: 100%; } }
.tg-wrap { position: relative; }
.tg-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.tg-guide { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
.tg-band { fill: none; stroke-width: 0; }
.tg-band.failed { fill: color-mix(in oklch, var(--missing-fill) 6%, transparent); }
.tg-band.open { fill: color-mix(in oklch, var(--in-flight-fill) 6%, transparent); }
.tg-band.ok { fill: color-mix(in oklch, var(--primary) 7%, transparent); }
.tg-spoke { stroke: var(--border); stroke-width: 1; }
.tg-core { fill: var(--card); stroke: var(--primary-border); stroke-width: 1.5; }
.tg-score { font-family: var(--font-mono); text-anchor: middle; }
.tg-score .a { font-size: 34px; fill: var(--foreground); letter-spacing: -0.03em; }
.tg-score .b { font-size: 10px; fill: var(--muted-foreground); letter-spacing: .1em; text-transform: uppercase; }
.tg-lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted-foreground); }
.tg-sq { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: stroke .12s ease; stroke: var(--background); stroke-width: 1.5; }
.tg-sq[data-s='verified'] { fill: var(--primary); }
.tg-sq[data-s='coincidental'] { fill: color-mix(in oklch, var(--primary) 55%, var(--background)); }
.tg-sq[data-s='override'] { fill: var(--background); stroke: var(--primary); }
.tg-sq[data-s='failed'] { fill: var(--missing-fill); }
.tg-sq[data-s='unverified'], .tg-sq[data-s='mixed'] { fill: var(--in-flight-fill); }
.tg-sq[data-s='uncertain'] { fill: var(--background); stroke: var(--in-flight-fill); stroke-dasharray: 2 2; }
.tg-sq:hover { stroke: var(--foreground); stroke-width: 2; }
.tg-sq.sel { stroke: var(--foreground); stroke-width: 2.5; }
.tg-sq.dim { opacity: .18; }
.tg-key { display: flex; gap: var(--space-4); flex-wrap: wrap; justify-content: center; margin-top: var(--space-3); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.tg-key span { display: inline-flex; gap: var(--space-1-5); align-items: center; }
.tg-key i { width: 0.8rem; height: 0.55rem; }
.d-side { display: grid; gap: var(--space-5); align-content: center; min-width: 0; }
.d-side .insp { }
.ribbon { display: flex; flex-wrap: wrap; gap: 3px; }
.rb { flex: 1 1 7.5rem; display: grid; align-content: space-between; gap: var(--space-3); min-height: 5.5rem; padding: var(--space-2-5) var(--space-3); border: 0; text-align: left; color: var(--background); transition: filter .15s ease, transform .15s ease; }
.rb .id { font-family: var(--font-mono); font-size: var(--fs-5); font-weight: var(--fw-medium); }
.rb .st { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; opacity: .85; }
.rb[data-s='satisfied'] { background: var(--primary); }
.rb[data-s='partial'] { background: repeating-linear-gradient(135deg, var(--primary) 0 10px, color-mix(in oklch, var(--primary) 70%, var(--in-flight-fill)) 10px 20px); }
.rb[data-s='human'] { background: var(--in-flight-fill); }
.rb[data-s='blocked'] { background: var(--missing-fill); }
.rb:hover { filter: brightness(1.12); }
.rb[aria-pressed='true'] { outline: 2px solid var(--foreground); outline-offset: 2px; }
.rdet { margin-top: var(--space-3); display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: var(--space-2) var(--space-4); padding: var(--space-4); border: 1px solid var(--border); background: var(--card); font-size: var(--fs-4); }
@container (max-width: 40rem) { .rdet { grid-template-columns: minmax(0, 1fr); } }
.rdet dd { overflow-wrap: anywhere; }

/* ================= E — board ================= */
.e-grid { display: grid; grid-template-columns: 21rem minmax(0, 1fr); gap: var(--space-fluid-8); align-items: start; }
@container (max-width: 62rem) { .e-grid { grid-template-columns: minmax(0, 1fr); } }
.e-rail { position: sticky; top: 4rem; display: grid; gap: var(--space-5); padding-right: var(--space-6); border-right: 1px solid var(--border); }
@container (max-width: 62rem) { .e-rail { position: static; border-right: 0; padding-right: 0; } }
.e-rail h1 { font-size: var(--fs-7); line-height: 1.15; letter-spacing: var(--ls-tight); font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.e-big { display: grid; grid-template-columns: 0.4rem minmax(0, 1fr); gap: var(--space-4); padding: var(--space-5); border: 1px solid var(--missing-border); }
.e-big[data-tone='in-flight'] { border-color: var(--in-flight-border); }
.e-big[data-tone='complete'] { border-color: var(--primary-border); }
.e-big .bar { background: var(--missing-fill); }
.e-big[data-tone='in-flight'] .bar { background: var(--in-flight-fill); }
.e-big[data-tone='complete'] .bar { background: var(--primary); }
.e-big .n { font-family: var(--font-mono); font-size: var(--fs-display-1); line-height: .9; color: var(--missing-fill); letter-spacing: var(--ls-tighter); }
.e-big[data-tone='in-flight'] .n { color: var(--in-flight-fill); }
.e-big[data-tone='complete'] .n { color: var(--primary); }
.e-big .l { font-size: var(--fs-4); font-weight: var(--fw-medium); margin-top: var(--space-2); }
.e-big .s { font-size: var(--fs-3); color: var(--muted-foreground); }
.e-stats { display: grid; border-top: 1px solid var(--border); }
.e-stats > * { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border: 0; border-bottom: 1px solid var(--border); background: none; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); text-align: left; }
button.e-stat:hover { color: var(--primary); }
.e-stats b { color: var(--foreground); font-weight: var(--fw-medium); text-align: right; text-transform: none; letter-spacing: 0; }
.e-stats b.bad { color: var(--missing-fill); }
.e-stats b.wait { color: var(--in-flight-fill); }
.slip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px dashed var(--in-flight-border); background: none; text-align: left; font-size: var(--fs-3); transition: all .15s ease; }
.slip:hover { border-style: solid; background: var(--in-flight-tint); }

<script>

/* ---------- model ---------- */
const fmtD = s => { if (!s) return null; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };

const TS_ORDER = ['failed', 'unverified', 'mixed', 'uncertain', 'override', 'coincidental', 'verified'];
const RS = { satisfied: ['Satisfied', 'complete'], partial: ['Satisfied, with a caveat', 'complete'], human: ['Needs a human', 'in-flight'], blocked: ['Blocked', 'missing'] };
const RS_ORDER = ['blocked', 'human', 'partial', 'satisfied'];
const SEV = { blocker: 'Blocker', warning: 'Warning', info: 'Info', clear: 'Clear' };
function score(d) { const m = d.score.match(/(\d+)\s*\/\s*(\d+)/); const ok = d.truths.filter(t => TS[t.status]?.ok).length; return m ? { n: +m[1], m: +m[2], rest: d.score.replace(m[0], '').replace(/^\s*(must-haves?|truths?)\s*/i, '').trim() } : { n: ok, m: d.truths.length, rest: '' }; }
function counts(list, key, order) { const c = {}; for (const x of list) c[x[key]] = (c[x[key]] ?? 0) + 1; return order.filter(k => c[k]).map(k => [k, c[k]]); }

function bvFor(d, t) { const k = t.text.slice(0, 30).toLowerCase(); return d.behaviorUnverified.find(b => b.truth.toLowerCase().includes(k) || k.includes(b.truth.slice(0, 30).toLowerCase())); }
function ccFor(d, t) { const k = t.text.slice(0, 30).toLowerCase(); return d.coincidental.find(b => b.truth.toLowerCase().startsWith(k.slice(0, 24))); }
function groups(d) { const g = []; for (const [i, t] of d.truths.entries()) { let x = g.find(y => y.name === t.group); if (!x) g.push(x = { name: t.group, items: [] }); x.items.push(i); } return g; }

  const here = S.findIndex(s => s.st === 'here'); const doneTo = d.status === 'passed' ? 1 : here >= 0 ? (here + 0.15) / S.length : 0.1;
  const sel = state.stop ?? (here >= 0 ? here : null);
  const route = `<div class="route" role="list">${'<span class="track"></span>'}<span class="fill" style="width:${(doneTo * 100).toFixed(1)}%"></span>${S.map((s, i) => `<button class="stop" role="listitem" data-k="${s.k}" data-st="${s.st ?? ''}" data-tone="${s.tone ?? ''}" ${s.k === 'plan' && !SCOPE_N(s.scope) ? 'data-unk' : ''} data-stop="${i}" aria-pressed="${sel === i}" style="--g:${s.g};--i:${i}"><span class="k">${esc(s.kk)}</span><span class="t">${inline(s.t)}</span>${s.k === 'plan' && s.pi != null ? scopeMeter(s.scope) : ''}${s.s ? `<span class="s">${inline(s.s)}</span>` : ''}${s.toks?.length ? `<span class="toks">${s.toks.map(g => `<span class="tok" data-k="${g.kind}" title="${esc(g.name)}">${g.kind === 'critical' ? 'C' : 'N'}${g.idx + 1}</span>`).join('')}</span>` : ''}</button>`).join('')}</div>`;
  const s = S[sel]; let det = '';
  if (s) {
    if (s.k === 'now' && d.status === 'gaps_found') det = `<div class="stop-det"><h3>Where it stands today</h3><div class="gl">${gapsAll(d).map(g => `<div class="gi"><span class="tok" data-k="${g.kind}">${g.kind === 'critical' ? 'C' : 'N'}${g.idx + 1}</span><div style="display:grid;gap:var(--space-1)"><b style="font-weight:var(--fw-medium)">${inline(g.name)}</b><span class="muted" style="font-size:var(--fs-3)">${inline(g.missing ?? '')}</span><span>${g.fixes.length ? `<span class="kicker">Closed by</span> <span class="mono" style="font-size:var(--fs-2);color:var(--primary)">${esc([...new Set(g.fixes.map(f => d.fixPlans[f.plan].file ?? d.fixPlans[f.plan].name))].join(', '))}</span>` : '<span class="kicker">No plan names it yet</span>'} · <button class="link-btn" data-gap="${g.key}">Details ↓</button></span></div></div>`).join('')}</div></div>`;
    else if (s.k === 'plan') { const p = s.pi != null ? d.fixPlans[s.pi] : null; det = `<div class="stop-det"><div class="fp-top"><h3>${p?.file ? `<span class="mono" style="color:var(--primary);font-size:var(--fs-3);margin-right:var(--space-2)">${esc(p.file)}</span>` : ''}${inline(p ? p.name : 'Plan the fixes')}</h3>${p ? scopeMeter(p.scope) : ''}</div>${p?.objective ? `<p class="prose">${inline(p.objective)}</p>` : ''}${p ? `<div class="gl">${p.tasks.map((t, ti) => { const gg = gapsAll(d).filter(g => g.fixes.some(f => f.plan === s.pi && f.task === ti)); return `<div class="gi"><span class="tok" style="background:${gg.length ? 'var(--primary)' : 'var(--muted-foreground)'}">${ti + 1}</span><div style="display:grid;gap:var(--space-1)"><span>${inline(t.text)}</span>${gg.length ? `<span class="toks">${gg.map(g => `<button class="pin" style="padding:0.1rem var(--space-2)" data-gap="${g.key}" data-tone="${g.kind === 'critical' ? '' : 'in-flight'}"><span class="k">${g.kind === 'critical' ? 'C' : 'N'}${g.idx + 1}</span>${t.verify ? 'proves' : 'closes'} ${inline(g.name)}</button>`).join('')}</span>` : `<span class="muted" style="font-size:var(--fs-3)">${t.verify ? 'Verification step' : 'Not tied to a listed gap'}</span>`}</div></div>`; }).join('')}</div>` : `<p class="prose">The report recommends no fix plans. Each gap carries its own fix below.</p>`}</div>`; }
    else if (s.k === 'hc' || s.k === 'human') det = `<div class="stop-det">${(s.k === 'hc' ? [d.human[s.hi]] : d.human).map((h, i) => hcCard(h, s.k === 'hc' ? s.hi : i)).join('')}</div>`;
    else if (s.k === 'reverify') det = `<div class="stop-det"><h3>Re-verify</h3><p class="prose">Once the fix plans run, the verifier checks the goal again. Today’s score: ${score(d).n}/${score(d).m}.</p></div>`;
  }
  const gs = groups(d); let k = 0; const hv = state.hoverT != null ? d.truths[state.hoverT] : null;
  const waffle = `<section id="sec-truths">${heading('What holds', `${score(d).n} of ${score(d).m}`, '', d.truths[0]?.line)}<div class="waffle-wrap">${gs.map(g => `<div class="wgroup">${gs.length > 1 ? `<span class="gl">${esc(g.name.replace('Roadmap success criteria', 'Roadmap'))}<b>${g.items.filter(i => TS[d.truths[i].status].ok).length}/${g.items.length}</b></span>` : `<span class="gl">All truths<b>${g.items.length}</b></span>`}<div class="waffle">${g.items.map(i => `<button class="wf" data-s="${d.truths[i].status}" data-sel="${i}" data-hov="${i}" aria-pressed="${state.sel === i}" style="--i:${k++}">${esc(d.truths[i].n)}</button>`).join('')}</div></div>`).join('')}<p class="caption" id="wcap">${hv ? `<b>#${esc(hv.n)} · ${esc(TS[hv.status].l)}</b> — ${inline(hv.text)}` : 'Hover a square to read the truth; click for its evidence.'}</p>${state.sel != null ? truthInsp(d, state.sel) : ''}</div></section>`;
  return `${shell()}<div class="page fade"><header class="head f-hero">${metaRow(d)}<h1 class="disp">${esc(title(d).replace(/ verification report$/i, ''))}</h1>${d.goal ? `<p class="disp-sub" style="--i:1"><b>Goal:</b> ${inline(d.goal)}</p>` : ''}
    <div style="--i:2;display:grid;gap:var(--space-3)"><span class="status-badge lg" data-tone="${tone}">${esc(l)}</span><p class="verdict-big" style="max-width:none">${v.big}</p></div>
    ${route}${det}${badges(d, { status: false })}</header>
    ${d.status === 'gaps_found' ? gapPanels(d) + humanSteps(d) : humanSteps(d) + gapPanels(d)}${waffle}${ribbon(d)}${antiSev(d)}${alsoRows(d)}${footer(d)}</div>`;
}

/* ---------- render ---------- */
function render() {
  const d = DOCS[state.doc]; const v = state.variant;
  hideRpop();
  const R2 = { d: viewD, e: viewE, f: viewF };
  document.getElementById('root').innerHTML = state.mode === 'view' && R2[v] ? R2[v](d) : `<div class="page fade">${state.mode === 'source' ? metaRow(d) + sourceView(d) : v === 'a' ? viewA(d) : v === 'b' ? viewB(d) : viewC(d)}</div>`;
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const f = document.getElementById('frame'); f.style.maxWidth = state.width === 'full' ? 'none' : state.width + 'px'; f.classList.toggle('narrow-frame', state.width !== 'full');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.variant === state.variant));
  document.querySelectorAll('#sketch-tools button').forEach(b => b.classList.toggle('on', b.dataset.doc === state.doc || b.dataset.theme === state.theme || b.dataset.width === state.width));
  drawer(); requestAnimationFrame(drawWires);
}
document.getElementById('doc-btns').innerHTML = Object.entries(DOCS).map(([k, d]) => `<button data-doc="${k}">${esc(d.label)}</button>`).join('');
function toast(msg) { const t = document.createElement('div'); t.textContent = msg; t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(40rem,90vw);background:var(--foreground);color:var(--background);padding:8px 14px;font-family:var(--font-mono);font-size:var(--fs-2);z-index:10000'; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function jump(id) { const el = document.getElementById(id); if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300); }
document.addEventListener('toggle', e => { const el = e.target; if (el.dataset?.det) { el.open ? state.open.add(el.dataset.det) : state.open.delete(el.dataset.det); requestAnimationFrame(drawWires); } }, true);
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') e.target.close(); });
addEventListener('resize', () => requestAnimationFrame(drawWires));
document.addEventListener('mouseover', e => { const h = e.target.closest('[data-hov]'); const cap = document.getElementById('wcap'); if (!h || !cap) return; const t = DOCS[state.doc].truths[+h.dataset.hov]; state.hoverT = +h.dataset.hov; cap.innerHTML = `<b>#${esc(t.n)} · ${esc(TS[t.status].l)}</b> — ${inline(t.text)}`; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideRpop(); if (state.sel != null && state.variant === 'b') { state.sel = null; drawer(); } } });
document.addEventListener('click', e => {
  if (pop && !e.target.closest('.rpop') && !e.target.closest('[data-rpop]')) hideRpop();
  const tg = e.target.closest('[data-toggle]'); if (tg) { const k = tg.dataset.toggle; state.open.has(k) ? state.open.delete(k) : state.open.add(k); const y = scrollY; render(); scrollTo(0, y); return; }
  const rq2 = e.target.closest('[data-rq]'); if (rq2) { state.req = state.req === rq2.dataset.rq ? null : rq2.dataset.rq; const y = scrollY; render(); scrollTo(0, y); return; }
  const st = e.target.closest('[data-stop]'); if (st && !e.target.closest('[data-gap]')) { state.stop = +st.dataset.stop; const y = scrollY; render(); scrollTo(0, y); return; }
  const rq = e.target.closest('[data-req]'); if (rq) { state.req = state.req === rq.dataset.req ? null : rq.dataset.req; const y = scrollY; render(); scrollTo(0, y); return; }
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const y = scrollY; const d = DOCS[state.doc];
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.mode = 'view'; state.sel = null; state.gap = null; state.stop = null; }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; state.mode = 'view'; state.hit = null; state.open.clear(); state.sel = null; state.filter = null; state.req = null; state.hv = 0; state.gap = null; state.gtab = 'critical'; state.stop = null; }
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.rpop) { if (pop?.btn === t) return hideRpop(); return showRpop(t); }
  else if (t.dataset.modal) return openModal(t.dataset.modal);
  else if ('close' in t.dataset) return document.getElementById('modal').close();
  else if (t.dataset.mode) { state.mode = t.dataset.mode; state.hit = null; render(); scrollTo(0, 0); return; }
  else if (t.dataset.src) { e.stopPropagation(); e.preventDefault(); document.getElementById('modal').close(); const n = +t.dataset.src; state.mode = 'source'; state.hit = [n, blockEnd(d, n)]; render(); document.getElementById('L' + n)?.scrollIntoView({ block: 'start' }); scrollBy(0, -80); return; }
  else if (t.dataset.copy) { try { navigator.clipboard.writeText(t.dataset.copy); } catch {} return toast('Path copied'); }
  else if ('sel' in t.dataset) { state.sel = t.dataset.sel === '' || +t.dataset.sel === state.sel ? null : +t.dataset.sel; if (state.variant === 'b') return drawer(); }
  else if ('filter' in t.dataset) state.filter = t.dataset.filter && t.dataset.filter !== state.filter ? t.dataset.filter : null;
  else if (t.dataset.hv) state.hv = +t.dataset.hv;
  else if (t.dataset.bgap) state.gap = state.gap === t.dataset.bgap ? null : t.dataset.bgap;
  else if (t.dataset.cgap) state.gap = t.dataset.cgap;
  else if (t.dataset.gtab) { state.gtab = t.dataset.gtab; state.gap = null; }
  else if ('showok' in t.dataset) state.showOk = !state.showOk;
  else if (t.dataset.gap) { const key = t.dataset.gap; const g = gapsAll(d).find(x => x.key === key); state.sel = null; if (state.variant === 'a') state.open.add('gap-' + key); else if (state.variant === 'b' || state.variant === 'e') state.gap = key; else if (state.variant === 'c') { state.gtab = g.kind; state.gap = key; } else if (g.kind !== 'critical') state.open.add('gp-' + key); render(); return setTimeout(() => jump('gap-' + key), 30); }
  else if (t.dataset.jump) return jump(t.dataset.jump);
  else if ('toast' in t.dataset) return toast(t.dataset.toast);
  else return;
  render(); scrollTo(0, y);
});
render();
</script>
</body>
</html>
