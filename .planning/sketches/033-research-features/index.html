/* Sketch 033: the Features panel inside 031's E frame (five spines, Features open): the feature
   landscape (expected, differentiators, anti-features) and the competitor feature analysis.
   Anti-features are 032 A's swaps in every variant. The variants differ in the rest: A two columns
   (expected | differentiators) + a comparison matrix with our column tinted; B a kind switch with a
   one-line why per row + "us vs them" rows; C a complexity map of tiles + a rival picker that reads
   each row as them → us. Data: 031's data.js (frame) + this sketch's data.js (FEATURES.md).
   The 031 notes follow. Sketch 031, round 4: round 2's E (five spines) with the user's three fixes. (1) Fewer words on
   the first screen: the finding is its first sentence, cut at a colon when long, and everything else
   waits behind one "Read the full summary". (2) Type matches the shipped pages: headings, labels,
   chips and marks in Space Grotesk (the app's --font-heading is the sans); mono only for code,
   package names, small number badges and counts. (3) A gate reads as a gate: a barrier block with a
   lock, "must pass first", and its condition; the track's corner squares and the lane label go.
   Round 2 notes follow. Sketch 031, round 2. Round 1 (round-1.html: tabs, side rail, hub) was rejected: "be creative
   with everything, including the layout", and nothing links to the source. Every file gets a
   signature visual (summary: the build-order line; stack: layered slabs; features: a three-way
   split; architecture: the lane diagram; pitfalls: one square per pitfall, by the phase that
   prevents it). The variants arrange them in three very different ways:
   D: bento board, where a tile opens in place · E: five spines side by side, one open at a time ·
   F: chapters, each with a full-screen title card, read front to back with a live index. */

  --figure-node-border: color-mix(in oklch, var(--primary) 40%, var(--border));
  --figure-wire: color-mix(in oklch, var(--muted-foreground) 60%, transparent);
  --figure-lane: color-mix(in oklch, var(--muted) 42%, transparent);

}

.gate-block { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-3) var(--space-4); padding: var(--space-4); border: 1px solid var(--primary-border); background: repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in oklch, var(--primary) 7%, transparent) 9px 10px), var(--primary-tint); }

.gate-block .gh small { color: var(--muted-foreground); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; }

.why-order { margin-top: var(--space-4); }

.why-order li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); font-size: var(--fs-4); line-height: var(--lh-relaxed); counter-increment: w; }
.why-order li::before { content: counter(w, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); padding-top: 0.2rem; }
.gaps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-8); counter-reset: g; }
.gap { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--hair); counter-increment: g; }
.gap::before { content: counter(g, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-3); padding-top: 0.15rem; color: var(--primary); line-height: var(--lh-snug); }
.gap b { display: block; font-weight: var(--fw-semibold); font-size: var(--fs-4); }
.gap p { margin-top: var(--space-1); color: var(--ink-soft); font-size: var(--fs-3); line-height: var(--lh-relaxed); }
.sum-flow { display: grid; gap: var(--space-fluid-13); }

/* ===================== D: bento board ===================== */
.d-page { width: min(88rem, 100%); margin: 0 auto; padding: var(--space-fluid-9) var(--space-fluid-8) var(--space-28); }
.d-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: var(--space-4) var(--space-8); }
.d-top h1 { margin-top: var(--space-2); font-size: var(--fs-display-3); line-height: var(--lh-display); font-weight: var(--fw-medium); letter-spacing: var(--ls-tighter); }
.d-top .side { display: grid; justify-items: end; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.d-top .side b { color: var(--foreground); font-weight: var(--fw-medium); }
.board { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-fluid-9); }
.tile { position: relative; display: grid; align-content: start; gap: var(--space-4); padding: var(--space-5); border: 1px solid var(--border); background: var(--card); text-align: left; min-width: 0; transition: border-color .15s ease; }

.tile-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.tile-top .t { display: inline-flex; gap: var(--space-2); align-items: center; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.tile-top .t svg { color: var(--primary); }
.tile-big { display: flex; gap: var(--space-3); align-items: baseline; }
.tile-big b { font-family: var(--font-mono); font-size: var(--fs-display-1); font-weight: var(--fw-medium); line-height: var(--lh-none); }
.tile-big span { color: var(--muted-foreground); font-size: var(--fs-3); }
.tile-line { font-size: var(--fs-4); line-height: var(--lh-relaxed); color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .open { position: absolute; right: var(--space-4); bottom: var(--space-4); color: var(--muted-foreground); }
button.tile:hover .open { color: var(--primary); }
.t-summary { grid-column: span 8; grid-row: span 2; background: color-mix(in oklch, var(--card) 70%, var(--primary-tint)); border-color: var(--primary-border); }
.t-summary .tile-line { -webkit-line-clamp: 5; font-size: var(--fs-fluid-1); color: var(--foreground); max-width: 48rem; }
.t-summary .tile-big b { font-size: var(--fs-display-3); color: var(--primary); }
.t-gaps { grid-column: span 4; grid-row: span 2; }
.t-gaps ol { display: grid; gap: var(--space-2); counter-reset: g; }
.t-gaps li { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); font-size: var(--fs-3); line-height: var(--lh-snug); counter-increment: g; }
.t-gaps li::before { content: counter(g, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--primary); }
.t-gaps .more { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.t-architecture { grid-column: span 7; grid-row: span 2; }
.t-stack { grid-column: span 5; }
.t-features { grid-column: span 5; }
.t-pitfalls { grid-column: span 12; }
.t-pitfalls .pit-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-8); align-items: end; }
.focus-strip { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: var(--space-2); margin-top: var(--space-fluid-9); position: sticky; top: 3rem; z-index: 5; padding: var(--space-2) 0; background: var(--background); }
.fs-tile { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2-5); align-items: center; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: var(--card); text-align: left; }
.fs-tile:hover { border-color: var(--primary-border); }
.fs-tile[aria-current="true"] { border-color: var(--primary); background: var(--primary-tint); }
.fs-tile svg { color: var(--primary); }
.fs-tile b { font-weight: var(--fw-medium); font-size: var(--fs-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fs-tile .n { font-family: var(--font-mono); color: var(--muted-foreground); }
.fs-tile.board-btn { grid-template-columns: auto minmax(0, 1fr); }
.focus-body { margin-top: var(--space-8); padding: var(--space-fluid-9); border: 1px solid var(--border); background: var(--card); }
.focus-body > .fh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-4); align-items: end; padding-bottom: var(--space-6); margin-bottom: var(--space-8); border-bottom: 1px solid var(--border); }
.focus-body > .fh h2 { margin-top: var(--space-2); font-size: var(--fs-display-1); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.focus-body .inspect, .focus-body .ld-canvas { background: var(--background); }
.focus-body .stn .card { background: var(--background); }

/* ===================== E: spines ===================== */
.e-wrap { display: grid; grid-template-rows: auto minmax(0, 1fr); height: calc(100vh - 3rem - 3.75rem); }
.e-bar { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); align-items: baseline; padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border); }
.e-bar h1 { font-size: var(--fs-fluid-4); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); }
.e-bar .m { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font-family: var(--font-sans); font-weight: var(--fw-semibold); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.e-bar .m b { color: var(--foreground); font-weight: var(--fw-medium); }
.spines { display: flex; min-height: 0; }
.spine { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; width: 5.25rem; flex: none; padding: var(--space-5) 0; border: 0; border-right: 1px solid var(--border); background: var(--background); text-align: center; transition: background .15s ease; }
.spine:hover { background: var(--state-hover); }
.spine .no { font-family: var(--font-sans); font-size: var(--fs-2); color: var(--muted-foreground); }
.spine .vt { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; gap: var(--space-4); align-items: center; justify-content: flex-end; padding: var(--space-5) 0; font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); white-space: nowrap; }
.spine .vt svg { transform: rotate(180deg); color: var(--primary); width: 1.1rem; height: 1.1rem; }
.spine .ft { display: grid; justify-items: center; gap: var(--space-2); }
.spine .ft b { font-family: var(--font-sans); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.spine .ft .meter { color: var(--primary); }
.spine.lead { background: color-mix(in oklch, var(--background) 80%, var(--primary-tint)); }
.leaf { flex: 1; min-width: 0; overflow-y: auto; border-right: 1px solid var(--border); }
.leaf-in { padding: var(--space-fluid-9) var(--space-fluid-8) var(--space-28); max-width: 76rem; }
.leaf-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-6); align-items: end; padding-bottom: var(--space-6); border-bottom: 1px solid var(--border); }
.leaf-head .no { font-family: var(--font-sans); font-weight: var(--fw-medium); font-size: var(--fs-display-3); line-height: var(--lh-display); color: var(--primary); letter-spacing: var(--ls-tighter); }
.leaf-head h2 { font-size: var(--fs-display-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.leaf-head .nums { display: flex; gap: var(--space-6); }
.leaf-head .nums div { display: grid; justify-items: end; }
.leaf-head .nums b { font-family: var(--font-sans); font-size: var(--fs-display-1); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-none); }
.leaf-head .nums small { margin-top: var(--space-1-5); font-family: var(--font-sans); font-weight: var(--fw-semibold); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.leaf-verdict { margin-top: var(--space-6); max-width: 56rem; font-size: var(--fs-fluid-3); line-height: var(--lh-snug); letter-spacing: var(--ls-tight); }
.leaf-verdict.long { font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); letter-spacing: normal; }
.leaf-verdict { max-width: 46rem; }
.leaf-tail { margin-top: var(--space-3); max-width: 46rem; color: var(--muted-foreground); font-size: var(--fs-4); line-height: var(--lh-relaxed); }
.leaf-viz { margin-top: var(--space-8); }
.leaf-body { margin-top: var(--space-fluid-10); }

/* ===================== F: chapters ===================== */
.f-wrap { display: grid; grid-template-columns: 13rem minmax(0, 1fr); }
.f-index { position: sticky; top: 3rem; align-self: start; height: calc(100vh - 3rem); display: grid; align-content: start; gap: var(--space-1); padding: var(--space-8) var(--space-4); border-right: 1px solid var(--border); }
.f-index .kicker { margin-bottom: var(--space-3); }
.f-ix { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: var(--space-2); align-items: baseline; padding: var(--space-2) var(--space-2); border: 0; border-left: 2px solid var(--border); background: none; text-align: left; color: var(--muted-foreground); }
.f-ix:hover { color: var(--foreground); }
.f-ix .no { font-family: var(--font-mono); font-size: var(--fs-2); }
.f-ix b { font-weight: var(--fw-medium); }
.f-ix small { grid-column: 2; font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.f-ix[aria-current="true"] { border-left-color: var(--primary); color: var(--foreground); }
.f-ix[aria-current="true"] .no { color: var(--primary); }
.f-ix.read { border-left-color: color-mix(in oklch, var(--primary) 35%, var(--border)); }
.f-main { min-width: 0; }
.chapter { border-bottom: 1px solid var(--border); }
.cover { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-fluid-14); align-items: center; min-height: calc(100vh - 3rem - 3.75rem); padding: var(--space-fluid-10) var(--space-fluid-8); }
.chapter:first-child .cover { background: color-mix(in oklch, var(--background) 88%, var(--primary-tint)); }
.cover .no { font-family: var(--font-sans); font-weight: var(--fw-medium); font-size: clamp(5rem, 14vw, 12rem); line-height: 0.8; letter-spacing: var(--ls-tighter); color: var(--primary); }
.cover h2 { margin-top: var(--space-6); font-size: var(--fs-display-1); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.cover .proj { margin-top: var(--space-3); }
.cover .verdict { margin-top: var(--space-6); font-size: var(--fs-fluid-3); line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 40rem; }
.cover .verdict.long { font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); letter-spacing: normal; }
.cover .cm { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin-top: var(--space-6); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.cover .cm b { color: var(--foreground); font-weight: var(--fw-medium); }
.cover .art { min-width: 0; }
.cover .art .huge { font-family: var(--font-mono); font-size: var(--fs-display-3); line-height: var(--lh-display); }
.cover .art .huge small { display: block; margin-top: var(--space-2); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.ch-body { padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-fluid-14); }
.f-next { display: inline-flex; gap: var(--space-2); align-items: center; margin-top: var(--space-8); }

/* ---------- responsive: the Width tool narrows #frame (.tablet / .narrow) ---------- */
.narrow .d-page, .narrow .leaf-in { padding: var(--space-6) var(--space-4) var(--space-28); }
.narrow .d-top h1 { font-size: 2.6rem; }
.narrow .d-top .side { justify-items: start; }
.narrow .board, .tablet .board { grid-template-columns: minmax(0, 1fr); }
.narrow .tile, .tablet .tile { grid-column: 1 !important; grid-row: auto !important; }
.narrow .t-pitfalls .pit-wrap { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
.narrow .focus-strip, .tablet .focus-strip { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
.narrow .focus-body { padding: var(--space-4); }
.narrow .gaps, .tablet .gaps, .narrow .inspect-body, .tablet .inspect-body { grid-template-columns: minmax(0, 1fr); }
.narrow .inspect-head, .narrow .inspect-body { padding: var(--space-4); }
.narrow .track { grid-template-columns: minmax(0, 1fr); min-width: 0; row-gap: var(--space-2); }
.narrow .track::before, .narrow .lane-label { display: none; }
.narrow .stn { grid-template-columns: 2.3rem minmax(0, 1fr); grid-column: 1 !important; grid-row: auto !important; }
.narrow .stn .card { min-height: 0; }
.narrow .stn.alongside { margin-left: var(--space-6); }
.narrow .stn.alongside::before { display: none; }
.narrow .ld[data-panel="true"], .tablet .ld[data-panel="true"] { grid-template-columns: minmax(0, 1fr); }
.narrow .split-legend { grid-template-columns: minmax(0, 1fr); }
.narrow .slab { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); }

.narrow .e-wrap { height: auto; }
.narrow .spines { flex-direction: column; }
.narrow .spine { width: auto; grid-template-rows: none; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; justify-items: start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-right: 0; border-bottom: 1px solid var(--border); }
.narrow .spine .vt { writing-mode: horizontal-tb; transform: none; padding: 0; font-size: var(--fs-6); }
.narrow .spine .vt svg { transform: none; }
.narrow .spine .ft { grid-auto-flow: column; gap: var(--space-3); align-items: center; }
.narrow .spine .ft b { font-size: var(--fs-5); }
.narrow .leaf { overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); }
.narrow .leaf-head { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
.narrow .leaf-head .no { font-size: 3rem; }
.narrow .leaf-head .nums div { justify-items: start; }
.narrow .f-wrap, .tablet .f-wrap { grid-template-columns: minmax(0, 1fr); }
.narrow .f-index, .tablet .f-index { position: sticky; top: 3rem; z-index: 5; height: auto; display: flex; overflow-x: auto; gap: var(--space-1); padding: var(--space-2) var(--space-3); background: var(--background); border-right: 0; border-bottom: 1px solid var(--border); }
.narrow .f-index .kicker, .tablet .f-index .kicker, .narrow .f-ix small { display: none; }
.narrow .f-ix, .tablet .f-ix { flex: none; border-left: 0; border-bottom: 2px solid var(--border); }
.narrow .f-ix[aria-current="true"], .tablet .f-ix[aria-current="true"] { border-bottom-color: var(--primary); }
.narrow .cover, .tablet .cover { grid-template-columns: minmax(0, 1fr); min-height: 0; }
.narrow .cover { padding: var(--space-8) var(--space-4); }
.narrow .ch-body { padding: var(--space-6) var(--space-4) var(--space-10); }
@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .tile { grid-column: 1 !important; grid-row: auto !important; }
  .gaps, .inspect-body { grid-template-columns: minmax(0, 1fr); }
  .shell-nav { display: none; }
  .f-wrap { grid-template-columns: minmax(0, 1fr); }
  .cover { grid-template-columns: minmax(0, 1fr); }
}


/* ===================== 033: the Features panel ===================== */
:root { --border-faint: color-mix(in oklch, var(--border) 55%, transparent); }
.feat { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-fluid-13); }
.feat > section { min-width: 0; }
.feat .sec-head { margin-bottom: var(--space-5); }
.sub-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); margin: var(--space-8) 0 var(--space-3); }
.sub-head h4 { font-size: var(--fs-6); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); }
.mlabel { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: 400; letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.chip { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0.1rem var(--space-1-5); border: 1px solid var(--border); background: none; color: var(--muted-foreground); font-family: var(--font-sans); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; line-height: var(--lh-snug); white-space: nowrap; }
button.chip:hover { color: var(--foreground); border-color: var(--primary-border); }
button.chip[aria-pressed="true"] { color: var(--primary); border-color: var(--primary); background: var(--primary-tint); }
/* complexity: three quiet cells */
.cx { display: inline-flex; gap: 2px; flex: none; color: var(--muted-foreground); }
.cx i { width: 0.5rem; height: 0.5rem; border: 1px solid currentColor; }
.cx i.on { background: currentColor; }
.cx i.half { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
/* a feature row (A, B) */
.frows { display: grid; border-top: 1px solid var(--border); }
.fgroup { padding: var(--space-4) 0 var(--space-1-5); border-bottom: 1px solid var(--border-faint); }
.frow { border-bottom: 1px solid var(--border-faint); }
.frow > button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-4); align-items: baseline; width: 100%; padding: var(--space-2-5) 0; border: 0; background: none; text-align: left; }
.frow > button:hover { background: var(--state-hover); }
.frow .fn { font-size: var(--fs-4); line-height: var(--lh-snug); }
.frow .fw { display: block; margin-top: var(--space-0-5); color: var(--muted-foreground); font-size: var(--fs-3); line-height: var(--lh-snug); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow[data-open="true"] .fn { font-weight: var(--fw-semibold); }
.frow .more { display: grid; gap: var(--space-1-5); padding: 0 0 var(--space-4); max-width: 54rem; }
.frow .more p { color: var(--ink-soft); font-size: var(--fs-3); line-height: var(--lh-relaxed); }
.frow .more .mlabel { margin-top: var(--space-1-5); }
/* A: two columns */
.fcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-8); }
.fcol-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); padding-bottom: var(--space-3); }
.fcol-head b { font-size: var(--fs-display-1); font-weight: var(--fw-medium); line-height: var(--lh-none); letter-spacing: var(--ls-tight); }
.fcol-head b.diff { color: var(--primary); }
.fcol-head span { display: grid; justify-items: end; gap: var(--space-0-5); }
/* anti-features: swaps, as 032 A */
.swaps { display: grid; border-top: 1px solid var(--border); }
.swap { border-bottom: 1px solid var(--border); }
.swap > button { display: grid; grid-template-columns: 2rem minmax(0, 1fr) 1.5rem minmax(0, 1fr) 1rem; gap: var(--space-3) var(--space-4); align-items: baseline; width: 100%; padding: var(--space-4) 0; border: 0; background: none; text-align: left; }
.swap > button:hover { background: var(--state-hover); }
.swap .n { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.swap .bad { font-size: var(--fs-4); line-height: var(--lh-snug); color: var(--muted-foreground); text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--destructive) 70%, transparent); text-decoration-thickness: 1.5px; }
.swap .arr { color: var(--primary); font-family: var(--font-mono); }
.swap .good { font-size: var(--fs-4); line-height: var(--lh-snug); }

.swap[data-open="true"] .chev { transform: rotate(90deg); }
.swap .why { display: grid; grid-template-columns: 2rem minmax(0, 1fr); column-gap: var(--space-4); row-gap: var(--space-1-5); padding: 0 0 var(--space-5); }

.swap .them { color: var(--muted-foreground); font-size: var(--fs-3); line-height: var(--lh-snug); }
/* competitor matrix (A) */
.cmx { display: grid; border: 1px solid var(--border); overflow-x: auto; }
.cmx-row { display: grid; grid-template-columns: minmax(9rem, 0.8fr) repeat(var(--rivals), minmax(9rem, 1fr)) minmax(11rem, 1.2fr); border-bottom: 1px solid var(--border-faint); }
.cmx-row:last-child { border-bottom: 0; }
.cmx-row > * { padding: var(--space-3); min-width: 0; font-size: var(--fs-3); line-height: var(--lh-snug); }
.cmx-row > :not(:first-child) { border-left: 1px solid var(--border-faint); }
.cmx-row.head > * { padding-top: var(--space-3); padding-bottom: var(--space-3); }
.cmx-row.head b { display: block; font-size: var(--fs-4); font-weight: var(--fw-semibold); }
.cmx-row.head small { display: block; margin-top: var(--space-0-5); color: var(--muted-foreground); font-size: var(--fs-2); }

.c-note { margin-top: var(--space-4); max-width: 54rem; color: var(--muted-foreground); font-size: var(--fs-4); line-height: var(--lh-relaxed); }

.kswitch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); margin-bottom: var(--space-6); }
.kswitch button { display: grid; gap: var(--space-1-5); justify-items: start; padding: var(--space-4) var(--space-5); border: 0; border-right: 1px solid var(--border); background: none; text-align: left; }

.vs-row .them li .mlabel { font-size: var(--fs-1); padding-top: 0.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.cmap { display: grid; grid-template-columns: 9rem repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); }

function gapsHTML(P) {

// ===================== 033: the Features panel =====================
const cap = (t) => String(t || '').replace(/^([a-z])/, (ch) => ch.toUpperCase()).replace(/\.$/, '');
const CX = { LOW: 1, 'LOW-MEDIUM': 1.5, 'MEDIUM-LOW': 1.5, MEDIUM: 2, 'MEDIUM-HIGH': 2.5, HIGH: 3 };
const cxMeter = (lv) => { const n = CX[lv] ?? 0; return `<span class="cx" title="${esc(lv ? `${lv.toLowerCase()} complexity` : 'complexity not rated')}">${[1, 2, 3].map((i) => `<i class="${n >= i ? 'on' : n >= i - 0.5 ? 'half' : ''}"></i>`).join('')}</span>`; };
// "OffShoot (Hedge)" → OffShoot / Hedge; "Project dashboards (Linear/Jira/GitHub Projects)" → Project dashboards / Linear/Jira/GitHub Projects
const rivalName = (r) => { const m = /^(.+?)\s*\((.+)\)\s*$/.exec(r); return m ? { name: m[1], sub: m[2] } : { name: r, sub: '' }; };
const KIND = { expected: 'Expected', differentiators: 'Differentiators', anti: 'Not to build' };

// One feature row: the name (and, in B, why in one line); click for why and notes.
function featureRows(kind, items, { why = false, limit = 0 } = {}) {
  let last = undefined; let inGroup = 0;
  const counts = {}; items.forEach((f) => { counts[f.group] = (counts[f.group] || 0) + 1; });
  return `<div class="frows">${items.map((f, i) => {
    if (f.group !== last) inGroup = 0;
    inGroup++;
    const gkey = `${kind}|${f.group}`;
    if (limit && inGroup > limit && !state.grpOpen.has(gkey)) {
      if (inGroup === limit + 1) { last = f.group; return `<button class="text-btn" style="padding:var(--space-2) 0" data-grp="${esc(gkey)}">+ ${counts[f.group] - limit} more${f.group ? ` in ${esc(f.group)}` : ''}</button>`; }
      return '';
    }
    const key = `${kind}:${i}`; const open = state.fOpen === key;
    const group = f.group !== last && f.group ? `<p class="fgroup mlabel">${esc(f.group)}</p>` : '';
    last = f.group;
    return `${group}<div class="frow" data-open="${open}"><button data-fopen="${key}" aria-expanded="${open}"><span><span class="fn">${inline(f.name)}</span>${why && !open ? `<span class="fw">${esc(plain(f.why))}</span>` : ''}</span>${cxMeter(f.complexity)}</button>${open ? `<div class="more"><p class="mlabel">${kind === 'expected' ? 'Why users expect it' : 'Why it matters'}</p><p>${inline(cap(f.why))}.</p>${f.notes ? `<p class="mlabel">Notes</p><p>${inline(cap(f.notes))}.</p>` : ''}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
// Anti-features: the swap from 032 A — the feature struck through → the better approach.
function antiRows(items) {
  return `<ol class="swaps">${items.map((a, i) => { const open = state.aOpen === i; return `<li class="swap" data-open="${open}"><button data-aopen="${i}" aria-expanded="${open}"><span class="n">${pad(i + 1)}</span><span class="bad">${inline(a.name)}</span><span class="arr">→</span><span class="good">${inline(cap(a.instead))}</span><span class="chev">${ICON(I.right)}</span></button>${open ? `<div class="why"><p class="mlabel">Why it gets asked for</p><p>${inline(cap(a.requested))}.</p><p class="mlabel">Why it's a problem</p><p>${inline(cap(a.problem))}.</p></div>` : ''}</li>`; }).join('')}</ol>`;
}
// The long list, three ways (D1–D3). Rows keep their place in the whole list, so open state is stable.
function oneRow(kind, f, key, { why = true } = {}) {
  const open = state.fOpen === key;
  return `<div class="frow" data-open="${open}"><button data-fopen="${key}" aria-expanded="${open}"><span><span class="fn">${inline(f.name)}</span>${why && !open ? `<span class="fw">${esc(plain(f.why))}</span>` : ''}</span>${cxMeter(f.complexity)}</button>${open ? `<div class="more"><p class="mlabel">${kind === 'expected' ? 'Why users expect it' : 'Why it matters'}</p><p>${inline(cap(f.why))}.</p>${f.notes ? `<p class="mlabel">Notes</p><p>${inline(cap(f.notes))}.</p>` : ''}</div>` : ''}</div>`;
}
function longList(kind, items, v) {
  const groups = [...new Set(items.map((f) => f.group))];
  if (groups.length < 2) return featureRows(kind, items, { why: true });
  const inG = (g) => items.map((f, i) => [f, i]).filter(([f]) => f.group === g);
  if (v === 'D1') {
    const g = groups.includes(state.grp) ? state.grp : groups[0];
    return `<div class="gchips">${groups.map((x) => `<button class="gchip" data-grpsel="${esc(x)}" aria-pressed="${x === g}"><span>${esc(x)}</span><b>${inG(x).length}</b></button>`).join('')}</div>
      <div class="frows">${inG(g).map(([f, i]) => oneRow(kind, f, `${kind}:${i}`)).join('')}</div>`;
  }
  if (v === 'D2') {
    const openG = state.acc === undefined ? groups[0] : state.acc;
    return `<div class="acc">${groups.map((x) => { const rows = inG(x); const open = x === openG; return `<div class="acc-g" data-open="${open}"><button class="acc-h" data-acc="${esc(x)}" aria-expanded="${open}"><span class="acc-n">${esc(x)}</span><span class="acc-c">${rows.length}</span><span class="acc-peek">${open ? '' : esc(rows.slice(0, 2).map(([f]) => plain(f.name)).join(' · '))}</span><span class="chev">${ICON(I.right)}</span></button>${open ? `<div class="frows">${rows.map(([f, i]) => oneRow(kind, f, `${kind}:${i}`)).join('')}</div>` : ''}</div>`; }).join('')}</div>`;
  }
  return `<div class="gcards">${groups.map((x) => { const rows = inG(x); return `<div class="gcard"><div class="gcard-h"><span>${esc(x)}</span><b>${rows.length}</b></div><div class="frows">${rows.map(([f, i]) => oneRow(kind, f, `${kind}:${i}`, { why: false })).join('')}</div></div>`; }).join('')}</div>`;
}
function landscapeHTML(L) {
  const v = state.variant;
  const total = L.expected.items.length + L.differentiators.items.length + L.anti.items.length;
  const head = `<div class="sec-head"><h3>Feature landscape</h3><span class="tally">${total} features · ${L.expected.items.length} expected · ${L.differentiators.items.length} differentiators · ${L.anti.items.length} not to build</span></div>`;
  const anti = L.anti.items.length ? `<div class="sub-head"><h4>Anti-features</h4><span class="mlabel">${L.anti.items.length} · looks good, causes problems</span></div>${antiRows(L.anti.items)}` : '';
  if (v === 'A') {
    const col = (kind, b) => `<div><div class="fcol-head"><h4 style="font-size:var(--fs-6);font-weight:var(--fw-semibold)">${KIND[kind]}</h4><span><b class="${kind === 'differentiators' ? 'diff' : ''}">${L[kind].items.length}</b></span></div>${featureRows(kind, L[kind].items, { limit: 3 })}</div>`;
    return `<section>${head}<div class="fcols">${col('expected')}${col('differentiators')}</div>${anti}</section>`;
  }
  if (v === 'B' || v[0] === 'D') {
    const k = state.kind;
    const sw = `<div class="kswitch">${['expected', 'differentiators', 'anti'].map((x) => `<button data-kind="${x}" aria-pressed="${k === x}"><b>${L[x].items.length}</b><span class="mlabel">${KIND[x]}</span></button>`).join('')}</div>`;
    return `<section>${head}${sw}${k === 'anti' ? antiRows(L.anti.items) : v.length === 2 ? longList(k, L[k].items, v) : featureRows(k, L[k].items, { why: true })}</section>`;
  }
  // C: a complexity map — expected and differentiators as tiles, by how hard they are to build.
  const band = (lv) => (!lv ? 3 : CX[lv] <= 1.5 ? 0 : CX[lv] < 2.5 ? 1 : 2);
  const rows = ['expected', 'differentiators'].map((kind) => {
    const cells = [[], [], [], []];
    L[kind].items.forEach((f, i) => cells[band(f.complexity)].push([f, i]));
    return { kind, cells };
  });
  const unrated = rows.some((r) => r.cells[3].length);
  const cols = unrated ? 4 : 3;
  const sel = state.tile && /^(expected|differentiators):(\d+)$/.exec(state.tile);
  const f = sel ? L[sel[1]].items[+sel[2]] : null;
  return `<section>${head}<div class="cmap" style="grid-template-columns:9rem repeat(${cols}, minmax(0, 1fr))"><div class="ch corner"><span class="mlabel">Complexity</span></div>${['Low', 'Medium', 'High', 'Not rated'].slice(0, cols).map((c, i) => `<div class="ch"><span class="mlabel">${c}</span>${i < 3 ? cxMeter(['LOW', 'MEDIUM', 'HIGH'][i]) : ''}</div>`).join('')}
    ${rows.map((r) => `<div class="rh ${r.kind === 'differentiators' ? 'diff' : ''}"><b>${L[r.kind].items.length}</b><span class="mlabel">${KIND[r.kind]}</span></div>${r.cells.slice(0, cols).map((c) => `<div class="cell">${c.map(([x, i]) => `<button class="tile ${r.kind === 'differentiators' ? 'diff' : ''}" data-tile="${r.kind}:${i}" aria-pressed="${state.tile === `${r.kind}:${i}`}" title="${esc(x.group || '')}">${inline(x.name)}</button>`).join('')}</div>`).join('')}`).join('')}</div>
    ${f ? `<div class="tdetail"><div><p class="mlabel" style="margin:0 0 var(--space-2)">${KIND[sel[1]]}${f.group ? ` · ${esc(f.group)}` : ''} · ${esc((f.complexity || 'unrated').toLowerCase())} complexity</p><h4>${inline(f.name)}</h4><p class="mlabel">${sel[1] === 'expected' ? 'Why users expect it' : 'Why it matters'}</p><p>${inline(cap(f.why))}.</p>${f.notes ? `<p class="mlabel">Notes</p><p>${inline(cap(f.notes))}.</p>` : ''}</div><button class="icon-btn close" data-tile="${state.tile}" aria-label="Close">${ICON(I.x)}</button></div>` : `<p class="bo-hint" style="margin-top:var(--space-3);color:var(--muted-foreground);font-size:var(--fs-3)">Pick a feature for why it's there.</p>`}
    ${anti}</section>`;
}
function competitorHTML(C) {
  if (!C) return '';
  const v = state.variant;
  const head = `<div class="sec-head"><h3>Competitor feature analysis</h3><span class="tally">${C.rows.length} features · ${C.rivals.length} compared</span></div>`;
  const note = C.note ? `<p class="c-note">${inline(C.note)}</p>` : '';
  const R = C.rivals.map(rivalName);
  if (v === 'A' || v[0] === 'D') {
    return `<section>${head}<div class="cmx" style="--rivals:${R.length}"><div class="cmx-row head"><span class="mlabel" style="align-self:end">Feature</span>${R.map((r) => `<span><b>${esc(r.name)}</b>${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</span>`).join('')}<span class="us"><b>${esc(/^our approach$/i.test(C.ours) ? project().name : rivalName(C.ours.replace(/'s approach$/i, '')).name)}</b><small>Our approach</small></span></div>
      ${C.rows.map((r, i) => `<div class="cmx-row" data-crow="${i}" data-open="${state.cOpen.has(i)}"><span class="ft">${inline(r.feature)}</span>${r.them.map((t) => `<span class="th"><span class="clamp">${inline(t || '—')}</span></span>`).join('')}<span class="us"><span class="clamp">${inline(r.ours)}</span></span></div>`).join('')}</div>${note}</section>`;
  }
  if (v === 'B') {
    return `<section>${head}<div class="vs">${C.rows.map((r) => `<div class="vs-row"><p class="ft">${inline(r.feature)}</p><div><p class="us">${inline(cap(r.ours))}</p><ul class="them">${r.them.map((t, j) => `<li><span class="mlabel" title="${esc(C.rivals[j])}">${esc(R[j].name)}</span><span>${inline(t || '—')}</span></li>`).join('')}</ul></div></div>`).join('')}</div>${note}</section>`;
  }
  const j = Math.min(state.rival, R.length - 1);
  return `<section>${head}<div class="rival-pick">${R.map((r, k) => `<button class="chip" data-rival="${k}" aria-pressed="${k === j}">${esc(r.name)}</button>`).join('')}</div>
    <ol class="swaps">${C.rows.map((r, i) => `<li class="swap"><button style="cursor:default"><span class="n">${pad(i + 1)}</span><span><span class="mlabel" style="display:block;margin-bottom:var(--space-1)">${inline(r.feature)}</span><span class="them">${inline(r.them[j] || '—')}</span></span><span class="arr">→</span><span class="good">${inline(cap(r.ours))}</span><span></span></button></li>`).join('')}</ol>${note}</section>`;
}
function featBody() {
  const F = window.FEAT[state.project];
  return `<div class="feat">${landscapeHTML(F.landscape)}${competitorHTML(F.competitors)}</div>`;
}

function render() {
  const P = project();
  if (!P.docs[state.doc]) state.doc = 'summary';
  if (state.focus && state.focus !== 'gaps' && !P.docs[state.focus]) state.focus = null;
  if (!P.docs[state.chapter]) state.chapter = 'summary';
  if (state.phase >= P.s.phases.length) state.phase = 0;
  if (state.node != null && (!P.docs.architecture || state.node >= P.docs.architecture.diagram.graph.nodes.length)) state.node = null;
  document.getElementById('shell-proj').textContent = P.name;
  document.getElementById('shell-sub').textContent = P.version ? `${P.version} · research` : 'research';
  document.getElementById('app').innerHTML = renderE(P);
  fitDiagrams();
}

// Re-rendering replaces the open panel; keep its scroll position.
function keepScroll(fn) { const l = document.querySelector('.leaf'); const y = l ? l.scrollTop : 0; const wy = scrollY; fn(); const n = document.querySelector('.leaf'); if (n) n.scrollTop = y; scrollTo(0, wy); }
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400); }
function openPitfall(n) {
  const P = project();
  if (!P.docs.pitfalls) return;
  if (state.variant === 'D') state.focus = 'pitfalls';
  if (state.variant === 'E') state.doc = 'pitfalls';
  render();
  if (state.variant === 'F') goChapter('pitfalls');
  toast(`Pitfall ${pad(n)}: ${P.docs.pitfalls.titles[n - 1]}`);
}
function goChapter(key) { state.chapter = key; render(); document.getElementById(`ch-${key}`)?.scrollIntoView({ block: 'start' }); }

document.addEventListener('click', (e) => {
  const v = e.target.closest('button.variant-tab');
  if (v) { state.variant = v.dataset.v; state.fOpen = null; state.aOpen = null; document.querySelectorAll('button.variant-tab').forEach((b) => b.classList.toggle('active', b === v)); keepScroll(render); return; }
  const tool = e.target.closest('#sketch-tools button');
  if (tool) {
    if (tool.dataset.project) { state.project = tool.dataset.project; state.phase = 0; state.node = null; state.fOpen = null; state.aOpen = null; state.cOpen = new Set(); state.rival = 0; state.tile = null; }
    if (tool.dataset.files) state.files = tool.dataset.files;
    if (tool.dataset.theme) { state.theme = tool.dataset.theme; document.documentElement.classList.toggle('dark', state.theme === 'dark'); }
    if (tool.dataset.width) { state.width = tool.dataset.width; const f = document.getElementById('frame'); f.style.maxWidth = state.width === 'full' ? '' : state.width + 'px'; f.classList.toggle('narrow-frame', state.width !== 'full'); f.classList.toggle('narrow', state.width === '375'); f.classList.toggle('tablet', state.width === '768'); }
    syncTools(); render(); return;
  }
  const gs = e.target.closest('[data-grpsel]');
  if (gs) { state.grp = gs.dataset.grpsel; state.fOpen = null; keepScroll(render); return; }
  const ac = e.target.closest('[data-acc]');
  if (ac) { const g = ac.dataset.acc; const cur = state.acc === undefined ? null : state.acc; state.acc = (state.acc === undefined ? ac.closest('.acc').querySelector('[data-acc]').dataset.acc : cur) === g ? null : g; keepScroll(render); return; }
  const gp = e.target.closest('[data-grp]');
  if (gp) { state.grpOpen.add(gp.dataset.grp); keepScroll(render); return; }
  const fo = e.target.closest('[data-fopen]');
  if (fo) { state.fOpen = state.fOpen === fo.dataset.fopen ? null : fo.dataset.fopen; keepScroll(render); return; }
  const ao = e.target.closest('[data-aopen]');
  if (ao) { const i = +ao.dataset.aopen; state.aOpen = state.aOpen === i ? null : i; keepScroll(render); return; }
  const kd = e.target.closest('[data-kind]');
  if (kd) { state.kind = kd.dataset.kind; state.fOpen = null; state.aOpen = null; keepScroll(render); return; }
  const cr = e.target.closest('[data-crow]');
  if (cr) { const i = +cr.dataset.crow; state.cOpen.has(i) ? state.cOpen.delete(i) : state.cOpen.add(i); keepScroll(render); return; }
  const rv = e.target.closest('[data-rival]');
  if (rv) { state.rival = +rv.dataset.rival; keepScroll(render); return; }
  const tl = e.target.closest('[data-tile]');
  if (tl) { state.tile = state.tile === tl.dataset.tile ? null : tl.dataset.tile; keepScroll(render); return; }
  const pit = e.target.closest('[data-pit]');
  if (pit) { openPitfall(+pit.dataset.pit); return; }
  const node = e.target.closest('[data-node]');
  if (node) { const id = +node.dataset.node; state.node = state.node === id ? null : id; keepScroll(render); return; }
  const foc = e.target.closest('[data-focus]');
  if (foc) { state.focus = foc.dataset.focus || null; render(); window.scrollTo({ top: 0 }); return; }
  const doc = e.target.closest('[data-doc]');
  if (doc) { state.doc = doc.dataset.doc; render(); return; }
  const ch = e.target.closest('[data-chapter]');
  if (ch) { goChapter(ch.dataset.chapter); return; }
  const ph = e.target.closest('[data-phase]');
  if (ph) { state.phase = +ph.dataset.phase; render(); return; }
  const walk = e.target.closest('[data-walk]');
  if (walk) { state.phase += +walk.dataset.walk; render(); document.querySelector(`[data-walk="${walk.dataset.walk}"]`)?.focus(); return; }
  const act = e.target.closest('[data-act]');
  if (act) { state[act.dataset.act] = !state[act.dataset.act]; keepScroll(render); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.variant === 'D' && state.focus) { state.focus = null; render(); return; }
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  if (e.target.closest('.track, .inspect')) {
    const n = project().s.phases.length;
    const next = Math.max(0, Math.min(n - 1, state.phase + dir));
    if (next === state.phase) return;
    e.preventDefault(); state.phase = next; render(); document.querySelector(`[data-phase="${next}"]`)?.focus(); return;
  }
  if (e.target.closest('.spines')) {
    const P = project(); const i = P.present.findIndex((f) => f.key === state.doc);
    const next = P.present[Math.max(0, Math.min(P.present.length - 1, i + dir))];
    e.preventDefault(); state.doc = next.key; render(); document.querySelector(`.spine[data-doc], .leaf`)?.focus?.();
  }
});
// Chapters: the index follows the chapter whose cover is nearest the top.
addEventListener('scroll', () => {
  if (state.variant !== 'F') return;
  let cur = state.chapter;
  document.querySelectorAll('.chapter').forEach((c) => { if (c.getBoundingClientRect().top < innerHeight * 0.4) cur = c.dataset.ch; });
  if (cur !== state.chapter) {
    state.chapter = cur;
    const P = project(); const at = P.present.findIndex((x) => x.key === cur);
    document.querySelectorAll('.f-ix').forEach((b, i) => { b.setAttribute('aria-current', String(b.dataset.chapter === cur)); b.classList.toggle('read', i < at); });
  }
}, { passive: true });
addEventListener('resize', fitDiagrams);
function syncTools() {
  document.querySelectorAll('#sketch-tools button').forEach((b) => b.classList.toggle('on', b.dataset.theme === state.theme || b.dataset.width === state.width || b.dataset.project === state.project || b.dataset.files === state.files));
}
syncTools();
render();
</script>
</body>
</html>
