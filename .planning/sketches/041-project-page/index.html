<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 041 — project page (PROJECT.md)</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* Sketch 041: the project page (PROJECT.md as the charter), three page structures. Labelore's own
   PROJECT.md (public repo) is the long input (27 decisions); Lendshed is the made-up fixture (4);
   Kiln is made up here to show Reversed and Revisit outcomes. Requirement counts are the
   traceability projection's (D-05), hard-coded for the sketch. Tokens only, squared corners,
   tones only: Good → complete, Revisit → in-flight, Reversed → missing, Pending → quiet. */
:root {
  --primary-foreground: oklch(0.98 0.016 73.684);
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --missing-border: color-mix(in oklch, var(--missing-fill) 50%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --s40: var(--space-10);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-4); font-weight: var(--fw-medium); line-height: var(--lh-normal); }
h1, h2, h3, p, ul, ol, dl, dd, blockquote, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
code { font-family: var(--font-mono); font-size: 0.92em; padding: 0 var(--space-0-5); background: var(--muted); }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
* { transition: background-color .15s ease, color .15s ease, border-color .15s ease; }

/* ---------- sketch chrome (not part of the app) ---------- */
#sketch-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
#sketch-bar .lbl { color: var(--muted-foreground); white-space: nowrap; }
#sketch-bar .grp { display: flex; gap: var(--space-1); align-items: center; }
#sketch-bar .grp + .grp { padding-left: var(--space-3); border-left: 1px solid var(--border); }
#sketch-bar button { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; color: var(--muted-foreground); white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; }
#sketch-bar button:hover { color: var(--foreground); background: var(--state-hover); }
#sketch-bar .on { color: var(--foreground); border-color: var(--border); background: var(--state-hover); }
@media (max-width: 42rem) { #sketch-bar { flex-wrap: nowrap; overflow-x: auto; } }
#toast { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 99; max-width: 90vw; padding: var(--space-2) var(--space-3); background: var(--foreground); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); opacity: 0; pointer-events: none; transition: opacity .15s; }
#toast.on { opacity: 1; }
#frame { margin-inline: auto; container-type: inline-size; container-name: page; }
#frame[data-w='768'] { max-width: 768px; border-inline: 1px dashed var(--border); }
#frame[data-w='390'] { max-width: 390px; border-inline: 1px dashed var(--border); }

/* ---------- app header (abridged, for context only) ---------- */
.app-head { display: flex; align-items: center; gap: var(--space-4); height: 3.5rem; padding-inline: var(--space-fluid-3); border-bottom: 1px solid var(--border); }
.app-brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-3); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.app-brand i { width: var(--space-5); height: var(--space-5); background: var(--primary); }
.app-brand span { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.app-nav { display: flex; gap: var(--space-1); margin-left: auto; overflow-x: auto; }
.app-nav a { padding: var(--space-1-5) var(--space-2-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.app-nav a:hover { color: var(--foreground); background: var(--state-hover); }
.app-nav a[aria-current] { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }
@container page (max-width: 42rem) { .app-nav { display: none; } }

/* ---------- shared atoms ---------- */
.micro-label { color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
.accent { color: var(--primary); }
.status-chip { display: inline-flex; gap: var(--space-1); align-items: center; width: fit-content; padding: var(--space-0-5) var(--space-2); border: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 55%, transparent); font-family: var(--font-mono); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; white-space: nowrap; }
.status-chip[data-tone='complete'] { border-color: var(--primary-border); background: var(--primary-tint); color: var(--primary); }
.status-chip[data-tone='in-flight'] { border-color: var(--in-flight-border); color: var(--in-flight-fill); }
.status-chip[data-tone='missing'] { border-color: var(--missing-border); color: var(--missing-fill); }
.status-chip[data-tone='quiet'] { color: var(--muted-foreground); border-style: dashed; }
.sq { display: inline-block; width: 0.6rem; height: 0.6rem; flex: none; border: 1px solid var(--border); }
.sq[data-tone='complete'] { background: var(--primary); border-color: var(--primary); }
.sq[data-tone='in-flight'] { background: var(--in-flight-fill); border-color: var(--in-flight-fill); }
.sq[data-tone='missing'] { background: transparent; border: 2px solid var(--missing-fill); }
.sq[data-tone='quiet'] { background: transparent; border: 1px dashed var(--muted-foreground); }
.text-link { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.text-link:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
.source-note { color: var(--muted-foreground); font-size: var(--fs-3); }
.tag { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.chev { transition: transform .15s ease; color: var(--muted-foreground); }
[aria-expanded='true'] > .chev, [aria-expanded='true'] .chev { transform: rotate(90deg); }
.why { display: grid; gap: var(--space-1); align-content: start; }
.ok { display: inline-flex; align-items: center; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.why dt { }
.why dd { color: var(--foreground); font-size: var(--fs-4); line-height: var(--lh-relaxed); }
.why-outcome dd { color: var(--muted-foreground); }

/* =====================================================================
   A — CHARTER: one centred reading column, said like a founding document
   ===================================================================== */
.ca { max-width: 46rem; margin-inline: auto; padding: var(--space-fluid-13) var(--space-fluid-3) var(--space-fluid-10); }
.ca-head { display: grid; gap: var(--space-3); padding-bottom: var(--space-fluid-9); }
.ca-name { font-size: var(--fs-display-3); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); font-weight: var(--fw-semibold); }
.ca-what { color: var(--muted-foreground); font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); max-width: 40rem; }
.ca-core { display: grid; gap: var(--space-3); padding: var(--space-fluid-9) 0; border-block: 1px solid var(--border); }
.ca-core blockquote { font-size: var(--fs-fluid-4); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); font-weight: var(--fw-medium); text-wrap: balance; }
.ca-core blockquote::before { content: '“'; color: var(--primary); margin-right: 0.05em; }
.ca-core blockquote::after { content: '”'; color: var(--primary); }
.ca-now { display: grid; gap: var(--space-4); padding: var(--space-fluid-9) 0; }
.ca-now-line { font-size: var(--fs-fluid-1); line-height: var(--lh-snug); }
.ca-now-line b { font-family: var(--font-mono); font-weight: var(--fw-semibold); font-size: 0.85em; letter-spacing: var(--ls-wider); text-transform: uppercase; margin-right: var(--space-2); }
.ca-counts { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); font-size: var(--fs-4); color: var(--muted-foreground); }
.ca-counts a { display: inline-flex; align-items: center; gap: var(--space-1-5); }
.ca-counts a strong { color: var(--foreground); font-family: var(--font-mono); font-weight: var(--fw-semibold); }
.ca-counts a:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
.ca-art { padding: var(--space-fluid-9) 0 0; display: grid; gap: var(--space-5); }
.ca-art-h { display: flex; align-items: baseline; gap: var(--space-3); padding-top: var(--space-3); border-top: 2px solid var(--foreground); }
.ca-art-h h2 { font-size: var(--fs-7); letter-spacing: var(--ls-tight); font-weight: var(--fw-semibold); }
.ca-art-h .source-note { margin-left: auto; }
.ca-clauses { display: grid; gap: var(--space-4); }
.ca-clause { display: grid; grid-template-columns: 2.5rem 1fr; gap: var(--space-3); }
.ca-clause-n { font-family: var(--font-mono); font-size: var(--fs-3); color: var(--muted-foreground); padding-top: 0.15em; }
.ca-clause p { line-height: var(--lh-relaxed); }
.ca-clause strong { font-weight: var(--fw-semibold); }
.ca-refuse .ca-clause strong { text-decoration: line-through; text-decoration-color: var(--muted-foreground); text-decoration-thickness: 1px; }
.ca-log { display: grid; }
.ca-tally { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); }
.ca-tally span { display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--fs-3); color: var(--muted-foreground); }
.ca-tally .text-link { margin-left: auto; }
.ca-entry { border-bottom: 1px solid var(--border-faint); }
.ca-entry-btn { display: grid; grid-template-columns: 2.5rem 1fr auto; gap: var(--space-3); align-items: baseline; width: 100%; padding: var(--space-3) 0; }
.ca-entry-btn:hover { background: var(--state-hover); }
.ca-entry-n { font-family: var(--font-mono); font-size: var(--fs-3); color: var(--muted-foreground); }
.ca-entry-d { font-size: var(--fs-5); line-height: var(--lh-snug); }
.ca-entry-d .tag { margin-left: var(--space-2); }
.ca-entry-o { display: inline-flex; align-items: center; gap: var(--space-2); }
.ca-entry-body { display: grid; gap: var(--space-3); padding: 0 0 var(--space-4) calc(2.5rem + var(--space-3)); }
.ca-foot { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-5); align-items: center; margin-top: var(--space-fluid-10); padding-top: var(--space-4); border-top: 1px solid var(--border); }
.ca-foot .source-note { margin-right: auto; }
@container page (max-width: 42rem) {
  .ca-entry-btn { grid-template-columns: 2rem 1fr; }
  .ca-entry-o { grid-column: 2; }
  .ca-entry-body { padding-left: calc(2rem + var(--space-3)); }
  .ca-clause { grid-template-columns: 2rem 1fr; }
}

/* =====================================================================
   B — MASTHEAD + SPINE: identity band across the page, decisions on a timeline spine,
   the rules in a margin
   ===================================================================== */
.mb-mast { border-bottom: 1px solid var(--border); background: var(--card-veil); }
.mb-mast-in { max-width: 80rem; margin-inline: auto; padding: var(--space-fluid-10) var(--space-fluid-3) var(--space-fluid-9); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--space-fluid-9); align-items: end; }
.mb-id { display: grid; gap: var(--space-3); }
.mb-name { font-size: var(--fs-display-3); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); font-weight: var(--fw-semibold); }
.mb-what { color: var(--muted-foreground); line-height: var(--lh-relaxed); max-width: 38rem; }
.mb-core { display: grid; gap: var(--space-3); padding: var(--space-5) var(--space-6); border: 1px solid var(--border); border-top: 3px solid var(--primary); background: var(--background); }
.mb-core p:last-child { font-size: var(--fs-fluid-3); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); text-wrap: balance; }
.mb-strip { max-width: 80rem; margin-inline: auto; padding: 0 var(--space-fluid-3); display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); }
.mb-cell { display: grid; gap: var(--space-1-5); align-content: start; padding: var(--space-4) var(--space-4); border-left: 1px solid var(--border); }
.mb-cell:first-child { border-left: 0; padding-left: 0; }
a.mb-cell:hover { background: var(--state-hover); }
.mb-cell-n { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-none); display: flex; align-items: center; gap: var(--space-2); }
.mb-cell-l { font-size: var(--fs-3); color: var(--muted-foreground); }
.mb-goal { font-size: var(--fs-4); line-height: var(--lh-snug); }
.mb-body { max-width: 80rem; margin-inline: auto; padding: var(--space-fluid-9) var(--space-fluid-3) var(--space-fluid-10); display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: var(--space-fluid-9); align-items: start; }
.mb-sec-h { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-4); }
.mb-sec-h h2 { font-size: var(--fs-7); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); }
.mb-sec-h .text-link { margin-left: auto; }
.mb-squares { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: var(--space-2); }
.mb-squares button { width: 0.85rem; height: 0.85rem; padding: 0; }
.mb-squares button .sq { width: 100%; height: 100%; }
.mb-squares button:hover .sq, .mb-squares button.hl .sq { outline: 2px solid var(--foreground); outline-offset: 1px; }
.mb-legend { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin-bottom: var(--space-6); }
.mb-legend span { display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--fs-3); color: var(--muted-foreground); }
.mb-spine { position: relative; display: grid; }
.mb-spine::before { content: ''; position: absolute; left: calc(0.45rem - 0.5px); top: var(--space-2); bottom: var(--space-2); width: 1px; background: var(--border); }
.mb-era { position: relative; padding: var(--space-4) 0 var(--space-2) var(--space-8); }
.mb-era::before { content: ''; position: absolute; left: 0.15rem; top: calc(var(--space-4) + 0.3rem); width: 0.6rem; height: 1px; background: var(--foreground); }
.mb-node { position: relative; padding-left: var(--space-8); }
.mb-node > .sq { position: absolute; left: 0.15rem; top: calc(var(--space-3) + 0.35rem); background-clip: padding-box; box-shadow: 0 0 0 3px var(--background); }
.mb-node > .sq[data-tone='missing'], .mb-node > .sq[data-tone='quiet'] { background-color: var(--background); }
.mb-node-btn { display: grid; grid-template-columns: 1fr auto; gap: var(--space-1) var(--space-3); align-items: baseline; width: 100%; padding: var(--space-3) var(--space-3) var(--space-3) 0; }
.mb-node-btn:hover { background: var(--state-hover); }
.mb-node.flash .mb-node-btn { background: var(--primary-tint); }
.mb-node-d { font-size: var(--fs-5); line-height: var(--lh-snug); }
.mb-node-meta { display: inline-flex; gap: var(--space-2); align-items: center; }
.mb-node-note { grid-column: 1 / -1; color: var(--muted-foreground); font-size: var(--fs-3); }
.mb-node-body { display: grid; gap: var(--space-3); padding: 0 var(--space-3) var(--space-4) 0; }
.mb-aside { position: sticky; top: 3.5rem; display: grid; gap: var(--space-8); }
.mb-rules h2 { margin-bottom: var(--space-3); padding-bottom: var(--space-2); border-bottom: 1px solid var(--border); }
.mb-rules dl { display: grid; gap: var(--space-3); }
.mb-rules dt { font-size: var(--fs-4); font-weight: var(--fw-semibold); }
.mb-rules dd { color: var(--muted-foreground); font-size: var(--fs-3); line-height: var(--lh-normal); }
.mb-rules.refuse dt { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--muted-foreground); }
.mb-rules dd.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mb-foot { display: grid; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }
@container page (max-width: 62rem) {
  .mb-mast-in { grid-template-columns: 1fr; }
  .mb-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mb-strip .mb-cell:first-child { grid-column: 1 / -1; padding: var(--space-4) 0; border-bottom: 1px solid var(--border); }
  .mb-strip .mb-cell:nth-child(2), .mb-strip .mb-cell:nth-child(4) { border-left: 0; padding-left: 0; }
  .mb-body { grid-template-columns: 1fr; }
  .mb-aside { position: static; order: 2; }
}

/* =====================================================================
   C — SPREAD: an open book. Left page the charter (sticky), right page the decision ledger.
   ===================================================================== */
.cs { max-width: 84rem; margin-inline: auto; padding: var(--space-fluid-9) var(--space-fluid-3) var(--space-fluid-10); display: grid; grid-template-columns: minmax(0, 27rem) minmax(0, 1fr); gap: 0; align-items: start; }
.cs-left { position: sticky; top: 3.5rem; display: grid; gap: var(--space-6); padding: var(--space-6) var(--space-fluid-8) var(--space-6) 0; border-right: 1px solid var(--border); max-height: calc(100vh - 4rem); overflow-y: auto; }
.cs-name { font-size: var(--fs-display-1); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); font-weight: var(--fw-semibold); }
.cs-core { font-size: var(--fs-fluid-1); line-height: var(--lh-snug); font-weight: var(--fw-medium); padding-left: var(--space-4); border-left: 3px solid var(--primary); }
.cs-what { color: var(--muted-foreground); font-size: var(--fs-3); line-height: var(--lh-relaxed); }
.cs-block { display: grid; gap: var(--space-2-5); padding-top: var(--space-4); border-top: 1px solid var(--border); }
.cs-goal { font-size: var(--fs-4); line-height: var(--lh-snug); }
.cs-counts { display: grid; }
.cs-counts a { display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--space-2); align-items: center; padding: var(--space-1-5) 0; border-bottom: 1px dashed var(--border-faint); font-size: var(--fs-3); }
.cs-counts a:hover { background: var(--state-hover); }
.cs-counts a strong { font-family: var(--font-mono); font-weight: var(--fw-semibold); font-size: var(--fs-4); }
.cs-counts a .i { width: var(--space-3); height: var(--space-3); color: var(--muted-foreground); }
.cs-rules { display: grid; gap: var(--space-2); }
.cs-rules li { font-size: var(--fs-3); line-height: var(--lh-normal); color: var(--muted-foreground); }
.cs-rules li strong { color: var(--foreground); font-weight: var(--fw-semibold); }
.cs-rules.refuse li strong { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--muted-foreground); }
.cs-more { justify-self: start; }
.cs-right { padding: var(--space-6) 0 var(--space-6) var(--space-fluid-8); min-width: 0; }
.cs-right-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-4); margin-bottom: var(--space-2); }
.cs-right-h h2 { font-size: var(--fs-fluid-3); letter-spacing: var(--ls-tight); font-weight: var(--fw-semibold); }
.cs-right-h .text-link { margin-left: auto; }
.cs-sub { color: var(--muted-foreground); font-size: var(--fs-3); margin-bottom: var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); }
.cs-sub span { display: inline-flex; align-items: center; gap: var(--space-1-5); }
.cs-cols { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) 7.5rem; gap: var(--space-3); padding: 0 0 var(--space-2); border-bottom: 1px solid var(--foreground); }
.cs-row { border-bottom: 1px solid var(--border-faint); }
.cs-row-btn { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) 7.5rem; gap: var(--space-3); align-items: baseline; width: 100%; padding: var(--space-2-5) 0; }
.cs-row-btn:hover { background: var(--state-hover); }
.cs-row[data-open='true'] { background: var(--card-veil); border-bottom-color: var(--border); }
.cs-row[data-open='true'] .cs-row-btn { box-shadow: inset 2px 0 0 var(--primary); }

.r-wrap { max-width: 78rem; margin-inline: auto; padding-inline: var(--space-fluid-3); }

/* B2: stacked masthead — name and what side by side, the core value across the page, a meter */
.r2-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-fluid-9); align-items: end; padding-block: var(--space-fluid-9) var(--space-6); }

.r2-now { display: grid; grid-template-columns: 10rem minmax(0, 1fr) minmax(0, 22rem); gap: var(--space-6); padding-block: var(--space-5) var(--space-6); border-top: 1px solid var(--border); align-items: start; }

/* body */

/* B3: rules as a band under the masthead, the margin becomes the decision reader */

@container page (max-width: 62rem) {

}

const TONE = { good: 'complete', revisit: 'in-flight', reversed: 'missing', pending: 'quiet' };
const MARK_ORDER = ['good', 'revisit', 'reversed', 'pending'];

  return [
    { n: c.complete, l: 'complete', s: `in ${c.milestone}`, tone: 'complete', q: `?milestone=${c.milestone}&state=complete` },
    { n: c.pending, l: 'pending', s: `in ${c.milestone}`, tone: 'quiet', q: `?milestone=${c.milestone}&state=pending` },
    { n: c.earlier, l: 'shipped before', s: c.earlierNote, tone: 'complete', q: '?state=validated' },
    { n: c.oos, l: 'out of scope', s: 'by choice', tone: 'quiet', q: '?state=out-of-scope' },
  ];
};
function rSpine(P, mode) {
  let era = null;
  return `<ol class="r-spine">${P.decisions.map((d, i) => {
    let marker = '';
    if (d.tag && isEra(d.tag) && d.tag !== era) { era = d.tag; marker = `<li class="r-era" aria-hidden="true"><span></span><i></i><span class="micro-label">${esc(d.tag)}</span></li>`; }
    const open = mode === 'inline' && isOpen(i);
    const sel = mode === 'panel' && S.sel === i;
    return `${marker}<li class="r-node" id="r-${i}" data-sel="${sel}">
      <button class="r-node-btn" data-${mode === 'panel' ? 'pick' : 'toggle'}="${i}" ${mode === 'panel' ? `aria-pressed="${sel}"` : `aria-expanded="${open}"`}>
        <span class="r-node-n">${pad(i + 1)}</span><span class="sq" data-tone="${TONE[d.tone]}"></span>
        <span class="r-node-txt"><span class="r-node-d">${md(d.d)}${d.tag && !isEra(d.tag) ? `<span class="tag" style="margin-left:var(--space-2)">${esc(d.tag)}</span>` : ''}</span>${d.note && !open ? `<span class="r-node-note">${md(d.note)}</span>` : ''}</span>
        <span class="r-node-o">${d.tone === 'good' ? '' : chip(d)}</span>
      </button>
      ${open ? `<div class="r-read">${whyBlock(d)}</div>` : ''}</li>`;
  }).join('')}</ol>`;
}
const rRules = (title, list, refuse, wide) => `<section class="r-rules${refuse ? ' refuse' : ''}"><h2 class="micro-label"><span>${title}</span><span>${list.length}</span></h2>
  <ol>${list.map((c, i) => `<li><span class="n">${ROMAN[i]}</span><div><strong>${md(c.k)}</strong><p class="${S.rules ? '' : 'clip'}">${md(c.v)}</p></div></li>`).join('')}</ol></section>`;
const rFoot = (P) => `<div class="r-foot"><span class="source-note">Last updated ${esc(P.updated || '—')}</span>
  <a class="text-link" href="#" data-go="dashboard">Where the work is now ${svg('arrow')}</a><a class="text-link" href="#" data-go="source">${svg('code')}Source</a></div>`;
const rDecHead = (P, mode) => `<div class="r-sec-h"><h2>Decisions</h2><span class="source-note">${P.decisions.length}, oldest first</span>${mode === 'inline' ? `<button class="text-link" data-all>${S.all ? 'Hide every reason' : 'Show every reason'}</button>` : ''}</div>
  <div class="r-overview">${squares(P)}${legend(P)}</div>`;
const rSplitMast = (P) => `<section class="r-mast"><div class="r-wrap">
    <div class="r-mast-grid"><div class="r-id"><p class="r-eyebrow micro-label accent">Project</p><h1 class="r-name">${esc(P.name)}</h1><p class="r-what">${md(P.what)}</p></div>
      <div class="r-core"><p class="micro-label">Core value</p><q>${md(P.core)}</q></div></div>
    <div class="r-strip"><div class="r-cell"><span class="micro-label">Now building ${esc(P.milestone)}</span><p class="r-goal">${md(P.goal)}</p></div>
      ${rcounts(P).map((c) => `<a class="r-cell" href="#" data-q="${c.q}"><span class="r-cell-n"><span class="sq" data-tone="${c.tone}"></span>${c.n}</span><span class="r-cell-l">${c.l}</span><span class="r-cell-s">${esc(c.s)}</span></a>`).join('')}</div>
  </div></section>`;
const rMargin = (P) => `<aside class="r-aside">${rRules('Bound by', P.constraints)}${rRules('Will not do', P.outOfScope, true)}
  <button class="text-link" data-rules style="justify-self:start">${S.rules ? 'Shorten' : 'Read in full'}</button>${rFoot(P)}</aside>`;

function variantB1(P) {
  return rSplitMast(P) + `<div class="r-wrap r-body"><section>${rDecHead(P, 'inline')}${rSpine(P, 'inline')}</section>${rMargin(P)}</div>`;
}
function variantB2(P) {
  const c = P.counts, tot = c.complete + c.pending;
  return `<section class="r-mast"><div class="r-wrap">
    <div class="r2-top"><div class="r-id"><p class="micro-label accent">Project</p><h1 class="r-name">${esc(P.name)}</h1></div><p class="r-what">${md(P.what)}</p></div>
    <div class="r2-core"><p class="micro-label">Core value</p><q>${md(P.core)}</q></div>
    <div class="r2-now"><p class="micro-label">Now building<br>${esc(P.milestone)}</p><p class="r-goal">${md(P.goal)}</p>
      <div class="r2-meter"><div class="r2-bar">
        <a href="#" data-q="?milestone=${c.milestone}&state=complete" data-tone="complete" style="flex:${c.complete}" title="${c.complete} complete"></a>
        <a href="#" data-q="?milestone=${c.milestone}&state=pending" data-tone="quiet" style="flex:${c.pending}" title="${c.pending} pending"></a></div>
        <div class="r2-keys"><a href="#" data-q="?milestone=${c.milestone}&state=complete"><span class="sq" data-tone="complete"></span><strong>${c.complete}</strong> of ${tot} complete</a><a href="#" data-q="?milestone=${c.milestone}&state=pending"><span class="sq" data-tone="quiet"></span><strong>${c.pending}</strong> pending</a></div>
        <div class="r2-keys"><a href="#" data-q="?state=validated" title="${esc(c.earlierNote)}"><strong>${c.earlier}</strong> shipped before</a><a href="#" data-q="?state=out-of-scope"><strong>${c.oos}</strong> out of scope</a></div>
      </div></div>
  </div></section><div class="r-wrap r-body"><section>${rDecHead(P, 'inline')}${rSpine(P, 'inline')}</section>${rMargin(P)}</div>`;
}
function variantB3(P) {
  const n = P.decisions.length;
  if (S.sel == null || S.sel >= n) S.sel = n - 1;
  const d = P.decisions[S.sel];
  return rSplitMast(P) + `<div class="r-wrap"><div class="r3-band">${rRules('Bound by', P.constraints)}${rRules('Will not do', P.outOfScope, true)}</div>
    <button class="text-link" data-rules style="margin-top:var(--space-2)">${S.rules ? 'Shorten' : 'Read the rules in full'}</button></div>
    <div class="r-wrap r-body"><section>${rDecHead(P, 'panel')}${rSpine(P, 'panel')}</section>
      <aside class="r3-panel" aria-live="polite">
        <div class="r3-panel-n"><b>${pad(S.sel + 1)}</b><span class="source-note">of ${n}</span><span style="margin-left:auto">${d.tone === 'good' ? outcome(d) : chip(d)}</span></div>
        <h3>${md(d.d)}${d.tag ? ` <span class="tag">${esc(d.tag)}</span>` : ''}</h3>
        ${whyBlock(d)}
        <div class="r3-nav"><button class="text-link" data-pick="${S.sel - 1}" ${S.sel === 0 ? 'disabled' : ''}>← Earlier</button><button class="text-link" data-pick="${S.sel + 1}" ${S.sel === n - 1 ? 'disabled' : ''}>Later →</button></div>
      </aside></div>
    <div class="r-wrap" style="padding-bottom:var(--space-fluid-10)">${rFoot(P)}</div>`;
}

function render() {
  const P = PROJECTS[S.p];
  document.documentElement.classList.toggle('dark', theme === 'dark');
  document.getElementById('frame').dataset.w = S.w;
  document.getElementById('app').innerHTML = appHead(P) + ({ a: variantA, b: variantB, c: variantC, b1: variantB1, b2: variantB2, b3: variantB3 })[S.v](P);
  document.querySelectorAll('#sketch-bar [data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === S.v));
  document.querySelectorAll('#sketch-bar [data-p]').forEach((b) => b.classList.toggle('on', b.dataset.p === S.p));
  document.querySelectorAll('#sketch-bar [data-w]').forEach((b) => b.classList.toggle('on', b.dataset.w === S.w));
  document.querySelectorAll('#sketch-bar [data-theme]').forEach((b) => b.classList.toggle('on', b.dataset.theme === theme));
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a');
  if (!t) return;
  const d = t.dataset;
  if (d.v) { S.v = d.v; S.open.clear(); history.replaceState(null, '', '#' + d.v); render(); return; }
  if (d.p) { S.p = d.p; S.open.clear(); S.all = false; S.sel = null; render(); return; }
  if (d.w) { S.w = d.w; render(); return; }
  if (d.theme) { theme = d.theme; render(); return; }
  if (d.toggle !== undefined) { const i = +d.toggle; if (S.all) { S.all = false; S.open = new Set(PROJECTS[S.p].decisions.map((_, k) => k)); } S.open.has(i) ? S.open.delete(i) : S.open.add(i); render(); document.querySelector(`[data-toggle="${i}"]`)?.focus(); return; }
  if (d.all !== undefined) { S.all = !S.all; S.open.clear(); render(); return; }
  if (d.rules !== undefined) { S.rules = !S.rules; render(); return; }
  if (d.pick !== undefined) { S.sel = +d.pick; render(); document.getElementById('r-' + S.sel)?.scrollIntoView({ block: 'nearest' }); return; }
  if (d.jump !== undefined && S.v === 'b3') { S.sel = +d.jump; render(); document.getElementById('r-' + S.sel).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (d.jump !== undefined) {
    const pre = S.v === 'b' ? 'b-' : 'r-';
    const n = document.getElementById(pre + d.jump); n.scrollIntoView({ behavior: 'smooth', block: 'center' });
    n.classList.add('flash'); setTimeout(() => n.classList.remove('flash'), 900); return;
  }
  if (d.q) { e.preventDefault(); toast('→ ' + route(d.q)); return; }
  if (d.go) { e.preventDefault(); toast(d.go === 'source' ? 'Source mode: PROJECT.md as written' : `→ /${S.p}/${d.go === 'dashboard' ? '' : d.go}`); return; }
});
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VARIANTS.includes(h)) { S.v = h; render(); } });
addEventListener('keydown', (e) => { if (S.v !== 'b3' || !['ArrowLeft', 'ArrowRight'].includes(e.key) || e.target.closest('input')) return; const n = PROJECTS[S.p].decisions.length; S.sel = Math.max(0, Math.min(n - 1, (S.sel ?? n - 1) + (e.key === 'ArrowRight' ? 1 : -1))); render(); document.getElementById('r-' + S.sel)?.scrollIntoView({ block: 'nearest' }); });
render();
</script>
</body>
</html>
