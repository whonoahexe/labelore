/* Sketch 029: the NOTE page, round 2. 028-A shipped, but its first screen is a title and rows: quick
   one-liners read empty and explore notes read as plain documents. Every variant here opens on the
   note's gist, said large, with one signature element, and handles every note shape (dense labelled,
   unlabelled prose, one-liner, unpromoted question, explore notes 42–112 lines). Lifting is
   deterministic, from the file only: quick notes by 028's Label: rule; explore notes by their lede,
   ## sections, bold-led list items, tables, measured figures (number + unit) and flag words
   (Decided / Blocked / open question / rejected / resolved / corrected). Shared vocabulary from 027
   (build.mjs). A gist console (rail + big number + ledger), B fact board (tiles, one big value each),
   C the note as a card (ruled index card + verdict line; explore notes as a deck of section cards). */

<script>
const DOCS = window.DATA;

const NOW = new Date('2026-10-23T12:00:00');
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

}
const ICON_LINK = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>';

/* ---------- model ---------- */
const parseD = s => { if (!s) return null; const d = new Date(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(s) ? s.replace(' ', 'T') : s); return isNaN(d) ? null : d; };

const sevOf = w => /^(blocker|critical|major|high|p0|p1)$/i.test(w ?? '') ? 'hi' : /^(medium|moderate|normal|p2)$/i.test(w ?? '') ? 'mid' : /^(minor|low|cosmetic|trivial|p3|p4)$/i.test(w ?? '') ? 'lo' : 'none';
const SEV_LABEL = { hi: 'High', mid: 'Medium', lo: 'Low', none: 'Unrated' };
const plural = (n, w) => n == null ? "?" : n === 0 && w === "day" ? "less than a day" : `${n} ${w}${n === 1 ? "" : "s"}`;
const cap = s => String(s ?? '').replace(/^./, c => c.toUpperCase());
// The written value leads; the three-level reading is the pip.
function pip(d) {

}
const area = d => d.area ?? d.theme;
const quickDate = id => { const m = id?.match(/^(\d{2})(\d{2})(\d{2})-/); return m ? `20${m[1]}-${m[2]}-${m[3]}` : null; };


/* ---------- lifting a quick note (028's rule, unchanged) ---------- */
// A clause starts at a sentence that opens with a short "Label:" (Decided:, Bug:, Want:, Off limits:,
// Decided 2026-10-21:) or a known opener (Today …, Estimated …, Batch with …). Sentences without one
// continue the clause before them; the first sentence is the gist.
const GROUP = { decided: 'decided', bug: 'problem', cause: 'problem', today: 'problem', observed: 'problem', problem: 'problem', fix: 'ask', want: 'ask', wanted: 'ask', how: 'ask', ui: 'ask', output: 'ask', suggested: 'ask', plan: 'ask', limits: 'limit', 'off limits': 'limit', 'known gap': 'limit', 'preset constraint': 'limit', estimated: 'limit', batch: 'limit', 'open question': 'open' };
const TONE = { decided: 'complete', bug: 'in-flight', cause: 'in-flight', observed: 'in-flight', suggested: 'in-flight', 'open question': 'missing' };
const GROUP_WORD = { decided: ['decided', 'decided'], ask: ['ask', 'asks'], problem: ['problem', 'problems'], limit: ['limit', 'limits'], open: ['open question', 'open questions'], other: ['other', 'other'] };
const OPENERS = [[/^Today\b/, 'Today'], [/^Estimated\b/, 'Estimated'], [/^Batch with\b/, 'Batch']];
function sentences(text) {
  const prot = text.replace(/\b(e\.g|i\.e|etc|vs|approx)\./g, '$1․');

const REF_RE = /((?:[\w.-]+\/)+[\w.-]+\.[a-z]{1,5}(?::\d+(?:-\d+)?)?|\b[\w-]+\.(?:ts|tsx|js|mjs|rs|md|json|css|py)(?::\d+)?\b)|(\b[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+\b|\b[a-z]+(?:_[a-z0-9]+){2,}\b|\b[a-z]+[A-Z]\w*\(\)?)/g;

/* ---------- figures and flags (both note shapes) ---------- */
// A figure is a number followed (within two words) by a unit — "~110 MB/s", "67 times", "11 of 16 types".
const UNIT = String.raw`(?:MB\/s|GB\/s|MiB|GiB|GB|TB|MB|GbE|fps|ms|files|types|times|keys|lines|instances|link events|clips|sketches|days|weeks|%|s\b)`;
const FIG_RE = new RegExp(String.raw`(~|about |around |under |over |up to )?(?<![×\w.])(\d[\d,.]*(?:\s?(?:of|\/)\s?\d[\d,.]*)?)\s?((?:[a-z][a-z-]*\s){0,2}?)(${UNIT})`, 'g');

function figures(text, sec = null) {

    const rest = e.figs.length > 5 ? `<p class="kicker">+${e.figs.length - 5} more figures in the text</p>` : '';
    const secs = `<section class="b-sections"><span class="kicker">The sections · ${e.sections.length}</span>${e.sections.map(s => `<details class="fold" id="s${s.idx}"><summary><h3>${inline(s.h)}</h3><span class="n">${s.shape.join(' · ') || s.lines + ' lines'}</span>${s.key ? `<p class="key">${inline(s.key)}</p>` : ''}</summary>${md(s.text)}</details>`).join('')}</section>`;
    return `${shell()}<div class="page">${head}<div class="board">${tiles.join('')}</div>${rest}${secs}${d.todos.length ? `<section style="display:grid;gap:var(--space-3)"><span class="kicker">Todos that point here</span><div class="c-todos">${todoCards(d)}</div></section>` : ''}${alsoRow()}</div>`;
  }
  const q = quickModel(d);
  const head = `<header class="b-head">${metaRow(d)}${q.rows.length ? `<h1 class="disp ${q.gist.text.length > 70 ? 'long' : ''}">${withRefs(q.gist.text)}</h1>` : `<h1 class="disp">${esc(slugTitle(d.path))}</h1>`}</header>`;
  let tiles;
  if (!q.rows.length) {
    tiles = [`<article class="tile w3 note-tile" data-tone="${j.stage === 'note' ? 'missing' : 'quiet'}"><span class="kicker">The whole note · ${q.words} words</span><p class="say">${withRefs(d.body)}</p><p class="phrase foot">Nothing else to lift: no labelled clauses, no files, no figures.</p></article>`, statusTile(d, j)];
  } else {
    const order = { decided: 0, ask: 1, problem: 2, open: 3, limit: 4, other: 5 };
    const clauseTiles = [...q.rows].sort((a, b) => order[a.group] - order[b.group] || a.i - b.i).map(c => `<div role="button" tabindex="0" class="tile click ${c.group === 'decided' || c.text.length > 260 ? 'w2' : ''} ${state.open.has('bc' + c.i) ? 'open' : ''}" data-tone="${c.tone ?? tone(c.group) ?? 'quiet'}" data-open="bc${c.i}"><div class="top">${label(c) || '<span class="kicker">Then</span>'}<span class="kicker">${String(c.i).padStart(2, '0')}</span></div><p class="say">${withRefs(firstSentence(c.text))}</p>${restOf(c.text) ? `<p class="more">${withRefs(restOf(c.text))}</p>` : ''}</div>`);
    const figT = q.figs.slice(0, 3).map(figTile);
    const ment = q.refs.length ? `<article class="tile" data-tone="quiet"><span class="kicker">Mentions · ${q.refs.length}</span><div class="refl">${q.refs.map(([f]) => `<button class="${state.ref === f ? 'on' : ''}" data-ref="${esc(f)}">${esc(f)}</button>`).join('')}</div></article>` : '';
    tiles = [clauseTiles[0], statusTile(d, j), ...clauseTiles.slice(1, 3), ...figT, ...clauseTiles.slice(3), ment].filter(Boolean);
  }
  const body = state.verbatim ? `<p class="verbatim">${withRefs(d.body)}</p>` : `<div class="board">${tiles.join('')}</div>`;
  return `${shell()}<div class="page">${head}<div style="display:grid;gap:var(--space-4)">${q.rows.length ? verbToggle('Board') : ''}${body}</div>${q.rows.length && j.t ? `<section style="display:grid;gap:var(--space-3);max-width:34rem"><span class="kicker">What it became</span>${todoCards(d)}</section>` : ''}${alsoRow()}</div>`;
}

/* ============ C — the note as a card ============ */
function viewC(d) {
  const j = journey(d);
  if (isDoc(d)) {
    const e = exploreModel(d);
    const head = `<header class="b-head">${metaRow(d)}<h1 class="c-verdict">${esc(e.shape)}</h1></header>`;
    const ledeCard = `<article class="scard lede-card"><span class="kicker">${inline(d.title)}</span><p class="key">${inline(e.lede ?? e.boiler ?? '')}</p>${figChips(e.figs)}<div class="foot"><span>${esc(fmtD(d.date))}</span><span>${d.raw.split('\n').length} lines</span></div></article>`;
    const cards = e.sections.map(s => {
      const open = state.open.has('c' + s.idx);
      const tone = s.flags.find(f => f.kind === 'blocked' || f.kind === 'open') ? 'var(--missing-fill)' : s.flags.find(f => f.kind === 'decided' || f.kind === 'resolved') ? 'var(--primary)' : 'var(--muted-foreground)';
      return open
        ? `<article class="scard open" id="s${s.idx}" style="border-top-color:${tone}"><div class="top" style="display:flex;justify-content:space-between;gap:var(--space-3)"><span class="n">${String(s.idx + 1).padStart(2, '0')}</span><button class="link-btn" data-open="c${s.idx}">Put back –</button></div><h3>${inline(s.h)}</h3>${md(s.text)}</article>`
        : `<div role="button" tabindex="0" class="scard click" id="s${s.idx}" data-open="c${s.idx}" style="border-top-color:${tone}"><span class="n">${String(s.idx + 1).padStart(2, '0')}</span><h3>${inline(s.short)}</h3>${s.key ? `<p class="key">${inline(s.key.length > 200 ? s.key.slice(0, 200) + '…' : s.key)}</p>` : ''}${s.flags.length ? `<div class="chips">${[...new Map(s.flags.map(f => [f.kind, f])).values()].map(f => `<span class="lbl" data-tone="${f.tone}">${f.label}</span>`).join('')}</div>` : ''}${figChips(s.figs.slice(0, 3))}<div class="foot"><span>${s.shape.join(' · ') || s.lines + ' lines'}</span><span>Read +</span></div></div>`;
    }).join('');
    return `${shell()}<div class="page">${head}<div class="deck">${ledeCard}${cards}</div>${d.todos.length ? `<section style="display:grid;gap:var(--space-3)"><span class="c-link">Todos that point here</span><div class="c-todos">${todoCards(d)}</div></section>` : ''}${alsoRow()}</div>`;
  }
  const q = quickModel(d); const one = !q.rows.length;
  const verdict = j.stage === 'done' ? `Became a todo. <span class="q">Shipped${j.shipped ? ' ' + esc(fmtD(j.shipped)) : ''}.</span>` : j.stage === 'open' ? 'Became a todo. <span class="q">Still open.</span>' : j.stage === 'untraced' ? 'Promoted. <span class="q">No todo carries it.</span>' : `Still a note. <span class="q">${plural(j.days, 'day')} on.</span>`;
  const head = `<header class="b-head">${metaRow(d)}<h1 class="c-verdict">${verdict}</h1></header>`;
  const lines = state.verbatim
    ? `<div class="cl"><span class="g"></span><p class="t">${withRefs(d.body)}</p></div>`
    : `<div class="cl lead"><span class="g"></span><p class="t">${withRefs(q.gist.text)}</p></div>${q.rows.map(c => `<div class="cl"><span class="g">${label(c)}</span><p class="t">${label(c, 'inline')}${withRefs(c.text)}</p></div>`).join('')}`;
  const card = `<article class="icard ${one ? 'one' : ''}" data-stage="${j.stage}"><div class="cl head"><span class="g"><span class="kicker">${esc(fmtDT(d.date))}</span></span><p class="t"><span class="kicker">${esc(d.project)} · ${q.words} words${q.rows.length ? ' · ' + countLine(q.counts) : ''}</span></p></div>${lines}${one ? `<div class="cl end"><span class="g"></span><p class="t">One line. Nothing else to lift.</p></div>` : ''}</article>`;
  const side = `<aside class="c-side"><span class="c-link">${j.t ? 'Became' : d.todos.length ? 'Related' : 'Where it went'}</span>${todoCards(d)}${mentions(q.refs)}</aside>`;
  return `${shell()}<div class="page">${head}<div style="display:grid;gap:var(--space-4)">${one ? '' : verbToggle('Lifted')}<div class="c-stage">${card}${side}</div></div>${alsoRow()}</div>`;
}

/* ---------- render ---------- */
function render() {
  const d = DOCS[state.doc];
  document.getElementById('root').innerHTML = state.mode === 'source' ? `${shell()}<div class="page">${metaRow(d)}${sourceView(d)}</div>` : ({ a: viewA, b: viewB, c: viewC })[state.variant](d);
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const f = document.getElementById('frame'); f.style.maxWidth = state.width === 'full' ? 'none' : state.width + 'px'; f.classList.toggle('narrow-frame', state.width !== 'full');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.variant === state.variant));
  document.querySelectorAll('#sketch-tools button').forEach(b => b.classList.toggle('on', b.dataset.doc === state.doc || b.dataset.theme === state.theme || b.dataset.width === state.width));
}
document.getElementById('doc-btns').innerHTML = Object.entries(DOCS).map(([k, d]) => `<button data-doc="${k}">${esc(d.label)}</button>`).join('');
function toast(msg) { const t = document.createElement('div'); t.textContent = msg; t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(40rem,90vw);background:var(--foreground);color:var(--background);padding:8px 14px;font-family:var(--font-mono);font-size:var(--fs-2);z-index:10000'; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open]'); if (!t || t.disabled) return; const y = scrollY; const d = DOCS[state.doc];
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.mode = 'view'; state.open.clear(); }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; state.mode = 'view'; state.verbatim = false; state.ref = null; state.open.clear(); }
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.verb) state.verbatim = t.dataset.verb === '1';
  else if (t.dataset.ref) { e.stopPropagation(); state.ref = state.ref === t.dataset.ref ? null : t.dataset.ref; try { navigator.clipboard.writeText(t.dataset.ref); } catch {} toast('Copied ' + t.dataset.ref); }
  else if (t.dataset.open) { const k = t.dataset.open; state.open.has(k) ? state.open.delete(k) : state.open.add(k); }
  else if (t.dataset.sibling) { const k = Object.keys(DOCS).find(k => DOCS[k].path === t.dataset.sibling); if (k) { state.doc = k; state.verbatim = false; state.ref = null; state.open.clear(); render(); scrollTo(0, 0); } else toast('Not in this sketch’s data: ' + t.dataset.sibling); return; }
  else if (t.dataset.todo) return toast('Opens the todo page: ' + t.dataset.todo);
  else if (t.dataset.mode) { state.mode = t.dataset.mode; state.hit = null; render(); scrollTo(0, 0); return; }
  else if (t.dataset.src) { state.mode = 'source'; state.hit = [1, d.raw.split('\n').indexOf('---', 1) + 1]; render(); return; }
  else if (t.dataset.copy) { try { navigator.clipboard.writeText(t.dataset.copy); } catch {} return toast('Copied ' + t.dataset.copy); }
  else return;
  render(); scrollTo(0, y);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-open]')) { e.preventDefault(); e.target.click(); } });
render();
</script>
</body>
</html>
