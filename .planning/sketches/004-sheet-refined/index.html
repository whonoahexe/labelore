<style>
/* Layout/component rules for this sketch only. Everything visual comes from ../themes/default.css,
   which carries the app's own tokens verbatim. Class names mirror the dashboard's where the sketch
   reuses a dashboard pattern (immediate-work, progress-panel, attention-panel, preview-panel,
   status-chip, plan-pill, eyebrow, section-heading) so the winner maps straight onto real CSS. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-5); line-height: var(--lh-normal); padding-top: 3rem; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
code, .mono { font-family: var(--font-mono); }

/* ---------- variant tabs (sketch chrome) ---------- */
#variant-nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; gap: var(--space-1); align-items: center; padding: var(--space-2) var(--space-4); background: var(--background); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; overflow-x: auto; }
#variant-nav .label { color: var(--muted-foreground); margin-right: var(--space-2); white-space: nowrap; }
.variant-tab { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; background: none; white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; color: var(--muted-foreground); transition: all .15s ease; }
.variant-tab:hover { color: var(--foreground); background: var(--state-hover); }
.variant-tab.active { color: var(--primary); border-color: color-mix(in oklch, var(--primary) 65%, var(--border)); background: var(--primary-tint); }

/* ---------- app shell (static approximation) ---------- */
.shell-header { display: flex; align-items: center; gap: var(--space-4); height: 3.75rem; padding: 0 var(--space-4); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.brand-mark { width: 2.25rem; height: 2.25rem; background: var(--primary); display: grid; place-items: center; color: white; font-weight: 700; }
.shell-nav { display: flex; margin: 0 auto; height: 100%; }
.shell-nav span { display: flex; align-items: center; padding: 0 var(--space-5); border-left: 1px solid var(--border); color: var(--muted-foreground); }
.shell-nav span:last-child { border-right: 1px solid var(--border); }
@container (max-width: 640px) { .shell-nav { display: none; } }


#frame { margin: 0 auto; container-type: inline-size; transition: max-width .2s ease; background: var(--background); min-height: 100vh; }
#frame.narrow-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.page { width: min(80rem, 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); }

/* ---------- shared atoms (mirroring globals.css) ---------- */
.eyebrow { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); color: var(--primary); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
.crumbs { font-family: var(--font-mono); font-size: var(--fs-3); color: var(--muted-foreground); margin-bottom: var(--space-6); }
.crumbs b { color: var(--foreground); font-weight: 400; }
.status-chip { display: inline-flex; gap: var(--space-1-5); align-items: center; width: fit-content; padding: var(--space-1-5) var(--space-2); border: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 55%, transparent); font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.status-chip[data-tone='active'], .status-chip[data-tone='complete'] { border-color: color-mix(in oklch, var(--primary) 65%, var(--border)); background: var(--primary-tint); color: var(--primary); }
.status-chip[data-tone='quiet'] { color: var(--muted-foreground); }
.status-chip[data-tone='warning'] { border-color: color-mix(in oklch, oklch(0.75 0.15 75) 60%, var(--border)); color: oklch(0.72 0.15 75); }
.plan-pill { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: var(--space-1) var(--space-2-5); border: 1px solid var(--border); color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-2); line-height: var(--lh-tight); }
.plan-pill strong { color: var(--foreground); font-weight: var(--fw-medium); }
.source-note { color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-1); line-height: var(--lh-normal); overflow-wrap: anywhere; }
.text-link { font-family: var(--font-mono); font-size: var(--fs-2); text-decoration: underline; text-underline-offset: 3px; color: var(--foreground); background: none; border: 0; padding: 0; }
.text-link:hover { color: var(--primary); }
.panel { border: 1px solid var(--border); background: var(--card-veil); padding: var(--space-fluid-3); min-width: 0; }
.panel h2, .section-heading h2 { font-size: var(--fs-fluid-3); letter-spacing: var(--ls-tight); font-weight: var(--fw-medium); font-family: var(--font-mono); }
.section-heading { display: flex; gap: var(--space-4); align-items: flex-end; justify-content: space-between; min-width: 0; }
.section-heading.compact { padding-bottom: var(--space-5); border-bottom: 1px solid var(--border); }
.count-box { display: grid; min-width: 2.25rem; height: 2.25rem; padding: 0 var(--space-2); place-items: center; border: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-5); }
.muted { color: var(--muted-foreground); }
.view-toggle { display: inline-flex; gap: var(--space-1); font-family: var(--font-sans); font-size: var(--fs-5); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.view-toggle button { border: 0; background: none; padding: var(--space-1-5) var(--space-3); color: var(--muted-foreground); transition: all .15s ease; }
.view-toggle button:hover { color: var(--foreground); }
.view-toggle button[aria-pressed='true'] { background: var(--muted); color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }
pre.source { margin: 0; padding: var(--space-5); border: 1px solid var(--border); background: var(--card-veil); font-family: var(--font-mono); font-size: var(--fs-3); line-height: var(--lh-normal); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted-foreground); }

/* item rows shared by variants */
.item { padding: var(--space-5) 0; border-bottom: 1px solid var(--border); min-width: 0; }
.item:last-child { border-bottom: 0; padding-bottom: 0; }
.item-head { display: flex; gap: var(--space-3); align-items: flex-start; justify-content: space-between; }
.item-id { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.item-title { font-weight: var(--fw-medium); font-size: var(--fs-5); line-height: var(--lh-snug); margin-top: var(--space-1); }
.item-answer { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: var(--space-3); font-size: var(--fs-5); }
.item-answer .answer-text { font-weight: var(--fw-medium); }
.item-more { margin-top: var(--space-3); }
.item-detail { margin-top: var(--space-3); padding: var(--space-3) var(--space-4); border-left: 2px solid var(--border); color: var(--muted-foreground); font-size: var(--fs-4); display: grid; gap: var(--space-2); }
.item-detail .alt { display: flex; gap: var(--space-2); }
.item-detail .alt::before { content: '—'; color: var(--border); }
.item-detail code { font-size: var(--fs-3); color: var(--foreground); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.side-list { display: grid; gap: var(--space-4); margin-top: var(--space-5); }
.side-list li { list-style: none; display: grid; gap: var(--space-1); font-size: var(--fs-4); }
.side-list li .muted { font-size: var(--fs-3); }
ul.side-list { padding: 0; }

/* ---- borrowed from 002 A ---- */
.a-meta { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-top: var(--space-7); }
.progress-headline { display: flex; gap: var(--space-2-5); align-items: baseline; }
.progress-headline strong { font-family: var(--font-heading); font-size: var(--fs-display-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tighter); line-height: var(--lh-display); }
.progress-headline span { color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-2); text-transform: uppercase; }

/* ================= A2: SHEET (from 003) ================= */
.s-sheet { border: 1px solid var(--border); background: var(--card-veil); }
.s-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-6); flex-wrap: wrap; padding: var(--space-fluid-3); }
.s-top h1 { font-family: var(--font-mono); font-size: var(--fs-display-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); max-width: 28ch; overflow-wrap: break-word; hyphens: auto; }
@container (max-width: 560px) { .s-top h1 { font-size: var(--fs-fluid-4); } }
.s-top .lede { margin-top: var(--space-3); color: var(--muted-foreground); font-size: var(--fs-5); max-width: 60ch; }
.s-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-3); }
.s-cells { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr) minmax(0, 1fr); border-top: 1px solid var(--border); }
.s-cell { padding: var(--space-fluid-3); border-left: 1px solid var(--border); min-width: 0; }
.s-cell:first-child { border-left: 0; }
.s-cell.glance { border-top: 3px solid var(--primary); margin-top: -1px; }
.s-cell.glance h2 { font-family: var(--font-mono); font-size: var(--fs-6); font-weight: var(--fw-medium); }
.s-cell.glance p { margin-top: var(--space-3); color: var(--muted-foreground); font-size: var(--fs-4); }
.s-facts { display: grid; gap: var(--space-3); }
.s-facts div { display: grid; gap: var(--space-0-5); }
.s-facts dt { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.s-facts dd { font-size: var(--fs-4); overflow-wrap: anywhere; }
.s-controls { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-6); }
.s-section { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: var(--space-6); margin-top: var(--space-10); padding-top: var(--space-6); border-top: 1px solid var(--border); }
.s-num { font-family: var(--font-heading); font-size: var(--fs-display-1); font-weight: var(--fw-medium); line-height: var(--lh-none); letter-spacing: var(--ls-tight); color: var(--muted-foreground); }
.s-section h2 { font-family: var(--font-mono); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.s-section .s-sub { margin-top: var(--space-1); }
.s-also { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: var(--space-5); margin-top: var(--space-5); }
@container (max-width: 900px) {
  .s-cells { grid-template-columns: 1fr; }
  .s-cell { border-left: 0; border-top: 1px solid var(--border); }
  .s-cell:first-child { border-top: 0; }
  .s-top-right { align-items: flex-start; }
  .s-section { grid-template-columns: 1fr; gap: var(--space-2); }
}


/* ---------- shared by B1–B3 ---------- */
.s-factline { margin-top: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); }
.s-factline b { color: var(--foreground); font-weight: var(--fw-medium); }
.rollup { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.s-section { scroll-margin-top: 7rem; }
.ch-bar-wrap { position: sticky; top: 3rem; z-index: 20; height: 0; margin: 0 calc(-1 * var(--space-fluid-8)); }
.ch-bar { position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2-5) var(--space-fluid-8); background: color-mix(in oklch, var(--background) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-3); opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity .15s ease, transform .15s ease; }
.ch-bar.shown { opacity: 1; pointer-events: auto; transform: none; }
.ch-bar .n { color: var(--primary); }
.ch-bar .t { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-bar .grow { flex: 1; min-width: 0; display: flex; gap: var(--space-3); overflow: hidden; }

/* ================= B1: COMPACT COVER ================= */
.b1-cells { display: grid; grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr); border-top: 1px solid var(--border); }
.b1-cells .s-cell { padding: var(--space-5) var(--space-fluid-3); }
.b1-num > strong { font-family: var(--font-heading); font-size: var(--fs-display-1); font-weight: var(--fw-medium); line-height: var(--lh-none); letter-spacing: var(--ls-tight); }
.b1-num > span { display: block; margin-top: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-2); text-transform: uppercase; letter-spacing: var(--ls-wider); }
.b1-num .chips { margin-top: var(--space-3); }
.b1-cells .glance p { margin-top: var(--space-2); }
.b1-facts summary { display: none; }
.b1-facts .s-facts { gap: var(--space-2); }
@container (max-width: 900px) {
  .b1-cells { grid-template-columns: 1fr; }
  .b1-facts summary { display: block; cursor: pointer; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
  .b1-facts[open] summary { margin-bottom: var(--space-3); }
}

/* ================= B2: CHAPTER INDEX ================= */
.ch-index { list-style: none; padding: 0; display: grid; }
.ch-index li button { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; width: 100%; padding: var(--space-2) 0; border: 0; border-bottom: 1px solid var(--border); background: none; text-align: left; transition: color .15s ease; }
.ch-index li:last-child button { border-bottom: 0; }
.ch-index li button:hover { color: var(--primary); }
.ch-index .n { font-family: var(--font-heading); font-size: var(--fs-3); color: var(--muted-foreground); }
.ch-index .t { font-size: var(--fs-4); font-weight: var(--fw-medium); }
.ch-index .c { font-family: var(--font-heading); font-size: var(--fs-2); color: var(--muted-foreground); }

/* ================= B3: FOLDED CHAPTERS ================= */
.fold { margin-top: var(--space-4); border: 1px solid var(--border); background: var(--card-veil); }
.fold:first-of-type { margin-top: var(--space-8); }
.fold { scroll-margin-top: 7rem; }
.fold-head { display: grid; grid-template-columns: 4rem minmax(0, 1fr) auto 1.5rem; gap: var(--space-5); align-items: center; width: 100%; padding: var(--space-5) var(--space-fluid-3); border: 0; background: none; text-align: left; transition: background .15s ease; }
.fold-head:hover { background: var(--state-hover); }
.fold-head .s-num { font-size: var(--fs-fluid-3); }
.fold-head h2 { font-family: var(--font-mono); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.fold-head .chev { font-family: var(--font-mono); color: var(--muted-foreground); transition: transform .15s ease; }
.fold.open .fold-head .chev { transform: rotate(90deg); }
.fold-body { padding: 0 var(--space-fluid-3) var(--space-5) calc(4rem + var(--space-5) + var(--space-fluid-3)); border-top: 1px solid var(--border); }
.fold-tools { display: flex; justify-content: flex-end; margin-top: var(--space-8); }
.fold-tools + .fold { margin-top: var(--space-3); }
@container (max-width: 900px) {
  .fold-head { grid-template-columns: 2.5rem minmax(0, 1fr) 1.5rem; }
  .fold-head .rollup { grid-column: 2; }
  .fold-head .chev { grid-column: 3; grid-row: 1; }
  .fold-body { padding-left: var(--space-fluid-3); }
}

/* reveal animation */
.fade { animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
</style>
</head>

<script>
/* ---------------------------------------------------------------------------------------------
   Real content, trimmed only for length:
   studio-portal/.planning/phases/04-bulk-archive-downloads/04-DISCUSSION-LOG.md
   studio-portal/.planning/phases/04-bulk-archive-downloads/04-06-PLAN.md (+ 04-06-SUMMARY status)
   Both documents are normalised into ONE shape — the point of the sketch is a pattern every
   artifact type can fill:
     hero   → what this is, where it sits, its status
     glance → the one thing you need to know (dashboard's "Next up" card)
     stats  → headline count + supporting counts (dashboard's progress panel)
     groups → the document's main structured body (dashboard's "Needs attention")
     side   → secondary lists (dashboard's "On deck")
   --------------------------------------------------------------------------------------------- */
const DOCS = {
  dl: {
    kind: 'Discussion log',
    crumbs: ['Dashboard', 'Roadmap', 'v1.1', 'Phase 04'],
    context: 'Phase 04 · 2026-08-21',
    title: 'Bulk Archive Downloads',
    lede: 'Each question that was asked, what was on the table, and what was chosen.',
    path: '.planning/phases/04-bulk-archive-downloads/04-DISCUSSION-LOG.md',
    status: { label: '16 of 16 decided', tone: 'complete' },
    meta: [{ label: '→ 04-CONTEXT.md', link: true }],
    facts: [['Discussed', '2026-08-21'], ['Areas', '4 topics, 4 questions each'], ['Decisions feed', '04-CONTEXT.md (D-01 … D-14)'], ['Note', 'Audit trail only — not an input to planning']],
    glance: {
      eyebrow: 'Left to Claude',
      title: '1 decision made on your behalf',
      body: '“Manifest is the contract” (D-09) — you answered “you decide”. Recorded as one-way: the archive builds exactly the file list measured on POST.',
      action: 'Jump to that question',
      target: 'q-cap-3',
    },
    stats: {
      headline: { n: 16, label: 'questions decided' },
      pills: [['4', 'Topics'], ['2', 'Execution-time'], ['3', 'Open questions'], ['4', 'Deferred']],
      tiles: [['16', 'Questions decided'], ['4', 'Topics'], ['2', 'Decided later'], ['3', 'Still open', true]],
    },
    groupsLabel: 'Decisions',
    unit: 'questions',
    groups: [
      { id: 'surface', title: 'Browse action surface', items: [
        { id: 'q-surface-1', ref: 'D-01', title: 'When the card above the table goes away, what does a row’s own Download button do?', answer: 'Downloads immediately', alts: ['Opens a small dialog', 'Row Download is removed'], note: 'Both the per-row icon button (browse-row.tsx:193) and the context-menu Download (:236) rewire to this.' },
        { id: 'q-surface-2', ref: 'D-02', title: 'What happens when exactly one file (not a folder) is checked?', answer: 'One file downloads direct', alts: ['Always builds an archive', 'Button label tells you'], note: 'The label variant was declined, so the button stays “Download”; the two-behaviours-one-label problem goes to the UI researcher.' },
        { id: 'q-surface-3', ref: 'D-03', title: 'The archive job finishes. How does the member collect it?', answer: 'Starts automatically', alts: ['Button on the tray row', 'Auto-start, but only if watching'] },
        { id: 'q-surface-4', ref: 'D-04', title: 'The job completes while the app is closed. What then?', answer: 'Tray row keeps a button', alts: ['Auto-starts on next visit', 'It’s collected or it’s gone'] },
      ]},
      { id: 'lifetime', title: 'Archive lifetime', items: [

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------------ shared pieces ------------------------------ */
const chip = (label, tone) => `<span class="status-chip"${tone ? ` data-tone="${tone}"` : ''}>${esc(label)}</span>`;
const crumbs = d => `<div class="crumbs">${d.crumbs.map(esc).join(' / ')} / <b>${esc(d.kind)}</b></div>`;
const toggle = () => `<div class="view-toggle" role="group" aria-label="View or source">
  <button data-mode="view" aria-pressed="${state.mode === 'view'}">View</button>
  <button data-mode="source" aria-pressed="${state.mode === 'source'}">Source</button></div>`;
const metaBits = d => d.meta.map(m => m.link ? `<button class="text-link">${esc(m.label)}</button>` : `<span class="source-note">${esc(m.label)}</span>`).join('');
const source = d => `<pre class="source fade">${esc(d.source)}</pre>`;

function answerChip(it, d) {
  if (d === DOCS.dl) return chip(it.claude ? 'Claude chose' : 'Chosen', 'active');
  return chip(it.answer, it.answerTone);
}
function detailBlock(it) {
  const parts = [];
  if (it.alts) parts.push(`<div class="muted" style="font-family:var(--font-mono);font-size:var(--fs-1);letter-spacing:var(--ls-wider);text-transform:uppercase">Also on the table</div>` + it.alts.map(a => `<div class="alt">${esc(a)}</div>`).join(''));
  if (it.note) parts.push(`<div>${esc(it.note)}</div>`);
  if (it.detail) parts.push(it.detail.map(x => `<div class="alt">${esc(x)}</div>`).join(''));
  if (it.verify) parts.push(`<div>Verify: <code>${esc(it.verify)}</code></div>`);
  return parts.length ? `<div class="item-detail fade">${parts.join('')}</div>` : '';
}
const hasDetail = it => !!(it.alts || it.note || it.detail || it.verify);
function moreLabel(it) {
  if (it.more) return it.more;
  if (it.alts) return `${it.alts.length} other option${it.alts.length > 1 ? 's' : ''}${it.note ? ' · note' : ''}`;
  if (it.detail) return 'What it does · how it’s verified';
  return 'Details';
}
function itemRow(it, d, { showAnswerText = true } = {}) {
  const isDl = d === DOCS.dl;
  const open = state.open.has(it.id);
  const chips = (it.chips || []).map(([l, t]) => chip(l, t)).join('');
  return `<article class="item" id="${it.id}">
    <div class="item-head"><div style="min-width:0">
      <div class="item-id">${esc(it.ref)}</div>
      <div class="item-title">${esc(it.title)}</div></div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
    </div>
    <div class="item-answer">${answerChip(it, d)}${isDl && showAnswerText ? `<span class="answer-text">${esc(it.answer)}</span>` : ''}</div>
    ${hasDetail(it) ? `<div class="item-more"><button class="text-link" data-open="${it.id}">${open ? 'Hide' : moreLabel(it)}</button></div>${open ? detailBlock(it) : ''}` : ''}
  </article>`;
}
function sideList(s) {
  return `<ul class="side-list">${s.items.map(([a, b, tone]) => `<li><span>${tone ? chip(tone === 'complete' ? 'Closed' : 'High', tone) + ' ' : ''}${esc(a)}</span>${b ? `<span class="muted">${esc(b)}</span>` : ''}</li>`).join('')}</ul>`;
}

/* ------------------------------ A2: SHEET ------------------------------ */
function renderSheet(d) {
  const sheet = `${crumbs(d)}<section class="s-sheet">
    <div class="s-top"><div style="min-width:0"><div class="eyebrow">${esc(d.kind)} · ${esc(d.context)}</div><h1>${esc(d.title)}</h1><p class="lede">${esc(d.lede)}</p></div>
      <div class="s-top-right">${chip(d.status.label, d.status.tone)}</div></div>
    <div class="s-cells">
      <div class="s-cell"><div class="eyebrow">At a glance</div><div class="progress-headline"><strong>${d.stats.headline.n}</strong><span>${esc(d.stats.headline.label)}</span></div>
        <div class="chips" style="margin-top:var(--space-4)">${d.stats.pills.map(([n, l]) => `<span class="plan-pill"><strong>${n}</strong> ${esc(l)}</span>`).join('')}</div></div>
      <div class="s-cell glance"><div class="eyebrow">${esc(d.glance.eyebrow)}</div><h2>${esc(d.glance.title)}</h2><p>${esc(d.glance.body)}</p><button class="text-link" style="margin-top:var(--space-3)" data-jump="${d.glance.target}">${esc(d.glance.action)} →</button></div>
      <div class="s-cell"><div class="eyebrow">Facts</div><dl class="s-facts">${d.facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div>
    </div></section>
    <div class="s-controls"><p class="source-note">${esc(d.path)}</p>${toggle()}</div>`;
  if (state.mode === 'source') return `<div class="page fade">${sheet}<div style="margin-top:var(--space-5)">${source(d)}</div></div>`;
  const pad = n => String(n).padStart(2, '0');
  const sections = d.groups.map((g, i) => `<section class="s-section"><div class="s-num">${pad(i + 1)}</div><div style="min-width:0">
      <h2>${esc(g.title)}</h2><p class="source-note s-sub">${g.items.length} ${esc(d.unit)}</p>${g.items.map(it => itemRow(it, d)).join('')}</div></section>`).join('');
  const also = `<section class="s-section"><div class="s-num">${pad(d.groups.length + 1)}</div><div style="min-width:0"><h2>Also in this document</h2>
      <div class="s-also">${d.side.map(sd => `<section class="panel"><div class="eyebrow">${esc(sd.eyebrow)}</div><h2 style="font-size:var(--fs-6)">${esc(sd.title)}</h2>${sideList(sd)}</section>`).join('')}</div></div></section>`;
  return `<div class="page fade">${sheet}${sections}${also}</div>`;
}

/* ------------------------------ shared for B1–B3 ------------------------------ */
const pad = n => String(n).padStart(2, '0');
function rollup(g, d) {
  if (d === DOCS.dl) {
    const byClaude = g.items.filter(i => i.claude).length;
    return chip(`${g.items.length} chosen`, 'quiet') + (byClaude ? chip(`${byClaude} by Claude`, 'active') : '');
  }
  const counts = new Map();
  g.items.forEach(i => { const k = i.answer; counts.set(k, { n: (counts.get(k)?.n || 0) + 1, tone: i.answerTone }); });
  return [...counts].map(([label, { n, tone }]) => chip(`${n} ${label}`, tone)).join('');
}
const factLine = d => `<p class="source-note s-factline">${d.facts.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('')}</p>`;
const chapterBar = d => `<div class="ch-bar-wrap"><div class="ch-bar" id="ch-bar"><div class="grow"><span class="n" id="ch-bar-n">01</span><span id="ch-bar-t">${esc(d.groups[0].title)}</span><span class="t">· ${esc(d.title)}</span></div>${toggle()}</div></div>`;
function chapterSections(d, withAlso = true) {
  const sections = d.groups.map((g, i) => `<section class="s-section" id="ch-${g.id}" data-ch-n="${pad(i + 1)}" data-ch-t="${esc(g.title)}"><div class="s-num">${pad(i + 1)}</div><div style="min-width:0">
      <h2>${esc(g.title)}</h2><div class="rollup s-sub" style="margin-top:var(--space-2)">${rollup(g, d)}</div>${g.items.map(it => itemRow(it, d)).join('')}</div></section>`).join('');
  if (!withAlso) return sections;
  return sections + `<section class="s-section" id="ch-also" data-ch-n="${pad(d.groups.length + 1)}" data-ch-t="Also in this document"><div class="s-num">${pad(d.groups.length + 1)}</div><div style="min-width:0"><h2>Also in this document</h2>
      <div class="s-also">${d.side.map(sd => `<section class="panel"><div class="eyebrow">${esc(sd.eyebrow)}</div><h2 style="font-size:var(--fs-6)">${esc(sd.title)}</h2>${sideList(sd)}</section>`).join('')}</div></div></section>`;
}
const numberCell = d => `<div class="s-cell b1-num"><div class="eyebrow">At a glance</div><strong>${d.stats.headline.n}</strong><span>${esc(d.stats.headline.label)}</span>
  <div class="chips">${d.stats.pills.map(([n, l]) => `<span class="plan-pill"><strong>${n}</strong> ${esc(l)}</span>`).join('')}</div></div>`;
const glanceCell = d => `<div class="s-cell glance"><div class="eyebrow">${esc(d.glance.eyebrow)}</div><h2>${esc(d.glance.title)}</h2><p>${esc(d.glance.body)}</p><button class="text-link" style="margin-top:var(--space-3)" data-jump="${d.glance.target}">${esc(d.glance.action)} →</button></div>`;
const coverTop = (d, extra = '') => `<div class="s-top"><div style="min-width:0"><div class="eyebrow">${esc(d.kind)} · ${esc(d.context)}</div><h1>${esc(d.title)}</h1><p class="lede">${esc(d.lede)}</p>${extra}</div>
  <div class="s-top-right">${chip(d.status.label, d.status.tone)}${toggle()}</div></div>`;

/* ------------------------------ B1: COMPACT COVER ------------------------------ */
function renderCompact(d) {
  const cover = `${crumbs(d)}<section class="s-sheet">${coverTop(d)}
    <div class="b1-cells">${numberCell(d)}${glanceCell(d)}
      <div class="s-cell"><details class="b1-facts" ${state.factsOpen ? 'open' : ''}><summary>Facts</summary><div class="eyebrow">Facts</div><dl class="s-facts">${d.facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></details></div>
    </div></section>`;
  if (state.mode === 'source') return `<div class="page fade">${cover}<div style="margin-top:var(--space-6)">${source(d)}</div></div>`;
  return `<div class="page fade">${cover}${chapterSections(d)}</div>`;
}

/* ------------------------------ B2: CHAPTER INDEX ------------------------------ */
function indexCell(d) {
  const all = d.groups.map((g, i) => [pad(i + 1), g.title, `${g.items.length}`, g.id]).concat([[pad(d.groups.length + 1), 'Also in this document', '', 'also']]);
  return `<div class="s-cell"><div class="eyebrow">In this document</div><ol class="ch-index">${all.map(([n, t, c, id]) => `<li><button data-chapter="${id}"><span class="n">${n}</span><span class="t">${esc(t)}</span><span class="c">${c}</span></button></li>`).join('')}</ol></div>`;
}
function renderIndex(d) {
  const cover = `${crumbs(d)}<section class="s-sheet" id="cover">${coverTop(d, factLine(d))}
    <div class="b1-cells">${numberCell(d)}${glanceCell(d)}${indexCell(d)}</div></section>`;
  if (state.mode === 'source') return `<div class="page fade">${cover}<div style="margin-top:var(--space-6)">${source(d)}</div></div>`;
  return `<div class="page fade">${chapterBar(d)}${cover}${chapterSections(d)}</div>`;
}

/* ------------------------------ B3: FOLDED CHAPTERS ------------------------------ */
function renderFolded(d) {
  const cover = `${crumbs(d)}<section class="s-sheet" id="cover">${coverTop(d, factLine(d))}
    <div class="b1-cells">${numberCell(d)}${glanceCell(d)}${indexCell(d)}</div></section>`;
  if (state.mode === 'source') return `<div class="page fade">${cover}<div style="margin-top:var(--space-6)">${source(d)}</div></div>`;
  const allOpen = d.groups.every(g => state.openCh.has(g.id)) && state.openCh.has('also');
  const folds = d.groups.map((g, i) => { const open = state.openCh.has(g.id); return `<section class="fold s-section-f${open ? ' open' : ''}" id="ch-${g.id}" data-ch-n="${pad(i + 1)}" data-ch-t="${esc(g.title)}">
      <button class="fold-head" data-fold="${g.id}" aria-expanded="${open}"><span class="s-num">${pad(i + 1)}</span><h2>${esc(g.title)}</h2><span class="rollup">${rollup(g, d)}</span><span class="chev">›</span></button>
      ${open ? `<div class="fold-body fade">${g.items.map(it => itemRow(it, d)).join('')}</div>` : ''}</section>`; }).join('');
  const openAlso = state.openCh.has('also');
  const also = `<section class="fold${openAlso ? ' open' : ''}" id="ch-also" data-ch-n="${pad(d.groups.length + 1)}" data-ch-t="Also in this document">
      <button class="fold-head" data-fold="also" aria-expanded="${openAlso}"><span class="s-num">${pad(d.groups.length + 1)}</span><h2>Also in this document</h2><span class="rollup">${d.side.map(sd => chip(`${sd.count || sd.items.length} ${sd.title}`, 'quiet')).join('')}</span><span class="chev">›</span></button>
      ${openAlso ? `<div class="fold-body fade"><div class="s-also">${d.side.map(sd => `<section class="panel"><div class="eyebrow">${esc(sd.eyebrow)}</div><h2 style="font-size:var(--fs-6)">${esc(sd.title)}</h2>${sideList(sd)}</section>`).join('')}</div></div>` : ''}</section>`;
  return `<div class="page fade">${chapterBar(d)}${cover}<div class="fold-tools"><button class="text-link" data-fold-all="${allOpen ? 'close' : 'open'}">${allOpen ? 'Collapse all' : 'Expand all'}</button></div>${folds}${also}</div>`;
}

/* chapter bar: show once the cover scrolls away, name the chapter being read */
function updateChapterBar() {
  const bar = document.getElementById('ch-bar'), cover = document.getElementById('cover');
  if (!bar || !cover) return;
  bar.classList.toggle('shown', cover.getBoundingClientRect().bottom < 60);
  let cur = null;
  document.querySelectorAll('[data-ch-n]').forEach(el => { if (el.getBoundingClientRect().top < 140) cur = el; });
  if (cur) { document.getElementById('ch-bar-n').textContent = cur.dataset.chN; document.getElementById('ch-bar-t').textContent = cur.dataset.chT; }
}
window.addEventListener('scroll', updateChapterBar, { passive: true });

/* ------------------------------ wiring ------------------------------ */
const RENDER = { a2: renderSheet, b1: renderCompact, b2: renderIndex, b3: renderFolded };
function render() {
  const d = DOCS[state.doc];
  $root.innerHTML = RENDER[state.variant](d);
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const f = document.getElementById('frame');
  f.style.maxWidth = state.width === 'full' ? 'none' : state.width + 'px';
  f.classList.toggle('narrow-frame', state.width !== 'full');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.variant === state.variant));
  updateChapterBar();
  document.querySelectorAll('#sketch-tools button').forEach(b => {
    const on = (b.dataset.doc && b.dataset.doc === state.doc) || (b.dataset.theme && b.dataset.theme === state.theme) || (b.dataset.width && b.dataset.width === state.width);
    b.classList.toggle('on', !!on);
  });
}
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('b1-facts')) state.factsOpen = e.target.open; }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], [data-card]');
  if (!t) return;
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.mode = 'view'; state.expandedCard = null; }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; state.tab = null; state.openCh.clear(); state.open.clear(); state.expandedCard = null; state.mode = 'view'; }
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.mode) state.mode = t.dataset.mode;
  else if (t.dataset.open) { state.open.has(t.dataset.open) ? state.open.delete(t.dataset.open) : state.open.add(t.dataset.open); }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; }
  else if (t.dataset.fold) { state.openCh.has(t.dataset.fold) ? state.openCh.delete(t.dataset.fold) : state.openCh.add(t.dataset.fold); }
  else if (t.dataset.foldAll) { const d = DOCS[state.doc]; if (t.dataset.foldAll === 'open') { d.groups.forEach(g => state.openCh.add(g.id)); state.openCh.add('also'); } else state.openCh.clear(); }
  else if (t.dataset.chapter) { state.openCh.add(t.dataset.chapter); render(); const el = document.getElementById('ch-' + t.dataset.chapter); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  else if (t.dataset.card) { state.expandedCard = state.expandedCard === t.dataset.card ? null : t.dataset.card; }
  else if (t.dataset.jump) {
    const id = t.dataset.jump; state.mode = 'view'; state.open.add(id);
    const g = DOCS[state.doc].groups.find(g => g.items.some(i => i.id === id)); if (g) { state.expandedCard = g.id; state.tab = g.id; state.openCh.add(g.id); }
    render(); const el = document.getElementById(id);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.transition = 'background .6s'; el.style.background = 'var(--primary-tint)'; setTimeout(() => el.style.background = '', 1400); }
    return;
  } else return;
  render();
});
render();
</script>
</body>
</html>
