<script>

const DOCS = {
  sp01: {
    name: 'Phase 1 — Portal-Owned Identity & Sessions',
    inN: 9, outN: 4,
    specifics: [
      { kind: 'rule', lead: 'The CLI must be called `backstage`.', rest: 'The user rejected the proposed `cinedise-portal` name outright and specified `backstage`. Use it verbatim — binary name, invocation in docs, and anywhere it is referenced.' },
      { kind: 'rule', lead: 'UI work must use shadcn theme preset `b3Dqcuo4na`, strictly.', rest: 'This held across all four v1.0 phases without drift and is a standing project rule, not a per-phase preference. Applies to the new `/login` and `/change-password` screens.' },
      { kind: 'leaning', lead: null, rest: 'The user consistently chose the tighter, more explicit option when a tradeoff was presented (backend validation over optimistic rendering, fail-closed over graceful degradation, handle + display name over a single field). Where a later ambiguity arises, that is the direction to lean.' },
    ],
    deferred: [
      { title: 'Live-socket teardown on logout', fate: 'handed', from: 'D-04', dest: 'Phase 3 · ADMIN-03', revisit: null, body: 'Server-side closing of an already-open WebSocket. Deliberately left to Phase 3\'s `SessionRevocationBus` (ADMIN-03), per D-04 and the roadmap\'s own assignment.' },
      { title: 'Login page visual treatment, logout placement in the navbar, and "remember me"', fate: 'passed', from: null, dest: null, revisit: null, body: 'Offered and passed over. Planner and `/gsd-ui-phase` have discretion within preset `b3Dqcuo4na`.' },
      { title: 'What the `sessions` table stores for Phase 3\'s ADMIN-05 to read', fate: 'passed', from: 'D-01', dest: 'Phase 3 · ADMIN-05', revisit: null, body: 'Device / user-agent, IP, login time — offered and passed over. D-01 commits to `last_seen`; the rest is Phase 3\'s to specify, though adding the columns now is cheaper than migrating later and the planner may choose to.' },
      { title: 'How AUTH-06\'s power-cut survival is actually proven', fate: 'passed', from: null, dest: null, revisit: null, body: 'Offered and passed over. v1.0 has an existing unclean-shutdown test to model on.' },
      { title: 'Throttle events writing an `audit_log` row', fate: 'notpursued', from: null, dest: 'Phase 3 · ADMIN-06', revisit: null, body: 'Raised as a possible question, not pursued. Candidate for Phase 3\'s ADMIN-06 audit work.' },
    ],
  },
  sp03: {
    name: 'Phase 3 — Account Administration & Session Control',
    inN: 7, outN: 3,
    specifics: [
      { kind: 'leaning', lead: 'The user consistently chose the smaller surface over the stricter one — except where lockout is at stake.', rest: 'This phase reproduces Phase 2\'s recorded through-line almost exactly: admin-typed passwords over generation (D-01), no rename (D-04), jobs keep running (D-06), no `detail` column (D-15), one sessions surface not two (D-13), hard delete over a tombstone (D-09). But on the two questions touching admin availability they took the tighter option both times: all three self-actions refused (D-11), and the invariant rewritten properly rather than patched per-operation (D-12). **Where a later ambiguity arises, lean toward the smaller surface — unless it touches lockout or admin access, where they will pay for strictness.**' },
      { kind: 'note', lead: 'D-07 was reached by refinement, not reversal.', rest: 'The user first chose to state the disabled reason plainly at login. When the enumeration cost was named — that it would retire a property Phase 1 built and proved — they took the version that keeps the plain message *and* the property, gated behind a successful password verify. Record it as a considered position, not a concession: they wanted the member told, and they got that.' },

const FATE = {
  handed: { label: 'Handed on', tone: 'accent', group: 'Handed to a later phase', note: 'Someone else owns it now — follow the destination.' },
  declined: { label: 'Declined', tone: 'quiet', group: 'Declined options', note: 'A decision\'s alternative the user turned down. Revisit only when its trigger fires.' },

const state = { variant: 'c', doc: 'sp01', theme: 'dark', width: 'full', open: new Set(), fate: null, collapsed: new Set() };

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function md(s) {
  if (!s) return '';
  const parts = esc(s).split(/(`[^`]+`)/g);
  return parts.map(p => {
    if (p.startsWith('`')) return `<code>${p.slice(1, -1)}</code>`;
    return p.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\b((?:P\d )?D-\d+|(?:ADMIN|AUTH)-\d+)\b/g, '<button class="mention" data-goto="$1">$1</button>');
  }).join('');
}
const tag = (label, tone, extra = '') => `<span class="tag" data-tone="${tone}" ${extra}>${label}</span>`;
const dest = d => d ? `<span class="dest">→ ${md(d)}</span>` : '';
const from = f => f ? `<span class="from">from ${md(f)}</span>` : '';

function scopeRef(d) {
  return `<div><p class="ref-note" style="margin-bottom:var(--space-2)">Shipped In/Out block, for reference</p>
  <div class="scope"><div><p class="label accent">In this phase <span class="count">${d.inN}</span></p>✓ …</div>
  <div><p class="label">Not in this phase <span class="count">${d.outN}</span></p>– …</div></div></div>`;
}

/* ---- A ---- */
function variantA(d) {
  const spec = d.specifics.map(s => `<li class="a-spec">${s.lead ? `<strong class="lead">${md(s.lead)}</strong> ` : ''}<span class="${s.lead ? 'rest' : 'lead'}">${md(s.rest)}</span></li>`).join('');
  const def = d.deferred.map((x, i) => {
    const k = 'a' + i; const open = state.open.has(k); const long = x.body.length > 150;
    return `<li class="a-def"><div class="title">${md(x.title)}</div>
      <div class="meta">${tag(FATE[x.fate].label, FATE[x.fate].tone)}${dest(x.dest)}${x.from && !x.dest ? `<span class="ref-note">from ${md(x.from)}</span>` : ''}</div>
      <p class="body" data-clamped="${long && !open}">${md(x.body)}</p>
      ${long ? `<button class="more" data-open="${k}">${open ? 'Less' : 'More'}</button>` : ''}</li>`;
  }).join('');
  return `<div class="a-grid">
    <section><p class="label">Specific ideas <span class="count">${d.specifics.length}</span></p><ul class="a-list">${spec}</ul></section>
    <section><p class="label">Deferred <span class="count">${d.deferred.length}</span></p><ul class="a-list">${def}</ul></section>
  </div>`;
}

/* ---- B ---- */
function variantB(d) {
  const rules = d.specifics.filter(s => s.kind === 'rule');
  const leans = d.specifics.filter(s => s.kind === 'leaning');
  const notes = d.specifics.filter(s => s.kind === 'note');
  const fates = [...new Set(d.deferred.map(x => x.fate))];
  const rows = d.deferred.filter(x => !state.fate || x.fate === state.fate).map(x => `<tr class="fade">
      <td><div class="title">${md(x.title)}</div><span class="body">${md(x.body)}</span></td>
      <td><div class="what">${tag(FATE[x.fate].label, FATE[x.fate].tone)}${from(x.from)}</div></td>
      <td class="where">${x.dest ? dest(x.dest) : x.revisit ? `<span class="revisit" style="margin:0">${md(x.revisit)}</span>` : '<span class="ref-note">—</span>'}</td></tr>`).join('');
  return `<section class="b-guidance">
      <div><p class="label accent">Standing guidance <span class="count">${rules.length} rules</span></p>
        <ol class="b-rules">${rules.map(s => `<li><div><span class="lead">${md(s.lead)}</span><span class="rest">${md(s.rest)}</span></div></li>`).join('')}</ol></div>
      <div class="b-lean"><p class="label" style="margin:0">How the user leans</p>
        ${leans.map(s => `<blockquote>${s.lead ? `<strong>${md(s.lead)}</strong>` : md(s.rest)}${s.lead ? `<span class="rest">${md(s.rest)}</span>` : ''}</blockquote>`).join('')}
        ${notes.map(s => `<p class="b-note"><strong>${md(s.lead)}</strong> ${md(s.rest)}</p>`).join('')}</div>
    </section>
    <section>
      <div class="b-register-head"><p class="label">Deferred <span class="count">${d.deferred.length}</span></p>
        ${fates.length > 1 ? `<button class="tag" data-fate="" aria-pressed="${!state.fate}">All</button>` + fates.map(f => `<button class="tag" data-fate="${f}" aria-pressed="${state.fate === f}">${FATE[f].label} ${d.deferred.filter(x => x.fate === f).length}</button>`).join('') : ''}</div>
      <table class="b-table"><thead><tr><th>Idea</th><th>What happened</th><th>Goes to / revisit if</th></tr></thead><tbody>${rows}</tbody></table>
    </section>`;
}

/* ---- C ---- */
function variantC(d) {
  const spec = d.specifics.map(s => `<li>${tag(KIND[s.kind].label, KIND[s.kind].tone)}<div>${s.lead ? `<strong>${md(s.lead)}</strong> ` : ''}<span class="${s.lead ? 'rest' : ''}">${md(s.rest)}</span></div></li>`).join('');
  const groups = {};
  d.deferred.forEach(x => { const g = FATE[x.fate].group; (groups[g] ||= { note: FATE[x.fate].note, items: [] }).items.push(x); });
  const order = ['Handed to a later phase', 'Declined options', 'Offered, passed over', 'Out of scope, restated', 'Carried forward'];
  const grp = order.filter(g => groups[g]).map(g => {
    const open = !state.collapsed.has(g);
    return `<div class="c-group"><button class="c-group-head" data-collapse="${g}" aria-expanded="${open}">${g} <span class="count">${groups[g].items.length}</span><span class="chev">▾</span></button>
      ${open ? `<p class="c-group-note">${groups[g].note}</p><ul class="c-items fade">${groups[g].items.map(x => `<li><span class="title">${md(x.title)}</span>${x.dest ? dest(x.dest) : from(x.from)}
        ${x.revisit ? `<span class="revisit">${md(x.revisit)}</span>` : ''}<span class="body">${md(x.body)}</span></li>`).join('')}</ul>` : ''}</div>`;
  }).join('');
  return `<div class="c-wrap">
    <section class="c-col"><p class="label accent">Specific ideas <span class="count">${d.specifics.length}</span></p><ul class="c-spec">${spec}</ul></section>
    <section class="c-col quiet"><p class="label">Deferred <span class="count">${d.deferred.length}</span></p>${grp}</section>
  </div>`;
}

const RENDER = { a: variantA, b: variantB, c: variantC };
const $root = document.getElementById('root');
function render() {
  const d = DOCS[state.doc];
  $root.innerHTML = `<div class="page fade"><p class="ref-note">${d.name} · CONTEXT · … decisions register above …</p>${scopeRef(d)}${RENDER[state.variant](d)}</div>`;
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const f = document.getElementById('frame');
  f.style.maxWidth = state.width === 'full' ? 'none' : state.width + 'px';
  f.classList.toggle('narrow-frame', state.width !== 'full');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.variant === state.variant));
  document.querySelectorAll('#sketch-tools button').forEach(b => b.classList.toggle('on', b.dataset.doc === state.doc || b.dataset.theme === state.theme || b.dataset.width === state.width));
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1400); }
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.goto) { toast('Would jump to ' + t.dataset.goto); return; }
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.fate = null; }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; state.open.clear(); state.fate = null; state.collapsed.clear(); }
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.open) { const k = t.dataset.open; state.open.has(k) ? state.open.delete(k) : state.open.add(k); }
  else if ('fate' in t.dataset) state.fate = t.dataset.fate || null;
  else if (t.dataset.collapse) { const g = t.dataset.collapse; state.collapsed.has(g) ? state.collapsed.delete(g) : state.collapsed.add(g); }
  else return;
  render();
});
render();
</script>
</body>
</html>
