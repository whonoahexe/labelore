function verHtml(d) { const v = verChips(R(d, 'verification')); if (!v) return ''; return `<div class="field"><span class="kicker">Verified${v.verdict ? ` · ${esc(v.verdict)}` : ''}</span>${v.chips ? `<div class="vchips">${v.chips.map(c => `<span class="vchip" data-ok="${c.ok}" title="${c.ok === null ? 'Not settled yet' : c.ok ? 'Passed' : 'Failed'}">${c.ok === null ? '○' : c.ok ? '✓' : '✗'} ${esc(c.name)}</span>`).join('')}</div>` : `<span>${inline(v.text)}</span>`}</div>`; }
function causesHtml(d, label) { const cs = causes(R(d, 'root_cause')); return `<div class="field"><span class="kicker">${label}${cs.length > 1 ? ` · ${cs.length}` : ''}</span>${cs.length > 1 ? `<ol class="causes">${cs.map(c => `<li><span class="cl">${esc(c.label)}</span><span>${inline(c.text)}${c.cut ? ' ' + moreBtn(`${label} · ${c.label}`, c.full, true) : ''}</span></li>`).join('')}</ol>` : `<p class="big">${inline(cs[0]?.text ?? '—')}${cs[0]?.cut ? ' ' + moreBtn(label, cs[0].full, true) : ''}</p>`}</div>`; }
function fixHtml(d, label) { const f = fixLine(R(d, 'fix')); if (!f) return ''; return `<div class="field"><span class="kicker" ${f.notApplied ? '' : 'style="color:var(--primary)"'}>${f.notApplied ? 'Suggested fix · not applied' : label}</span>${clampWithMore('clamp3', inline(f.text), f.notApplied ? 'Suggested fix' : label, f.full, f.cut)}</div>`; }
// "More ↗" opens one item's full text in the modal. Shown when the text was shortened, or (for
// CSS-clamped lines) when the clamp actually cuts it — checked after render in markClamped().
let MORE = [];
function moreBtn(title, full, always) { const i = MORE.push({ title, full }) - 1; return `<button class="link-btn more-btn" data-more="${i}" ${always ? '' : 'data-ifclamped hidden'}>More ↗</button>`; }
function clampWithMore(cls, html, title, full, shortened) { return `<span class="${cls}">${html}</span>${moreBtn(title, full, shortened)}`; }

const fullLink = d => `<button class="link-btn" data-modal="resolution" style="justify-self:start">The full root cause, fix and verification ↗</button>`;

/* ---------- shared pieces ---------- */
const shell = () => `<div class="shell-header"><span class="brand-mark">L</span><span>Labelore</span></div>`;
function metaRow(d) { const f = fmtD(d.created), u = fmtD(d.updated), ut = fmtT(d.updated);
  return `<div class="meta-row"><div class="meta-left"><span class="eyebrow">Debug session</span>${f ? `<span class="date">Opened <b>${esc(f)}</b></span>` : ''}${u ? `<span class="date">Updated <b>${esc(u === f ? (ut ?? u) : u)}</b>${u !== f && ut ? ` · ${esc(ut)}` : ''}</span>` : ''}${d.archived ? '<span class="chip">Archived</span>' : ''}${d.synthetic ? '<span class="chip">Synthetic</span>' : ''}</div><div class="doc-tools"><button class="icon-btn" data-copy="${esc(d.path)}" title="Copy path" aria-label="Copy path">${ICON_LINK}</button><div class="seg" role="group" aria-label="Display mode"><button data-mode="view" aria-pressed="${state.mode === 'view'}">View</button><button data-mode="source" aria-pressed="${state.mode === 'source'}">Source</button></div></div></div>`; }
function heading(t, aside = '', src = null) { return `<div class="section-heading"><h2>${t}</h2><span class="aside">${aside}${src ? `<button class="link-btn" data-src="${src}">Source ↗</button>` : ''}</span></div>`; }
function statusBadge(d) { const [l, t] = STATUS(d.status); return `<span class="status-badge" data-tone="${t}">${esc(l)}</span>`; }
function trigger(d, cls = 'quote-big') { if (!d.trigger) return ''; const long = d.trigger.length > 260; const open = state.open.has('trig'); return `<figure class="${cls}" style="margin:0"><p>${inline(long && !open ? d.trigger.slice(0, 250).replace(/\s+\S*$/, '') + ' …' : d.trigger)}</p><figcaption class="by">What was reported${long ? ` · <button class="link-btn" data-toggle="trig">${open ? 'Less' : 'All of it'}</button>` : ''}</figcaption></figure>`; }
function nextBox(d, label = 'Next action') { const n = fval(d, 'next_action'); if (empty(n)) return ''; return `<div class="next"><span class="arrow">→</span><div><span class="kicker">${label}</span>${inline(clean(n))}</div></div>`; }
// the status-adaptive lead
function lead(d) {

  }

  if (s === 'diagnosed') return `<section class="lead" data-tone="in-flight"><span class="kicker">Root cause found · not fixed yet</span>${causesHtml(d, 'Root cause')}${fixHtml(d, 'Fix')}${fullLink(d)}</section>`;
  return `<section class="lead" data-tone="complete">${causesHtml(d, 'Root cause')}${fixHtml(d, 'The fix')}${verHtml(d)}${filesHtml(d)}${fullLink(d)}</section>`;
}
function symptoms(d) {
  if (!d.symptoms.length) return '';
  const get = re => d.symptoms.find(e => re.test(e.key)); const exp = get(/^expected/i), act = get(/^actual/i);

}
const TAG_L = { confirms: 'Confirms', eliminates: 'Rules out', fix: 'Fix', finding: 'Finding' };
function evCard(e, i) { return `<article class="ev" data-t="${e.tag}"><div class="ev-top"><span class="ts">#${i + 1} · ${esc(e.ts)}</span><span class="tag" data-t="${e.tag}">${TAG_L[e.tag]}</span></div>${e.checked ? `<p class="checked">${inline(clean(e.checked))}</p>` : ''}${e.found ? `<p class="found">${inline(clean(e.found))}</p>` : ''}${e.text ? `<p class="found">${inline(clean(e.text))}</p>` : ''}${e.implication ? `<p class="impl"><span>${inline(clean(e.implication))}</span></p>` : ''}</article>`; }
function elimCard(e) { return `<article class="elim"><p class="h">${inline(clean(e.hypothesis))}</p>${e.evidence ? `<p class="why"><b>Ruled out by</b>${inline(clean(e.evidence))}</p>` : ''}${e.timestamp ? `<span class="tag">${esc(e.timestamp)}</span>` : ''}</article>`; }
function alsoRow(d) { const items = d.other.map(o => `<li><button class="chip" data-src="${o.line}">${inline(o.title.replace(/\s*\(.*?\)\s*$/, '').replace(/\s+[—–-]\s+.*$/, ''))}</button></li>`); const rc = Object.keys(d.reasoning).length ? `<li><button class="chip" data-src="${d.focusLine}">Reasoning checkpoint</button></li>` : ''; items.push(rc, `<li><button class="chip" data-src="1">Frontmatter</button></li>`); return `<nav class="source-only" aria-label="Also in this session"><span class="kicker">Also in this session</span><ul>${items.join('')}</ul></nav>`; }
function factsLine(d) { const bc = fval(d, 'bug_class'); return `<div class="facts-line">${bc ? `<span>Bug class<b>${esc(clean(bc).split(/[ (—]/)[0])}</b></span>` : ''}<span>Evidence<b>${d.evidence.length}</b></span><span>Ruled out<b>${d.eliminated.length}</b></span>${d.evidence.some(e => e.round !== d.evidence[0]?.round) ? `<span>Rounds<b>${new Set(d.evidence.map(e => e.round)).size}</b></span>` : ''}</div>`; }

/* ============ A — case file ============ */
function suspects(d) {

  const col = (k, label, list) => `<div class="scol" data-k="${k}"><header><span>${label}</span><span>${list.length}</span></header>${list.length ? list.map(s => `<div class="suspect" data-k="${k}">${s.kind ? `<span class="kind">${esc(s.kind)}</span>` : ''}<span class="t">${inline(clean(s.text))}</span>${s.why ? `<span class="why">${inline(clean(s.why))}</span>` : ''}</div>`).join('') : '<div class="empty" style="font-size:var(--fs-3)">None.</div>'}</div>`;

function evidenceLog(d) {

/* ============ B — lab timeline ============ */
function viewB(d) {

    if (keyOnly && !isKey) return; shown++; const open = state.open.has('n' + i) || !keyOnly && false;

/* ============ C — funnel ============ */
function bands(d) {

/* ---------- modal ---------- */
function openMore(i) { const it = MORE[+i]; if (!it) return; const m = document.getElementById('modal'); m.innerHTML = `<div class="m-head"><h3>${esc(it.title)}</h3><button class="link-btn" data-close>Close ×</button></div><div class="m-body" style="gap:var(--space-4)">${val(it.full)}</div>`; m.showModal(); }
function openModal(kind) { const d = DOCS[state.doc]; const m = document.getElementById('modal');
  const part = (k, l) => empty(R(d, k)) ? '' : `<section style="display:grid;gap:var(--space-2)"><span class="kicker">${l}</span>${val(R(d, k))}</section>`;
  m.innerHTML = `<div class="m-head"><h3>Resolution in full</h3><button class="link-btn" data-close>Close ×</button></div><div class="m-body" style="gap:var(--space-6)">${part('root_cause', 'Root cause')}${part('fix', 'Fix')}${part('verification', 'Verification')}${fileList(d).length ? `<section style="display:grid;gap:var(--space-2)"><span class="kicker">Files changed</span>${fileList(d).map(f => `<div class="m-file"><span>${esc(f.path)}</span><span class="muted">${inline(f.note)}</span></div>`).join('')}</section>` : ''}${d.resolutionLine ? `<button class="link-btn" style="justify-self:start" data-src="${d.resolutionLine}">Open in source ↗</button>` : ''}</div>`;

document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') e.target.close(); });

/* ---------- render ---------- */
function render() {
  const d = DOCS[state.doc]; const v = state.variant; MORE = [];

}
addEventListener('resize', () => { document.querySelectorAll('[data-ifclamped]').forEach(b => { b.hidden = true; }); markClamped(); });
document.getElementById('doc-btns').innerHTML = Object.entries(DOCS).map(([k, d]) => `<button data-doc="${k}">${esc(d.label)}</button>`).join('');
function toast(msg) { const t = document.createElement('div'); t.textContent = msg; t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(40rem,90vw);background:var(--foreground);color:var(--background);padding:8px 14px;font-family:var(--font-mono);font-size:var(--fs-2);z-index:10000'; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

  else if (t.dataset.copy) { try { navigator.clipboard.writeText(t.dataset.copy); } catch {} return toast('Path copied'); }

});
