      <div class="side r"><span class="side-h">Inside · trusted</span>${R.map((n, k) => `<button class="pnode in ${hw ? (norm(hw.s.to) === n ? 'hot' : 'dim') : ''}" data-node="R${k}" data-wireto="${esc(n)}">${inline(n)}</button>`).join('')}</div>
      <svg class="wires" id="wires"></svg></div>
    <div class="wire-caption">${hw ? `<span class="k">${inline(hw.s.from)} → ${inline(hw.s.to)}</span><span><span class="mono-note">Carries · </span>${inline(hw.r.data)}</span><span class="muted">${inline(hw.r.desc)}</span>` : `<span class="muted">Pick a node to see what crosses the boundary there and why it matters.</span>`}</div>
    ${stores.length ? `<div class="stores-e">${stores.map(r => `<div class="store"><b>${inline(r.name)}</b><span>${inline(r.data)} — ${inline(r.desc)}</span></div>`).join('')}</div>` : ''}</section>` : '';
  window.__wires = { wires: wires.map(w => ({ i: w.i, from: L.indexOf(norm(w.s.from)), to: R.indexOf(norm(w.s.to)) })), hot };
  const groups = [['mitigate', 'Mitigated', 'Fixed in code'], ['accept', 'Accepted', 'Risk taken on purpose — signed'], ['transfer', 'Transferred', 'Someone else carries it'], ['mixed', 'Mixed', 'Groups with several dispositions']].map(([k, l, sub]) => ({ k, l, sub, rs: M.rows.filter(r => r.disp === k).sort((a, b) => (a.status === 'closed') - (b.status === 'closed') || SEV_N[b.sev.top] - SEV_N[a.sev.top]) })).filter(g => g.rs.length);
  const item = t => { const risk = M.riskFor(t.key); const o = state.open.has('e-' + t.i);
    return `<button class="ditem" data-open="e-${t.i}" data-tone="${t.tone === 'complete' ? '' : t.tone}"><span class="r1"><span class="id">${esc(t.group ? t.id.split(',')[0] + '…' : t.id)}</span>${sevline(t)}</span><span class="c">${inline(threatTitle(t))}</span>${t.status !== 'closed' ? `<span class="r1"><span class="chip" data-tone="${t.tone}">${ST[t.status][0]}</span></span>` : ''}${risk ? `<span class="why">${inline(risk.why)}</span><span class="sig">— ${esc(risk.by)}, ${esc(fmtD(risk.date))} · ${esc(risk.id)}</span>` : ''}${o && !risk ? `<span class="why">${inline(t.mitigation)}</span>` : ''}</button>`; };
  const cols = M.rows.length ? `<section><div class="eh"><h2>Threats, by what was done about them</h2><span class="mono-note">${M.rows.length} · open first</span></div>
    <div class="dcols" style="--cols:${groups.length}">${groups.map(g => { const lim = state.open.has('col-' + g.k) ? 999 : (g.k === 'accept' ? 999 : 8); return `<div class="dcol"><h3><span>${g.l}</span><span class="n">${g.rs.length}</span></h3><p class="sub">${g.sub}</p>${g.rs.slice(0, lim).map(item).join('')}${g.rs.length > lim ? `<button class="link-btn" data-open="col-${g.k}" style="margin-top:var(--space-2)">+${g.rs.length - lim} more</button>` : ''}</div>`; }).join('')}</div>
    ${!M.risks.length && d.risks?.note ? `<div class="notice" style="margin-top:var(--space-4)">${md(d.risks.note)}</div>` : ''}</section>` : md(d.register?.prose ?? '');
  const foot = `<footer class="footer-stamp" id="signoff"><span class="mono-note">Sign-off</span><span class="ticks">${so.map(i => `<i class="${i.checked ? 'on' : ''}" title="${esc(plain(i.text))}"></i>`).join('')}</span><span>${inline(d.signoff?.approval ?? '—')}</span><button class="link-btn" data-open="e-so" style="margin-left:auto">${state.open.has('e-so') ? 'Hide checks ▴' : 'Checks ▾'}</button></footer>${state.open.has('e-so') ? signoffList(d) : ''}`;
  return `${banner}${diagram}${cols}${extras(d)}${foot}`;
}
function drawWires() {
  const svg = document.getElementById('wires'), box = document.getElementById('perim'); if (!svg || !box || !window.__wires) return;
  const B = box.getBoundingClientRect(); const { wires, hot } = window.__wires;
  svg.setAttribute('viewBox', `0 0 ${B.width} ${B.height}`); svg.setAttribute('width', B.width); svg.setAttribute('height', B.height);
  svg.innerHTML = wires.map(w => { const a = box.querySelector(`[data-node="L${w.from}"]`).getBoundingClientRect(), b = box.querySelector(`[data-node="R${w.to}"]`).getBoundingClientRect();
    const x1 = a.right - B.left, y1 = a.top + a.height / 2 - B.top, x2 = b.left - B.left, y2 = b.top + b.height / 2 - B.top, mx = (x1 + x2) / 2;
    return `<path class="${hot == null ? '' : hot === w.i ? 'hot' : 'dim'}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`; }).join('');
}
window.addEventListener('resize', drawWires);

/* F: audit report */
function viewF(d, M) {
  const [st, tone] = DOCSTATUS(d.fm.status); const open = +(d.fm.threats_open ?? M.openB.length);
  const so = d.signoff?.items ?? []; const done = so.filter(i => i.checked).length;
  const acc = M.rows.filter(r => r.disp === 'accept').length, mit = M.rows.filter(r => r.disp === 'mitigate').length;
  const verdict = !M.rows.length ? `The register is written as prose.` : open
    ? `<span class="hl-m">${open} ${M.openB[0]?.sev.top ?? ''} threat${open === 1 ? '' : 's'}</span> still open and blocking sign-off. ${M.closed} of ${M.rows.length} are closed.`
    : M.openL.length ? `Nothing blocks sign-off. <span class="hl-f">${M.openL.length} low threat${M.openL.length === 1 ? ' is' : 's are'} still open</span>, below the ${esc(M.threshold)} threshold.`
    : `<span class="hl-c">All ${M.rows.length} ${M.grouped ? 'threat groups' : 'threats'} are closed.</span> ${mit} mitigated in code${acc ? `, ${acc} accepted as risks` : ''}.`;
  const sorted = [...M.rows].sort((a, b) => SEV_N[b.sev.top] - SEV_N[a.sev.top] || (a.status === 'closed') - (b.status === 'closed') || a.i - b.i);
  const h = { critical: '3.2rem', high: '2.4rem', medium: '1.6rem', low: '1rem', unknown: '1rem' };
  let prev = null;
  const strip = M.rows.length ? `<div class="strip"><div class="cells">${sorted.map(t => { const g = prev && prev !== t.sev.top ? '<span class="gap"></span>' : ''; prev = t.sev.top; return `${g}<button data-tline="${t.i}" data-tone="${t.tone === 'complete' ? '' : t.tone}" data-disp="${t.disp}" style="height:${h[t.sev.top]}" title="${esc(t.id)} · ${t.sev.top} · ${ST[t.status][0]}"></button>`; }).join('')}</div>
    <div class="key"><span>one bar per threat · height = severity</span><span><span class="dot-sq" style="width:.6rem;height:.6rem"></span>mitigated</span><span><span class="dot-sq" style="width:.6rem;height:.6rem;background:none;border-style:dashed"></span>accepted</span><span><span class="dot-sq" data-tone="missing" style="width:.6rem;height:.6rem"></span>open</span><span><span class="dot-sq" data-tone="in-flight" style="width:.6rem;height:.6rem"></span>open · non-blocking</span></div></div>` : '';
  const fnum = new Map(M.risks.map((r, k) => [r.ref, k + 1]));
  const fnFor = t => { const r = M.riskFor(t.key); return r ? fnum.get(r.ref) : null; };
  const sec = (n, t, s, body, id) => `<section class="rp-sec" id="${id}"><div class="rp-margin"><span class="n">${n}</span><span class="t">${t}</span>${s ? `<span class="s">${s}</span>` : ''}</div><div>${body}</div></section>`;
  const bands = ['critical', 'high', 'medium', 'low', 'unknown'].map(s => ({ s, rs: sorted.filter(t => t.sev.top === s) })).filter(b => b.rs.length);
  const tl = t => { const o = state.open.has('f-' + t.i); const fn = fnFor(t); return `<button class="tline" id="tl-${t.i}" data-open="f-${t.i}"><span class="dot-sq" data-tone="${t.tone === 'complete' ? (t.disp === 'accept' ? 'quiet' : '') : t.tone}"></span><span class="id">${esc(t.group ? t.id.split(',')[0] + '…' : t.id)}</span><span>${inline(threatTitle(t))}${fn ? `<sup>${fn}</sup>` : ''}</span><span class="tail">${t.status === 'closed' ? esc(t.disp) : ST[t.status][0]}</span></button>${o ? `<div class="tline-more fade">${inline(t.mitigation)}</div>` : ''}`; };
  const register = M.rows.length ? bands.map(b => { const lim = state.open.has('band-' + b.s) ? 999 : 6; const rs = [...b.rs].sort((a, c) => (a.status === 'closed') - (c.status === 'closed')); return `<div class="band"><div class="band-h">${pips(b.s)} ${b.s} · ${b.rs.length}</div>${rs.slice(0, lim).map(tl).join('')}${rs.length > lim ? `<button class="link-btn" data-open="band-${b.s}" style="padding:var(--space-2) 0">+${rs.length - lim} more ${b.s}</button>` : ''}</div>`; }).join('') : md(d.register?.prose ?? '');
  const notes = M.risks.length ? `<ol class="fnotes">${M.risks.map((r, k) => { const t = M.rows.find(x => r.ref && r.ref.includes(x.key)); return `<li id="fn-${k + 1}"><span class="fn">${k + 1}</span><span><b style="font-weight:var(--fw-medium)">${esc(r.ref)}${t ? ` · ${inline(threatTitle(t))}` : ''}</b><br>${inline(r.why)}<span class="by">Accepted by ${esc(r.by)}, ${esc(fmtD(r.date))} · ${esc(r.id)}</span></span></li>`; }).join('')}</ol>` : `<div class="prose-flow">${md(d.risks?.note || 'No risks were accepted.')}</div>`;
  const bounds = d.boundaries ? `<div class="prose-flow"><p>Untrusted input crosses into the system at <b>${d.boundaries.rows.length}</b> points.</p>${md(d.boundaries.rows.map(b => { const s = splitB(b.name); return s ? `- **${plain(s.from)}** → **${plain(s.to)}**, carrying *${plain(b.data)}*. ${b.desc}` : `- **${plain(b.name)}** holds *${plain(b.data)}*. ${b.desc}`; }).join('\n'))}</div>` : '';
  const sig = `<div class="sigblock"><div><div class="sigline">${/verified|approved/i.test(d.signoff?.approval ?? '') && !/pending/i.test(d.signoff?.approval ?? '') ? esc(d.signoff.approval) : ''}</div><div class="sigcap">Approval · ${inline(d.signoff?.approval ?? '—')}</div></div><div>${signoffList(d)}</div></div>`;
  return `<div class="report"><header class="rp-head"><div class="line"><span class="eyebrow" style="letter-spacing:var(--ls-widest)">Security report · Phase ${esc(String(d.fm.phase ?? '').replace(/^0+(?=\d)/, ''))}${d.synthetic ? ' <span class="synthetic">· synthetic</span>' : ''}</span><span class="chip" data-tone="${tone}">${esc(st)}</span><span>Created <b>${esc(fmtD(d.fm.created))}</b></span><span>ASVS <b>L${esc(d.fm.asvs_level ?? '—')}</b></span><span>Blocks at <b>${esc(M.threshold)}+</b></span><span style="margin-left:auto;display:flex;gap:var(--space-3);align-items:center"><button class="icon-btn" data-copy="${esc(d.file)}" aria-label="Copy file path">${ICON.link}</button><span class="seg"><button aria-pressed="true">View</button><button data-toast>Source</button></span></span></div>
      <p class="mono-note" style="text-transform:none;letter-spacing:0;font-size:var(--fs-4);color:var(--foreground)">${esc(humanize(d.fm.slug))}</p>
      <p class="rp-verdict">${verdict}</p>${d.lead ? `<div class="rp-sub">${md(d.lead)}</div>` : ''}${strip}</header>
    ${sec('01', 'Threats', `${M.rows.length} by severity · superscripts point to accepted-risk notes`, register, 'register')}
    ${sec('02', 'Accepted risks', M.risks.length ? `${M.risks.length} notes` : '', notes, 'risks')}
    ${bounds ? sec('03', 'Trust boundaries', 'In plain words', bounds, 'bounds') : ''}
    ${d.extras.length ? sec('·', 'Also recorded', '', extras(d), 'extras') : ''}
    ${sec(bounds ? '04' : '03', 'Sign-off', `${done} of ${so.length}`, sig, 'signoff')}
    ${sec('', 'Audit trail', 'Off by default', audit(d), 'audit')}</div>`;
}

/* ---------- render ---------- */
function render() {
  const d = DOCS[state.doc]; const M = model(d); const v = state.variant;
  const sec = (id, n, title, aside, body) => body ? `<section id="${id}">${heading(n, title, aside)}${body}</section>` : '';
  const bAside = d.boundaries ? `${d.boundaries.rows.length} places untrusted input crosses in` : '';
  if ('def'.includes(v)) { document.getElementById('root').innerHTML = `<div class="page wide fade">${v === 'd' ? viewD(d, M) : v === 'e' ? viewE(d, M) : viewF(d, M)}</div>`; return finish(); }
  let html = cover(d, M);
  if (v === 'a') html += sec('register', '01', 'Threat register', 'Open first · severity × disposition', registerA(d, M)) + sec('risks', '02', 'Accepted risks', `${M.risks.length} signed off`, risksA(d, M)) + sec('bounds', '03', 'Trust boundaries', bAside, boundariesA(d)) + extras(d) + signoff(d, '04') + audit(d);
  if (v === 'b') html += sec('bounds', '01', 'Where it can be attacked', bAside, boundaryMap(d)) + sec('register', '02', 'Threats by kind', 'STRIDE · open first in each lane', strideLanes(d, M)) + sec('risks', '03', 'Accepted risks', 'When and why', riskTimeline(d, M)) + extras(d) + signoff(d, '04') + audit(d);
  if (v === 'c') html += sec('risks', '01', 'Needs a human eye', 'Open threats · accepted risks', attention(d, M)) + sec('register', '02', 'Threat register', 'Click a heading to sort', ledger(d, M)) + (d.boundaries ? `<div class="extras"><details><summary>Trust boundaries · ${d.boundaries.rows.length}</summary><div style="padding:0 var(--space-4) var(--space-4)">${boundariesA(d)}</div></details></div>` : '') + extras(d) + signoff(d, '03') + audit(d);
  document.getElementById('root').innerHTML = `<div class="page fade">${html}${sourceOnly()}</div>`;
  finish();
}
function finish() {
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const f = document.getElementById('frame');
  f.style.maxWidth = state.width === 'full' ? 'none' : state.width + 'px';
  f.classList.toggle('narrow-frame', state.width !== 'full');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.variant === state.variant));
  document.querySelectorAll('#sketch-tools button').forEach(b => b.classList.toggle('on', b.dataset.doc === state.doc || b.dataset.theme === state.theme || b.dataset.width === state.width));
  requestAnimationFrame(drawWires);
}
document.getElementById('doc-btns').innerHTML = Object.entries(DOCS).map(([k, d]) => `<button data-doc="${k}">${esc(d.label)}</button>`).join('');
function toast(msg) { const t = document.createElement('div'); t.textContent = msg; t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:8px 16px;font-family:var(--font-mono);font-size:var(--fs-2);z-index:10000'; document.body.appendChild(t); setTimeout(() => t.remove(), 1400); }
function jumpTo(id) { const el = document.getElementById(id); if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 900); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) { try { navigator.clipboard.writeText(c.dataset.copy); } catch {} toast('Path copied'); return; }
  const t = e.target.closest('button'); if (!t) return;
  const y = window.scrollY;
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.open.clear(); state.f = null; state.pick = null; state.wire = null; }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; state.open.clear(); state.f = null; state.pick = null; state.wire = null; }
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.jump) { if (t.dataset.openthreat) { state.open.add('t-' + t.dataset.openthreat); state.open.add('closed'); } if (/^th-/.test(t.dataset.jump)) state.open.add('closed'); render(); return jumpTo(t.dataset.jump); }
  else if (t.dataset.pick !== undefined && t.dataset.pick !== '') { const i = +t.dataset.pick; state.pick = state.pick === i ? null : i; }
  else if (t.dataset.jumpto) return jumpTo(t.dataset.jumpto);
  else if (t.dataset.tline) { state.open.add('f-' + t.dataset.tline); const r = model(DOCS[state.doc]).rows.find(x => x.i === +t.dataset.tline); if (r) state.open.add('band-' + r.sev.top); render(); return jumpTo('tl-' + t.dataset.tline); }
  else if (t.dataset.node) { const w = window.__wires?.wires.find(x => (t.dataset.node[0] === 'L' ? 'L' + x.from : 'R' + x.to) === t.dataset.node && x.i !== state.wire) ?? null; state.wire = w ? w.i : null; }
  else if (t.dataset.f) state.f = state.f === t.dataset.f ? null : t.dataset.f;
  else if (t.dataset.sort) state.sort = t.dataset.sort;
  else if ('audit' in t.dataset) state.audit = !state.audit;
  else if (t.dataset.open) { const k = t.dataset.open; state.open.has(k) ? state.open.delete(k) : state.open.add(k); }
  else if ('toast' in t.dataset) return toast('Opens Source mode at this section');
  else return;
  render(); window.scrollTo(0, y);
});
render();
</script>
</body>
</html>
