/* Sketch 014: the UI-SPEC (UI design contract) page. Shared across variants: cover (created date,
   status, a quiet shadcn · preset line, sign-off dimensions), copy deck, folded phase-specific
   chapters, registry safety, collapsed agent notes. The question is how the design system
   (spacing, type, colour) and UI considerations read. Data: ./data.js from six real UI-SPEC.md
   files (gen-data.mjs). Tones only (docs/design-language.md ## Tones): PASS / covered → complete,
   FLAG / backstop → in-flight, BLOCK / unresolved → missing, pending / dismissed → quiet.
   Colour swatches paint the document's own stated values (content, not design). */

.ladder .rung { display: grid; grid-template-columns: minmax(0, 1fr) 13rem; gap: var(--space-4); align-items: center; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.ladder .rung:last-child { border-bottom: 0; }
.ladder .rung .spec { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); text-align: right; }
.ladder .rung .spec b { display: block; color: var(--foreground); font-weight: var(--fw-medium); font-family: var(--font-heading); letter-spacing: var(--ls-wider); text-transform: uppercase; font-size: var(--fs-1); }
@container (max-width: 640px) { .ladder .rung { grid-template-columns: 1fr; } .ladder .rung .spec { text-align: left; } }
.mock-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: var(--space-4); }
.mock { border: 1px solid var(--border); padding: var(--space-5); display: grid; gap: var(--space-3); position: relative; }
.mock .mock-card { padding: var(--space-4); display: grid; gap: var(--space-2); }
.mock .mock-btn { justify-self: start; padding: var(--space-1-5) var(--space-3); font-size: var(--fs-3); font-weight: var(--fw-semibold); border: 0; }
.mock .mock-err { font-size: var(--fs-3); }
.mock .mock-muted { height: 0.45rem; }
.mock .tag { position: absolute; top: var(--space-2); right: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; padding: 0 var(--space-1); }
.mock.nodoc-mock { background: var(--hatch); display: grid; place-items: center; min-height: 11rem; }
.pins { display: grid; gap: var(--space-2); margin-top: var(--space-4); }
.pin { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: var(--space-3); font-size: var(--fs-3); align-items: baseline; }
.pin .n { font-family: var(--font-mono); font-size: var(--fs-1); border: 1px solid var(--border); text-align: center; }

/* ===== UI considerations (shared summary) ===== */
.cov { display: grid; gap: var(--space-2); margin-bottom: var(--space-6); max-width: 52rem; }
.cov-bar { display: flex; height: 0.6rem; border: 1px solid var(--border); }
.cov-bar span { display: block; height: 100%; }
.s-covered { background: var(--primary); }
.s-backstop { background: var(--in-flight-fill); }
.s-unresolved { background: var(--missing-fill); }
.s-dismissed { background: color-mix(in oklch, var(--foreground) 18%, transparent); }
.cov-key { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.cov-key i { display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: var(--space-1-5); }
.cov-key b { color: var(--foreground); font-weight: var(--fw-medium); margin-right: var(--space-1); }
.cov-author { font-size: var(--fs-2); color: var(--muted-foreground); font-family: var(--font-mono); }
.el-code { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); letter-spacing: var(--ls-wider); }
.p-tag { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--primary); letter-spacing: var(--ls-wider); }

/* A: matrix */
.matrix-wrap { overflow-x: auto; border: 1px solid var(--border); }
.matrix { border-collapse: collapse; width: 100%; min-width: 46rem; font-size: var(--fs-3); }
.matrix th { font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); padding: var(--space-2); text-align: center; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 40%, transparent); white-space: nowrap; }
.matrix th.el { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--background); }
.matrix td { border-bottom: 1px solid color-mix(in oklch, var(--border) 55%, transparent); padding: 0; text-align: center; height: 2.4rem; }
.matrix td.el { text-align: left; padding: var(--space-1-5) var(--space-3); position: sticky; left: 0; background: var(--background); z-index: 1; max-width: 16rem; border-right: 1px solid var(--border); }
.matrix td.el .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@container (max-width: 640px) { .matrix td.el { max-width: 8.5rem; font-size: var(--fs-2); } .matrix { min-width: 34rem; } }
.matrix tr:hover td.el { background: color-mix(in oklch, var(--muted) 40%, var(--background)); }
.cell { width: 100%; height: 100%; min-height: 2.4rem; border: 0; background: none; display: grid; place-items: center; transition: background .15s ease; }
.cell:hover { background: var(--state-hover); }
.cell[aria-pressed='true'] { background: var(--primary-tint); box-shadow: inset 0 0 0 1px var(--primary); }
.mk { width: 0.8rem; height: 0.8rem; display: inline-block; position: relative; }
.mk.covered { background: var(--primary); }
.mk.backstop { background: linear-gradient(135deg, var(--in-flight-fill) 50%, transparent 50%); outline: 1.5px solid var(--in-flight-fill); outline-offset: -1.5px; }
.mk.unresolved { outline: 2px solid var(--missing-fill); outline-offset: -2px; }
.mk.dismissed { width: 0.5rem; height: 1px; background: var(--muted-foreground); }
.mk-n { font-family: var(--font-mono); font-size: 0.55rem; color: var(--muted-foreground); margin-left: 2px; vertical-align: top; }
.matrix-key { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); margin: var(--space-3) 0 var(--space-4); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); align-items: center; }
.matrix-key span { display: inline-flex; gap: var(--space-1-5); align-items: center; }
.cell-detail { margin-top: var(--space-4); border: 1px solid var(--border); background: var(--card-veil); padding: var(--space-4); display: grid; gap: var(--space-3); }
.cell-detail .hd { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: baseline; }
.cell-detail .hd h3 { font-size: var(--fs-6); font-weight: var(--fw-semibold); }
.res { display: grid; gap: var(--space-1-5); padding-top: var(--space-3); border-top: 1px dashed var(--border); }
.res:first-of-type { border-top: 0; padding-top: 0; }
.res .txt { font-size: var(--fs-4); }
.attn-strip { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-3); }

/* B: attention first */
.attn { display: grid; gap: var(--space-3); margin-bottom: var(--space-8); }
.attn-card { display: grid; grid-template-columns: minmax(10rem, 15rem) minmax(0, 1fr); gap: var(--space-2) var(--space-5); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); background: var(--card-veil); }
.attn-card[data-s='backstop'] { border-left: 3px solid var(--in-flight-fill); }
.attn-card[data-s='unresolved'] { border-left: 3px solid var(--missing-fill); }
.attn-card .who { display: grid; gap: var(--space-1); align-content: start; }
.attn-card .who .nm { font-weight: var(--fw-semibold); font-size: var(--fs-4); }
.attn-card .txt { font-size: var(--fs-4); }
@container (max-width: 700px) { .attn-card { grid-template-columns: 1fr; } }
.el-list { border-top: 1px solid var(--border); }
.el-row > button { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto auto; gap: var(--space-3); align-items: center; width: 100%; padding: var(--space-2-5) var(--space-2); border: 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); background: none; text-align: left; transition: background .15s ease; }
.el-row > button:hover { background: var(--state-hover); }
.el-row.open > button { background: color-mix(in oklch, var(--muted) 45%, transparent); }
.el-row .nm { font-size: var(--fs-4); font-weight: var(--fw-medium); min-width: 0; overflow-wrap: anywhere; }
.mini { display: inline-flex; gap: 2px; }
.mini i { width: 0.55rem; height: 0.55rem; display: block; }
.mini i.none { outline: 1px dashed color-mix(in oklch, var(--border) 90%, transparent); outline-offset: -1px; }
.el-body { padding: var(--space-3) var(--space-2) var(--space-5) 3.75rem; display: grid; gap: 0; }
.cons { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px dashed color-mix(in oklch, var(--border) 70%, transparent); font-size: var(--fs-4); }
.cons:last-child { border-bottom: 0; }
.cons .c { display: grid; gap: var(--space-1); align-content: start; }
.cons .c .cat { font-family: var(--font-mono); font-size: var(--fs-2); }
.cons.dis { color: var(--muted-foreground); }
@container (max-width: 640px) { .el-body { padding-left: var(--space-2); } .cons { grid-template-columns: 1fr; gap: var(--space-1); } .el-row > button { grid-template-columns: 2.5rem minmax(0, 1fr) auto; } .el-row .mini { display: none; } }
.dismissed-toggle { margin-top: var(--space-5); }

/* C: element cards + filters */
.filters { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; margin-bottom: var(--space-2); }
.filters .mono-note { margin-right: var(--space-2); min-width: 4rem; }
.el-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); gap: var(--space-3); align-items: start; margin-top: var(--space-4); }
@container (max-width: 520px) { .el-cards { grid-template-columns: 1fr; } }
.el-card { border: 1px solid var(--border); background: var(--card-veil); min-width: 0; }
.el-card > button { display: grid; gap: var(--space-2); width: 100%; padding: var(--space-3) var(--space-4); border: 0; background: none; text-align: left; transition: background .15s ease; }
.el-card > button:hover { background: var(--state-hover); }
.el-card .top { display: flex; gap: var(--space-2); align-items: baseline; }
.el-card .nm { font-weight: var(--fw-semibold); font-size: var(--fs-4); overflow-wrap: anywhere; }
.el-card .kinds { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); }
.strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
.strip > span { display: grid; gap: 2px; justify-items: center; }
.strip i { width: 100%; height: 0.5rem; display: block; }
.strip i.none { background: none; outline: 1px dashed color-mix(in oklch, var(--border) 90%, transparent); outline-offset: -1px; }
.strip small { font-family: var(--font-mono); font-size: 0.5rem; color: var(--muted-foreground); letter-spacing: 0.04em; text-transform: uppercase; }
.el-card.flagged { border-color: var(--in-flight-border); }
.el-card .el-body { padding: 0 var(--space-4) var(--space-4); }
.el-card.dim { opacity: .4; }

/* copy deck (shared) */
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: var(--space-3); }
.line-card { border: 1px solid var(--border); background: var(--card-veil); padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-2); align-content: start; min-width: 0; }
.line-card .say { font-size: var(--fs-6); font-weight: var(--fw-medium); line-height: var(--lh-snug); overflow-wrap: anywhere; }
.line-card .say q { quotes: '“' '”'; }
.line-card .say + .say { font-size: var(--fs-4); }
.line-card .note { font-size: var(--fs-3); color: var(--muted-foreground); }
.line-card.none .say { color: var(--muted-foreground); font-style: italic; font-size: var(--fs-4); }
.deck-more { margin-top: var(--space-4); }

/* chapters (shared) */
.chapters { display: grid; border-top: 1px solid var(--border); }
.chapter > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; padding: var(--space-3) var(--space-2); border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); transition: background .15s ease; }
.chapter > summary::-webkit-details-marker { display: none; }
.chapter > summary:hover { background: var(--state-hover); }
.chapter > summary .n { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.chapter > summary .t { display: grid; gap: var(--space-0-5); min-width: 0; }
.chapter > summary .t b { font-weight: var(--fw-semibold); font-size: var(--fs-5); }
.chapter > summary .t span { font-size: var(--fs-3); color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter > summary::after { content: '▾'; color: var(--muted-foreground); }
.chapter[open] > summary::after { content: '▴'; }
.chapter[open] > summary .t span { display: none; }
.chapter .md { padding: var(--space-4) var(--space-2) var(--space-6) 3.25rem; }
@container (max-width: 640px) { .chapter .md { padding-left: var(--space-2); } }
.rev { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--in-flight-fill); letter-spacing: var(--ls-wider); text-transform: uppercase; }

/* registry (shared) */
.reg { display: grid; gap: var(--space-2); }
.reg-row { display: grid; grid-template-columns: 11rem minmax(0, 1fr) auto; gap: var(--space-4); align-items: start; padding: var(--space-3) var(--space-4); border: 1px solid var(--border); background: var(--card-veil); }
.reg-row .name { font-weight: var(--fw-semibold); font-size: var(--fs-4); }
.reg-row .blocks { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: baseline; font-size: var(--fs-3); }
.reg-row .blocks code { font-size: var(--fs-2); }
.reg-row .blocks .grp { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); letter-spacing: var(--ls-wider); text-transform: uppercase; margin: 0 var(--space-1) 0 var(--space-2); }
.reg-row .gate { justify-self: end; display: grid; gap: var(--space-1); justify-items: end; text-align: right; max-width: 18rem; }
.reg-row .gate small { font-size: var(--fs-2); color: var(--muted-foreground); }
@container (max-width: 700px) { .reg-row { grid-template-columns: 1fr; } .reg-row .gate { justify-self: start; justify-items: start; text-align: left; } }

/* back matter (shared) */
.back { display: grid; gap: var(--space-3); }
.back details { border: 1px solid var(--border); background: var(--card-veil); }
.back > details > summary { cursor: pointer; padding: var(--space-3) var(--space-4); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); list-style: none; display: flex; gap: var(--space-2); }
.back > details > summary::-webkit-details-marker { display: none; }
.back > details > summary::after { content: '▾'; margin-left: auto; }
.back > details[open] > summary::after { content: '▴'; }
.back > details > summary:hover { color: var(--foreground); }
.back .inner { padding: 0 var(--space-4) var(--space-4); display: grid; gap: var(--space-4); }
.back .inner pre { white-space: pre-wrap; font-size: var(--fs-2); color: var(--muted-foreground); margin: 0; font-family: var(--font-mono); }
.source-strip { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding-top: var(--space-4); border-top: 1px dashed var(--border); }

/* ===== round 2 ===== */
.crow.sp-row { grid-template-columns: minmax(0, 1fr) auto; padding: var(--space-5) var(--space-6) var(--space-3); }
.sp-row .tickline { height: 2.2rem; }
.meta-row { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-6); align-items: center; justify-content: space-between; }
.meta-row .facts { align-items: center; }
.signoff-chip { gap: var(--space-1-5); padding: var(--space-1) var(--space-2); font-size: var(--fs-2); }
.signoff-chip svg { opacity: .8; }
.doc-tools { display: flex; gap: var(--space-4); align-items: center; }
.icon-btn { display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; border: 0; background: none; color: var(--muted-foreground); transition: color .15s ease, background .15s ease; }
.icon-btn:hover { color: var(--foreground); background: var(--state-hover); }
.seg { display: inline-flex; }
.seg button { padding: var(--space-1) var(--space-3); border: 0; background: none; font-family: var(--font-mono); font-size: var(--fs-4); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--foreground); }
.seg button[aria-pressed='true'] { background: color-mix(in oklch, var(--muted) 85%, transparent); }
.preset-quiet { display: inline-flex; gap: var(--space-1-5); align-items: center; text-transform: none; letter-spacing: 0; opacity: .85; }
.preset-copy { display: inline-flex; gap: var(--space-1); align-items: center; padding: 0 var(--space-1); border: 1px dashed var(--border); background: none; color: var(--muted-foreground); transition: all .15s ease; }
.preset-copy code { background: none; padding: 0; }
.preset-copy:hover { color: var(--foreground); border-color: var(--muted-foreground); }
/* modal (Base UI dialog look, as the RESEARCH confidence modal) */
.modal-back { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: var(--space-4); background: color-mix(in oklch, var(--background) 55%, transparent); backdrop-filter: blur(4px); }
.modal { width: min(44rem, 100%); max-height: 88vh; overflow-y: auto; background: var(--card); border: 1px solid var(--border); padding: var(--space-6); display: grid; gap: var(--space-4); box-shadow: 0 20px 60px oklch(0 0 0 / 35%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); }
.modal-head h2 { display: flex; gap: var(--space-2); align-items: center; font-family: var(--font-heading); font-size: var(--fs-5); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.modal-x { border: 1px solid var(--border); }
.so-list { margin: 0; display: grid; }
.so-row { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--border); }
.so-row:last-child { border-bottom: 0; }
.so-row.bare { padding: var(--space-2) 0; } .so-row.bare dt { grid-column: 1 / -1; display: flex; justify-content: space-between; }
.so-row dt { display: grid; gap: var(--space-1); align-content: start; }
.so-row dd { margin: 0; font-size: var(--fs-4); }
.so-name { font-weight: var(--fw-semibold); font-size: var(--fs-4); }
.so-verdict { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); display: inline-flex; gap: var(--space-1-5); }
.so-verdict[data-tone='complete'] { color: var(--primary); } .so-verdict[data-tone='in-flight'] { color: var(--in-flight-fill); } .so-verdict[data-tone='missing'] { color: var(--missing-fill); }
.so-approval { font-size: var(--fs-3); color: var(--muted-foreground); padding-top: var(--space-3); border-top: 1px dashed var(--border); }
@media (max-width: 40rem) { .so-row { grid-template-columns: 1fr; gap: var(--space-1); } }
/* choices */
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-10); }
.choices.four { grid-template-columns: 1.15fr 1fr 1fr 1.3fr; }
@container (max-width: 1000px) { .choices, .choices.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 560px) { .choices, .choices.four { grid-template-columns: 1fr; } }
.choice { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-4); border: 1px solid color-mix(in oklch, var(--primary) 45%, var(--border)); background: var(--primary-tint); box-shadow: inset 0 3px 0 var(--primary); min-width: 0; }
.choice.is-none { border-color: var(--border); background: var(--card-veil); box-shadow: none; }
.choice-v { font-size: var(--fs-7); font-weight: var(--fw-semibold); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); overflow-wrap: anywhere; }
.choice-v.none { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.choice-rest { font-size: var(--fs-3); color: var(--muted-foreground); overflow-wrap: anywhere; }
.choice .link-btn { justify-self: start; }
.faces { display: grid; gap: var(--space-3); }
.face { display: grid; gap: var(--space-0-5); }
.face + .face { padding-top: var(--space-3); border-top: 1px dashed color-mix(in oklch, var(--primary) 30%, var(--border)); }
.face .aa { font-size: var(--fs-4); color: var(--foreground); opacity: .7; }
.shadcn-state { display: flex; gap: var(--space-1-5); flex-wrap: wrap; }
.preset-field { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2); align-items: center; padding: var(--space-1-5) var(--space-2); border: 1px solid var(--border); background: var(--background); text-align: left; transition: border-color .15s ease; }
.preset-field code { background: none; padding: 0; font-size: var(--fs-4); overflow-wrap: anywhere; }
.preset-field svg { color: var(--muted-foreground); }
.preset-field:hover { border-color: var(--primary); }
.kvs { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); font-family: var(--font-mono); font-size: var(--fs-2); }
.kvs i { font-style: normal; color: var(--muted-foreground); }
/* copy gallery (B) */
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-6) var(--space-8); align-items: start; }
@container (max-width: 820px) { .gallery { grid-template-columns: 1fr; } }
.g-group { min-width: 0; }
.g-action, .g-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }

<script>
const DOCS = window.UISPEC_DOCS;
const state = { variant: 'w', doc: 'sp04', theme: 'dark', width: 'full', open: new Set(), cell: null, tab: 'spacing', fStatus: 'all', fCat: null, kind: null, modal: null };
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="#" onclick="return false">$1</a>');
const plain = s => String(s ?? '').replace(/\*\*|`|\*/g, '');
const firstSentence = s => { const t = plain(s).replace(/\s+/g, ' ').trim(); const m = t.match(/^(.{20,180}?[.;:])\s/); return m ? m[1] : t.length > 180 ? t.slice(0, 178) + '…' : t; };
const humanize = s => String(s ?? '').replace(/-/g, ' ').replace(/^./, c => c.toUpperCase());

/* small markdown block renderer: ###/#### headings, tables, lists, blockquotes, fences, paragraphs */
function md(src) {

    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) { const b = []; i++; while (i < lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); i++; out.push(`<pre><code>${esc(b.join('\n'))}</code></pre>`); continue; }
    if (/^#{3,6}\s/.test(l)) { out.push(`<h4>${inline(l.replace(/^#+\s/, ''))}</h4>`); i++; continue; }
    if (isTbl(i)) { const h = cells(l); i += 2; const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++])); out.push(`<div class="tbl-wrap"><table><thead><tr>${h.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue; }
    if (/^>/.test(l)) { const b = []; while (i < lines.length && /^>/.test(lines[i])) b.push(lines[i++].replace(/^>\s?/, '')); out.push(`<blockquote>${md(b.join('\n'))}</blockquote>`); continue; }

/* ---------- value parsing ---------- */
function sizePx(s) { // -> { min, max, fluid } in px, or null
  const t = plain(s);
  let m = t.match(/(\d+(?:\.\d+)?)\s*[–-]\s*(\d+(?:\.\d+)?)\s*px/); if (m) return { min: +m[1], max: +m[2], fluid: true };

}
const fmtPx = v => v ? (v.fluid ? `${+v.min.toFixed(1)}–${+v.max.toFixed(1)}px` : `${+v.min.toFixed(1)}px`) : '—';

const LIT = /#[0-9a-f]{6}\b|#[0-9a-f]{3}\b|oklch\([^)]*\)/gi;
// A colour cell -> [{ tokens:[...], light, dark }]; token groups own the literals that follow them.
function swatchesOf(cell, darkCell) {
  const s = String(cell ?? '');
  const re = /`(--[\w-]+)`|(#[0-9a-f]{6}\b|#[0-9a-f]{3}\b|oklch\([^)]*\))\s*`?\s*(light|dark)?/gi;
  const out = []; let cur = null, m, lastTok = false;
  while ((m = re.exec(s))) {
    if (m[1] && /\b(never|not|instead of)\W*$/i.test(s.slice(Math.max(0, m.index - 14), m.index))) { (out.avoid ||= []).push(m[1]); continue; }
    if (m[1]) { if (!cur || !lastTok || cur.light || cur.dark) out.push(cur = { tokens: [], light: null, dark: null }); cur.tokens.push(m[1]); lastTok = true; }
    else { if (!cur) out.push(cur = { tokens: [], light: null, dark: null }); const which = (m[3] || '').toLowerCase(); if (which === 'dark' || (cur.light && !which)) cur.dark = cur.dark ?? m[2]; else cur.light = cur.light ?? m[2]; lastTok = false; }
  }
  if (darkCell) for (const g of swatchesOf(darkCell)) {
    const tgt = out.find(o => g.tokens.some(t => o.tokens.includes(t))) ?? (g.tokens.length ? null : out.find(o => !o.dark));
    if (tgt) tgt.dark = tgt.dark ?? g.light; else out.push({ tokens: g.tokens, light: null, dark: g.light, darkOnly: true });

}
function colorModel(d) {
  const h = d.color.head.map(x => x.toLowerCase());
  const lightI = h.findIndex(x => /value/.test(x)), darkI = h.findIndex(x => /dark/.test(x) && !/light/.test(x));
  const useI = h.findIndex(x => /usage/.test(x));

    const name = plain(r[0]).replace(/\s*\(.*\)\s*/, '').trim();
    const pct = +((r[0].match(/(\d+)%/) || [])[1] ?? 0) || null;
    const sw = swatchesOf(r[lightI], darkI > lightI ? r[darkI] : null);
    const note = plain(r[lightI]).replace(LIT, '').replace(/--[\w-]+/g, '').replace(/[—\-/,:()]+/g, ' ').replace(/\b(light|dark)\b/gi, '').trim();

}
const litCss = v => v; // doc values are valid CSS as written (hex / oklch)
function swBox(sw, cls = 'chipbox') {

/* ---------- tones ---------- */
const DIM_TONE = { PASS: 'complete', FLAG: 'in-flight', BLOCK: 'missing', FAIL: 'missing', PENDING: 'quiet' };
const DIM_GLYPH = { PASS: '✓', FLAG: '⚑', BLOCK: '✗', FAIL: '✗', PENDING: '○' };

const CATS = ['empty', 'loading', 'error', 'populated', 'partial', 'overflow', 'zero-one-many', 'long-text'];
const CAT_SHORT = { 'zero-one-many': '0·1·n', 'long-text': 'long', 'populated': 'full', 'overflow': 'ovfl', 'loading': 'load' };

/* ---------- icons (lucide paths) ---------- */
const ICON = {
  link: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg>',

  max: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg>',
  copy: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="0"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',

/* ---------- cover: eyebrow, title, meta row (sign-off chip → modal, created, copy path, View/Source) ---------- */
function signoffSummary(so) {
  const c = so.dims.reduce((a, x) => (a[x.verdict] = (a[x.verdict] || 0) + 1, a), {});
  const n = so.dims.length;

  if (c.PENDING === n) return { label: 'Sign-off not run', tone: 'quiet' };

function presetInfo(d) {
  const fm = d.fm;

  const raw = d.designSystem?.rows.find(r => /^preset$/i.test(plain(r.k)))?.v ?? '';
  const code = (raw.match(/`([^`]+)`/) || [])[1] ?? plain(fm.preset ?? '').split(/[\s(]/)[0];
  const usable = code && !/^(none|not applicable)$/i.test(code);
  const kv = [];
  for (const m of raw.matchAll(/\b(style|baseColor|base|theme|radius)\s+[`"]([\w-]+)[`"]|`(style|baseColor|base|theme|radius):\s*([\w-]+)`/g)) kv.push([(m[1] ?? m[3]).replace(/Color$/, ''), m[2] ?? m[4]]);

        <button class="icon-btn" data-copy="${esc(d.file)}" title="${esc(d.file)}" aria-label="Copy file path">${ICON.link}</button>

}
function signoffModal(d) {

  const reset = () => { state.open.clear(); state.cell = null; state.kind = null; state.modal = null; };
  if (t.dataset.variant) { state.variant = t.dataset.variant; reset(); }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; reset(); }
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.modal) state.modal = t.dataset.modal;
  else if (t.dataset.cell) state.cell = state.cell === t.dataset.cell ? null : t.dataset.cell;
  else if (t.dataset.kind) state.kind = state.kind === t.dataset.kind ? null : t.dataset.kind;
  else if (t.dataset.open) { const k = t.dataset.open; state.open.has(k) ? state.open.delete(k) : state.open.add(k); }
  else if ('toast' in t.dataset) return toast('Opens Source mode at this section');
  else return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (state.modal) state.modal = null; else if (state.cell) state.cell = null; else return; render(); } });
render();
</script>
