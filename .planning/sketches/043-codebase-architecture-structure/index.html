<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 043 — Architecture and Structure panels</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* Sketch 043: the Architecture and Structure panels inside the 042 frame, three arrangements.
   Drawn inside the 042 A frame (Rail + column), which is identical in every variant. Text comes from
   Labelore's own public map (.planning/codebase/) and from the made-up Tidemark fixture; the longest
   real Architecture, Structure and Concerns documents set the shapes. Tokens come from ../themes/default.css;
   nothing here defines a colour of its own: every colour is a theme token or a colour-mix of tokens.
   Squared corners, spacing from --space-* tokens, four font sizes (display h1, --fs-7, --fs-4, --fs-2). */
:root {
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --veil: color-mix(in oklch, var(--muted) 55%, transparent);
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --sq: var(--space-2-5);
  --page: calc(var(--space-8) * 40);
  --rail: calc(var(--space-8) * 9);
}
:root {
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --veil: color-mix(in oklch, var(--muted) 55%, transparent);
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --sq: var(--space-2-5);
  --page: calc(var(--space-8) * 40);
  --rail: calc(var(--space-8) * 9);
  --side: calc(var(--space-8) * 10);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-4); font-weight: var(--fw-medium); line-height: var(--lh-normal); }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--font-mono); font-size: inherit; }
[hidden] { display: none !important; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.dark .moon, .sun { display: none; }
.dark .sun { display: block; }

/* ---------- sketch chrome (not part of the app) ---------- */
#sketch-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
#sketch-bar .lbl { color: var(--muted-foreground); white-space: nowrap; }
#sketch-bar .grp { display: flex; flex: none; gap: var(--space-1); align-items: center; }
#sketch-bar .grp + .grp { padding-left: var(--space-3); border-left: 1px solid var(--border); }
#sketch-bar .grp.line { flex-basis: 100%; padding-left: 0; border-left: 0; }
#sketch-bar a, #sketch-bar button { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; color: var(--muted-foreground); white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; }
#sketch-bar a:hover, #sketch-bar button:hover { color: var(--foreground); background: var(--state-hover); }
#sketch-bar .on { color: var(--foreground); border-color: var(--border); background: var(--state-hover); }
#sketch-bar .name { color: var(--muted-foreground); padding-inline: var(--space-1); }
@media (max-width: 42rem) { #sketch-bar { flex-wrap: nowrap; overflow-x: auto; } #sketch-bar .grp.line { flex-basis: auto; } }
#toast { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 99; max-width: 90vw; padding: var(--space-2) var(--space-3); background: var(--foreground); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); opacity: 0; pointer-events: none; }
#toast.on { opacity: 1; }

/* ---------- app shell header (outside the page, drawn as today) ---------- */
.app-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-fluid-3); border-bottom: 1px solid var(--border); }
.app-brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-3); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.app-brand i { width: var(--space-5); height: var(--space-5); background: var(--primary); }
.app-brand span { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.app-nav { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-left: auto; }
.app-nav a { padding: var(--space-1-5) var(--space-2-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.app-nav a[aria-current] { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }

/* ---------- page atoms (all four sizes: display h1, heading fs-7, body fs-4, label fs-2) ---------- */
.page { display: grid; gap: var(--space-6); align-content: start; width: min(var(--page), 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); }
.crumbs [aria-current] { color: var(--foreground); }
.heading-block { display: grid; gap: var(--space-3); min-width: 0; }
.eyebrow { display: flex; gap: var(--space-2); align-items: center; color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
h1 { font-size: var(--fs-display-3); font-weight: var(--fw-semibold); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); overflow-wrap: anywhere; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); min-width: 0; }
.micro-label, .grp-h { margin: 0; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
.btn-xs { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1-5); min-height: var(--space-7); padding-inline: var(--space-3); border: 1px solid var(--border); font-family: var(--font-sans); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.btn-xs:hover { background: var(--state-hover); }
.btn-xs[aria-pressed='true'] { background: var(--muted); }
.btn-xs.icon { padding-inline: 0; width: var(--space-7); }
@media (pointer: coarse) { .btn-xs { min-height: var(--space-10); } .btn-xs.icon { width: var(--space-10); } }
.seg { display: inline-flex; }
.seg .btn-xs + .btn-xs { border-left: 0; }
.text-link { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.text-link:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: var(--space-0-5); }
.status-chip { display: inline-flex; gap: var(--space-1-5); align-items: center; width: fit-content; max-width: 100%; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--veil); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; white-space: nowrap; }
.status-chip[data-tone='complete'] { border-color: var(--primary-border); background: var(--primary-tint); color: var(--primary); }
.status-chip[data-tone='in-flight'] { border-color: var(--in-flight-border); color: var(--in-flight-fill); }
.status-chip[data-tone='quiet'] { color: var(--muted-foreground); border-style: dashed; }
.sq { display: inline-block; width: var(--sq); height: var(--sq); flex: none; border: 1px solid var(--border); }
.sq[data-tone='complete'] { background: var(--primary); border-color: var(--primary); }
.sq[data-tone='in-flight'] { background: var(--in-flight-fill); border-color: var(--in-flight-fill); }
.sq[data-tone='quiet'] { background: transparent; border: 1px dashed var(--muted-foreground); }
.sq[data-tone='neutral'] { background: var(--muted); border-color: var(--muted-foreground); }
.source-note { color: var(--muted-foreground); font-size: var(--fs-4); overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); min-width: 0; }
.facts-count { font-weight: var(--fw-semibold); }
.facts-date { color: var(--muted-foreground); }
.status-chip.mono { text-transform: none; letter-spacing: var(--ls-wider); }
/* ---------- the panel list (entries) ---------- */
.list ol { display: grid; }
.entry { position: relative; display: grid; align-items: center; min-width: 0; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: transparent; }
a.entry:hover { background: var(--state-hover); }
.entry-li + .entry-li .entry { border-top-color: var(--border-faint); }
.entry-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--muted-foreground); }
.entry-name { min-width: 0; font-weight: var(--fw-semibold); }
.entry-gist { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground); }
.entry-key { display: flex; align-items: baseline; gap: var(--space-1-5); min-width: 0; font-family: var(--font-mono); }
.entry-key b { font-size: var(--fs-4); font-weight: var(--fw-semibold); }
.entry-key i { font-style: normal; font-size: var(--fs-2); color: var(--muted-foreground); }
.entry-ghost { display: inline-flex; align-items: center; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
[data-ghost='true'] .entry { border-style: dashed; color: var(--muted-foreground); }
[data-ghost='true'] .entry-name { font-weight: var(--fw-medium); }
.entry[aria-current='page'] { border-color: var(--primary-border); background: var(--primary-tint); }
.entry[aria-current='page'] .entry-no { color: var(--primary); }

/* ---------- the panel ---------- */
.panel { display: grid; gap: var(--space-6); min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border); }
.panel-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--primary); }
.panel-head h2 { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.panel-key { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }
/* =============== Variant A: rail + reading column =============== */
.fr .a-grid { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: var(--space-fluid-9); align-items: start; }
.fr .a-rail { position: sticky; top: calc(var(--space-10) + var(--space-4)); display: grid; gap: var(--space-4); min-width: 0; max-height: calc(100vh - var(--space-28)); overflow-y: auto; }
.fr .facts { flex-direction: column; align-items: flex-start; gap: var(--space-2); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); }
.fr .entry { grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); grid-template-areas: 'no name key'; }
.fr .entry-no { grid-area: no; } .fr .entry-name { grid-area: name; } .fr .entry-key { grid-area: key; }
.fr .entry-gist { display: none; }
.fr .entry-key i { display: none; }
.fr [data-ghost='true'] .entry { grid-template-areas: 'no name' '. ghost'; grid-template-columns: auto minmax(0, 1fr); }
.fr .entry-ghost { grid-area: ghost; }
.fr .a-main { display: grid; gap: var(--space-8); min-width: 0; }

@media (max-width: 62rem) {
  .fr .a-grid { grid-template-columns: minmax(0, 1fr); }
  .fr .a-rail { position: static; max-height: none; overflow: visible; }
}

/* ---------- panel atoms shared by the variants (four sizes only: fs-7, fs-4, fs-2 and the h1) ---------- */
.lifted, .plain { display: grid; gap: var(--space-6); min-width: 0; }
.lifted > .grp:first-child > .grp-h { padding-top: 0; border-top: 0; }
.grp { display: grid; gap: var(--space-3); min-width: 0; align-content: start; }
.grp-h { padding-top: var(--space-3); border-top: 1px solid var(--border); display: flex; align-items: baseline; gap: var(--space-2); }
.grp-h .n { color: var(--foreground); }
.prose { max-width: 72ch; line-height: var(--lh-normal); overflow-wrap: anywhere; }
code { overflow-wrap: anywhere; }
.prose code, .leads code, .steps code, .ledger code, .swap code, .lookup code, .bul code, .t-note code, .pick code, .ptable code { padding: 0 var(--space-0-5); background: var(--muted); }
.lede { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); max-width: 46ch; overflow-wrap: anywhere; }
.lede code { font-size: inherit; background: none; padding: 0; }
.leads { display: grid; gap: var(--space-2-5); max-width: 78ch; }
.leads dt { font-weight: var(--fw-semibold); }
.leads dd { color: var(--muted-foreground); overflow-wrap: anywhere; }
.steps { display: grid; gap: var(--space-1-5); max-width: 78ch; padding-left: var(--space-5); list-style: decimal; }
.steps li { overflow-wrap: anywhere; }
.steps ul { margin-top: var(--space-1); padding-left: var(--space-4); color: var(--muted-foreground); list-style: square; }
.bul { display: grid; gap: var(--space-1-5); max-width: 78ch; }
.bul > li { display: grid; grid-template-columns: var(--space-2-5) minmax(0, 1fr); gap: var(--space-2); align-items: baseline; overflow-wrap: anywhere; }
.bul > li::before { content: ''; width: var(--space-1-5); height: var(--space-1-5); background: var(--muted-foreground); transform: translateY(-0.1em); justify-self: center; }
.bul .f { color: var(--muted-foreground); font-weight: var(--fw-semibold); }
.bul ul { grid-column: 2; margin-top: var(--space-1); color: var(--muted-foreground); display: grid; gap: var(--space-1); }
.sub-h { font-weight: var(--fw-semibold); }
.plain-sec { display: grid; gap: var(--space-3); min-width: 0; align-content: start; }
.plain-sec .g-label { font-weight: var(--fw-semibold); }
.plain-sec .g { display: grid; gap: var(--space-1-5); min-width: 0; }
.ptable { width: 100%; border-collapse: collapse; }
.ptable th { text-align: left; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; padding: var(--space-1-5) var(--space-3) var(--space-1-5) 0; border-bottom: 1px solid var(--border); }
.ptable td { vertical-align: top; padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--border-faint); overflow-wrap: anywhere; }
.tbl-scroll { overflow-x: auto; }
pre.plain-pre { margin: 0; padding: var(--space-3); border: 1px solid var(--border); background: var(--muted); font-family: var(--font-mono); font-size: var(--fs-2); line-height: var(--lh-snug); overflow-x: auto; }

/* the component / entry ledger */
.ledger { display: grid; }
.ledger > li { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-0-5) var(--space-4); padding: var(--space-2) 0; border-bottom: 1px solid var(--border-faint); }
.ledger .l-name { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.ledger .l-body { color: var(--muted-foreground); overflow-wrap: anywhere; }
.ledger .l-file { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); overflow-wrap: anywhere; }
@media (min-width: 42rem) { .ledger > li { grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) minmax(0, 13rem); align-items: baseline; } }
.more-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; color: var(--muted-foreground); }

/* swaps: the mistake struck through, the fix beside it, the rest on open */
.swaps { display: grid; }
.swap { border-bottom: 1px solid var(--border-faint); }
.swap > summary { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-1); padding: var(--space-3) 0; cursor: pointer; list-style: none; }
.swap > summary::-webkit-details-marker { display: none; }
.swap > summary:hover { background: var(--state-hover); }
.swap s { color: var(--muted-foreground); overflow-wrap: anywhere; }
.swap .do { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.swap .arr { display: none; color: var(--muted-foreground); }
@media (min-width: 42rem) {
  .swap > summary { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.25fr); align-items: baseline; gap: var(--space-4); }
  .swap .arr { display: block; }
}
.swap-more { display: grid; gap: var(--space-2); padding: 0 0 var(--space-4); max-width: 78ch; }
.swap-more dt { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; color: var(--muted-foreground); }
.swap-more dd { overflow-wrap: anywhere; }

/* the figure frame (shipped FigureFrame: title, chips, body that scrolls inside the frame) */
.figure-frame { border: 1px solid var(--border); min-width: 0; display: grid; }
.ff-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); background: var(--veil); }
.ff-title { margin-right: auto; font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.ff-bar button.status-chip { cursor: pointer; }
.ff-bar button.status-chip[aria-pressed='true'] { background: var(--muted); }
.ff-body { overflow: auto; padding: var(--space-4); min-width: 0; max-width: 100%; }
.ff-note { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin: 0 0 var(--space-3); color: var(--muted-foreground); }
.ff-cap { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); color: var(--muted-foreground); }
.lift { position: relative; width: max-content; font-family: var(--font-mono); font-size: var(--fs-2); line-height: 1.5; }
.lift-card { position: absolute; left: calc((var(--c) + 0.5) * 1ch); top: calc((var(--r) + 0.5) * 1.5em); width: calc(var(--w) * 1ch); height: calc(var(--h) * 1.5em); border: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 75%, transparent); }
.lift-card[data-hot='true'] { border-color: var(--primary); background: var(--primary-tint); box-shadow: 0 0 0 1px var(--primary); }
.lift pre { position: relative; margin: 0; font: inherit; white-space: pre; color: var(--foreground); }
.plain-text { margin: 0; width: max-content; font-family: var(--font-mono); font-size: var(--fs-2); line-height: 1.5; white-space: pre; }

/* the clean tree (shipped CleanTree: folder chains collapse, folders fold, notes in a second column) */
.tree { display: grid; grid-template-columns: max-content max-content; justify-content: start; align-items: center; width: max-content; }
.tree > li { display: contents; }
.t-name { position: relative; display: flex; align-items: center; gap: var(--space-2); min-height: var(--space-6); padding-left: calc(var(--d) * var(--space-6)); font-family: var(--font-mono); white-space: nowrap; text-align: left; }
.t-name::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--d) * var(--space-6)); background: repeating-linear-gradient(to right, var(--border-faint) 0 1px, transparent 1px var(--space-6)); pointer-events: none; }
.t-name .nm { font-size: var(--fs-4); }
.t-name[data-folder] .nm { font-weight: var(--fw-semibold); }
.t-name svg { color: var(--muted-foreground); }
.t-name[data-folder] svg { color: var(--primary); }
.t-note { min-height: var(--space-6); display: flex; align-items: center; padding-left: var(--space-5); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); white-space: nowrap; }
button.t-name:hover .nm { text-decoration: underline; text-underline-offset: var(--space-0-5); }
.t-name[data-hot='true'] .nm, .t-name[data-sel='true'] .nm { background: var(--primary-tint); outline: 1px solid var(--primary-border); outline-offset: 2px; }
.counts-line { font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }

/* the lookup: Where to add new code */
.lookup { display: grid; }

/* ---------- round 2: visual-first atoms (tokens, opacity steps and hatch only; no colour of its own) ---------- */

.bd { display: inline-grid; place-items: center; min-width: var(--space-4-5, 1.125rem); height: 1.125rem; padding: 0 var(--space-1); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); line-height: 1; }

.m-st[data-ix='true'] .m-dot { outline: 2px solid var(--muted-foreground); outline-offset: 2px; }

const DATA = {"labelore":{"arch":{"preamble":[{"t":"p","text":"# Architecture"},{"t":"p","text":"**Analysis Date:** 2026-11-04"}],"sections":[{"h":"System Overview","blocks":[{"t":"fence","lang":"text","text":"┌──────────────────────────────────────────────────────────────────────────┐\n│  Browser SPA (React 19 + react-router + TanStack Query)                  │\n│  `src/web/main.tsx` → `src/web/app-router.tsx` → lazy route pages        │\n└───────────────┬──────────────────────────────────────────────────────────┘\n                │ fetch /api/projects[/:slug]/…  (apiFetch in `src/web/api.ts`)\n                ▼\n┌──────────────────────────────────────────────────────────────────────────┐\n│  HTTP server (Hono on @hono/node-server)                                 │\n│  `src/server/index.ts` (startServer)  →  `src/server/registry-api.ts`     │\n│  request guard `src/server/request-guard.ts`  (Host + JSON content type) │\n│  Dev: Vite middleware mounted for non-API URLs; Prod: serveStatic ./dist │\n└───────┬─────────────────────────────┬────────────────────────────────────┘\n        │ /api/projects…              │ /api/projects/:slug/*\n        ▼                             ▼\n┌──────────────────────────┐   ┌──────────────────────────────────────────┐\n│ ProjectRegistry          │   │ Per-project read API                     │\n│ `project-registry.ts`    │──▶│ `src/server/project-api.ts`              │\n│ settings + slug + scan   │   │ resolves ProjectRuntime per request      │\n└──────────┬───────────────┘   └───────────────┬──────────────────────────┘\n           │ one ProjectRuntime per slug       │ reads DerivedViews\n           ▼                                   ▼\n┌──────────────────────────────────────────────────────────────────────────┐\n│  ProjectRuntime `src/server/project-runtime.ts`                          │\n│  DerivedViews: routeTable · presentation · artifactIndex ·               │\n│  referenceRegistry · searchIndexState  (swapped as one bundle)           │\n└───────────────┬──────────────────────────────────────────────────────────┘\n                │ SnapshotSource.getSnapshot()/refresh()\n                ▼\n┌──────────────────────────────────────────────────────────────────────────┐\n│  Parsing core `src/planning-repo/` (PlanningRepository in snapshot.ts)   │\n│  discover → parseWithRegistry (HANDLERS) → assembleDomainModel          │\n└───────────────┬──────────────────────────────────────────────────────────┘\n                │ PlanningFilesystem port (`src/planning-fs/types.ts`)\n                ▼\n┌──────────────────────────────────────────────────────────────────────────┐\n│  Filesystem adapter `src/planning-fs/local-fs.ts` (only node:fs user)    │\n│  or ssh mirror: `src/server/remote-source.ts` copies .planning to tmp    │\n└──────────────────────────────────────────────────────────────────────────┘"}]},{"h":"Component Responsibilities","blocks":[{"t":"table","head":["Component","Responsibility","File"],"rows":[["CLI / server entry","Parses argv (`--port`, `--smoke`, positional paths), starts the Hono server, prints startup lines","`src/server/index.ts`"],["Target path resolution","Turns a CLI argument into a local folder or remote target, checks for `.planning/`","`src/cli/target-path.ts`, `src/cli/remote-target.ts`"],["Project registry","Keeps the remembered project list, allocates slugs, builds runtimes lazily, handles add/forget/scan","`src/server/project-registry.ts`"],["Settings store","Persists Labelore's own project list outside any target project (file or memory)","`src/server/settings-store.ts`"],["Registry HTTP app","Mounts the guard, body-size limits, project list routes and `/api/projects/:slug`","`src/server/registry-api.ts`"],["Request guard","Host allow-list and JSON content-type check on `/api/*`","`src/server/request-guard.ts`"],["Project runtime","Owns one project's `DerivedViews`, coalesces refreshes, disposes sources","`src/server/project-runtime.ts`"],["Per-project API","Read-only JSON endpoints (dashboard, roadmap, tree, search, documents, sketches, refresh)","`src/server/project-api.ts`"],["Snapshot source (local / remote)","Builds a `SnapshotSource` for a folder, or mirrors a remote `.planning/` into a temp dir","`src/server/project-registry.ts` (`createSnapshotSource`), `src/server/remote-source.ts`"],["Filesystem port","Interface every layer above depends on; all paths are project-relative","`src/planning-fs/types.ts`"],["Local filesystem adapter","Node-backed, containment-checked reads (`PathEscapeError`)","`src/planning-fs/local-fs.ts`"],["Discovery","Finds artifacts by filename and directory position only","`src/planning-repo/discovery.ts`"],["Handler registry","Ordered list of typed parsers; generic markdown is the final fallback","`src/planning-repo/handlers/index.ts`"],["Assembly","Builds the milestone-qualified domain graph (`Project`) and resolves cross-references","`src/planning-repo/assemble.ts`, `src/planning-repo/crossref.ts`"],["Snapshot (load/refresh seam)","Returns a new immutable `ProjectSnapshot`; never throws","`src/planning-repo/snapshot.ts`"],["Domain model","Shared entity types (`Project`, `Phase`, `Plan`, `Artifact`, …) with no parsing imports","`src/domain/model.ts`"],["Presentation builders","Pure functions turning the domain model into view models per page","`src/presentation/*.ts`"],["Route table & URL grammar","One clean address per file, `file/` fallback for collisions, alias redirects","`src/presentation/route-table.ts`, `src/presentation/routes.ts`"],["Rendering","Unified/remark/rehype markdown pipeline, shiki highlighting, ASCII diagram lifting","`src/rendering/markdown.ts` and siblings"],["Search","MiniSearch index built per derived bundle, scheduled off the request path","`src/server/search-index.ts`, `src/presentation/search.ts`"],["Web shell & routing","Root render, router, project layout, route dispatch to pages","`src/web/main.tsx`, `src/web/app-router.tsx`, `src/web/route-dispatch.ts`"],["Client API","`apiFetch`, typed fetchers, error kinds (refused / unreachable / http)","`src/web/api.ts`"],["Pages","Route-level React components (lazy-loaded)","`src/web/pages/*.tsx`"],["Views","Pure view composition (`*.ts`) paired with presentational React (`*-components.tsx`)","`src/web/views/*.ts`, `src/web/views/*-components.tsx`"]]}]},{"h":"Pattern Overview","blocks":[{"t":"p","text":"**Overall:** Layered read-only pipeline with a filesystem port, a pure parse-and-assemble core, derived immutable view bundles per project, and a thin Hono JSON API consumed by a React SPA."},{"t":"label","text":"Key Characteristics"},{"t":"ul","items":[{"text":"Strictly read-only: no write paths exist. `PlanningFilesystem.write?` and `watch?` are declared as optional hooks for future use (`src/planning-fs/types.ts`); `src/server/project-registry.ts` never writes inside a target project (SEC-05).","sub":[]},{"text":"One `PlanningFilesystem` interface is the only seam between disk and the rest of the code. `src/planning-fs/local-fs.ts` is the only file that imports `node:fs` (the boundary is also enforced by grep in its header comment). `src/server/remote-source.ts` mirrors remote `.planning/` into a local temp directory and then reuses the same local adapter.","sub":[]},{"text":"Derived views are replaced atomically: `ProjectRuntime.derived` is assigned once per refresh, built from a single snapshot (`src/server/project-runtime.ts`, D-05).","sub":[]},{"text":"Multi-project from the start: every request resolves its own `ProjectRuntime` by slug; there is no server-wide \"active project\" (`src/server/project-api.ts`, D-08).","sub":[]},{"text":"Parsing is driven by filename and directory position, never by frontmatter presence (DATA-02, `src/planning-repo/discovery.ts`), so unknown GSD artifacts fall through to `GenericMarkdownHandler` and degrade rather than break.","sub":[]},{"text":"Failures are values, not exceptions: `PlanningRepository.refresh()` resolves with a `LoadStatus` (D-12); `parseWithRegistry` converts handler throws into warnings (`src/planning-repo/registry.ts`).","sub":[]}]}]},{"h":"Layers","blocks":[{"t":"label","text":"Filesystem port and adapters (Layer A)"},{"t":"ul","items":[{"text":"Purpose: Read files under a project root, enforce containment, never write.","sub":[]},{"text":"Location: `src/planning-fs/`","sub":[]},{"text":"Contains: `types.ts` (interface, `PathEscapeError`), `local-fs.ts` (Node adapter, temp-dir helpers), `in-memory-fs.ts` (test double).","sub":[]},{"text":"Depends on: Node built-ins (`local-fs.ts` only).","sub":[]},{"text":"Used by: `src/planning-repo/*`, `src/server/project-registry.ts`, `src/server/remote-source.ts`, `src/server/sketch-files.ts`.","sub":[]}]},{"t":"label","text":"Domain model"},{"t":"ul","items":[{"text":"Purpose: Shared vocabulary of entities and identities.","sub":[]},{"text":"Location: `src/domain/model.ts`","sub":[]},{"text":"Contains: `Project`, `Milestone`, `Phase`, `Plan`, `Artifact`, `Requirement`, `QuickTask`, `PhaseIdentity`, `ArtifactLocation`. Status fields are open strings.","sub":[]},{"text":"Depends on: nothing (its header states zero imports from `planning-fs/` or `planning-repo/`).","sub":[]},{"text":"Used by: nearly every layer above.","sub":[]}]},{"t":"label","text":"Parsing core (`planning-repo`)"},{"t":"ul","items":[{"text":"Purpose: Turn a `.planning/` tree into a `ProjectSnapshot`.","sub":[]},{"text":"Location: `src/planning-repo/`","sub":[]},{"text":"Contains: `snapshot.ts` (`PlanningRepository`), `discovery.ts`, `registry.ts` (`parseWithRegistry`), `handlers/` (54 files; one handler per artifact family), `assemble.ts`, `crossref.ts`, `mentions.ts`, `warnings.ts`, `theme-tokens.ts`, `naming.ts`, `folders.ts`, `file-class.ts`.","sub":[]},{"text":"Depends on: `planning-fs/types.ts`, `domain/model.ts`.","sub":[]},{"text":"Used by: `src/server/*`, `src/presentation/*` (via `ProjectSnapshot` and `Project` types).","sub":[]}]},{"t":"label","text":"Presentation (view-model builders, server-side, pure)"},{"t":"ul","items":[{"text":"Purpose: Build JSON-ready view models and the URL grammar for every page.","sub":[]},{"text":"Location: `src/presentation/`","sub":[]},{"text":"Contains: `route-table.ts` (one address per file), `routes.ts` (`parseRoutePath`, `buildUrl`), `dashboard.ts`, `roadmap.ts`, `traceability.ts`, `search.ts`, `tree.ts`, `drawer.ts`, `reserved.ts`, `legacy-routes.ts`, `*-context.ts` and `*-page` builders, `references.ts`.","sub":[]},{"text":"Depends on: `planning-repo` types and naming helpers; some modules import types and helpers from `src/server/project-presentation.ts` and `src/server/dashboard-ledger.ts`, so this layer is not fully isolated from `server/`.","sub":[]},{"text":"Used by: `src/server/project-runtime.ts` (`buildRouteTable`, `toProjectPresentation`), `src/server/project-api.ts`, and the web route dispatcher (`src/web/route-dispatch.ts`).","sub":[]}]},{"t":"label","text":"Rendering (server-side markdown)"},{"t":"ul","items":[{"text":"Purpose: Convert artifact markdown to HTML once and cache by consumer.","sub":[]},{"text":"Location: `src/rendering/`","sub":[]},{"text":"Contains: `markdown.ts` (`createArtifactRenderer`: unified → remark-parse → remark-gfm → remark-rehype → rehype-raw → rehype-sanitize → rehype-slug → shiki/linkify), `linkify.ts` (`rehypeResolvedReferences`), `ascii-lift.ts`, `ascii-tree.ts`, `ascii-graph.ts`, `lane-layout.ts`, `build-order-layout.ts`, `plan-segments.ts`, `figure-detect.ts`, `slug.ts`.","sub":[]},{"text":"Depends on: unified ecosystem, `hast-util-sanitize`, shiki, its own `slug.ts`/`plan-segments.ts`, and type-only `ReferenceRegistry` from `src/presentation/references.ts`.","sub":[]},{"text":"Used by: `src/server/project-api.ts` (artifact renderer instance created per API factory).","sub":[]}]},{"t":"label","text":"Server (project and registry)"},{"t":"ul","items":[{"text":"Purpose: HTTP, project lifecycle, caching of per-project state, search state, commit times and file dates.","sub":[]},{"text":"Location: `src/server/`","sub":[]},{"text":"Contains: `index.ts` (entry), `registry-api.ts`, `project-api.ts`, `project-registry.ts`, `project-runtime.ts`, `project-presentation.ts`, `search-index.ts`, `commit-times.ts` (git history reads), `file-dates.ts`, `file-bytes.ts`, `sketch-files.ts`, `artifact-index.ts`, `dashboard-ledger.ts`, `folder-scan.ts`, `request-guard.ts`, `settings-store.ts`, `settings-model.ts`, `remote-source.ts`, `project-title.ts`, `document-sources.ts`.","sub":[]},{"text":"Depends on: all layers below plus `hono`, `@hono/node-server`, `vite` (dev only; dynamically imported in `src/server/index.ts`).","sub":[]},{"text":"Used by: the CLI entry and the browser.","sub":[]}]},{"t":"label","text":"Web client"},{"t":"ul","items":[{"text":"Purpose: Render every page from the JSON API, with client routing and cache.","sub":[]},{"text":"Location: `src/web/`","sub":[]},{"text":"Contains: `main.tsx` (root render), `app-router.tsx` (`createBrowserRouter`, lazy page routes, `ProjectRoute`), `route-dispatch.ts` (pure address → outcome), `api.ts`, `query-keys.ts` (`projectKey`, `projectsKey`), `components/` (shell, sidebar, switcher, add-project dialog, `ui/` primitives), `pages/` (37 route pages), `views/` (59 files: pure composers plus `-components.tsx`), `styles/globals.css`.","sub":[]},{"text":"Depends on: `src/presentation/*` and `src/server/project-presentation.ts` as **type-only** imports (e.g. `src/web/app-router.tsx`), plus `react`, `react-router`, `@tanstack/react-query`, `mermaid` (dynamic).","sub":[]},{"text":"Used by: the browser via `index.html` → `src/web/main.tsx`.","sub":[]}]}]},{"h":"Data Flow","blocks":[{"t":"h3","text":"Primary Request Path (page load of a project)"},{"t":"ol","items":[{"text":"Browser requests `/<slug>/…`; `src/web/app-router.tsx` matches `/:project/*` and renders `ProjectRoute` → `ProjectLayout` (`src/web/pages/project-layout.tsx`).","sub":[]},{"text":"`fetchPresentation(slug)` calls `GET /api/projects/:slug/presentation` through `apiFetch` (`src/web/api.ts`).","sub":[]},{"text":"`createRegistryApp` applies `createRequestGuard` to `/api/*` (`src/server/registry-api.ts`, `src/server/request-guard.ts`), then `app.route('/api/projects/:slug', projectApi)`.","sub":[]},{"text":"`createProjectApi`'s first middleware resolves the `ProjectRuntime` for the slug via `ProjectRegistry` (`src/server/project-registry.ts`), which lazily builds it on first use. The runtime's in-flight count is held for the request (Pitfall 9 comment in `project-api.ts`).","sub":[]},{"text":"The `/presentation` handler returns `runtime.derived.presentation` (`src/server/project-api.ts`, around line 205).","sub":[]},{"text":"The client runs `resolveProjectRoute` (`src/web/route-dispatch.ts`) against the payload, then mounts the page lazily.","sub":[]}]},{"t":"h3","text":"Load / Refresh Path (server side)"},{"t":"ol","items":[{"text":"`ProjectRegistry` builds a `SnapshotSource` via `createSnapshotSource` (`src/server/project-registry.ts`): a `LocalFsPlanningFilesystem` for a folder, or a mirror from `src/server/remote-source.ts` for `sftp://`, `ssh://`, or scp-style targets.","sub":[]},{"text":"`new PlanningRepository(fs, rootPath).refresh()` (`src/planning-repo/snapshot.ts`):","sub":["`checkTargetIsGsdProject()` checks `.planning/` exists; otherwise returns a failed `LoadStatus` with `project: null`.","`discover(fs)` walks `.planning/` and returns `refs` plus `exclusions` (`src/planning-repo/discovery.ts`).","`parseWithRegistry` per ref (`src/planning-repo/registry.ts`) picks the first `HANDLERS` entry whose `match(ref)` is true, falling back to `GenericMarkdownHandler`. Only `fileClass === 'text'` is read.","`withUiSpecTheme` attaches project theme tokens to UI-spec artifacts (`src/planning-repo/theme-tokens.ts`).","`assembleDomainModel` (`src/planning-repo/assemble.ts`) groups by milestone-qualified phase identity, builds plans and summaries, then runs `resolveCrossReferences` (`src/planning-repo/crossref.ts`).","`scanMentions` sets `project.mentions` (`src/planning-repo/mentions.ts`)."]},{"text":"`ProjectRuntime.refresh()` (`src/server/project-runtime.ts`) coalesces concurrent calls, rejects non-`ok` load status without touching `derived`, then swaps `derived` in one assignment via `buildDerivedViews` (route table → presentation → artifact index → reference registry → search state).","sub":[]},{"text":"The search index is built asynchronously off this path by `createSearchIndexState().buildFrom` (`src/server/search-index.ts`); requests never wait on it.","sub":[]}]},{"t":"h3","text":"Secondary Flow: Sketch and image files"},{"t":"ol","items":[{"text":"Client requests a file-backed route; project API mounts `createSketchFileMiddleware` and `createFileBytesHandler` (`src/server/sketch-files.ts`, `src/server/file-bytes.ts`).","sub":[]},{"text":"Handlers read through `runtime.planningFilesystem()` → `readBytesWithin`, which enforces containment (`src/planning-fs/local-fs.ts`). Sources without a filesystem answer 404.","sub":[]}]},{"t":"h3","text":"Add-project flow"},{"t":"ol","items":[{"text":"`POST /api/projects` or `POST /api/projects/scan` (`src/server/registry-api.ts`) → `ProjectRegistry.register` / `scanForProjects` (`src/server/folder-scan.ts`).","sub":[]},{"text":"Registry records the target through `SettingsStore.mutate`, which re-reads the settings file first (`src/server/settings-store.ts`), so two Labelore instances do not mint the same slug.","sub":[]}]},{"t":"label","text":"State Management"},{"t":"ul","items":[{"text":"Server: per-project state lives only in `ProjectRuntime` instances keyed by slug inside `ProjectRegistry`; the list of remembered projects lives in `settings.json` (`defaultSettingsDir()`) or memory for smoke runs and tests.","sub":[]},{"text":"Client: server state is cached through TanStack Query with keys from `src/web/query-keys.ts`; UI state uses React built-ins. Nav state lives in `src/web/nav.tsx` and `src/presentation/project-map-state.ts`.","sub":[]}]}]},{"h":"Key Abstractions","blocks":[{"t":"label","text":"`PlanningFilesystem`"},{"t":"ul","items":[{"text":"Purpose: Read-only, project-relative file access with containment.","sub":[]},{"text":"Examples: `src/planning-fs/types.ts`, `src/planning-fs/local-fs.ts`, `src/planning-fs/in-memory-fs.ts`","sub":[]},{"text":"Pattern: Port/adapter. Optional members (`watch?`, `write?`, `readBytesWithin?`, `readHead?`) reserve future capabilities without signature changes.","sub":[]}]},{"t":"label","text":"`ArtifactHandler`"},{"t":"ul","items":[{"text":"Purpose: Typed parser for one GSD artifact family.","sub":[]},{"text":"Examples: `src/planning-repo/handlers/plan.ts`, `src/planning-repo/handlers/roadmap.ts`, `src/planning-repo/handlers/generic.ts`","sub":[]},{"text":"Pattern: Registry array (`HANDLERS` in `src/planning-repo/handlers/index.ts`). First match wins; `GenericMarkdownHandler` must remain last (see the load-bearing comment in its file).","sub":[]}]},{"t":"label","text":"`SnapshotSource` and `ProjectRuntime`"},{"t":"ul","items":[{"text":"Purpose: Uniform source of a project's snapshot plus the derived view bundle served from it.","sub":[]},{"text":"Examples: `src/server/project-runtime.ts`, `src/server/project-registry.ts` (`failedSource`, `createSnapshotSource`)","sub":[]},{"text":"Pattern: Runtime holds `derived: DerivedViews`; replacement is whole-bundle (D-05).","sub":[]}]},{"t":"label","text":"`RouteTable` and address grammar"},{"t":"ul","items":[{"text":"Purpose: Guarantee each file exactly one readable URL.","sub":[]},{"text":"Examples: `src/presentation/route-table.ts`, `src/presentation/routes.ts`, `src/web/route-dispatch.ts`","sub":[]},{"text":"Pattern: Clean address per file where unique; collisions get `file/` addresses; aliases redirect (e.g. live-milestone roadmap). Client resolution is pure: `resolveProjectRoute(rest, search, presentation)`.","sub":[]}]},{"t":"label","text":"View composition (web)"},{"t":"ul","items":[{"text":"Purpose: Separate testable layout logic from React rendering.","sub":[]},{"text":"Examples: `src/web/views/manifest.ts` (`composeView`), `src/web/views/layout.ts`, `src/web/views/review-ledger.ts` with `src/web/views/review-ledger-components.tsx`","sub":[]},{"text":"Pattern: Each view has a pure `.ts` composer and a `-components.tsx` presenter. `.ts` files use type-only imports to avoid runtime cycles (stated in `manifest.ts`).","sub":[]}]},{"t":"label","text":"`ProjectRegistry` and `SettingsStore`"},{"t":"ul","items":[{"text":"Purpose: Multi-project list, slug allocation, identity de-duplication, scan.","sub":[]},{"text":"Examples: `src/server/project-registry.ts`, `src/server/settings-store.ts`, `src/server/settings-model.ts`","sub":[]},{"text":"Pattern: Lazy runtime construction with coalesced loads; list is memory-only until a runtime is needed.","sub":[]}]}]},{"h":"Entry Points","blocks":[{"t":"label","text":"Server / CLI"},{"t":"ul","items":[{"text":"Location: `src/server/index.ts` (`package.json` scripts `dev`, `start`, `smoke`; `snapshot` uses `src/cli/snapshot.ts`)","sub":[]},{"text":"Triggers: `node src/server/index.ts [paths…] [--port N]`; `npm start` runs with `NODE_ENV=production` against `./dist`.","sub":[]},{"text":"Responsibilities: parse argv, register CLI targets, create the guarded registry app, start listening on `127.0.0.1` (auto-port from 4173 unless `--port` is given), attach Vite middleware in dev.","sub":[]}]},{"t":"label","text":"Snapshot CLI"},{"t":"ul","items":[{"text":"Location: `src/cli/snapshot.ts`","sub":[]},{"text":"Triggers: `npm run snapshot`","sub":[]},{"text":"Responsibilities: one-off read of a target to a snapshot.","sub":[]}]},{"t":"label","text":"Browser"},{"t":"ul","items":[{"text":"Location: `index.html` → `src/web/main.tsx` → `createRoot(...).render(...)` with `appRouter` from `src/web/app-router.tsx`.","sub":[]},{"text":"Triggers: navigation to any URL the server does not own (`isServerOwnedUrl` in `src/presentation/reserved.ts` decides the split).","sub":[]},{"text":"Responsibilities: shell rendering, lazy page loading (`trackRouteChunk`), project switching.","sub":[]}]},{"t":"label","text":"Tests / e2e"},{"t":"ul","items":[{"text":"Location: `test/**/*.test.ts` (vitest, `vitest.config.ts`), `test/e2e/*.spec.ts` (Playwright, `playwright.config.ts`), `test/helpers/` for shared fixtures.","sub":[]}]}]},{"h":"Architectural Constraints","blocks":[{"t":"ul","items":[{"text":"**Threading:** Single Node event loop. Heavy work is async (`Promise.all` over handler parses in `src/planning-repo/snapshot.ts`); the MiniSearch build is scheduled off the request path (`src/server/search-index.ts`). The ssh mirror spawns `ssh`/`tar` through `node:child_process` in `src/server/remote-source.ts`; commit times are read from the target's git history via `src/server/commit-times.ts`.","sub":[]},{"text":"**Global state:** Module-level `HANDLERS` array (`src/planning-repo/handlers/index.ts`), module-level `LOCATION_ORDER` (`src/planning-repo/discovery.ts`), and the `searchIndex` export imported by `src/server/project-api.ts` from `src/server/search-index.ts`. Per-project state is otherwise held in `ProjectRuntime` instances, not in module scope.","sub":[]},{"text":"**Circular imports:** The web view layer avoids runtime cycles by using type-only imports (`src/web/views/manifest.ts` header comment). The presentation layer imports types from `src/server/project-presentation.ts`, which in turn imports from `src/planning-repo/*`; no runtime cycle was verified beyond what those comments state.","sub":[]},{"text":"**Dev/prod split:** `src/server/index.ts` dynamically imports `vite` only in dev mode; production serves `./dist` through `serveStatic`. The browser bundle is split per route (`vite.config.ts`, `chunkSizeWarningLimit: 680`) so mermaid loads only when needed.","sub":[]},{"text":"**Layering boundary:** `src/domain/model.ts` has no parsing imports. `src/planning-fs/local-fs.ts` is the only file under `src/` that imports `node:fs` for reads; `discovery.ts` mentions `node:fs` only in a comment. `src/web/` must not import Node modules (none found by grep).","sub":[]}]}]},{"h":"Anti-Patterns","blocks":[{"t":"h3","text":"Reading a project through a server-wide \"active\" pointer"},{"t":"p","text":"**What happens:** Shared state keyed to \"the current project\" would let one request observe another project. **Why it's wrong:** The registry supports several projects at once (D-08, PLAT-02). A global pointer would race across requests. **Do this instead:** Resolve the runtime per request from the slug (`createProjectApi`'s `resolve` argument in `src/server/project-api.ts`) and read only `runtime.derived`."},{"t":"h3","text":"Mutating a derived bundle field by field"},{"t":"p","text":"**What happens:** Updating only `presentation` or `artifactIndex` after a refresh. **Why it's wrong:** A route table built from one snapshot could resolve against another snapshot's index, so URLs would point at the wrong files (D-05, `src/server/project-runtime.ts`). **Do this instead:** Build a whole new `DerivedViews` with `buildDerivedViews(snapshot)` and assign `this.derived` once."},{"t":"h3","text":"Calling `gray-matter` or handler parsers without a guard"},{"t":"p","text":"**What happens:** A handler that throws escapes the parse. **Why it's wrong:** A single malformed file would fail the whole refresh. **Do this instead:** Let the handler throw; `parseWithRegistry` (`src/planning-repo/registry.ts`) converts it to a warning and an empty artifact. Frontmatter problems are handled in `src/planning-repo/frontmatter.ts`."},{"t":"h3","text":"Importing `node:fs` outside the adapter"},{"t":"p","text":"**What happens:** Code under `src/planning-repo/` or `src/presentation/` reads disk directly. **Why it's wrong:** It bypasses containment checks and breaks the port, which the remote mirror and the test doubles depend on. **Do this instead:** Accept a `PlanningFilesystem` argument. The Node disk and process imports outside the adapter are confined to `src/server/file-dates.ts`, `src/server/settings-store.ts` (settings file) and `src/server/remote-source.ts` (ssh mirror, `node:child_process`); new disk access should follow the same placement."}]},{"h":"Error Handling","blocks":[{"t":"p","text":"**Strategy:** Results and status values over thrown exceptions at the core; HTTP errors as JSON at the edge."},{"t":"label","text":"Patterns"},{"t":"ul","items":[{"text":"`PlanningRepository.refresh()` resolves a `LoadStatus` (`ok`, `not-a-gsd-project`, `permission-denied`, …) and never throws (`src/planning-repo/snapshot.ts`).","sub":[]},{"text":"`ProjectRuntime.refresh()` returns a `RefreshOutcome` (`unsupported` | `refreshed` | `failed`) and keeps the previous bundle on failure (`src/server/project-runtime.ts`).","sub":[]},{"text":"Path escapes raise `PathEscapeError` (`src/planning-fs/types.ts`) and are caught as warnings during parsing.","sub":[]},{"text":"API responds `{ error: 'API route not found' }` with 404 for unknown `/api/*` routes (`src/server/registry-api.ts`); `src/web/api.ts` maps failures to `ApiError` kinds `refused`, `unreachable`, `http`.","sub":[]}]}]},{"h":"Cross-Cutting Concerns","blocks":[{"t":"p","text":"**Logging:** `console.log` / `console.warn` in `src/server/index.ts` for startup lines only; no logging framework detected. **Validation:** Path validation in `src/planning-fs/local-fs.ts` and `src/cli/remote-target.ts`; request validation in `src/server/request-guard.ts` (Host allow-list, JSON content type, body limit `GUARD_BODY_LIMIT = 4096`). **Authentication:** None. The server binds to `127.0.0.1` (`HOSTNAME` in `src/server/index.ts`) and relies on the Host guard against DNS rebinding; extra hosts come from `LABELORE_ALLOWED_HOSTS`."}]}]},"struct":{"preamble":[{"t":"p","text":"# Codebase Structure"},{"t":"p","text":"**Analysis Date:** 2026-11-04"}],"sections":[{"h":"Directory Layout","blocks":[{"t":"fence","lang":"","text":"labelore/\n├── src/                      # All application source (TypeScript, one tree for server + web)\n│   ├── cli/                  # Target argument parsing (local path, sftp/ssh/scp remote)\n│   ├── domain/               # Shared entity types (model.ts) — no parsing imports\n│   ├── planning-fs/          # Filesystem port + Node adapter (the only node:fs reader)\n│   ├── planning-repo/        # Discovery, parsing, handlers, assembly, snapshot\n│   │   └── handlers/         # One parser per GSD artifact family (54 files)\n│   ├── presentation/         # Pure view-model builders and URL grammar (server-side)\n│   ├── rendering/            # Markdown → HTML pipeline, diagram lifting/layout\n│   ├── server/               # Hono app, project registry/runtime, search, settings\n│   └── web/                  # React SPA\n│       ├── components/       # Shell, switcher, dialogs, shared widgets\n│       │   └── ui/           # Base primitives (button, dialog, toast)\n│       ├── pages/            # Route-level components (lazy-loaded)\n│       ├── views/            # Pure view composers (*.ts) + presenters (*-components.tsx)\n│       └── styles/           # globals.css (oklch tokens, Tailwind v4 @theme)\n├── test/                     # Vitest unit/integration tests, goldens, e2e specs\n│   ├── __golden__/           # Golden JSON snapshots (dense, sparse-empty, sparse-started)\n│   ├── e2e/                  # Playwright specs and shared e2e helpers\n│   ├── fixtures/             # Fixture .planning trees used by tests (dashboard, debug, lendshed…)\n│   ├── helpers/              # Shared test setup, corpora builders, vitest-gate.mjs\n│   └── web/                  # Web-side tests (class-vocabulary, css-source-order, …)\n├── fixtures/                 # Top-level fixture projects (e.g. dense/.planning) and README\n├── docs/                     # design-language.md (visual and naming conventions)\n├── public/                   # favicon.svg, self-hosted woff2 fonts\n├── .claude/                  # Claude Code settings, project CLAUDE.md, cloud helper scripts\n├── .planning/                # This project's own GSD planning state (not read by the app at runtime)\n├── index.html                # Vite entry HTML (loads /src/web/main.tsx)\n├── vite.config.ts            # Vite + React + Tailwind plugins, '@' → src/web alias\n├── vitest.config.ts          # Test include: test/**/*.test.ts\n├── playwright.config.ts      # e2e configuration\n├── tsconfig.json             # Base TS config\n├── tsconfig.server.json      # Server typecheck (excludes src/web)\n├── tsconfig.web.json         # Web typecheck\n├── eslint.config.js          # Flat ESLint config\n├── components.json           # shadcn configuration (base-sera style)\n└── package.json              # Scripts: dev, build, start, smoke, test, test:e2e, typecheck, lint"}]},{"h":"Directory Purposes","blocks":[{"t":"label","text":"`src/cli/` (3 files)"},{"t":"ul","items":[{"text":"Purpose: Turn raw CLI arguments into a local folder or remote target, before any filesystem read.","sub":[]},{"text":"Contains: `target-path.ts` (folder check, `LOAD_STATUS_MESSAGES`), `remote-target.ts` (pure parsing of `sftp://`, `ssh://`, `[user@]host:/path`), `snapshot.ts` (one-off snapshot CLI).","sub":[]},{"text":"Key files: `src/cli/target-path.ts`, `src/cli/remote-target.ts`","sub":[]}]},{"t":"label","text":"`src/domain/` (1 file)"},{"t":"ul","items":[{"text":"Purpose: Shared vocabulary; safe for any layer to import.","sub":[]},{"text":"Key files: `src/domain/model.ts`","sub":[]}]},{"t":"label","text":"`src/planning-fs/` (3 files)"},{"t":"ul","items":[{"text":"Purpose: Read-only filesystem port.","sub":[]},{"text":"Contains: `types.ts` (`PlanningFilesystem`, `PathEscapeError`, `DirEntry`, `FileRead`), `local-fs.ts` (Node adapter, `canonicalizePath`, temp-dir helpers), `in-memory-fs.ts` (test double).","sub":[]},{"text":"Key files: `src/planning-fs/types.ts`, `src/planning-fs/local-fs.ts`","sub":[]}]},{"t":"label","text":"`src/planning-repo/` (71 files including handlers)"},{"t":"ul","items":[{"text":"Purpose: Parse a `.planning/` tree into a `ProjectSnapshot`.","sub":[]},{"text":"Contains: `discovery.ts`, `registry.ts`, `assemble.ts`, `crossref.ts`, `snapshot.ts`, `naming.ts`, `folders.ts`, `file-class.ts`, `frontmatter.ts`, `mentions.ts`, `warnings.ts`, `theme-tokens.ts`, `css-color.ts`, `codebase-files.ts`, `secret-mask.ts`, `serialize.ts`, `types.ts`.","sub":[]},{"text":"Key files: `src/planning-repo/snapshot.ts` (entry: `PlanningRepository`), `src/planning-repo/handlers/index.ts` (`HANDLERS`), `src/planning-repo/assemble.ts`","sub":[]}]},{"t":"label","text":"`src/planning-repo/handlers/` (54 files)"},{"t":"ul","items":[{"text":"Purpose: One parser per artifact family. Each exports a handler matching by filename and location.","sub":[]},{"text":"Examples: `plan.ts`, `summary.ts`, `roadmap.ts`, `state.ts`, `requirements.ts`, `project.ts`, `milestones.ts`, `review.ts`, `review-disposition.ts`, `research.ts`, `security.ts`, `uat.ts`, `verification.ts`, `todo.ts`, `note.ts`, `debug.ts`, `learnings.ts`, `windows.ts`, `coverage.ts`, `json-config.ts`, `generic.ts` (fallback — must stay last in `HANDLERS`).","sub":[]},{"text":"Shared helpers: `markdown-sections.ts`, `section-projection.ts`, `frontmatter-only.ts`, `plan-structure.ts`.","sub":[]}]},{"t":"label","text":"`src/presentation/` (37 files)"},{"t":"ul","items":[{"text":"Purpose: Build view models and addresses; pure functions of a `Project` or `ProjectPresentation`.","sub":[]},{"text":"Key files: `route-table.ts`, `routes.ts`, `reserved.ts` (server-owned URL check), `dashboard.ts`, `roadmap.ts`, `traceability.ts`, `search.ts`, `tree.ts`, `drawer.ts`, `references.ts`, `legacy-routes.ts`, `root-redirects.ts`, `sketches.ts`, `project-research.ts`, `*-context.ts` (review, todo, note, project).","sub":[]}]},{"t":"label","text":"`src/rendering/` (11 files)"},{"t":"ul","items":[{"text":"Purpose: Server-side markdown rendering and diagram handling.","sub":[]},{"text":"Key files: `markdown.ts` (`createArtifactRenderer`), `linkify.ts`, `ascii-lift.ts`, `ascii-tree.ts`, `ascii-graph.ts`, `lane-layout.ts`, `build-order-layout.ts`, `plan-segments.ts`, `figure-detect.ts`, `slug.ts`.","sub":[]}]},{"t":"label","text":"`src/server/` (20 files)"},{"t":"ul","items":[{"text":"Purpose: HTTP surface, project lifecycle, derived state per project.","sub":[]},{"text":"Key files: `index.ts` (entry and CLI parsing), `registry-api.ts` (`createRegistryApp`), `project-api.ts` (`createProjectApi`), `project-registry.ts` (`ProjectRegistry`), `project-runtime.ts` (`ProjectRuntime`), `request-guard.ts`, `settings-store.ts`, `search-index.ts`, `remote-source.ts`, `folder-scan.ts`, `commit-times.ts`, `file-dates.ts`, `file-bytes.ts`, `sketch-files.ts`, `artifact-index.ts`, `dashboard-ledger.ts`, `document-sources.ts`, `project-presentation.ts`, `project-title.ts`, `settings-model.ts`.","sub":[]}]},{"t":"label","text":"`src/web/` (140 files)"},{"t":"ul","items":[{"text":"Purpose: Browser application.","sub":[]},{"text":"Key files: `main.tsx` (root), `app-router.tsx` (route table and `ProjectRoute`), `route-dispatch.ts` (pure address resolution), `api.ts`, `query-keys.ts`, `nav.tsx`, `project-path.ts`, `opened-ago.ts`.","sub":[]},{"text":"`components/` (35 files): `app-shell.tsx`, `project-switcher.tsx`, `project-add-dialog.tsx`, `artifact-header.tsx`, `sidebar-drawer.tsx`, `theme-toggle.tsx`, `lane-diagram.tsx`, `fenced-figure.tsx`, `route-progress.tsx`, `route-chunk-store.ts`.","sub":[]},{"text":"`components/ui/` (3 files): `button.tsx`, `dialog.tsx`, `toast.tsx` — base-sera primitives on `@base-ui/react`.","sub":[]},{"text":"`pages/` (37 files): one `*-page.tsx` per route family (`dashboard-page.tsx`, `roadmap-page.tsx`, `traceability-page.tsx`, `research-page.tsx`, `sketches-page.tsx`, `search-page.tsx`, `document-route.tsx`, `plan-pair-page.tsx`, `artifact-page.tsx`, `projects-page.tsx`, `project-layout.tsx`, `not-found-page.tsx`), plus pure helpers such as `document-title.ts`, `roadmap-deep-link.ts`, `traceability-rollup.ts`, `strip-markdown.ts`.","sub":[]},{"text":"`views/` (59 files): paired files per view, e.g. `review-ledger.ts` (pure) with `review-ledger-components.tsx` (React); shared `manifest.ts` (`composeView`), `layout.ts`, `blocks.tsx`, `facts.ts`, `inline-markdown.ts`.","sub":[]},{"text":"`styles/globals.css`: oklch tokens and `@theme` mapping.","sub":[]}]},{"t":"label","text":"`test/` (553 files, mostly fixtures)"},{"t":"ul","items":[{"text":"Unit and integration tests are `test/**/*.test.ts` (e.g. `test/discovery.test.ts`, `test/assemble.test.ts`, `test/crossref.test.ts`, `test/context-brief.test.ts`). Web tests live under `test/web/`.","sub":[]},{"text":"e2e: `test/e2e/*.spec.ts` (34 files) with `test/e2e/fixture-server.ts`, `test/e2e/projects-server.ts`, `test/e2e/pages.ts`.","sub":[]},{"text":"Goldens: `test/__golden__/*.json`.","sub":[]},{"text":"Fixtures: `test/fixtures/` (235 files) organised by scenario (`dashboard/ledger`, `dashboard/synthetic`, `lendshed`, `debug`, `learnings`).","sub":[]}]},{"t":"label","text":"`fixtures/` (64 files)"},{"t":"ul","items":[{"text":"Purpose: Top-level sample GSD projects (`fixtures/dense/.planning/…`) and `fixtures/README.md`. Distinct from `test/fixtures/`.","sub":[]}]}]},{"h":"Key File Locations","blocks":[{"t":"label","text":"Entry Points"},{"t":"ul","items":[{"text":"`src/server/index.ts`: server and CLI start (`startServer`, `parseCli`)","sub":[]},{"text":"`src/web/main.tsx`: browser entry, referenced from `index.html`","sub":[]},{"text":"`src/cli/snapshot.ts`: `npm run snapshot`","sub":[]}]},{"t":"label","text":"Configuration"},{"t":"ul","items":[{"text":"`package.json`: scripts and dependency versions (Node `>=22.18.0`)","sub":[]},{"text":"`vite.config.ts`: build alias `@` → `src/web`; `chunkSizeWarningLimit: 680`","sub":[]},{"text":"`tsconfig.server.json` / `tsconfig.web.json`: split typechecks; web excluded from server config","sub":[]},{"text":"`eslint.config.js`, `.prettierrc`, `components.json`","sub":[]},{"text":"`.claude/settings.json`, `.claude/CLAUDE.md`: agent instructions (not app config)","sub":[]}]},{"t":"label","text":"Core Logic"},{"t":"ul","items":[{"text":"`src/planning-repo/snapshot.ts`: load and refresh pipeline","sub":[]},{"text":"`src/planning-repo/handlers/index.ts`: handler dispatch order","sub":[]},{"text":"`src/planning-repo/assemble.ts`: milestone, phase, plan graph","sub":[]},{"text":"`src/server/project-runtime.ts`: per-project derived bundle","sub":[]},{"text":"`src/presentation/route-table.ts`: address ownership","sub":[]},{"text":"`src/web/app-router.tsx`: web route table","sub":[]}]},{"t":"label","text":"Testing"},{"t":"ul","items":[{"text":"`vitest.config.ts`: unit test runner, setup `test/helpers/config-dir-setup.ts`","sub":[]},{"text":"`playwright.config.ts`: e2e runner","sub":[]},{"text":"`test/helpers/`: 23 shared helpers, including `fixture-project.ts`, `from-directory.ts`, `dashboard-sources.ts`","sub":[]}]}]},{"h":"Naming Conventions","blocks":[{"t":"label","text":"Files"},{"t":"ul","items":[{"text":"kebab-case for all TypeScript modules: `project-registry.ts`, `route-table.ts`, `review-ledger-components.tsx`","sub":[]},{"text":"React components in `.tsx`; pure logic in `.ts`. A view's presenter has the `-components.tsx` suffix (`src/web/views/*-components.tsx`).","sub":[]},{"text":"Pages end in `-page.tsx` (`src/web/pages/roadmap-page.tsx`); some pages use `-route` or `-layout` (`document-route.tsx`, `project-layout.tsx`).","sub":[]},{"text":"Test files: `test/<area>.test.ts`; e2e: `test/e2e/<feature>.spec.ts`.","sub":[]},{"text":"Handlers: `src/planning-repo/handlers/<artifact-family>.ts`, exporting `<Name>Handler` (e.g. `PlanHandler`, `UiReviewHandler`).","sub":[]}]},{"t":"label","text":"Directories"},{"t":"ul","items":[{"text":"Lowercase, hyphenated (`planning-repo`, `planning-fs`, `project-research`); no index barrels except `handlers/index.ts`.","sub":[]}]},{"t":"label","text":"Identifiers and constants"},{"t":"ul","items":[{"text":"Functions: camelCase (`buildRouteTable`, `parseWithRegistry`).","sub":[]},{"text":"Module constants: SCREAMING_SNAKE (`HANDLERS`, `LOCATION_ORDER`, `GUARD_BODY_LIMIT`, `SKETCH_FILES_SEGMENT`).","sub":[]},{"text":"Types and interfaces: PascalCase, with `Snapshot`, `Source`, `Outcome`, `Context`, `ViewModel` suffixes used as the codebase's convention.","sub":[]},{"text":"Imports use `.ts` / `.tsx` extensions (`import … from '../domain/model.ts'`).","sub":[]}]},{"t":"p","text":"**Files under `.planning/` in a target project** (what the app reads): `PROJECT.md`, `ROADMAP.md`, `STATE.md`, `REQUIREMENTS.md`, `milestones/`, `phases/`, `quick/`, `research/`, `todos/`, `notes/`, `debug/`, `codebase/`. Naming parsers live in `src/planning-repo/naming.ts`."}]},{"h":"Where to Add New Code","blocks":[{"t":"label","text":"New artifact type (a GSD file the app should understand)"},{"t":"ul","items":[{"text":"Parser: `src/planning-repo/handlers/<name>.ts` exporting a handler with `match(ref)` and `parse(raw, ref)`.","sub":[]},{"text":"Register it in `HANDLERS` in `src/planning-repo/handlers/index.ts`, before `GenericMarkdownHandler`.","sub":[]},{"text":"Domain shape if needed: `src/domain/model.ts`.","sub":[]},{"text":"Tests: `test/<name>.test.ts`; fixture under `test/fixtures/`.","sub":[]}]},{"t":"label","text":"New view model or page data"},{"t":"ul","items":[{"text":"Builder: `src/presentation/<name>.ts` (pure; takes `Project` or `ProjectPresentation`).","sub":[]},{"text":"Endpoint: add `api.get('/<name>', …)` in `src/server/project-api.ts` and read `runtime.derived`.","sub":[]},{"text":"Client fetcher: `src/web/api.ts`; query key via `src/web/query-keys.ts`.","sub":[]}]},{"t":"label","text":"New page"},{"t":"ul","items":[{"text":"Component: `src/web/pages/<name>-page.tsx` (default export not used; named export such as `DashboardPage`).","sub":[]},{"text":"Route: add a lazy import and entry in `src/web/app-router.tsx`, wrapped with `trackRouteChunk`.","sub":[]},{"text":"Address grammar, if new: `src/presentation/routes.ts` and dispatch in `src/web/route-dispatch.ts`.","sub":[]},{"text":"Reserved first segments: `src/presentation/reserved.ts` (`PROJECT_PAGES`, `LEGACY_FIRST_SEGMENTS`).","sub":[]}]},{"t":"label","text":"New view (composed UI section)"},{"t":"ul","items":[{"text":"Pure composer: `src/web/views/<name>.ts`","sub":[]},{"text":"Presenter: `src/web/views/<name>-components.tsx`","sub":[]},{"text":"Register in `src/web/views/manifests.ts` if it participates in the document layout.","sub":[]}]},{"t":"label","text":"New UI component"},{"t":"ul","items":[{"text":"Shared widget: `src/web/components/<name>.tsx`","sub":[]},{"text":"Base primitive from shadcn: `src/web/components/ui/` (set `\"rsc\": false` in `components.json`, per the project design rules).","sub":[]},{"text":"Styles: tokens in `src/web/styles/globals.css`; visual rules in `docs/design-language.md` (enforced by `test/web/class-vocabulary.test.ts`).","sub":[]}]},{"t":"label","text":"New rendering behaviour"},{"t":"ul","items":[{"text":"`src/rendering/markdown.ts` (pipeline order: sanitize before highlight and linkify plugins).","sub":[]}]},{"t":"label","text":"New filesystem capability"},{"t":"ul","items":[{"text":"Extend `src/planning-fs/types.ts` (optional member first), implement in `src/planning-fs/local-fs.ts`, and in-memory double in `src/planning-fs/in-memory-fs.ts`.","sub":[]}]},{"t":"label","text":"New project-level CLI option"},{"t":"ul","items":[{"text":"`parseCli` in `src/server/index.ts`. Unknown flags throw (no `--scan` flag by design, D-16).","sub":[]}]},{"t":"label","text":"Utilities"},{"t":"ul","items":[{"text":"Pure string and URL helpers: `src/presentation/identity-keys.ts`, `src/web/project-path.ts`, `src/web/pages/strip-markdown.ts` (client-side only).","sub":[]},{"text":"Server helpers: `src/server/project-title.ts`, `src/server/file-b :{"arch":{"preamble":[{"t":"p","text":"# Architecture"},{"t":"p","text":"**Analysis Date:** 2026-10-30"}],"sections":[{"h":"System Overview","blocks":[{"t":"fence","lang":"text","text":"┌─────────────────────────────────────────────────────────────┐\n│                       Berth board (browser)                  │\n│                         `board/`                             │\n└────────────────────────────┬────────────────────────────────┘\n                             │ JSON over HTTP\n                             ▼\n┌──────────────────┬──────────────────┬───────────────────────┐\n│   Berth routes   │  Office routes   │    Tide window job    │\n│ `server/berths/` │ `server/office/` │    `server/tides/`    │\n└────────┬─────────┴────────┬─────────┴──────────┬────────────┘\n         │                  │                     │\n         ▼                  ▼                     ▼\n┌─────────────────────────────────────────────────────────────┐\n│                      Slot store module                       │\n│        `server/store/` over the file `data/tidemark.db`      │\n└─────────────────────────────────────────────────────────────┘\n## the three route groups above share one process"}]},{"h":"Component Responsibilities","blocks":[{"t":"table","head":["Component","Responsibility","File"],"rows":[["Berth board","Shows free berths and the owner's own requests","`board/App.tsx`"],["Berth routes","Accept a request, list berths for a date range","`server/berths/routes.ts`"],["Office routes","Confirm, move or refuse a request","`server/office/routes.ts`"],["Tide window job","Turns the tide feed into usable windows per berth","`server/tides/refresh.ts`"],["Slot store","The only module that touches the database file","`server/store/index.ts`"]]}]},{"h":"Pattern Overview","blocks":[{"t":"p","text":"**Overall:** Layered monolith with a thin browser client"},{"t":"label","text":"Key Characteristics"},{"t":"ul","items":[{"text":"One process serves the API and the built board","sub":[]},{"text":"Route groups never call each other; they share the slot store","sub":[]},{"text":"A berth is usable only inside a tide window, and the window is data, not code","sub":[]}]}]},{"h":"API Architecture","blocks":[{"t":"p","text":"**Style:** JSON resources under `/api`, one router per resource group."},{"t":"p","text":"**Versioning:** None. The board and the server ship together."},{"t":"p","text":"**Authentication:** Owners sign in with an emailed code; the office uses a shared staff login."}]},{"h":"Data Flow","blocks":[{"t":"h3","text":"Primary Request Path"},{"t":"ol","items":[{"text":"The owner picks dates on the board (`board/RequestForm.tsx`)","sub":[]},{"text":"The berth route parses the body and checks the tide window (`server/berths/routes.ts`)","sub":[]},{"text":"The slot store writes a pending request (`server/store/index.ts`)","sub":[]},{"text":"The board refetches the berth list and shows the request as pending (`board/useBerths.ts`)","sub":[]}]},{"t":"h3","text":"Tide Refresh"},{"t":"ol","items":[{"text":"The scheduled job fetches the tide feed (`server/tides/refresh.ts`)","sub":[]},{"text":"Each row is parsed and turned into a window per berth depth","sub":[]},{"text":"The slot store replaces the windows for the next fourteen days","sub":[]}]},{"t":"label","text":"State Management"},{"t":"ul","items":[{"text":"Server state lives in the database file; the board keeps only form state","sub":[]}]}]},{"h":"Key Abstractions","blocks":[{"t":"label","text":"Window"},{"t":"ul","items":[{"text":"Purpose: A span of time during which a berth of a given depth has enough water","sub":[]},{"text":"Examples: `server/tides/window.ts`","sub":[]},{"text":"Pattern: Plain value object, rebuilt on every refresh","sub":[]}]}]},{"h":"Entry Points","blocks":[{"t":"label","text":"Server"},{"t":"ul","items":[{"text":"Location: `server/main.ts`","sub":[]},{"text":"Triggers: `npm start`","sub":[]},{"text":"Responsibilities: Reads config, opens the store, mounts routes, starts the refresh job","sub":[]}]},{"t":"label","text":"Board"},{"t":"ul","items":[{"text":"Location: `board/main.tsx`","sub":[]},{"text":"Triggers: Page load","sub":[]},{"text":"Responsibilities: Mounts the app and the query client","sub":[]}]}]},{"h":"Anti-Patterns","blocks":[{"t":"h3","text":"Reading the database from a route"},{"t":"p","text":"**What happens:** The office confirm route opens the database file directly to check a clash. **Why it's wrong:** Two modules now know the table layout, and the clash rule exists twice. **Do this instead:** Ask the slot store for the clash check (`server/store/clash.ts`)."},{"t":"h3","text":"Hard-coded depth in the board"},{"t":"p","text":"**What happens:** The board filters berths by a depth constant copied from the harbour chart. **Why it's wrong:** A dredged berth keeps its old depth on screen until the next release. **Do this instead:** Send the depth from the server with each berth (`server/berths/routes.ts`)."}]},{"h":"Error Handling","blocks":[{"t":"p","text":"**Strategy:** Routes throw typed errors; one handler turns them into JSON with a status code."},{"t":"label","text":"Patterns"},{"t":"ul","items":[{"text":"Parse failures answer 400 with the first zod issue","sub":[]},{"text":"A clash answers 409 and names the berth","sub":[]}]}]}]}}};

// ---------- round 2: the directory tree as a weighted model (shared by 043 and 044) ----------
// Source: the Directory Layout fence in STRUCTURE (indent + trailing "# note"). Weight = the number of entries
// the document lists under a folder (a file or an empty folder counts 1).
function parseTree2(text) {
  const root = { name: '', children: [], folder: true, depth: -1, note: '' };
  const stack = [root];
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    const m = line.match(/^((?:│   |    )*)(?:├── |└── )(.*)$/);
    const depth = m ? m[1].length / 4 + 1 : 0;
    const rest = m ? m[2] : line.trim();
    const hash = rest.search(/\s+#\s/);
    const name = (hash >= 0 ? rest.slice(0, hash) : rest).trim();
    const note = hash >= 0 ? rest.slice(hash).replace(/^\s+#\s+/, '').trim() : '';
    const node = { name, note, folder: name.endsWith('/'), children: [], depth };
    while (stack[stack.length - 1].depth >= depth) stack.pop();
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  return root.children[0];
}
// A folder's drawable children: folders that list entries, empty folders one each, and one "files" group.
function kids2(n) {
  if (n._k) return n._k;
  const out = [];
  n._k = out;
  const files = [];
  n.children.forEach((c) => { if (c.folder) out.push(c); else files.push(c); });
  if (files.length) out.push({ name: `${files.length} file${files.length > 1 ? 's' : ''}`, folder: false, group: true, children: [], files, note: files.map((f) => f.name).join(', ') });
  return out;
}
let GROUP_W = (n) => n;
function weight2(n) {
  if (n.group) return (n.w = GROUP_W(n.files.length));
  const ks = kids2(n);
  if (!ks.length) return (n.w = 1);
  return (n.w = Math.max(1, ks.reduce((s, c) => s + weight2(c), 0)));
}
// Squarified treemap of the children of a folder inside a rectangle. Returns [{node, x, y, w, h}].
function squarify2(items, x, y, w, h) {
  const out = [];
  const list = items.slice().sort((a, b) => b.node.w - a.node.w);
  let total = list.reduce((s, i) => s + i.node.w, 0);
  let area = w * h;
  while (list.length) {
    const side = Math.min(w, h);
    const k = area / total;
    const worst = (arr) => {

  if (S.pin != null) inner = `${dockHead(`<span class="pin">${S.pin + 1}</span> ${inline(m.where[S.pin].when)}`, 'Where to add new code')}<ul class="bul">${m.where[S.pin].lines.map((l) => `<li><span>${inline(l)}</span></li>`).join('')}</ul>`;
  else if (sel) { const n = sel.node; const pur = m.purposes.find((p) => p.path === sel.path); inner = `${dockHead(`<code>${esc(sel.path.replace('*files', '') || '/')}</code>`, n.group ? 'files at this level' : `${n.w} entries listed`)}${n.note ? drow('Note', inline(n.note)) : ''}${pur ? pur.f.map(([k, v]) => drow(k, inline(v))).join('') : ''}${n.group ? drow('Lists', `<code>${esc(n.files.map((f) => f.name).join('  '))}</code>`) : ''}`; }
  const foot = `<span class="key"><span class="pin">1</span>where to add: a signpost on the slice it names</span><span>Rings are folder depth (inner is the top of the tree); a slice's angle is the number of entries listed under it; grey slices are the files at that level.</span>`;
  const body = `<div class="sb-wrap"><svg viewBox="0 0 ${SIZE} ${SIZE}" role="img" aria-label="Directory structure as rings">${paths}</svg>${labels}${pins}<div class="sb-core">${esc(root.name.replace(/\/$/, ''))}</div></div>`;
  return art('structure', 'directories', `<div class="lifted">${picture('Directory structure', '', body, foot)}${pinChips(m)}${dock(inner)}</div>${structAcc(m)}`);
}

const viewR2 = (arch, struct) => () => pageHtml(proj(), st().panel, st().panel === 'architecture' ? arch() : struct());
VIEWS.d = viewR2(archD, structD); VIEWS.e = viewR2(archE, structE); VIEWS.f = viewR2(archF, structF);

render();
</script>
</body>
