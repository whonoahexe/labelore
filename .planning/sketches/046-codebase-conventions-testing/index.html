  const keep = r.toks.filter((t) => !r.struck.includes(t)).slice(0, 3);
  const lead = plainText(r.text.split('`')[0]).replace(/[:,(]\s*$/, '').trim();
  const cap = lead.length >= 12 ? lead : plainText(r.text).slice(0, 80);
  const pair = prose ? '' : `<span class="pair">${keep.map((t) => `<span class="spec">${esc(t)}</span>`).join('')}${r.struck.slice(0, 2).map((t) => `<span class="strike">${esc(t)}</span>`).join('')}${r.toks.length > keep.length + Math.min(2, r.struck.length) ? `<span class="cap">+${r.toks.length - keep.length - Math.min(2, r.struck.length)}</span>` : ''}</span>`;
  return `<button class="srow" type="button" data-act="sel" data-id="${r.id}"${prose ? ' data-prose="true"' : ''}${S.sel === r.id ? ' aria-pressed="true"' : ''}>${pair}<span class="cap">${esc(cap)}</span></button>`;
}
function plate(s, si) {
  const cases = s.rules.filter((r) => r.case);
  const rest = s.rules.filter((r) => !r.case);
  const MAX = 6;
  const caseHtml = cases.length ? `<div class="case-grid">${cases.map((r) => { const ex = r.toks.find((t) => !/\s/.test(t) && t.length < 34 && !r.struck.includes(t)) || ''; return `<button class="case" type="button" data-act="sel" data-id="${r.id}"${S.sel === r.id ? ' aria-pressed="true"' : ''}><span class="glab">${esc(r.label || '')}</span><span class="big">${esc(r.case)}</span>${ex ? `<span class="spec cap">${esc(ex.split('/').pop())}</span>` : ''}</button>`; }).join('')}</div>` : '';
  const shown = rest.slice(0, MAX);
  return `<section class="plate"${s.rules.length > 9 && cases.length ? ' data-wide="true"' : ''}><div class="plate-h"><span class="micro-label">${esc(s.h)}</span><b>${s.rules.length}</b></div>${caseHtml}${shown.map(specRow).join('')}${rest.length > MAX ? `<button class="more-btn" type="button" data-act="sel" data-id="sec:${si}">+${rest.length - MAX} more rules</button>` : ''}</section>`;
}
function convA() {
  const C = liftConv(convDoc());
  const body = `<div class="plates">${C.secs.map((s, i) => plate(s, i)).join('')}</div>`;
  const foot = `<span class="key"><span class="spec">name</span> a name the rule shows</span><span class="key"><span class="strike">name</span> a name the rule rules out</span><span class="key"><span class="spec" style="font-size:var(--fs-7)">camelCase</span> a case style the rule names</span><span>Rules with no name in code are a plain caption.</span>`;
  return convHead(C, `${pic('The conventions as specimens', `<span class="counts-line">${C.secs.length} sections · ${C.rules.length} rules</span>`, body, foot)}${dockConv(C)}${sectionBars(convDoc())}`);
}
function testA() {
  const T = liftTest(testDoc());
  const benches = [...T.runners.map((p) => ({ k: p.key, p, name: p.name })), ...(T.cmds.some((c) => c.runner === 'checks') ? [{ k: 'checks', name: 'checks' }] : [])];
  const assert = T.plates.find((p) => p.key === 'assert');
  const plates = benches.map((b) => `<section class="rplate" data-k="${b.k}">${b.p ? `<button class="srow" type="button" data-act="sel" data-id="plate:${esc(b.p.name)}"${S.sel === `plate:${b.p.name}` ? ' aria-pressed="true"' : ''}><span class="micro-label">${esc(b.p.label)}</span><span class="rname"><b>${esc(b.p.name)}</b>${b.p.version ? `<code>${esc(b.p.version)}</code>` : ''}</span>${b.p.config ? `<span class="cap">Config <code>${esc(b.p.config)}</code></span>` : ''}</button><div class="tags">${typesOn(T, b.name)}</div>` : `<span class="micro-label">Checks beside the tests</span><span class="rname"><b>Type check and lint</b></span>`}<div class="cmds">${T.cmds.filter((c) => c.runner === b.name).map(cmdHtml).join('')}</div></section>`).join('');
  const cov = T.covReq ? `<section class="rplate" data-k="coverage"><span class="micro-label">Coverage</span><span class="rname"><b>${esc(plainText(T.covReq.value || firstValue(T.covReq)).split(/\.\s/)[0].replace(/\.$/, ''))}</b></span>${assert ? `<span class="cap">Assertions: ${esc(assert.name)}</span>` : ''}</section>` : '';
  const forbid = T.forbid ? `<div class="forbid"><span class="micro-label">${esc(T.forbid.h)}</span><div class="tags">${[...new Set(groupsOf(T.forbid).flatMap((g) => g.items.flatMap((it) => tokens(it.text))))].slice(0, 14).map((t) => `<span class="strike">${esc(t)}</span>`).join('')}</div></div>` : '';
  const body = `<div class="bench">${plates}${cov}</div>${forbid}`;
  const foot = `<span>One bench per runner the document names, each holding the test types that run on it and its run commands; checks that are not tests get their own bench. A command is selectable text with a Copy command button; Labelore never runs it.</span>`;
  return testHead(`${pic('What runs the tests', `<span class="counts-line">${T.runners.length} runner${T.runners.length > 1 ? 's' : ''} · ${T.cmds.length} commands</span>`, body, foot)}${dockTest(T)}${sectionBars(testDoc())}`);
}

// =====================================================================================
// B: Reuse. Conventions as the 044 E piles; Testing on the shipped clean tree.
// =====================================================================================
function convB() {
  const C = liftConv(convDoc());
  const cols = C.secs.map((s, i) => `<div class="pile-col"${S.filter != null && S.filter !== String(i) ? ' data-dim="true"' : ''}><div class="pile">${s.rules.length ? s.rules.map((r) => rk(r)).join('') : '<span class="pile-zero">0</span>'}</div><button class="pile-lab" type="button" data-act="filter" data-f="${i}" aria-pressed="${S.filter === String(i)}"><b>${s.rules.length}</b><span class="pl">${esc(s.short)}</span></button></div>`).join('');
  const legend = `<div class="sec-legend" role="group" aria-label="Sections">${C.secs.map((s, i) => `<button class="sec-chip" type="button" data-act="filter" data-f="${i}" aria-pressed="${S.filter === String(i)}"><span>${esc(s.short)}</span><b>${s.rules.length}</b></button>`).join('')}</div>`;
  const foot = `<span class="key"><span class="rk" data-st="hard"></span>a hard rule: never, must, only, no</span><span class="key"><span class="rk" data-st="plain"></span>a plain rule</span><span class="key"><span class="rk" data-st="soft"></span>an observed habit</span><span class="key"><span class="rk" data-st="plain" data-enf="true"></span>checked by a test or the linter</span><span>One column per section in the document's order, one segment per rule.</span>`;
  return convHead(C, `${pic('How much each section asks', `<span class="counts-line">${C.rules.length} rules · ${C.rules.filter((r) => r.st === 'hard').length} hard · ${C.rules.filter((r) => r.enf).length} checked</span>`, `<div class="piles" style="--cols:${C.secs.length}">${cols}</div>`, foot)}${legend}${dockConv(C)}${sectionBars(convDoc())}`);
}
function parseTree(text) {
  const rows = [];
  text.split('\n').forEach((line) => {
    if (!line.trim()) return;
    const m = line.match(/^((?:│\s{3}|\s{4})*)(?:├── |└── )(.*)$/);
    const depth = m ? m[1].length / 4 + 1 : 0;
    const rest = m ? m[2] : line.trim();
    const h = rest.search(/\s+#\s/);
    const name = (h >= 0 ? rest.slice(0, h) : rest).trim();
    rows.push({ depth, name, note: h >= 0 ? rest.slice(h).replace(/^\s+#\s+/, '') : '', folder: name.endsWith('/') });
  });
  // the full path of each row
  const stack = [];
  rows.forEach((r) => { stack.length = r.depth; stack[r.depth] = r.name; r.path = stack.slice(0, r.depth + 1).join(''); });
  return rows;
}
function testB() {
  const T = liftTest(testDoc());
  let tree = '';
  if (T.tree) {
    const rows = parseTree(T.tree);
    tree = `<ul class="tree">${rows.map((r) => {
      const ty = T.types.filter((t) => t.paths.some((p) => p === r.path || (p.endsWith('/') && r.path === p) || (/\*/.test(p) && r.path === p.replace(/\*.*$/, '') && false)));
      const isTest = /\.(test|spec)\./.test(r.name);
      const runnerB = ty.length && ty[0].runner !== (T.runners[0] || {}).name ? `<span class="badge" data-k="runner">${esc(ty[0].runner)}</span>` : '';
      return `<li><button class="t-name" type="button" data-act="sel" data-id="path:${esc(r.path)}" style="--d:${r.depth}"${r.folder ? ' data-folder' : ''}${S.sel === `path:${r.path}` ? ' aria-pressed="true"' : ''}>${svg(r.folder ? 'folder' : 'file')}<span class="nm">${esc(r.name)}</span></button><span class="t-note">${ty.map((t) => `<span class="badge">${esc(t.name)}</span>`).join('')}${runnerB}${isTest ? '<span class="badge" data-k="test">test file</span>' : ''}${r.note ? `<span>${esc(r.note)}</span>` : ''}</span></li>`;
    }).join('')}</ul>`;
  }
  const loose = T.types.filter((t) => !t.paths.length || !T.tree || !t.paths.some((p) => T.tree.includes(p.replace(/^test\//, '').replace(/\/$/, '')))).map((t) => `<button class="badge" type="button" data-act="sel" data-id="type:${esc(t.name)}">${esc(t.name)}</button>`).join('');
  const body = `${runnerStrip(T)}<div class="tree-scroll" style="margin-top:var(--space-4)">${tree || `<p class="source-note">${esc(T.loc ? plainText(firstValue(T.loc)) : 'No tree in this document')}</p>`}</div>${loose ? `<div class="notused" style="display:grid;gap:var(--space-1-5);margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px dashed var(--border)"><span class="micro-label">Test types not placed on the tree</span><div class="tags">${loose}</div></div>` : ''}`;
  const cmds = `<section class="pic" style="margin-top:0"><div class="pic-bar"><span class="ff-title">Run commands</span><span class="counts-line">${T.cmds.length}</span></div><div class="pic-body"><div class="cmd-list">${T.cmds.map(cmdHtml).join('')}</div></div></section>`;
  const foot = `<span>The tree is the document's own Structure fence, drawn as the shipped clean tree (009 B); a badge is a Test Types heading whose parenthesis names that folder.</span>`;
  return testHead(`${pic('Where the tests live', `<span class="counts-line">${T.types.length} test types</span>`, body, foot)}${cmds}${dockTest(T)}${sectionBars(testDoc())}`);
}

// =====================================================================================
// C: Territory map + mirror map
// =====================================================================================
function convC() {
  const C = liftConv(convDoc());
  const areas = new Map();
  C.rules.forEach((r) => (r.paths.length ? r.paths : ['everywhere']).forEach((a) => { (areas.get(a) || areas.set(a, []).get(a)).push(r); }));
  const order = [...areas.entries()].sort((a, b) => (a[0] === 'everywhere' ? -1 : b[0] === 'everywhere' ? 1 : b[1].length - a[1].length));
  const max = Math.max(1, ...order.filter(([a]) => a !== 'everywhere').map(([, rs]) => rs.length));
  const tiles = order.map(([a, rs]) => `<div class="tile2" role="group"${a === 'everywhere' ? ' data-every="true"' : ` data-step="${rs.length >= max * 0.6 ? 3 : rs.length >= max * 0.3 ? 2 : 1}"`} style="--g:${rs.length}"><button class="tn text-link" type="button" data-act="sel" data-id="area:${esc(a)}" style="text-transform:none;letter-spacing:0;white-space:normal;color:var(--foreground)">${a === 'everywhere' ? '<span class="micro-label">Everywhere · rules that name no path</span>' : `<code>${esc(a)}</code>`}<b>${rs.length}</b></button><div class="rks">${rs.map((r) => rk(r)).join('')}</div></div>`).join('');
  const legend = `<div class="sec-legend" role="group" aria-label="Sections">${C.secs.map((s, i) => `<button class="sec-chip" type="button" data-act="filter" data-f="${i}" aria-pressed="${S.filter === String(i)}"><span>${esc(s.short)}</span><b>${s.rules.length}</b></button>`).join('')}</div>`;
  const foot = `<span class="key"><span class="rk" data-st="hard"></span>hard</span><span class="key"><span class="rk" data-st="plain"></span>plain</span><span class="key"><span class="rk" data-st="soft"></span>observed</span><span class="key"><span class="rk" data-st="plain" data-enf="true"></span>checked</span><span>A territory is a part of the repository the rules name by path; a rule naming two sits in both. Its size and shade grow with the rules that name it.</span>`;
  return convHead(C, `${pic('Where each rule applies', `<span class="counts-line">${order.length} territories · ${C.rules.length} rules</span>`, `<div class="terr">${tiles}</div>`, foot)}${legend}${dockConv(C)}${sectionBars(convDoc())}`);
}
function mirrorModel(T) {
  const left = new Map(); const right = [];
  const srcNames = new Set();
  const lines = T.loc ? T.loc.items.flatMap((it) => [it.text, ...it.sub]) : [];
  lines.forEach((t) => tokens(t).forEach((x) => { const m = x.match(/^(src\/[a-z-]+)/); if (m) srcNames.add(m[1]); }));
  ['planning-repo', 'planning-fs', 'server', 'web', 'presentation', 'rendering', 'cli', 'domain'].forEach((n) => { if (T.doc.sections.some((s) => JSON.stringify(s.blocks).includes(`src/${n}`))) srcNames.add(`src/${n}`); });
  lines.forEach((t, i) => {
    const toks = tokens(t);
    const test = toks.find((x) => /^test\//.test(x) && !/\.test\.ts$|\.mjs$/.test(x)) || (toks.find((x) => /^test\//.test(x)) ? 'test/' : null);
    if (!test) return;
    let src = (toks.find((x) => /^src\//.test(x)) || '').match(/^(src\/[a-z-]+)/);
    let inferred = false;
    if (!src) { const w = [...srcNames].find((n) => new RegExp(`\\b${n.slice(4).replace('-', '[- ]')}\\b`, 'i').test(t)); if (w) { src = [w]; inferred = true; } }
    const label = test;
    if (right.some((r) => r.label === label && r.cap === plainText(t.replace(/^`[^`]+`\s*/, '')))) return;
    const runner = /playwright|e2e/i.test(t) ? (T.runners.find((p) => /playwright/i.test(p.name)) || {}).name : null;
    const r = { id: `m${i}`, label, path: test, src: src ? src[1] : null, inferred, runner, cap: plainText(t.replace(/^`[^`]+`\s*/, '')) };
    right.push(r);
    if (r.src) left.set(r.src, true);
  });
  // co-located pairs from the tree (x.ts beside x.test.ts)
  const pairs = [];
  if (!right.some((r) => r.src) && T.tree) {
    const rows = parseTree(T.tree);
    rows.filter((r) => /\.test\.\w+$/.test(r.name)).forEach((r) => { const base = r.path.replace(/\.test(\.\w+)$/, '$1'); if (rows.some((x) => x.path === base)) pairs.push({ src: base, test: r.path }); });
  }
  return { left: [...left.keys()], right, pairs };
}
function testC() {
  const T = liftTest(testDoc());
  const M = mirrorModel(T);
  let map;
  if (M.right.some((r) => r.src)) {
    const selR = S.sel && S.sel.startsWith('path:') ? S.sel.slice(5) : null;
    map = `<div class="mirror" id="mirror"><svg class="mm-wires" aria-hidden="true"></svg><span class="micro-label mm-h" style="grid-column:1;grid-row:1">The code</span><span class="micro-label mm-h" style="grid-column:3;grid-row:1">Its tests</span>${M.left.map((l) => `<button class="mm-item" type="button" data-src="true" data-key="${esc(l)}" data-act="sel" data-id="path:${esc(l)}" style="grid-column:1;grid-row:${M.right.findIndex((r) => r.src === l) + 2}"${selR === l ? ' aria-pressed="true"' : ''}><code>${esc(l)}</code></button>`).join('')}${M.right.map((r, ri) => `<button style="grid-column:3;grid-row:${ri + 2}" class="mm-item" type="button" data-to="${esc(r.src || '')}" data-inferred="${r.inferred}"${r.src ? '' : ' data-lone="true"'} data-act="sel" data-id="path:${esc(r.path)}"${selR === r.path ? ' aria-pressed="true"' : ''}><span class="tags"><code>${esc(r.label)}</code>${r.runner ? `<span class="badge" data-k="runner">${esc(r.runner)}</span>` : ''}</span><span class="cap">${esc(r.cap)}</span></button>`).join('')}</div>`;
  } else {
    map = `<div class="mirror" id="mirror"><svg class="mm-wires" aria-hidden="true"></svg><div class="mm-col left"><span class="micro-label">The code</span>${M.pairs.map((p) => `<button class="mm-item" type="button" data-src="true" data-key="${esc(p.src)}" data-act="sel" data-id="path:${esc(p.src)}"><code>${esc(p.src)}</code></button>`).join('')}</div><div class="mm-mid"></div><div class="mm-col right"><span class="micro-label">Its tests · ${esc(T.loc ? plainText(firstValue(T.loc)) : '')}</span>${M.pairs.map((p) => `<button class="mm-item" type="button" data-to="${esc(p.src)}" data-act="sel" data-id="path:${esc(p.test)}"><code>${esc(p.test)}</code></button>`).join('')}</div></div>`;
  }
  const cmds = `<div class="cmd-list" style="margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--border)"><span class="micro-label">Run commands · ${T.cmds.length}</span>${T.cmds.map(cmdHtml).join('')}</div>`;
  const foot = `<span>Each test folder is wired to the source folder its line names ("test/server/ for src/server/**"); a dashed box names no source folder. With co-located tests the tree's x.ts and x.test.ts pairs are wired instead.</span><span class="pan-note">The map reflows; captions hide.</span>`;
  return testHead(`${pic('Tests against the code they test', `<span class="counts-line">${M.right.length || M.pairs.length} test place${(M.right.length || M.pairs.length) === 1 ? '' : 's'}</span>`, `${runnerStrip(T)}<div style="margin-top:var(--space-4)">${map}</div>${cmds}`, foot)}${dockTest(T)}${sectionBars(testDoc())}`);
}
function wireMirror() {
  const m = document.getElementById('mirror');
  if (!m) return;
  const br = m.getBoundingClientRect();
  const sel = S.sel && S.sel.startsWith('path:') ? S.sel.slice(5) : null;
  m.querySelector('.mm-wires').innerHTML = [...m.querySelectorAll('.mm-item[data-to]')].filter((e) => e.dataset.to).map((e) => {
    const s = m.querySelector(`.mm-item[data-src][data-key="${CSS.escape(e.dataset.to)}"]`);
    if (!s) return '';
    const a = s.getBoundingClientRect(); const b = e.getBoundingClientRect();
    const x1 = a.right - br.left; const y1 = a.top + a.height / 2 - br.top; const x2 = b.left - br.left; const y2 = b.top + Math.min(b.height / 2, 18) - br.top;
    const mx = (x1 + x2) / 2;
    const hot = sel && (sel === e.dataset.to || e.dataset.id === `path:${sel}`);
    return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"${e.dataset.inferred === 'true' ? ' data-inferred="true"' : ''}${hot ? ' data-hot="true"' : ''}/>`;
  }).join('');
}

// ---------- wiring ----------
const VARIANT = { a: { conventions: convA, testing: testA }, b: { conventions: convB, testing: testB }, c: { conventions: convC, testing: testC } };
['a', 'b', 'c'].forEach((v) => { VIEWS[v] = () => pageHtml(PROJ[proj()], S.panel, MINE, VARIANT[v][S.panel]()); });
function afterRender() { wireMirror(); }
window.addEventListener('resize', () => render());
render();

</script>
