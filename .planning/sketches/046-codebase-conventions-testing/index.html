<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 046 — Conventions and Testing panels</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* Sketch 046: the Conventions and Testing panels inside the 042 A frame (Rail + column), identical in
   every variant. Text comes from Labelore's own public map (.planning/codebase/) and from the made-up
   Tidemark fixture (its older-form Conventions: no frontmatter, an Analysis Date line and a Last updated
   footer). The eight-command state is Tidemark's TESTING with five more commands written in its own
   comment-above form. A value written beside a variable name, even in a code sample, is withheld before
   the text reaches this file. Tokens come from ../themes/default.css; every colour is a theme token, a
   colour-mix of tokens, an opacity step or a hatch. Squared corners, --space-* spacing, four font sizes. */
:root {
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --veil: color-mix(in oklch, var(--muted) 55%, transparent);
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --sq: var(--space-2-5);
  --page: calc(var(--space-8) * 40);
  --rail: calc(var(--space-8) * 9);
  --fill-1: color-mix(in oklch, var(--foreground) 4%, transparent);
  --fill-2: color-mix(in oklch, var(--foreground) 8%, transparent);
  --fill-3: color-mix(in oklch, var(--foreground) 13%, transparent);
  --fill-4: color-mix(in oklch, var(--foreground) 19%, transparent);
  --hatch: repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 6px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-4); font-weight: var(--fw-medium); line-height: var(--lh-normal); }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
h3, h4 { font-size: inherit; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--font-mono); font-size: inherit; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- sketch chrome (not part of the app) ---------- */
#sketch-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
#sketch-bar .lbl { color: var(--muted-foreground); white-space: nowrap; }
#sketch-bar .grp { display: flex; flex: none; gap: var(--space-1); align-items: center; }
#sketch-bar .grp + .grp { padding-left: var(--space-3); border-left: 1px solid var(--border); }
#sketch-bar .grp.line { flex-basis: 100%; padding-left: 0; border-left: 0; }
#sketch-bar a, #sketch-bar button { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; color: var(--muted-foreground); white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; }
#sketch-bar a:hover, #sketch-bar button:hover { color: var(--foreground); background: var(--state-hover); }
#sketch-bar .on { color: var(--foreground); border-color: var(--border); background: var(--state-hover); }
#sketch-bar .name { color: var(--muted-foreground); padding-inline: var(--space-1); }
@media (max-width: 42rem) { #sketch-bar { flex-wrap: nowrap; overflow-x: auto; } #sketch-bar .grp.line { flex-basis: auto; } }
#toast { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 99; max-width: 90vw; padding: var(--space-2) var(--space-3); background: var(--foreground); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); opacity: 0; pointer-events: none; }
#toast.on { opacity: 1; }

/* ---------- app shell header (outside the page, drawn as today) ---------- */
.app-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-fluid-3); border-bottom: 1px solid var(--border); }
.app-brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-3); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.app-brand i { width: var(--space-5); height: var(--space-5); background: var(--primary); }
.app-brand span { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.app-nav { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-left: auto; }
.app-nav a { padding: var(--space-1-5) var(--space-2-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.app-nav a[aria-current] { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }
@media (max-width: 42rem) { .app-nav { display: none; } }

/* ---------- page atoms (four sizes: display h1, heading fs-7, body fs-4, label fs-2) ---------- */
.page { display: grid; gap: var(--space-6); align-content: start; width: min(var(--page), 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); }
.crumbs [aria-current] { color: var(--foreground); }
.heading-block { display: grid; gap: var(--space-3); min-width: 0; }
.eyebrow { display: flex; gap: var(--space-2); align-items: center; color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
h1 { font-size: var(--fs-display-3); font-weight: var(--fw-semibold); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); overflow-wrap: anywhere; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); min-width: 0; }
.micro-label, .grp-h { margin: 0; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
.btn-xs { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1-5); min-height: var(--space-7); padding-inline: var(--space-3); border: 1px solid var(--border); font-family: var(--font-sans); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.btn-xs:hover { background: var(--state-hover); }
.btn-xs[aria-pressed='true'] { background: var(--muted); }
.btn-xs.icon { padding-inline: 0; width: var(--space-7); }
@media (pointer: coarse) { .btn-xs { min-height: var(--space-10); } .btn-xs.icon { width: var(--space-10); } }
.seg { display: inline-flex; }
.seg .btn-xs + .btn-xs { border-left: 0; }
.text-link { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.text-link:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: var(--space-0-5); }
.status-chip { display: inline-flex; gap: var(--space-1-5); align-items: center; width: fit-content; max-width: 100%; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--veil); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; white-space: nowrap; }
.status-chip[data-tone='complete'] { border-color: var(--primary-border); background: var(--primary-tint); color: var(--primary); }
.status-chip[data-tone='in-flight'] { border-color: var(--in-flight-border); color: var(--in-flight-fill); }
.status-chip[data-tone='quiet'] { color: var(--muted-foreground); border-style: dashed; }
.status-chip.mono { text-transform: none; letter-spacing: var(--ls-wider); }
.sq { display: inline-block; width: var(--sq); height: var(--sq); flex: none; border: 1px solid var(--border); }
.sq[data-tone='complete'] { background: var(--primary); border-color: var(--primary); }
.sq[data-tone='in-flight'] { background: var(--in-flight-fill); border-color: var(--in-flight-fill); }
.sq[data-tone='quiet'] { background: transparent; border: 1px dashed var(--muted-foreground); }
.sq[data-tone='neutral'] { background: var(--muted); border-color: var(--muted-foreground); }
.source-note { color: var(--muted-foreground); font-size: var(--fs-4); overflow-wrap: anywhere; }
.facts { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); min-width: 0; }
.facts-count { font-weight: var(--fw-semibold); }
.facts-date { color: var(--muted-foreground); }
/* the quiet "Value not shown" mark: a withheld value is never in the page */
.vns { display: inline-flex; align-items: center; gap: var(--space-1); margin-left: var(--space-1); padding: 0 var(--space-1-5); border: 1px dashed var(--muted-foreground); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; vertical-align: baseline; line-height: var(--lh-snug); }

/* ---------- the 042 A frame: rail + reading column ---------- */
.a-grid { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: var(--space-fluid-9); align-items: start; }
.a-rail { position: sticky; top: calc(var(--space-10) + var(--space-4)); display: grid; gap: var(--space-4); min-width: 0; max-height: calc(100vh - var(--space-28)); overflow-y: auto; }
.a-main { display: grid; gap: var(--space-8); min-width: 0; }
.list ol { display: grid; }
.entry { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); align-items: center; min-width: 0; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); }
a.entry:hover { background: var(--state-hover); }
.entry-li + .entry-li .entry { border-top-color: var(--border-faint); }
.entry-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--muted-foreground); }
.entry-name { min-width: 0; font-weight: var(--fw-semibold); }
.entry-key { font-family: var(--font-mono); font-weight: var(--fw-semibold); }
.entry[aria-current='page'] { border-color: var(--primary-border); background: var(--primary-tint); }
.entry[aria-current='page'] .entry-no { color: var(--primary); }
@media (max-width: 62rem) { .a-grid { grid-template-columns: minmax(0, 1fr); } .a-rail { position: static; max-height: none; overflow: visible; } }

/* ---------- the panel ---------- */
.panel { display: grid; gap: var(--space-6); min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border); }
.panel-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--primary); }
.panel-head h2 { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.panel-key { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }
.panel-stamp { flex-basis: 100%; color: var(--muted-foreground); }
.lifted { display: grid; gap: var(--space-6); min-width: 0; }

/* plain form (the generic document rendering of a section) */
.prose { max-width: 72ch; overflow-wrap: anywhere; }
.prose code, .bul code, .ptable code, .dock code, .steps code { padding: 0 var(--space-0-5); background: var(--muted); }
.bul { display: grid; gap: var(--space-1-5); max-width: 78ch; }
.bul > li { display: grid; grid-template-columns: var(--space-2-5) minmax(0, 1fr); gap: var(--space-2); align-items: baseline; overflow-wrap: anywhere; }
.bul > li::before { content: ''; width: var(--space-1-5); height: var(--space-1-5); background: var(--muted-foreground); transform: translateY(-0.1em); justify-self: center; }
.bul ul { grid-column: 2; margin-top: var(--space-1); color: var(--muted-foreground); display: grid; gap: var(--space-1); }
.steps { display: grid; gap: var(--space-1-5); max-width: 78ch; padding-left: var(--space-5); list-style: decimal; }
.g { display: grid; gap: var(--space-1-5); min-width: 0; }
.g-label { font-weight: var(--fw-semibold); }
.g-label .v { font-weight: var(--fw-medium); }
.ptable { width: 100%; border-collapse: collapse; }
.ptable th { text-align: left; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; padding: var(--space-1-5) var(--space-3) var(--space-1-5) 0; border-bottom: 1px solid var(--border); }
.ptable td { vertical-align: top; padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--border-faint); overflow-wrap: anywhere; }
.tbl-scroll { overflow-x: auto; }
pre.plain-pre { margin: 0; padding: var(--space-3); border: 1px solid var(--border); background: var(--muted); font-family: var(--font-mono); font-size: var(--fs-2); line-height: var(--lh-snug); overflow-x: auto; max-width: 100%; }
.foot-line { color: var(--muted-foreground); font-style: italic; }

/* the picture frame, dock and the closed section bars */
.pic { border: 1px solid var(--border); min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.pic-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); background: var(--veil); }
.ff-title { margin-right: auto; font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.counts-line { font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }
.pic-body { overflow: auto; padding: var(--space-4); min-width: 0; max-width: 100%; }
.pic-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: var(--fs-2); }
.pic-foot .key { display: inline-flex; align-items: center; gap: var(--space-1-5); }
.pan-note { display: none; }
@media (max-width: 42rem) { .pan-note { display: inline; } }
.dock { display: grid; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--primary-border); background: var(--primary-tint); min-width: 0; }
.dock-empty { padding: var(--space-3) var(--space-4); border: 1px dashed var(--border); color: var(--muted-foreground); }
.dock-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-3); }
.dock-head h4 { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.dock .d-x { margin-left: auto; }
.dock .xref { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding-top: var(--space-2); border-top: 1px solid var(--primary-border); }
.acc-list { display: grid; }
.acc { border-top: 1px solid var(--border); }
.acc:last-child { border-bottom: 1px solid var(--border); }
.acc > summary { display: flex; align-items: center; gap: var(--space-3); min-height: var(--space-10); cursor: pointer; list-style: none; font-weight: var(--fw-semibold); }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary:hover { background: var(--state-hover); }
.acc > summary .n { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: var(--ls-wider); }
.acc > summary svg { color: var(--muted-foreground); }
.acc[open] > summary svg { transform: rotate(90deg); }
.acc > .acc-body { display: grid; gap: var(--space-4); padding: 0 0 var(--space-5) var(--space-7); min-width: 0; }
@media (max-width: 42rem) { .acc > .acc-body { padding-left: 0; } }
.sec-legend { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.sec-chip { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--background); font-size: var(--fs-2); }
.sec-chip b { font-family: var(--font-mono); font-weight: var(--fw-semibold); }
.sec-chip:hover { background: var(--state-hover); }
.sec-chip[aria-pressed='true'] { border-color: var(--primary-border); background: var(--primary-tint); }
/* the shipped copy-command row (10-10): selectable mono command, then the button; Copied in the button */
.copy-command { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); min-width: 0; }
.copy-command-text { padding: var(--space-1-5) var(--space-2-5); background: var(--muted); font-family: var(--font-mono); font-size: var(--fs-4); font-weight: var(--fw-semibold); overflow-wrap: anywhere; user-select: all; min-width: 0; max-width: 100%; }
.copy-command-button[data-copied='true'] { color: var(--primary); }
.copy-command-button svg { width: var(--space-3-5); height: var(--space-3-5); }

/* ---------- 046 shared marks ---------- */
.spec { font-family: var(--font-mono); font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.strike { font-family: var(--font-mono); color: var(--muted-foreground); text-decoration: line-through; text-decoration-thickness: 2px; overflow-wrap: anywhere; }
.cap { font-size: var(--fs-2); color: var(--muted-foreground); overflow-wrap: anywhere; }
.rk { display: inline-block; flex: none; width: 11px; height: 11px; padding: 0; border: 1px solid var(--muted-foreground); background: var(--muted-foreground); opacity: 0.6; cursor: pointer; }
.rk[data-st='hard'] { opacity: 1; } .rk[data-st='soft'] { opacity: 0.3; background: transparent; }
.rk[data-enf='true'] { outline: 2px solid var(--primary); outline-offset: 1px; }
.rk:hover { outline: 2px solid var(--primary-border); outline-offset: 1px; }
.rk[data-on='true'] { outline: 2px solid var(--foreground); outline-offset: 1px; }
.rk[data-dim='true'] { opacity: 0.12; }
.badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-1-5); border: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; line-height: var(--lh-snug); }
.badge[data-k='runner'] { border-color: var(--muted-foreground); background: var(--fill-2); }
.badge[data-k='test'] { border-style: dashed; }
.tags { display: flex; flex-wrap: wrap; gap: var(--space-1); min-width: 0; align-items: center; }
[aria-pressed='true'].srow, [aria-pressed='true'].tile2, [aria-pressed='true'].tr-row, [aria-pressed='true'].mm-item { outline: 2px solid var(--primary); outline-offset: 1px; }

/* ---------- A: the specimen sheet ---------- */
.plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: var(--space-3); }
.plate { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-3); border: 1px solid var(--border); background: var(--background); min-width: 0; }
.plate[data-wide='true'] { grid-column: span 2; }
.plate-h { display: flex; align-items: baseline; gap: var(--space-2); padding-bottom: var(--space-1-5); border-bottom: 1px solid var(--border-faint); }
.plate-h .micro-label { margin-right: auto; color: var(--foreground); }
.plate-h b { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); font-weight: var(--fw-semibold); }
.plate .glab { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: var(--space-2); }
.case { display: grid; gap: var(--space-0-5); align-content: start; padding: var(--space-2) var(--space-2-5); border: 1px solid var(--border); background: var(--fill-1); text-align: left; min-width: 0; }
.case:hover { background: var(--state-hover); }
.case .big { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); overflow-wrap: anywhere; }
.srow { display: grid; gap: var(--space-0-5); padding: var(--space-1) var(--space-1-5); margin-inline: calc(var(--space-1-5) * -1); text-align: left; min-width: 0; }
.srow:hover { background: var(--state-hover); }
.srow .pair { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: baseline; }
.srow .cap { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.srow[data-prose='true'] .cap { color: var(--foreground); opacity: 0.7; }
.more-btn { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); text-align: left; }
.more-btn:hover { color: var(--foreground); text-decoration: underline; }
@media (max-width: 42rem) { .plate[data-wide='true'] { grid-column: auto; } }

/* ---------- A: the runner bench ---------- */
.bench { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: var(--space-3); align-items: start; }
.rplate { display: grid; gap: var(--space-2-5); align-content: start; padding: var(--space-3); border: 1px solid var(--border); border-top: 3px solid var(--foreground); background: var(--background); min-width: 0; }
.rplate[data-k='checks'] { border-top-style: dashed; border-top-color: var(--muted-foreground); }
.rplate[data-k='coverage'] { border-style: dashed; background: var(--hatch); }
.rplate .rname { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2); }
.rplate .rname b { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }

.cmds { display: grid; gap: var(--space-2-5); }
.cmd { display: grid; gap: var(--space-1); min-width: 0; }
.cmd .cap { padding-left: var(--space-0-5); }
.forbid { display: grid; gap: var(--space-2); margin-top: var(--space-3); padding: var(--space-3); border: 1px dashed var(--border); }
.forbid .tags { gap: var(--space-1-5) var(--space-3); }

/* ---------- B: rule piles (the 044 E pile, reused) ---------- */
.piles { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--space-1-5); align-items: end; }
.pile-col { display: grid; gap: var(--space-2); align-content: end; min-width: 0; }
.pile-col[data-dim='true'] { opacity: 0.35; }
.pile { display: flex; flex-direction: column-reverse; gap: 3px; }
.pile .rk { width: 100%; height: 13px; }
.pile-zero { height: 13px; border: 1px dashed var(--muted-foreground); display: grid; place-items: center; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); line-height: 1; }
.pile-lab { display: grid; gap: var(--space-1); justify-items: start; text-align: left; padding-top: var(--space-1-5); border-top: 1px solid var(--border); min-width: 0; }
.pile-lab b { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: 1.1; }

.pile-lab[aria-pressed='true'] b { color: var(--primary); }
.runner-strip { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: stretch; }
.rmini { display: grid; gap: var(--space-0-5); padding: var(--space-1-5) var(--space-2-5); border: 1px solid var(--border); border-top: 3px solid var(--foreground); min-width: 0; }
.rmini[data-k='coverage'] { border-style: dashed; border-top-width: 1px; background: var(--hatch); }

@media (max-width: 42rem) { .pile-lab .pl { display: none; } }

/* ---------- B: the shipped clean tree (009 B) with test-type badges ---------- */
.tree { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: center; width: 100%; }
.tree > li { display: contents; }
.tr-row { display: contents; }
.t-name { position: relative; display: flex; align-items: center; gap: var(--space-2); min-height: var(--space-7); padding-left: calc(var(--d) * var(--space-6)); padding-right: var(--space-4); font-family: var(--font-mono); white-space: nowrap; text-align: left; }
.t-name::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--d) * var(--space-6)); background: repeating-linear-gradient(to right, var(--border-faint) 0 1px, transparent 1px var(--space-6)); pointer-events: none; }

.t-note { min-height: var(--space-7); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); font-size: var(--fs-2); color: var(--muted-foreground); border-bottom: 1px solid var(--border-faint); min-width: 0; }
.tree > li:last-child .t-note { border-bottom: 0; }
.tree-scroll { overflow-x: auto; }
@media (max-width: 42rem) { .tree { grid-template-columns: max-content max-content; width: max-content; } }

/* ---------- C: the territory map ---------- */
.terr { display: flex; flex-wrap: wrap; border: 2px solid var(--foreground); }
.tile2 { flex: var(--g) 1 9rem; display: grid; gap: var(--space-1-5); align-content: start; min-height: 6.5rem; padding: var(--space-2) var(--space-2-5); border: 1px solid var(--border); background: var(--fill-1); text-align: left; min-width: 0; }
.tile2[data-step='2'] { background: var(--fill-2); } .tile2[data-step='3'] { background: var(--fill-3); }

.tile2:hover { box-shadow: inset 0 0 0 2px var(--primary-border); }
.tile2 .tn { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.tile2 .tn code { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.tile2 .tn b { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: 1; }
.tile2 .rks { display: flex; flex-wrap: wrap; gap: 3px; }

/* ---------- C: the mirror map (tests wired to the code they mirror) ---------- */
.mirror { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--space-28) minmax(0, 1fr); gap: var(--space-2) 0; align-items: start; }
.mm-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mm-wires path { fill: none; stroke: var(--muted-foreground); stroke-width: 1.5; }
.mm-wires path[data-inferred='true'] { stroke-dasharray: 4 4; }
.mm-wires path[data-hot='true'] { stroke: var(--primary); stroke-width: 2.5; }
.mm-col { display: grid; gap: var(--space-2); align-content: start; min-width: 0; }
.mm-col.left { grid-column: 1; } .mm-col.right { grid-column: 3; }
.mm-col > .micro-label { padding-bottom: var(--space-1); border-bottom: 1px solid var(--border); }
.mm-item { position: relative; z-index: 1; display: grid; gap: var(--space-1); padding: var(--space-2) var(--space-2-5); border: 1px solid var(--border); background: var(--background); text-align: left; min-width: 0; }
.mm-item:hover { background: var(--state-hover); }
.mm-item code { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.mm-item[data-src='true'] { background: var(--fill-2); }
.mm-item[data-lone='true'] { border-style: dashed; }
.mm-item .cap { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mm-mid { grid-column: 2; }
@media (max-width: 42rem) { .mirror { grid-template-columns: minmax(0, 1fr) var(--space-8) minmax(0, 1fr); } .mm-item .cap { display: none; } }
.cmd-list { display: grid; gap: var(--space-3); }
.cmd-list .cmd { padding-bottom: var(--space-2-5); border-bottom: 1px solid var(--border-faint); }

.mirror > .mm-item { z-index: 1; }
.mm-h { padding-bottom: var(--space-1); border-bottom: 1px solid var(--border); }

</style>

<script>
const DOCS = {"conventions":{"labelore":{"front":{"last_mapped_commit":"717c8d7db3d75717948b08690df3a087fc01684d","last_mapped_at":"2026-11-04"},"comment":null,"title":"Coding Conventions","date":"2026-11-04","intro":[],"sections":[{"h":"Naming Patterns","blocks":[{"t":"label","text":"Files","value":""},{"t":"ul","items":[{"text":"kebab-case for every source file: `src/server/project-registry.ts`, `src/planning-repo/handlers/roadmap.ts`, `src/web/components/app-shell.tsx`","sub":[]},{"text":"Source files carry an explicit extension in imports (`allowImportingTsExtensions` is on): `import type { ProjectSnapshot } from '../planning-repo/types.ts'`","sub":[]},{"text":"Web hooks use a `use-` prefix: `src/web/components/use-active-section.ts`","sub":[]},{"text":"Web page components live in `src/web/pages/*-page.tsx` and route-level views in `src/web/views/*.ts(x)`","sub":[]},{"text":"Planning-artifact handlers are named after the artifact type: `src/planning-repo/handlers/<type>.ts` (for example `state.ts`, `review-report.ts`, `ui-spec-contract.ts`); `handlers/index.ts` is the registry","sub":[]},{"text":"Test files mirror the source area and end in `.test.ts` (never `.test.tsx`): `test/server/refresh.test.ts`, `test/rendering/markdown.test.ts`, `test/web/class-vocabulary.test.ts`","sub":[]},{"text":"Playwright specs end in `.spec.ts` and live in `test/e2e/`","sub":[]}]},{"t":"label","text":"Functions","value":""},{"t":"ul","items":[{"text":"camelCase for all functions: `defaultSettingsDir`, `tryParseFrontmatter`, `buildSearchDocuments`, `createApp`","sub":[]},{"text":"Top-level helpers are `function` declarations, not `const` arrow functions: `function cn(...)` in `src/web/components/ui/button.tsx`, `function findSection(...)` in `src/planning-repo/handlers/state.ts`","sub":[]},{"text":"Factory functions are named `create*`: `createApp` (`src/server/index.ts`), `createSearchIndexState` (`src/server/search-index.ts`), `createRegistryApp` (`src/server/registry-api.ts`), `createProjectApi` (`src/server/project-api.ts`)","sub":[]},{"text":"Test fixture builders are named `make*`: `makeArtifact`, `makePhase`, `makeProject`, `makeSnapshot` (repeated per test file, see `test/server/search-index.test.ts`)","sub":[]},{"text":"Predicate helpers are named `is*` / `has*`: `isBlockersHeading`, `isDecisionsHeading`, `isReady`","sub":[]},{"text":"Parsing helpers that return null on failure start with `try`: `tryParseFrontmatter` (`src/planning-repo/frontmatter.ts`)","sub":[]}]},{"t":"label","text":"Variables","value":""},{"t":"ul","items":[{"text":"camelCase locals; `const` by default","sub":[]},{"text":"Module-level constants are SCREAMING_SNAKE_CASE: `DEFAULT_PORT`, `PORT_ATTEMPTS`, `HOSTNAME` (`src/server/index.ts`), `MAX_QUERY_LENGTH`, `SCAN_RESULT_CAP`, `DEFAULT_MAX_LOADED` (`src/server/project-registry.ts`)","sub":[]},{"text":"Message tables are SCREAMING_SNAKE too: `LOAD_STATUS_MESSAGES` (`src/cli/target-path.ts`), `NOTICE_UNREADABLE` (`src/server/settings-model.ts`)","sub":[]},{"text":"Private class fields are plain `private readonly` (no `#` fields): `src/planning-repo/warnings.ts`","sub":[]}]},{"t":"label","text":"Types","value":""},{"t":"ul","items":[{"text":"PascalCase for types, interfaces and classes; no `I` prefix on interfaces (`SettingsStore`, `ParseWarning`, `FailedLoadStatus`)","sub":[]},{"text":"Use `type` aliases for unions and discriminated results: `export type LoadStatus = ...`, `export type MutateResult = { ok: true; ... } | { ok: false; ... }` (`src/server/settings-store.ts`)","sub":[]},{"text":"Use `interface` for object shapes and extension points: `export interface SettingsStore` (`src/server/settings-store.ts`), and option bags such as `ServerOptions` in `src/server/index.ts`","sub":[]},{"text":"Discriminate results on a `status` or `ok` literal field; never throw for expected load failures (see Error Handling)","sub":[]},{"text":"Domain types live in `src/domain/model.ts`; planning-repo contract types in `src/planning-repo/types.ts`","sub":[]}]}]},{"h":"Code Style","blocks":[{"t":"label","text":"Formatting","value":""},{"t":"ul","items":[{"text":"Prettier 3.9.6 with `.prettierrc`: single quotes, semicolons, `printWidth: 100`, `trailingComma: \"all\"`","sub":[]},{"text":"Run with `npm run format` (`prettier --write .`). Formatting is not enforced by a hook or pre-commit step","sub":[]},{"text":"Keep lines at or under 100 columns in new code; some existing files (notably `src/web/**` and tests) exceed this in long string literals and JSX attribute lists","sub":[]}]},{"t":"label","text":"TypeScript settings","value":""},{"t":"ul","items":[{"text":"`strict: true`, `verbatimModuleSyntax: true`, `module`/`moduleResolution: nodenext` (`tsconfig.json`)","sub":[]},{"text":"Use `import type { ... }` for type-only imports; the compiler rejects value imports of types under `verbatimModuleSyntax`","sub":[]},{"text":"Web code is type-checked with `tsconfig.web.json` (`jsx: react-jsx`, DOM lib); server code with `tsconfig.server.json`","sub":[]},{"text":"`npm run typecheck` runs both configs","sub":[]}]},{"t":"label","text":"Linting","value":""},{"t":"ul","items":[{"text":"ESLint 10 flat config at `eslint.config.js`","sub":[]},{"text":"Base: `@eslint/js` recommended + `typescript-eslint` recommended","sub":[]},{"text":"`@typescript-eslint/no-unused-vars` is an error with `argsIgnorePattern: '^_'`: prefix intentionally unused parameters with `_`","sub":[]},{"text":"`src/web/**` adds `eslint-plugin-react-hooks` recommended rules and browser globals; `src/server/**`, `src/cli/**`, `src/planning-repo/**`, `src/planning-fs/**` and `test/**` use Node globals","sub":[]},{"text":"Restricted import rule (NAV-09): in `src/web/**`, `Link`, `NavLink`, `useNavigate` and `useLocation` must not be imported from `react-router`. Use the wrappers in `src/web/nav.tsx`. Only `nav.tsx` and `src/web/app-router.tsx` are exempt","sub":[]},{"text":"Ignored: `dist/**`, `fixtures/**`, `test/__golden__/**`, `.planning/**`","sub":[]},{"text":"Run with `npm run lint`","sub":[]},{"text":"Suppressions are rare and narrow: the one `eslint-disable-next-line react-hooks/exhaustive-deps` is in `src/web/components/use-active-section.ts`. No `@ts-ignore` or `@ts-expect-error` appears in `src/` or `test/`","sub":[]},{"text":"`any` does not appear as a type annotation in source; use `unknown` and narrow","sub":[]}]},{"t":"label","text":"Exports","value":""},{"t":"ul","items":[{"text":"Named exports only. No `export default` appears anywhere in `src/` or `test/`. Keep it that way: `src/server/index.ts` exports `createApp`, `routesToApp`, `startServer` by name","sub":[]},{"text":"Re-exports are used to keep old import paths alive, for example `test/helpers/fixture-project.ts` re-exports loaders from `todo-corpus.ts`","sub":[]}]}]},{"h":"Import Organization","blocks":[{"t":"label","text":"Order (observed, not lint-enforced)","value":""},{"t":"ol","items":[{"text":"Node built-ins with `node:` prefix: `import { mkdtempSync } from 'node:fs'`","sub":[]},{"text":"Third-party packages: `hono`, `react`, `@base-ui/react/dialog`, `class-variance-authority`","sub":[]},{"text":"Project modules via relative paths with extensions, parents first then siblings: `../planning-repo/types.ts`, then `./settings-model.ts`","sub":[]},{"text":"`import type` lines are commonly grouped with the module they describe, not separated","sub":[]}]},{"t":"label","text":"Path Aliases","value":""},{"t":"ul","items":[{"text":"None. The project has no `@/` alias. Use relative paths with `.ts` / `.tsx` extensions","sub":[]},{"text":"`src/web/components/ui/dialog.tsx` imports `./button.tsx` for the same reason","sub":[]}]},{"t":"label","text":"Restricted imports","value":""},{"t":"ul","items":[{"text":"Router primitives come from `src/web/nav.tsx`, not `react-router`, inside `src/web/**` (see Linting)","sub":[]}]}]},{"h":"Error Handling","blocks":[{"t":"label","text":"Load and read paths never throw (D-12)","value":""},{"t":"ul","items":[{"text":"`PlanningRepository.load()` / `refresh()` return a `LoadStatus` value: `{ status: 'ok' }` or one of `not-a-gsd-project`, `path-not-found`, `permission-denied`, each with `pathChecked` and `message` (`src/planning-repo/types.ts`)","sub":[]},{"text":"Consumers switch on `status`; they do not wrap calls in `try`","sub":[]},{"text":"The `LOAD_STATUS_MESSAGES` table in `src/cli/target-path.ts` maps statuses to user-facing text","sub":[]}]},{"t":"label","text":"Per-artifact degradation (D-11)","value":""},{"t":"ul","items":[{"text":"A parse failure does not drop the artifact. It attaches a `ParseWarning` (`path`, `stage`, `message`, `salvage`) produced by `WarningCollector` in `src/planning-repo/warnings.ts`","sub":[]},{"text":"`stage` is one of `read`, `frontmatter`, `structured-extraction`, `assembly`","sub":[]},{"text":"`salvage` describes what survived, for example \"body intact, frontmatter unavailable\"","sub":[]},{"text":"Never store the caught error object or its stack in a warning. Store the message string","sub":[]}]},{"t":"label","text":"Frontmatter","value":""},{"t":"ul","items":[{"text":"Wrap `gray-matter` (via `src/planning-repo/frontmatter.ts`) in try/catch; on failure keep the whole file as body with empty frontmatter. Do not call `matter()` unguarded","sub":[]}]},{"t":"label","text":"Settings store","value":""},{"t":"ul","items":[{"text":"`src/server/settings-store.ts` returns `MutateResult` (`{ ok: true, state } | { ok: false, state, reason }`) from `mutate()` and never throws for I/O problems it can describe. `read()` \"never throws\"","sub":[]},{"text":"Errors caught as `catch (err)` and reduced to a reason string","sub":[]}]},{"t":"label","text":"Throwing","value":""},{"t":"ul","items":[{"text":"Throw `Error` only for programmer or configuration faults that must stop startup or a test run:","sub":["`src/server/settings-store.ts`: `LABELORE_CONFIG_DIR must be set when Labelore runs under vitest`","`src/server/index.ts`: `--port requires a numeric value`, `Unknown option: ...`, `Invalid port: ...`","`test/helpers/fixture-project.ts`: a missing fixture throws instead of skipping"]},{"text":"The CLI entry (`src/server/index.ts`) catches the top-level error, prints `error.message`, and exits non-zero","sub":[]}]},{"t":"label","text":"HTTP responses","value":""},{"t":"ul","items":[{"text":"JSON errors use `c.json({ error: '...' }, status)` from Hono, e.g. `c.json({ error: 'API route not found' }, 404)` in `src/server/index.ts`","sub":[]}]}]},{"h":"Logging","blocks":[{"t":"label","text":"Framework","value":"`console` only. No logging library is present."},{"t":"label","text":"Where logging is allowed","value":""},{"t":"ul","items":[{"text":"Startup and CLI output: `src/server/index.ts` (`Labelore is reading ...`, `Open ${baseUrl}`), `src/cli/snapshot.ts` (`console.error` for usage, `console.log` for JSON)","sub":[]},{"text":"Non-fatal remote warnings: `console.warn` in `src/server/remote-source.ts`","sub":[]},{"text":"Do not add logging inside `src/planning-repo/**` or `src/planning-fs/**`; report through `ParseWarning` or `LoadStatus` so the data path stays pure","sub":[]}]}]},{"h":"Comments","blocks":[{"t":"label","text":"File headers","value":""},{"t":"ul","items":[{"text":"Almost every source file opens with a multi-line `//` header that states the file's role, the decisions it implements, and the constraints it keeps. Example: `src/server/settings-store.ts` names the one permitted `node:fs` writer and the test that enforces it","sub":[]},{"text":"Decision and requirement IDs are cited inline: `D-09`, `D-12`, `PLAT-02`, `NAV-09`, `SEC-05`, `TEST-01`, and quick-task IDs such as `quick-260923-jxp`. Keep citing them when you extend a file","sub":[]}]},{"t":"label","text":"When to Comment","value":""},{"t":"ul","items":[{"text":"Explain why a rule exists, especially invariants that a test enforces. `src/web/nav.tsx` explains why links go through the wrappers","sub":[]},{"text":"Put a comment at the top of an exported function when the behavior is subtle, using `/** ... */` (see `src/planning-repo/warnings.ts`, `src/server/index.ts` `createApp`)","sub":[]},{"text":"Section dividers use `// ---- name ----` or long `// -----` rules in long files (`test/web/class-vocabulary.test.ts`, `src/planning-repo/handlers/verification-report.ts`)","sub":[]},{"text":"Do not restate what the code does","sub":[]}]},{"t":"label","text":"JSDoc/TSDoc","value":""},{"t":"ul","items":[{"text":"`/** */` on exported functions, interface members and type aliases where a contract matters (`SettingsStore.read`, `ServerOptions.autoPort`)","sub":[]},{"text":"No `@param` / `@returns` tags are used. Prose only","sub":[]}]}]},{"h":"Function Design","blocks":[{"t":"label","text":"Size","value":"Parsers in `src/planning-repo/handlers/*.ts` are long and split into many small helpers in the same file. Prefer adding a helper to the file over growing a handler's main function."},{"t":"label","text":"Parameters","value":""},{"t":"ul","items":[{"text":"Positional for one to three arguments","sub":[]},{"text":"Options bags for many optional values: `ServerOptions` in `src/server/index.ts`, `createApp(source, production, staticRoot, commitLog)` with defaults","sub":[]},{"text":"Dependency injection through parameters with defaults: `defaultSettingsDir(env = process.env, home = homedir())` in `src/server/settings-store.ts`. Tests pass `MemorySettingsStore` or `InMemoryPlanningFilesystem`","sub":[]}]},{"t":"label","text":"Return Values","value":""},{"t":"ul","items":[{"text":"Pure functions return data; repository and store methods return discriminated results (see Error Handling)","sub":[]},{"text":"Nullable lookups return `null`, not `undefined`: `findSection(...)` in `src/planning-repo/handlers/state.ts` returns `{...} | null`, and `tryParseFrontmatter` in `src/planning-repo/frontmatter.ts` follows the same rule","sub":[]},{"text":"`undefined` is reserved for absent optional fields in options bags","sub":[]}]},{"t":"label","text":"Classes","value":""},{"t":"ul","items":[{"text":"Use a class when state is held across calls: `WarningCollector`, `ProjectRegistry`, `ProjectRuntime`, `FileSettingsStore`, `RemoteSnapshotSource`, `InMemoryPlanningFilesystem`, `LocalFsPlanningFilesystem`","sub":[]},{"text":"Use plain functions for everything else","sub":[]}]}]},{"h":"Module Design","blocks":[{"t":"label","text":"Exports","value":"Named exports; one primary concept per file. Types that belong to a module are exported from that module (`src/server/settings-model.ts` exports `ParsedSettings`, `SettingsState`)."},{"t":"label","text":"Barrel Files","value":""},{"t":"ul","items":[{"text":"Used in one place: `src/planning-repo/handlers/index.ts` (the handler registry)","sub":[]},{"text":"Otherwise import from the concrete file. Do not add new barrels","sub":[]}]},{"t":"label","text":"Boundaries that are enforced by tests","value":""},{"t":"ul","items":[{"text":"Only two modules may import `node:fs` under `src/` (`src/planning-fs/local-fs.ts` and `src/server/settings-store.ts`); `test/portability.test.ts` checks this","sub":[]},{"text":"The planning reader (`src/planning-repo/**`, `src/planning-fs/**`) is read-only and does not import the settings store","sub":[]},{"text":"Web code fetches the server through `src/web/api.ts` (the fetch layer referenced by the React Query hooks)","sub":[]}]}]},{"h":"Web (React) Conventions","blocks":[{"t":"label","text":"Components","value":""},{"t":"ul","items":[{"text":"Function components with named exports, `.tsx` extension, JSX runtime `react-jsx` (no `import React` needed)","sub":[]},{"text":"`forwardRef` is used for wrapper components that forward refs to DOM elements (`src/web/nav.tsx` `Link`, `NavLink`)","sub":[]},{"text":"Props types are declared inline or as a local `interface`, not exported unless a test uses them","sub":[]}]},{"t":"label","text":"UI primitives (shadcn base-sera)","value":""},{"t":"ul","items":[{"text":"Live in `src/web/components/ui/` (`button.tsx`, `dialog.tsx`, `toast.tsx`), built on `@base-ui/react` primitives","sub":[]},{"text":"Each primitive sets `data-slot`\u0001 on its root element","sub":[]},{"text":"Variants use `class-variance-authority` `cva(...)` with `variant` and `size` keys and `defaultVariants`","sub":[]},{"text":"Class merging uses `twMerge(clsx(...))`. Each ui file defines its own local `cn` helper (`src/web/components/ui/button.tsx`, `dialog.tsx`); do not import a shared `cn`","sub":[]},{"text":"Corners are squared: `rounded-none` is the base for buttons. Keep this when adding primitives","sub":[]}]},{"t":"label","text":"Styling vocabulary","value":""},{"t":"ul","items":[{"text":"Page and component classes are plain CSS class names defined in `src/web/styles/globals.css`, not CSS modules","sub":[]},{"text":"Every class used in `src/web/views`, `src/web/pages` and `src/web/components` must appear in the table of `docs/design-language.md`, or in the reserved `view-<kind>-<suffix>` namespace. `test/web/class-vocabulary.test.ts` enforces this. To add a class, add a row to `docs/design-language.md` first","sub":[]},{"text":"Tokens are oklch CSS custom properties (`--primary`, `--muted-foreground`, `--card-veil`, `--status-square-size`). Do not hard-code hex or hue values in components; use a token. Derive tints from existing tokens with `color-mix`","sub":[]},{"text":"Tone is expressed with a `data-tone`\u0001 attribute on `.status-chip` / `.status-square`, not extra class names","sub":[]}]},{"t":"label","text":"State and data","value":""},{"t":"ul","items":[{"text":"Server state flows through `@tanstack/react-query` (`src/web/api.ts` is the single fetch layer)","sub":[]},{"text":"Local UI state uses `useState` and hooks; no global state library","sub":[]}]}]},{"h":"Server (Hono) Conventions","blocks":[{"t":"ul","items":[{"text":"One Hono app per concern: `createProjectApi` (`src/server/project-api.ts`), `createRegistryApp` (`src/server/registry-api.ts`), composed with `app.route('/api', ...)`","sub":[]},{"text":"Routes are thin; logic lives in `src/presentation/**` (pure view models) and `src/server/**` (I/O-adjacent)","sub":[]},{"text":"Every mutating or request-facing route passes through the request guard in `src/server/request-guard.ts` (Host and same-origin checks)","sub":[]},{"text":"Read-only is the rule: nothing writes inside a target project. The only write is Labelore's own `settings.json`, via `SettingsStore`","sub":[]}]}]},{"h":"Naming of Presentation Concepts","blocks":[{"t":"ul","items":[{"text":"Route and URL helpers are in `src/presentation/routes.ts` and `src/presentation/route-table.ts`; add new URL grammar there, not inline in components","sub":[]},{"text":"Slugs come from `src/presentation/project-slug.ts` (`slugOf`, `allocateSlug`)","sub":[]},{"text":"Presentation modules are pure TypeScript with no React and no `node:` imports (`src/presentation/*.ts`)","sub":[]}]}]},{"h":"Where to Follow These Rules","blocks":[{"t":"ul","items":[{"text":"New planning artifact type: add `src/planning-repo/handlers/<type>.ts`, register it in `handlers/index.ts`, and return `ParseWarning`s instead of throwing","sub":[]},{"text":"New server route: add it to the Hono app that owns the area; keep the `.ts` extension in imports","sub":[]},{"text":"New UI class: add the row to `docs/design-language.md` first, then use it","sub":[]},{"text":"New React link or navigation: use `src/web/nav.tsx`","sub":[]}]}]}],"footer":"Convention analysis: 2026-11-04"},"tidemark":{"front":{},"comment":"<!-- made-up example · derived from agents/gsd-codebase-mapper.md · gsd-core 1.19.0 -->","title":"Coding Conventions","date":"2026-10-27","intro":[],"sections":[{"h":"Naming Patterns","blocks":[{"t":"label","text":"Files","value":""},{"t":"ul","items":[{"text":"Server modules are lower-case, one noun per file (`clash.ts`, `window.ts`)","sub":[]},{"text":"Board components live in a PascalCase folder with an `index.tsx`","sub":[]}]},{"t":"label","text":"Functions","value":""},{"t":"ul","items":[{"text":"camelCase, verb first (`buildWindow`, `findClash`)","sub":[]}]},{"t":"label","text":"Variables","value":""},{"t":"ul","items":[{"text":"camelCase; constants in SCREAMING_SNAKE_CASE only at module top level","sub":[]}]},{"t":"label","text":"Types","value":""},{"t":"ul","items":[{"text":"PascalCase, no `I` prefix","sub":[]}]}]},{"h":"Code Style","blocks":[{"t":"label","text":"Formatting","value":""},{"t":"ul","items":[{"text":"Prettier 3, default settings plus single quotes","sub":[]},{"text":"Two-space indent","sub":[]}]},{"t":"label","text":"Linting","value":""},{"t":"ul","items":[{"text":"ESLint 9 with the recommended TypeScript rules","sub":[]},{"text":"No unused exports outside `index.ts` files","sub":[]}]}]},{"h":"Import Organization","blocks":[{"t":"label","text":"Order","value":""},{"t":"ol","items":[{"text":"Node built-ins","sub":[]},{"text":"Packages","sub":[]},{"text":"Project modules by relative path","sub":[]}]},{"t":"label","text":"Path Aliases","value":""},{"t":"ul","items":[{"text":"None","sub":[]}]}]},{"h":"Error Handling","blocks":[{"t":"label","text":"Patterns","value":""},{"t":"ul","items":[{"text":"Routes throw a `HarbourError` with a status code","sub":[]},{"text":"Never swallow an error in the store; let it reach the route handler","sub":[]}]}]},{"h":"Logging","blocks":[{"t":"label","text":"Framework","value":"pino"},{"t":"label","text":"Patterns","value":""},{"t":"ul","items":[{"text":"One info line per request, one warn line per refused request","sub":[]},{"text":"Never log an owner's email address","sub":[]}]}]},{"h":"Comments","blocks":[{"t":"label","text":"When to Comment","value":""},{"t":"ul","items":[{"text":"Say why a tide rule exists, not what the line does","sub":[]}]},{"t":"label","text":"JSDoc/TSDoc","value":""},{"t":"ul","items":[{"text":"Only on exports used across route groups","sub":[]}]}]},{"h":"Function Design","blocks":[{"t":"label","text":"Size","value":"Short enough to read without scrolling"},{"t":"label","text":"Parameters","value":"One options object after the second positional argument"},{"t":"label","text":"Return Values","value":"Plain values; failures are thrown, not returned"}]},{"h":"Module Design","blocks":[{"t":"label","text":"Exports","value":"Named exports only"},{"t":"label","text":"Barrel Files","value":"One `index.ts` per route group, nowhere else"}]}],"footer":"Last updated: 2026-10-27"}},"testing":{"labelore":{"front":{"last_mapped_commit":"717c8d7db3d75717948b08690df3a087fc01684d","last_mapped_at":"2026-11-04"},"comment":null,"title":"Testing Patterns","date":"2026-11-04","intro":[],"sections":[{"h":"Test Framework","blocks":[{"t":"label","text":"Runner","value":""},{"t":"ul","items":[{"text":"Vitest 4.1.11 (`package.json` devDependencies)","sub":[]},{"text":"Config: `vitest.config.ts`","sub":["`include: ['test/**/*.test.ts']`","`setupFiles: ['test/helpers/config-dir-setup.ts']`, which gives every worker its own throwaway `LABELORE_CONFIG_DIR` (decision D-09) so no run touches the real settings file"]},{"text":"No `environment: 'jsdom'`. Web code is tested as text and contract scans, not rendered in a DOM (no `.test.tsx` files exist)","sub":[]}]},{"t":"label","text":"E2E runner","value":""},{"t":"ul","items":[{"text":"Playwright Test 1.63.0 (`@playwright/test`)","sub":[]},{"text":"Config: `playwright.config.ts`","sub":[]},{"text":"Specs: `test/e2e/*.spec.ts`","sub":[]}]},{"t":"label","text":"Assertion Library","value":""},{"t":"ul","items":[{"text":"Vitest's built-in `expect` (Chai-style matchers: `toEqual`, `toBe`, `toMatch`, `toThrow`, `toBeLessThan`)","sub":[]},{"text":"Playwright's `expect` for browser specs","sub":[]}]},{"t":"label","text":"Run Commands","value":""},{"t":"fence","lang":"bash","text":"npm test                      # vitest run (all unit/contract tests)\nnpm run test:watch            # vitest (watch mode)\nnpm run test:gate             # node test/helpers/vitest-gate.mjs: fails on any skip, todo, failure, or zero tests\nnpm run test:gate -- test/server/refresh.test.ts   # gate a single file\nnpm run test:e2e              # playwright test (starts four servers, see E2E below)\nnpx playwright test -g \"copy-path\"                 # one e2e spec or title, the narrowest run\nnpm run typecheck             # tsc --noEmit on tsconfig.server.json and tsconfig.web.json\nnpm run lint                  # eslint .\nnpx vitest run test/web/class-vocabulary.test.ts   # one file"},{"t":"label","text":"Coverage","value":""},{"t":"ul","items":[{"text":"No coverage tool or script is configured. There is no `@vitest/coverage-*` dependency and no `coverage` key in `vitest.config.ts`","sub":[]},{"text":"Coverage requirement: none enforced","sub":[]}]}]},{"h":"Test File Organization","blocks":[{"t":"label","text":"Location","value":""},{"t":"ul","items":[{"text":"All unit and contract tests live in a top-level `test/` directory, separate from `src/`. Tests are never co-located with source","sub":[]},{"text":"Folders mirror the source layers:","sub":["`test/server/` for `src/server/**` (for example `test/server/refresh.test.ts`, `test/server/search-index.test.ts`, `test/server/settings-store.test.ts`)","`test/rendering/` for `src/rendering/**` (for example `test/rendering/ascii-tree.test.ts`, `test/rendering/markdown.test.ts`)","`test/presentation/` for `src/presentation/**` (for example `test/presentation/roadmap.test.ts`, `test/presentation/url-grammar.test.ts`)","`test/web/` for `src/web/**` (static contract checks, see Test Types)","`test/e2e/` for Playwright browser specs","Planning-repo handler tests sit at the root of `test/`, one per artifact type: `test/uat-session.test.ts`, `test/verification-report.test.ts`, `test/review-report.test.ts`, `test/todo-file.test.ts`","Root-level guards cover whole-repo rules: `test/no-skips.test.ts`, `test/portability.test.ts`, `test/token-guard.test.ts`, `test/made-up-examples.test.ts`, `test/fixture-leak.test.ts`"]},{"text":"Shared helpers: `test/helpers/` (see Fixtures and Factories)","sub":[]},{"text":"Golden outputs: `test/__golden__/` (`dense.json`), consumed by `test/snapshot.golden.test.ts`","sub":[]}]},{"t":"label","text":"Naming","value":""},{"t":"ul","items":[{"text":"`<subject>.test.ts`, kebab-case, matching the source module name where one exists: `test/rendering/lane-layout.test.ts` tests `src/rendering/lane-layout.ts`","sub":[]},{"text":"Handler guards use `<type>-handler-guard.test.ts` (for example `test/review-handler-guard.test.ts`, `test/uat-handler-guard.test.ts`)","sub":[]},{"text":"Playwright specs: `<feature>.spec.ts` in `test/e2e/`","sub":[]}]},{"t":"label","text":"Structure","value":""},{"t":"fence","lang":"","text":"test/\n├── helpers/            # shared builders, loaders, request helpers, source scanners\n├── fixtures/           # made-up planning projects: lendshed/, shapes/, dashboard/, debug/, ...\n├── __golden__/         # frozen snapshot JSON\n├── rendering/fixtures/ # ASCII diagram fixtures (*.txt)\n├── server/             # server unit tests\n├── presentation/       # view-model tests\n├── web/                # web contract tests (source-text scans)\n├── e2e/                # Playwright specs and app-url / fixture-server helpers\n└── *.test.ts           # planning-repo handler tests and root guards"}]},{"h":"Test Structure","blocks":[{"t":"label","text":"Suite Organization","value":""},{"t":"ul","items":[{"text":"`describe` groups one module or one behavior; nested `describe` for sub-behaviors. About 980 `describe(` blocks across 244 test files","sub":[]},{"text":"`it(` is the only test form in use. The codebase has about 4,000 `it(` blocks and no `test(` calls. Keep `it`","sub":[]},{"text":"`it` titles are full sentences in the past or present tense that state the observable outcome, often citing the decision or requirement they pin. Examples from the tree:","sub":["`it('yields three Milestone entries for a live milestone and two archived ones, each carrying its own phases', ...)`","`it('carries both fields separately and lets them disagree', ...)`","`it('falls back to the root <details> block per field when the per-milestone block leaves it empty', ...)`"]},{"text":"Header comment at the top of the file explains what the file pins and which IDs it covers (`test/server/refresh.test.ts`: \"Pins the POST /api/refresh contract ...\")","sub":[]}]},{"t":"label","text":"Standard shape","value":""},{"t":"fence","lang":"typescript","text":"import { describe, expect, it } from 'vitest';\nimport { createApp } from '../../src/server/index.ts';\nimport { buildSearchDocuments, tokenizeSearchText } from '../../src/server/search-index.ts';\n\nfunction waitForBuild(): Promise<void> {\n  return new Promise((resolve) => setImmediate(resolve));\n}\n\ndescribe('search index', () => {\n  it('returns no documents for a project with no artifacts', async () => {\n    // arrange with a make* builder, act, assert\n    expect(buildSearchDocuments(makeProject([], [])).length).toBe(0);\n  });\n});"},{"t":"label","text":"Patterns","value":""},{"t":"ul","items":[{"text":"Setup: builders named `make*` at the top of the file (`makeArtifact`, `makePhase`, `makeProject`, `makeSnapshot`). Each file re-declares its own builders with `Partial<T> & { path }` overrides rather than importing one shared factory. Keep that convention and spread `...overrides` last","sub":[]},{"text":"Teardown: `afterAll` / `afterEach` for temp directories, as in `test/web/class-vocabulary.test.ts` (`rm(tmpDir, { recursive: true, force: true })`)","sub":[]},{"text":"Shared `beforeEach` / `afterEach` / `beforeAll` calls: about 115 across the test tree","sub":[]},{"text":"Async ordering: wait for pending async index builds with `setImmediate` (`waitForBuild` in `test/server/search-index.test.ts`), not with fixed sleeps","sub":[]},{"text":"Assertions: prefer `toEqual` on whole structures and `toMatch` on text; use `toThrow` for the programmer-error throws listed in CONVENTIONS.md","sub":[]}]}]},{"h":"Test Types","blocks":[{"t":"label","text":"Unit tests (`test/rendering/`, `test/presentation/`, `test/*.test.ts`)","value":""},{"t":"ul","items":[{"text":"Pure function in, value out. Use the made-up Lendshed fixture or inline builders","sub":[]},{"text":"Parse behavior is tested against both realistic documents and malformed ones. Degradation tests assert the `ParseWarning` stage and salvage text, not thrown errors (see `test/degradation.test.ts`)","sub":[]}]},{"t":"label","text":"HTTP / server tests (`test/server/`)","value":""},{"t":"ul","items":[{"text":"Build the real Hono app with `createApp(source)` or `createRegistryApp(...)` and drive it with `app.request(...)`. No real socket is opened","sub":[]},{"text":"Guarded requests: `guardedRequest`, `guardedHeaders`, `testPolicy` from `test/helpers/guarded-request.ts` add the allowed Host and Origin headers the request guard expects","sub":[]},{"text":"`test/server/start-server.test.ts` checks that `startServer` (the production entry) never constructs the test-only single-runtime wrapper","sub":[]}]},{"t":"label","text":"Contract / source-scan tests (`test/web/`, `test/no-skips.test.ts`, `test/portability.test.ts`, `test/token-guard.test.ts`)","value":""},{"t":"ul","items":[{"text":"Read source files as text and assert structural rules. No AST tooling is used; the scanners are regex plus comment stripping","sub":[]},{"text":"Helpers: `blankComments` and `walkSource` from `test/helpers/source-scan.ts`; vocabulary loader and checks from `test/helpers/design-vocabulary.ts`","sub":[]},{"text":"Each scanner ships with a planted positive control: it writes a bad file into a `mkdtemp` folder and asserts that the scanner flags it. See `test/web/class-vocabulary.test.ts`, which writes a fixture and checks it fails","sub":[]},{"text":"Examples:","sub":["`test/web/class-vocabulary.test.ts`: every class in `src/web/views`, `src/web/pages`, `src/web/components` must be listed in `docs/design-language.md`","`test/web/nav-contract.test.ts`: no router link or navigate call bypasses `src/web/nav.tsx`","`test/web/css-source-order.test.ts`: CSS ordering constraints in `src/web/styles/globals.css`","`test/portability.test.ts`: only the two allowed modules import `node:fs` under `src/`"]}]},{"t":"label","text":"Golden tests","value":""},{"t":"ul","items":[{"text":"`test/snapshot.golden.test.ts` compares a full snapshot of the dense fixture against `test/__golden__/dense.json`","sub":[]},{"text":"Regenerate only when the output change is intended. Golden files are excluded from ESLint (`test/__golden__/**` in `eslint.config.js`)","sub":[]}]},{"t":"label","text":"Integration tests (`test/fixture-project.test.ts`, `test/fs-equivalence.test.ts`)","value":""},{"t":"ul","items":[{"text":"Load a real fixture root through `LocalFsPlanningFilesystem` and `PlanningRepository`, then assert on the whole snapshot","sub":[]}]},{"t":"label","text":"E2E tests (`test/e2e/`)","value":""},{"t":"ul","items":[{"text":"Playwright with a single `chromium` project (see `playwright.config.ts`)","sub":[]},{"text":"`testDir: 'test/e2e'`, `testMatch: '**/*.spec.ts'`, `fullyParallel: false`, `workers: 1`, `timeout: 60_000`, `expect.timeout: 10_000`","sub":[]},{"text":"Four servers start fresh on every run, each with its own temporary `LABELORE_CONFIG_DIR`:","sub":["port 4199: the repository itself (document-page sweep)","port 4198: the made-up Lendshed fixture (`test/fixtures/lendshed`), through the dev server","port 4197: the made-up Shapes fixture through the dev server (deep-reload spec)","port 4196: Shapes through the built app (`npm run build` then `npm start`)"]},{"text":"`reuseExistingServer: false`: Playwright never attaches to a running instance. The user's own instances on 4173 and 4174 are never touched","sub":[]},{"text":"Specs resolve URLs from the presentation payload (`projectApiUrl`, `artifactUrl` in `test/e2e/app-url.ts`) rather than hard-coding paths","sub":[]},{"text":"Run the narrowest spec or title with `-g` when iterating. A full e2e run is several minutes","sub":[]}]}]},{"h":"Mocking","blocks":[{"t":"label","text":"Framework","value":"Vitest `vi` (`vi.fn`, `vi.doMock`, `vi.resetModules`, `vi.stubEnv`, `vi.stubGlobal`, `vi.spyOn`). Used in 14 test files only."},{"t":"label","text":"Preferred approach: fakes, not mocks.","value":"The codebase ships in-memory implementations of its boundaries and tests use those:"},{"t":"ul","items":[{"text":"`InMemoryPlanningFilesystem` in `src/planning-fs/in-memory-fs.ts` for the planning read boundary","sub":[]},{"text":"`MemorySettingsStore` in `src/server/settings-store.ts` for Labelore's settings (`createApp` / `startServer` accept it through `ServerOptions.settings`)","sub":[]},{"text":"`createSource` and `remoteRunner` options on `ServerOptions` (tests only) replace the real local and ssh sources","sub":[]},{"text":"`FileSettingsStore` is always pointed at a `mkdtemp` directory in tests","sub":[]}]},{"t":"label","text":"Patterns","value":""},{"t":"fence","lang":"typescript","text":"// Environment: stub, then restore\nvi.stubEnv('LABELORE_CONFIG_DIR', dir);\n// ...\nvi.unstubAllEnvs();\n\n// Module isolation for a module that reads env at import time\nvi.resetModules();\nvi.doMock('../../src/server/settings-store.ts', () => ({ ... }));\nconst { defaultSettingsDir } = await import('../../src/server/settings-store.ts');\nvi.doUnmock('../../src/server/settings-store.ts');\n\n// Global stub\nvi.stubGlobal('fetch', vi.fn(async () => new Response('{}')));\nvi.unstubAllGlobals();"},{"t":"label","text":"What to Mock","value":""},{"t":"ul","items":[{"text":"The environment (`LABELORE_CONFIG_DIR`, `VITEST`) through `vi.stubEnv`","sub":[]},{"text":"External process or network boundaries (ssh, fetch) through the injected option, not `vi.mock`","sub":[]},{"text":"Time-dependent values by passing them in (`readAt`, `mtimeMs` are set in builders)","sub":[]}]},{"t":"label","text":"What NOT to Mock","value":""},{"t":"ul","items":[{"text":"The planning parser, handlers, or presentation layer. Tests run them for real on fixtures","sub":[]},{"text":"The filesystem for planning reads. Use `LocalFsPlanningFilesystem` on a fixture root or `InMemoryPlanningFilesystem`","sub":[]},{"text":"Hono: use `app.request` on the real app","sub":[]}]}]},{"h":"Fixtures and Factories","blocks":[{"t":"label","text":"Made-up planning projects (required pattern)","value":""},{"t":"ul","items":[{"text":"Realistic but fictional GSD projects live under `test/fixtures/`: `lendshed/`, `shapes/`, `dashboard/`, `debug/`, `learnings/`, `review/`, `todos/`, `verification/`","sub":[]},{"text":"The rule is enforced by `test/made-up-examples.test.ts`: every file of a rule kind must carry a marker, and each marked file must appear in `test/fixtures/README.md`","sub":["Frontmatter form: `made_up_example: true`, `derived_from: <path under ~/.claude>`, `gsd_core_version: <version>`","No-frontmatter form: first line `<!-- made-up example · derived from <path> · gsd-core <version> -->`"]},{"text":"The frozen `fixtures/dense` root is exempt by name. This repository's own `.planning/` is exempt because it holds real planning files","sub":[]},{"text":"`test/fixture-leak.test.ts` and `test/no-skips.test.ts` forbid tests that reach any real project on the machine","sub":[]}]},{"t":"label","text":"Fixture access","value":""},{"t":"ul","items":[{"text":"`test/helpers/fixture-project.ts` exports:","sub":["`FX_ROOT`, `FX_PLANNING`: absolute paths to the Lendshed project","`fxPath(relative)` and `fxRead(relative)`: throw when the file is missing","`loadProject(...)`: loads a `LoadedProject` (snapshot, presentation, reference registry, body lookup)","`loadFiles`, `planningFiles`"]},{"text":"`test/helpers/shapes-project.ts`, `test/helpers/from-directory.ts`, `test/helpers/fixture-roots.ts` load the other fixture roots","sub":[]},{"text":"`test/helpers/note-corpus.ts`, `todo-corpus.ts`, `research-fixtures.ts`, `project-research-fixtures.ts`, `security-synthetic.ts`, `diagram-grids.ts` build corpora for specific handlers","sub":[]}]},{"t":"label","text":"Missing fixtures fail, never skip","value":""},{"t":"ul","items":[{"text":"`test/helpers/fixture-project.ts` throws at import when `test/fixtures/lendshed/.planning` is absent","sub":[]},{"text":"`playwright.config.ts` calls `resolveFixtureRoot` at load time, which throws when a fixture is missing","sub":[]}]},{"t":"label","text":"Inline builders (common pattern)","value":""},{"t":"fence","lang":"typescript","text":"const PHASE_IDENTITY: PhaseIdentity = {\n  milestoneVersion: null,\n  number: '01',\n  projectCode: null,\n  slug: 'identity-slice',\n};"},{"t":"ul","items":[{"text":"Put constant identities and builder functions at the top of the test file, before the first `describe`","sub":[]}]}]},{"h":"Forbidden Test Constructs","blocks":[{"t":"p","text":"Enforced by `test/no-skips.test.ts` (scans every test file, comments blanked):"},{"t":"ul","items":[{"text":"`it.skip`, `test.skip`, `describe.skip`, `.todo`, `.only`, `.fixme`, `.skipIf`, `.runIf`","sub":[]},{"text":"Disguised skips: `if (!existsSync(...)) return;` at the top of a test","sub":[]},{"text":"Absolute machine paths: `/home/<user>/codebases`, `~/Work`, `homedir()` calls, real checkout constants","sub":[]},{"text":"Absolute millisecond timing budgets (`expect(elapsed).toBeLessThan(<ms>)` with `performance.now`, `Date.now` or `bestOf`). Use the growth harness `test/helpers/growth.ts` for scaling checks instead","sub":[]},{"text":"Exemptions are a frozen list in `test/no-skips.test.ts` (four files, including `test/server/remote-source.test.ts` for a generous hang detector). Adding one is a decision, not an edit","sub":[]}]},{"t":"label","text":"Gate","value":"`npm run test:gate` (`test/helpers/vitest-gate.mjs`) runs vitest with a JSON reporter and exits 1 when any test is failed, skipped, todo, or when zero tests run. A green plain `npm test` can hide a skip. Use the gate for \"is it actually const svg = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MARK = '\u0001';
const VNS = '<span class="vns">Value not shown</span>';
// inline markdown: `code`, **bold**, *italic*; the withheld-value marker becomes the quiet mark.
const inline = (s) => {
  const codes = [];
  let t = String(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  t = esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[Number(i)])}</code>`).split(MARK).join(VNS);
};
const plainText = (s) => String(s).replace(/`/g, '').replace(/\*\*/g, '').split(MARK).join(' (value not shown)');

function liftTest(doc) {
  const fw = findSec(doc, /^test framework/);

function specRow(r) {
