  const dec = `<section class="b-dec"><header class="sec-head"><div><p class="eyebrow">${ic('gavel')}Settled</p><h2>Decisions</h2></div><div style="display:flex;gap:var(--space-5);align-items:end;flex-wrap:wrap">${all.length ? searchBox('Search decisions') : ''}<span class="count">${all.length}<small>${ui.phase ? `${decFiltered(d).length} in ${ui.phase === '—' ? 'no phase' : 'phase ' + esc(ui.phase)}` : 'logged'}</small></span></div></header>${hist}${tl}</section>`;
  // Round 3: the pace section sits between Decisions and the bottom row.
  const pace = PACE[state.v] ? PACE[state.v](d) : '';
  return `${band}${dec}${pace}<section class="b-low">${onDeck(d)}${recentActivity(d)}</section>`;
}

// ================= C: two boards =================
function viewC(d) {
  const all = d.decisions ?? []; const f = decFiltered(d);
  const decBoard = `<section class="panel c-dec"><header class="sec-head"><div><p class="eyebrow">${ic('gavel')}Settled</p><h2>Decisions</h2></div><span class="count">${all.length}</span></header>${all.length ? `${searchBox('Search decisions')}${phaseChips(d)}` : ''}${!all.length ? noDecisions(d) : f.length ? `<ol class="rows">${take('dec', f).map((x) => decRow(x)).join('')}</ol>${showMore('dec', Math.min(LIMIT, f.length), f.length, 'decisions')}` : noMatch()}</section>`;
  const open = openBlk(d);
  const shown = blkFiltered(d);
  const card = (x) => { const k = 'b' + x.line; const o = ui.open.has(k); return `<button class="bcard${x.urgent && !x.resolved ? ' urgent' : ''}${x.resolved ? ' resolved' : ''}${o ? ' open' : ''}" data-toggle="${k}" aria-expanded="${o}"><span class="bm">${blkTag(x)}</span><span class="bt">${hl(inline(x.title))}</span>${o ? `${x.why ? `<span class="bw">${hl(inline(x.why))}</span>` : ''}<span class="row-links">${untagged(x) ? '<span class="src-sum none">Untagged</span>' : x.sources.map((s) => go(`${s.kind} ${s.label}`, s.path)).join('')}</span>` : srcSum(x)}</button>`; };
  const groups = []; for (const x of take('blk', shown, 6)) { const g = groups.at(-1); g && g.name === x.group ? g.items.push(x) : groups.push({ name: x.group, items: [x] }); }
  const blkBoard = open.length || ui.resolved
    ? `<section class="panel c-blk"><header class="sec-head"><div><p class="eyebrow" style="color:var(--destructive)">${ic('shield')}Unresolved</p><h2>Blockers</h2></div><span class="count">${open.length}</span></header>${groupChips(d, 'danger')}${shown.length ? `<div class="cards">${groups.map((g) => `${g.name && groups.length > 1 ? `<p class="kicker c-grp">${esc(g.name)}</p>` : ''}${g.items.map(card).join('')}`).join('')}</div>${showMore('blk', Math.min(6, shown.length), shown.length, 'blockers')}` : noMatch()}</section>`
    : `<section class="panel c-blk clear"><header class="sec-head"><div><p class="eyebrow">${ic('shield')}Unresolved</p><h2>Blockers</h2></div><span class="count">0</span></header><p class="empty">${ic('check')}${noBlockers(d)}${resolvedBlk(d).length ? ` ${resolvedBlk(d).length} marked resolved.` : ''}</p>${resolvedBlk(d).length ? `<div><button class="chip" data-resolved>Show resolved <b>${resolvedBlk(d).length}</b></button></div>` : ''}</section>`;
  return `<section class="c-boards">${decBoard}${blkBoard}</section><section class="c-low">${onDeck(d)}${recentLog(d)}</section>`;
}

// ================= Round 3 — Pace (on B) =================
// Rebuilt from every phase plan's own SUMMARY (duration + completed), not STATE.md's metrics table.
// The milestone chips scope everything; the trend compares minutes per task, recent plans vs the
// ones before them, so a run of big plans doesn't read as "slowing down".
const fmtMin = (m) => (m < 60 ? `${Math.round(m)} min` : `${Math.floor(m / 60)}h${Math.round(m % 60) ? ` ${Math.round(m % 60)}m` : ''}`);
const msOrder = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
function paceScope(d) {
  const all = d.pace.plans; const mss = [...new Set(all.map((p) => p.milestone).filter(Boolean))].sort(msOrder);
  const cur = d.pace.current && all.filter((p) => p.milestone === d.pace.current && p.min).length >= 4 ? d.pace.current : 'all';
  const ms = ui.ms ?? cur;
  return { mss, ms, plans: ms === 'all' ? all : all.filter((p) => p.milestone === ms) };
}
function paceStats(plans) {
  const timed = plans.filter((p) => p.min); const n = timed.length;
  const total = timed.reduce((a, p) => a + p.min, 0);
  const sorted = timed.map((p) => p.min).sort((a, b) => a - b);
  const median = n ? (n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2) : 0;
  const rate = (xs) => xs.reduce((a, p) => a + p.min, 0) / Math.max(1, xs.reduce((a, p) => a + (p.tasks || 1), 0));
  // Trend: median minutes-per-task of the last w plans vs the w before — a median, so one long plan
  // can't flip the verdict — and only with at least 4 plans on each side.
  const med = (xs) => { const v = xs.map((p) => p.min / (p.tasks || 1)).sort((a, b) => a - b); return v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2; };
  const w = Math.min(8, Math.floor(n / 2));
  let trend = null;
  if (w >= 4) {
    const recent = med(timed.slice(-w)); const prior = med(timed.slice(-2 * w, -w)); const change = (recent - prior) / prior;
    trend = { w, recent, prior, change, verdict: Math.abs(change) < 0.15 ? 'steady' : change < 0 ? 'faster' : 'slower' };
  }
  return { plans: plans.length, timed: n, untimed: plans.length - n, approx: timed.filter((p) => p.approx).length, total, avg: n ? total / n : 0, median, perTask: rate(timed), trend, max: timed.reduce((m, p) => (p.min > (m?.min ?? 0) ? p : m), null) };
}
const VERDICT = { faster: 'Getting faster', steady: 'Holding steady', slower: 'Slowing down' };
const trendLine = (t) => (t ? `The last ${t.w} plans took a median ${t.recent.toFixed(1)} min a task, ${t.verdict === 'steady' ? 'about the same as' : t.verdict === 'faster' ? `${Math.round(-t.change * 100)}% less than` : `${Math.round(t.change * 100)}% more than`} the ${t.w} before (${t.prior.toFixed(1)}).` : 'Too few timed plans to call a trend.');
const trendIcon = (t) => (!t ? '' : t.verdict === 'faster' ? ICONS_T.down : t.verdict === 'slower' ? ICONS_T.up : ICONS_T.flat);
const ICONS_T = {
  down: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 17h6v-6"/><path d="m22 17-8.5-8.5-5 5L2 7"/></svg>',
  up: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>',
  flat: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m15 8 4 4-4 4"/></svg>',
};
const trendChip = (t) => (t ? `<span class="trend-chip" data-verdict="${t.verdict}">${trendIcon(t)}${VERDICT[t.verdict]}</span>` : '<span class="trend-chip">Not enough plans yet</span>');
const tipOf = (p) => `${p.id} · Phase ${p.phase} ${p.phaseName}\n${p.min ? `${p.approx ? '~' : ''}${fmtMin(p.min)}` : 'No usable duration'}${p.tasks ? ` · ${plural(p.tasks, 'task')}` : ''}${p.date ? ` · ${fmtD(p.date)}` : ''}${p.milestone ? ` · ${p.milestone}` : ''}`;
function msChips(sc) {
  if (sc.mss.length < 2) return '';
  return `<div class="chips">${['all', ...sc.mss.slice().reverse()].map((m) => `<button class="chip${sc.ms === m ? ' on' : ''}" data-ms="${esc(m)}">${m === 'all' ? 'All milestones' : esc(m)}</button>`).join('')}</div>`;
}
// Consecutive runs of the same phase (within a milestone) — the bands and groups every chart uses.
function runs(timed) { const out = []; timed.forEach((p, i) => { const g = out.at(-1); const k = `${p.milestone}/${p.phase}`; g && g.k === k ? (g.to = i, g.items.push(p)) : out.push({ k, phase: p.phase, name: p.phaseName, ms: p.milestone, from: i, to: i, items: [p] }); }); return out; }
const niceCap = (v) => { const steps = [10, 20, 30, 40, 60, 90, 120, 180, 240, 360, 480]; return steps.find((s) => s >= v) ?? Math.ceil(v / 60) * 60; };
const p90 = (xs) => { const s = xs.slice().sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * 0.9))] ?? 0; };
const paceEmpty = (d) => `<section class="pace pace-empty"><header class="sec-head"><div><p class="eyebrow">${ic('clock')}Pace</p><h2>How fast plans land</h2></div></header><p class="empty">${ic('check')}No completed plan has a recorded duration yet.</p></section>`;
const paceHead = (sc, sub) => `<header class="sec-head"><div><p class="eyebrow">${ic('clock')}Pace</p><h2>${sub}</h2></div>${msChips(sc)}</header>`;

// P3's verdict: the stats said as one sentence, the trend word underlined in its tone.
function verdictSentence(st) {
  const t = st.trend; const word = t ? { faster: 'getting faster', steady: 'holding a steady pace', slower: 'slowing down' }[t.verdict] : null;
  return `<p class="pace-sentence"><b>${st.plans} ${st.plans === 1 ? 'plan' : 'plans'}</b> done in <b>${fmtMin(st.total)}</b> of execution — about <b>${fmtMin(st.avg)}</b> each${word ? `, and <b class="v" data-verdict="${t.verdict}">${word}</b>` : ''}.</p>`;
}

// P1 — rail + timeline: the total as the hero, every plan as a dot over time, a rolling median.
function paceRail(d, { sentence = false } = {}) {
  const sc = paceScope(d); const st = paceStats(sc.plans); if (!st.timed) return paceEmpty(d);
  const timed = sc.plans.filter((p) => p.min);
  const W = 760, H = 230, L = 34, R = 8, T = 26, B = 22; const cap = niceCap(Math.max(st.median * 3, p90(timed.map((p) => p.min))));
  const x = (i) => L + (timed.length === 1 ? (W - L - R) / 2 : (i / (timed.length - 1)) * (W - L - R)); const y = (m) => T + (1 - Math.min(m, cap) / cap) * (H - T - B);
  const bands = runs(timed).map((g, j) => { const x0 = j ? (x(g.from) + x(g.from - 1)) / 2 : L - 4; const x1 = g.to === timed.length - 1 ? W - R + 4 : (x(g.to) + x(g.to + 1)) / 2; return `<rect class="band${j % 2 ? ' alt' : ''}" x="${x0}" y="${T - 4}" width="${x1 - x0}" height="${H - T - B + 4}"/>${x1 - x0 > 26 ? `<text class="band-l" x="${(x0 + x1) / 2}" y="${T - 10}" text-anchor="middle">P${esc(g.phase)}</text>` : ''}`; }).join('');
  const roll = timed.map((_, i) => { const win = timed.slice(Math.max(0, i - 4), i + 1).map((p) => p.min).sort((a, b) => a - b); return win[Math.floor(win.length / 2)]; });
  const line = `<path class="roll" d="${roll.map((m, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(m).toFixed(1)}`).join('')}"/>`;
  const ticks = [0, cap / 2, cap].map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t >= 60 ? fmtMin(t).replace(' 0m', '') : t}</text>`).join('');
  const dots = timed.map((p, i) => `<g class="dot${p.approx ? ' approx' : ''}${p.min > cap ? ' over' : ''}" data-tip="${esc(tipOf(p))}"><circle class="hit" cx="${x(i)}" cy="${y(p.min)}" r="10"/><circle class="mk" cx="${x(i)}" cy="${y(p.min)}" r="4"/>${p.min > cap ? `<path class="over-mk" d="M${x(i) - 4},${y(cap) - 8}l4,-5l4,5"/>` : ''}</g>`).join('');
  return `<section class="pace pace-rail"><div class="pace-big"><p class="eyebrow">${ic('clock')}Pace</p><span class="n">${fmtMin(st.total)}</span><span class="quiet">of execution across ${plural(st.timed, 'timed plan')}</span><dl class="pace-dl"><dt>Plans completed</dt><dd>${st.plans}${st.untimed ? `<small>${st.untimed} untimed</small>` : ''}</dd><dt>Average</dt><dd>${fmtMin(st.avg)}<small>median ${fmtMin(st.median)}</small></dd><dt>Per task</dt><dd>${st.perTask.toFixed(1)} min</dd></dl></div><div class="pace-main">${msChips(sc) ? `<div class="pace-filter">${msChips(sc)}</div>` : ''}${sentence ? `<div class="pace-verdict p4">${verdictSentence(st)}<p class="pace-detail quiet">${trendLine(st.trend)}</p></div>` : `<div class="pace-verdict">${trendChip(st.trend)}<p>${trendLine(st.trend)}</p></div>`}<figure class="pace-fig"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes per plan, in completion order">${bands}${ticks}${line}${dots}</svg><figcaption><span><i class="k-dot"></i>One plan, minutes</span><span><i class="k-dot hollow"></i>Approximate (~)</span><span><i class="k-line"></i>Running median of 5</span>${timed.some((p) => p.min > cap) ? `<span>Above ${fmtMin(cap)}: drawn at the top</span>` : ''}</figcaption></figure></div></section>`;
}

// P2 — four tiles, then a skyline: one column per plan, grouped under its phase.
function paceSkyline(d) {
  const sc = paceScope(d); const st = paceStats(sc.plans); if (!st.timed) return paceEmpty(d);
  const timed = sc.plans.filter((p) => p.min); const groups = runs(timed);
  const H = 150; const cap = niceCap(p90(timed.map((p) => p.min)) * 1.15);
  const spark = (() => { const r = timed.map((_, i) => { const xs = timed.slice(Math.max(0, i - 4), i + 1); return xs.reduce((a, p) => a + p.min, 0) / xs.reduce((a, p) => a + (p.tasks || 1), 0); }); const mx = Math.max(...r), mn = Math.min(...r); return `<svg class="spark" viewBox="0 0 120 32" aria-hidden="true"><path d="${r.map((v, i) => `${i ? 'L' : 'M'}${(i / Math.max(1, r.length - 1)) * 116 + 2},${30 - ((v - mn) / Math.max(0.01, mx - mn)) * 26}`).join('')}"/><circle cx="118" cy="${30 - ((r.at(-1) - mn) / Math.max(0.01, mx - mn)) * 26}" r="3"/></svg>`; })();
  const tile = (label, value, sub, extra = '') => `<div class="tile"><span class="kicker">${label}</span><span class="tile-v">${value}</span>${sub ? `<span class="quiet">${sub}</span>` : ''}${extra}</div>`;
  const cols = groups.map((g) => `<div class="sky-g" style="flex:${g.items.length} 1 0;max-width:${g.items.length * 26 + 8}px"><div class="sky-cols">${g.items.map((p) => `<span class="sky-c${p.approx ? ' approx' : ''}${p === st.max ? ' max' : ''}" data-tip="${esc(tipOf(p))}" style="height:${Math.max(2, (Math.min(p.min, cap) / cap) * 100)}%">${p === st.max ? `<b>${fmtMin(p.min)}</b>` : ''}</span>`).join('')}</div><span class="sky-l" title="Phase ${esc(g.phase)} ${esc(g.name)}">${g.items.length > 1 || groups.length < 14 ? `P${esc(g.phase)}` : ''}</span></div>`).join('');
  return `<section class="pace pace-sky">${paceHead(sc, 'How fast plans land')}<div class="tiles">${tile('Plans completed', st.plans, st.untimed ? `${st.untimed} without a usable duration` : 'all timed')}${tile('Execution time', fmtMin(st.total), `across ${plural(st.timed, 'timed plan')}`)}${tile('Average plan', fmtMin(st.avg), `median ${fmtMin(st.median)} · ${st.perTask.toFixed(1)} min a task`)}${tile('Trend', st.trend ? VERDICT[st.trend.verdict] : '—', st.trend ? `${st.trend.change < 0 ? '−' : '+'}${Math.abs(Math.round(st.trend.change * 100))}% min a task, last ${st.trend.w}` : 'Too few timed plans', spark).replace('class="tile"><span class="kicker">Trend', `class="tile tile-trend" data-verdict="${st.trend?.verdict ?? ''}"><span class="kicker">Trend`)}</div><figure class="sky" style="--h:${H}px"><div class="sky-axis"><span>${fmtMin(cap)}</span><span>${fmtMin(cap / 2)}</span><span>0</span></div><div class="sky-plot">${cols}</div></figure><p class="sky-cap quiet">Each column is one plan in the order it finished, grouped by phase; fainter columns are approximate (~). Hover for the plan.</p></section>`;
}

// P3 — the verdict as a sentence, then one card per phase on a shared scale.
function paceSentence(d) {
  const sc = paceScope(d); const st = paceStats(sc.plans); if (!st.timed) return paceEmpty(d);
  const timed = sc.plans.filter((p) => p.min); const groups = runs(timed);
  const byPhase = []; for (const g of groups) { const h = byPhase.find((x) => x.k === g.k); h ? h.items.push(...g.items) : byPhase.push({ ...g, items: [...g.items] }); }
  const cap = niceCap(p90(timed.map((p) => p.min)) * 1.15);
  const longest = byPhase.reduce((m, g) => { const t = g.items.reduce((a, p) => a + p.min, 0); return t > m.t ? { g, t } : m; }, { g: null, t: 0 }).g;
  const t = st.trend; const sentence = verdictSentence(st);
  const cards = byPhase.slice().reverse().map((g) => { const tot = g.items.reduce((a, p) => a + p.min, 0); return `<article class="ph-card${g === longest && byPhase.length > 1 ? ' longest' : ''}"><header><span class="ph-n">${esc(g.phase)}</span><span class="ph-name">${esc(g.name)}</span>${sc.ms === 'all' && g.ms ? `<span class="kicker">${esc(g.ms)}</span>` : ''}</header><div class="ph-bars">${g.items.map((p) => `<span class="${p.approx ? 'approx' : ''}" data-tip="${esc(tipOf(p))}" style="height:${Math.max(3, (Math.min(p.min, cap) / cap) * 100)}%"></span>`).join('')}</div><dl><div><dt>Plans</dt><dd>${g.items.length}</dd></div><div><dt>Time</dt><dd>${fmtMin(tot)}</dd></div><div><dt>Average</dt><dd>${fmtMin(tot / g.items.length)}</dd></div></dl>${g === longest && byPhase.length > 1 ? '<span class="ph-flag">Most time</span>' : ''}</article>`; }).join('');
  return `<section class="pace pace-sent">${paceHead(sc, 'How fast plans land')}${sentence}<p class="pace-sub">${trendChip(t)}<span>${trendLine(t)}</span><span class="quiet">Median ${fmtMin(st.median)} · ${st.perTask.toFixed(1)} min a task${st.untimed ? ` · ${st.untimed} ${st.untimed === 1 ? 'plan has' : 'plans have'} no usable duration` : ''}</span></p><div class="ph-grid">${cards}</div><p class="sky-cap quiet">Newest phase first. Bars share one scale (top = ${fmtMin(cap)}); each bar is a plan, fainter = approximate.</p></section>`;
}
const PACE = { p1: paceRail, p2: paceSkyline, p3: paceSentence, p4: (d) => paceRail(d, { sentence: true }) };

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1600); }

function render() {
  const h = window.DOCS[state.doc]; const d = window.DASH[state.doc];
  const fid = document.activeElement?.id; const focused = fid === 'q' || fid === 'bq' ? document.activeElement.selectionStart : null;
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const frame = document.getElementById('frame');
  frame.style.maxWidth = state.width === 'full' ? '' : state.width + 'px';
  frame.classList.toggle('narrow-frame', state.width !== 'full');
  const body = (isB() ? viewB : { a: viewA, c: viewC }[state.v])(d);
  frame.innerHTML = `<header class="shell-header"><span class="brand-mark">L</span><span>Labelore</span><span class="crumb">/ ${esc(h.name ?? 'Untitled project')}</span><span class="shell-tabs"><b>Dashboard</b><span>Roadmap</span><span>Traceability</span></span></header><main class="page">${head(h)}${body}</main>`;
  if (focused != null) { const q = document.getElementById(fid); if (q) { q.focus(); q.setSelectionRange(focused, focused); } }
  document.querySelectorAll('.variant-tab').forEach((t) => t.classList.toggle('active', t.dataset.v === state.v));
  document.querySelectorAll('#sketch-tools button').forEach((b) => b.classList.toggle('on', b.dataset.doc === state.doc || b.dataset.theme === state.theme || b.dataset.width === state.width));
  const p = new URLSearchParams({ v: state.v, doc: state.doc }); if (state.theme !== 'dark') p.set('theme', state.theme); if (state.width !== 'full') p.set('width', state.width);
  history.replaceState(null, '', '?' + p);
}

// Hover tooltips for chart marks: any element with data-tip.
const tip = document.getElementById('tip');
document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (!t) { tip.classList.remove('on'); return; } tip.textContent = t.dataset.tip; tip.classList.add('on'); });
document.addEventListener('mousemove', (e) => { if (!tip.classList.contains('on')) return; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(window.innerWidth - r.width - 8, e.clientX + 14) + 'px'; tip.style.top = Math.max(8, e.clientY - r.height - 12) + 'px'; });
document.getElementById('doc-btns').innerHTML = Object.values(window.DASH).map((d) => `<button data-doc="${d.key}">${esc(d.label)}</button>`).join('');
document.addEventListener('input', (e) => { if (e.target.id === 'q' || e.target.id === 'bq') { ui[e.target.id] = e.target.value; ui.page[e.target.id === 'bq' ? 'blk' : 'dec'] = 0; if (e.target.id === 'q' && !isB()) ui.page.blk = 0; ui.all.delete('dec'); ui.all.delete('blk'); render(); } });
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.tagName === 'A') { e.preventDefault(); toast(`Would open ${t.dataset.to ?? 'the source'}`); return; }
  const ds = t.dataset;
  if (ds.v) { state.v = ds.v; ui = fresh(); }
  else if (ds.doc) { state.doc = ds.doc; ui = fresh(); }
  else if (ds.theme) state.theme = ds.theme;
  else if (ds.width) state.width = ds.width;
  else if (ds.toggle) ui.open.has(ds.toggle) ? ui.open.delete(ds.toggle) : ui.open.add(ds.toggle);
  else if (ds.mode) { ui.mode = ds.mode; ui.q = ''; }
  else if ('phase' in ds) { ui.phase = ds.phase || null; ui.all.delete('dec'); ui.page.dec = 0; }
  else if ('group' in ds) { ui.group = ds.group || null; ui.untagged = false; ui.all.delete('blk'); ui.page.blk = 0; }
  else if ('untagged' in ds) { ui.untagged = !ui.untagged; ui.group = null; ui.all.delete('blk'); ui.page.blk = 0; }
  else if (ds.page) { const [k, n] = ds.page.split(':'); ui.page[k] = +n; for (const o of [...ui.open]) if (o.startsWith(k[0])) ui.open.delete(o); }
  else if ('copy' in ds) { toast('Copied the blocker text'); return; }
  else if ('resolved' in ds) { ui.resolved = !ui.resolved; ui.page.blk = 0; }
  else if (ds.tab) ui.tab = ds.tab;
  else if (ds.ms) ui.ms = ds.ms;
  else if (ds.all) ui.all.has(ds.all) ? ui.all.delete(ds.all) : ui.all.add(ds.all);
  else if ('clear' in ds) ui[ds.clear] = '';
  else return;
  render();
});
render();
</script>
