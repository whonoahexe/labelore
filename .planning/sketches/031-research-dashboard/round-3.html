/* Sketch 031, round 3 refines round 2's E (five spines): E1 living spines (each closed spine
   carries its file's visual, vertically, and a peek on hover), E2 summary docked (the summary is a
   permanent left column: build order and gaps as the navigation; the main area shows a phase, a gap
   or a file), E3 fisheye (the open panel's neighbour opens halfway as a preview).
   Round 2 notes follow. Sketch 031, round 2. Round 1 (round-1.html: tabs, side rail, hub) was rejected: "be creative
   with everything, including the layout", and nothing links to the source. Every file gets a
   signature visual (summary: the build-order line; stack: layered slabs; features: a three-way
   split; architecture: the lane diagram; pitfalls: one square per pitfall, by the phase that
   prevents it). The variants arrange them in three very different ways:
   D: bento board, where a tile opens in place · E: five spines side by side, one open at a time ·
   F: chapters, each with a full-screen title card, read front to back with a live index. */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --hair: color-mix(in oklch, var(--border) 60%, transparent);
  --panel: color-mix(in oklch, var(--muted) 55%, var(--background));
  --figure-card-border: color-mix(in oklch, var(--foreground) 22%, var(--border));
  --figure-node-border: color-mix(in oklch, var(--primary) 40%, var(--border));
  --figure-wire: color-mix(in oklch, var(--muted-foreground) 60%, transparent);
  --figure-lane: color-mix(in oklch, var(--muted) 42%, transparent);
  --figure-icon: color-mix(in oklch, var(--foreground) 75%, transparent);
  --ink-soft: color-mix(in oklch, var(--foreground) 82%, var(--muted-foreground));
}
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-5); line-height: var(--lh-normal); padding-top: 3rem; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--font-mono); font-size: 0.86em; padding: 0 0.2em; background: color-mix(in oklch, var(--muted) 70%, transparent); overflow-wrap: anywhere; }
.dark code { background: color-mix(in oklch, var(--foreground) 9%, transparent); }
strong { font-weight: var(--fw-semibold); }
svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.kicker { color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.eyebrow { color: var(--primary); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }

/* ---------- sketch chrome ---------- */
#variant-nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; gap: var(--space-1); align-items: center; padding: var(--space-2) var(--space-4); background: var(--background); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; overflow-x: auto; }
#variant-nav .lbl { color: var(--muted-foreground); margin-right: var(--space-2); white-space: nowrap; }
.variant-tab { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; background: none; white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; color: var(--muted-foreground); text-decoration: none; }
.variant-tab:hover { color: var(--foreground); background: var(--state-hover); }
.variant-tab.active { color: var(--primary); border-color: var(--primary-border); background: var(--primary-tint); }
#frame { margin: 0 auto; background: var(--background); min-height: calc(100vh - 3rem); }
#frame.narrow-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.shell-header { display: flex; align-items: stretch; height: 3.75rem; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.shell-brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4); min-width: 0; }
.brand-mark { width: 2.25rem; height: 2.25rem; background: var(--primary); display: grid; place-items: center; color: white; font-weight: 700; flex: none; }
.shell-brand .proj { display: grid; text-transform: none; letter-spacing: normal; font-family: var(--font-sans); min-width: 0; }
.shell-brand .proj b { font-size: var(--fs-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shell-brand .proj small { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); }
.shell-nav { display: flex; margin-left: auto; margin-right: auto; }
.shell-nav span { display: flex; align-items: center; padding: 0 var(--space-4); border-left: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
.shell-nav span:last-child { border-right: 1px solid var(--border); }
.shell-nav span.on { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }
.narrow .shell-nav, .tablet .shell-nav { display: none; }

/* ---------- shared atoms ---------- */
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 0.55rem; height: 0.4rem; border: 1px solid currentColor; }
.meter i.on { background: currentColor; }
.meter i.half { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.conf { display: inline-flex; gap: var(--space-2); align-items: center; color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.text-btn { display: inline-flex; gap: var(--space-1-5); align-items: center; padding: var(--space-1) 0; border: 0; background: none; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.text-btn:hover { color: var(--primary); }
.text-btn svg { transition: transform .15s ease; }
.text-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
.icon-btn { display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; border: 1px solid var(--border); background: none; color: var(--muted-foreground); flex: none; }
.icon-btn:hover:not(:disabled) { color: var(--foreground); background: var(--state-hover); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--space-2) var(--space-6); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); }
.sec-head h3 { font-family: var(--font-mono); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.sec-head .tally { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.sec-note { margin-top: var(--space-3); max-width: 50rem; color: var(--muted-foreground); font-size: var(--fs-3); line-height: var(--lh-relaxed); }

/* ---------- visual: the build-order line (mini) ---------- */
.mline { --cols: 4; position: relative; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); row-gap: var(--space-3); }
.mline::before { content: ''; position: absolute; left: 0.8rem; right: 0.8rem; top: 0.8rem; border-top: 2px solid var(--primary); }
.mline .st { position: relative; z-index: 1; display: grid; justify-items: start; gap: var(--space-1-5); min-width: 0; }
.mline .sq { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border: 1px solid var(--primary); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-1); }
.mline .st.gated .sq { background: var(--primary); color: white; }
.mline .st.along .sq { border-style: dashed; border-color: var(--muted-foreground); }
.mline .st.along::before { content: ''; position: absolute; left: 0.8rem; top: calc(-1 * var(--space-3)); height: var(--space-3); border-left: 1px dashed var(--muted-foreground); }
.mline .nm { max-width: 100%; padding-right: var(--space-2); font-size: var(--fs-2); line-height: var(--lh-tight); color: var(--ink-soft); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mline.tiny .nm { display: none; }
.mline-key { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin-top: var(--space-3); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.mline-key span { display: inline-flex; gap: var(--space-1-5); align-items: center; }
.mline-key i { width: 0.6rem; height: 0.6rem; border: 1px solid var(--primary); }
.mline-key i.f { background: var(--primary); }
.mline-key i.d { border-style: dashed; border-color: var(--muted-foreground); }

/* ---------- visual: stack slabs ---------- */
.slabs { display: grid; gap: 3px; }
.slab { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: var(--space-3); align-items: baseline; padding: var(--space-2) var(--space-3); border: 1px solid var(--border); background: var(--background); }
.slab:first-child { border-color: var(--primary-border); background: var(--primary-tint); }
.slab:nth-child(2) { margin-left: var(--space-2); } .slab:nth-child(3) { margin-left: var(--space-4); } .slab:nth-child(n+4) { margin-left: var(--space-6); }
.slab .kicker { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slab .names { font-family: var(--font-mono); font-size: var(--fs-2); line-height: var(--lh-relaxed); color: var(--ink-soft); }
.slab .names b { color: var(--foreground); font-weight: var(--fw-medium); }
.slab .names em { font-style: normal; color: var(--muted-foreground); }

/* ---------- visual: features three-way split ---------- */
.split { display: flex; height: 2.4rem; gap: 3px; }
.split div { display: flex; align-items: center; padding: 0 var(--space-2-5); min-width: 2.6rem; font-family: var(--font-mono); font-size: var(--fs-4); }
.split .expected { background: color-mix(in oklch, var(--foreground) 14%, var(--background)); }
.split .differentiators { background: var(--primary); color: white; }
.split .anti { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in oklch, var(--destructive) 40%, transparent) 5px 6px); border: 1px solid color-mix(in oklch, var(--destructive) 45%, var(--border)); }
.split-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-3); }
.split-legend .kicker { display: flex; gap: var(--space-1-5); align-items: center; }
.split-legend .kicker i { width: 0.6rem; height: 0.6rem; flex: none; }
.split-legend .k-expected i { background: color-mix(in oklch, var(--foreground) 40%, var(--background)); }
.split-legend .k-differentiators i { background: var(--primary); }
.split-legend .k-anti i { border: 1px solid var(--destructive); }
.split-legend ul { display: grid; gap: var(--space-1); margin-top: var(--space-2); }
.split-legend li { font-size: var(--fs-2); line-height: var(--lh-snug); color: var(--ink-soft); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.split-legend .k-anti li { text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--destructive) 60%, transparent); }

/* ---------- visual: pitfalls, one square per pitfall, by the phase that prevents it ---------- */
.pits { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-4); }
.pit-group { display: grid; gap: var(--space-1-5); }
.pit-group .kicker { font-size: 0.58rem; }
.pit-row { display: flex; gap: 3px; }
.pit { display: grid; place-items: center; width: 1.7rem; height: 1.7rem; border: 1px solid color-mix(in oklch, var(--destructive) 55%, var(--border)); background: color-mix(in oklch, var(--destructive) 10%, transparent); font-family: var(--font-mono); font-size: 0.62rem; color: var(--foreground); }
.pit.first { background: var(--destructive); border-color: var(--destructive); color: white; }
.pits.big .pit { width: 2.3rem; height: 2.3rem; font-size: var(--fs-2); }
.pit-lead { margin-top: var(--space-3); font-size: var(--fs-3); line-height: var(--lh-snug); }
.pit-lead b { font-family: var(--font-mono); color: var(--destructive); font-weight: var(--fw-medium); margin-right: var(--space-1-5); }

/* ---------- visual: the lane diagram, as shipped ---------- */
.ld-thumb { width: 100%; height: auto; display: block; }
.ld-thumb .ln { fill: var(--figure-lane); }
.ld-thumb .nd { fill: var(--background); stroke: var(--figure-card-border); }
.ld-thumb .nd.client { stroke: var(--primary); }
.ld-thumb .ic { fill: var(--muted); }
.ld-thumb .ic.client { fill: var(--primary); }
.ld-thumb .tx { fill: color-mix(in oklch, var(--foreground) 45%, transparent); }
.ld-thumb .wr { fill: none; stroke: var(--figure-wire); stroke-width: 2; }
.ld-thumb .ar { fill: var(--figure-wire); }
.ld { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
.ld[data-panel="true"] { grid-template-columns: minmax(0, 1fr) 19rem; }
.ld-canvas { min-width: 0; overflow: hidden; border: 1px solid var(--border); background: var(--card); }
.ld-stage { position: relative; transform-origin: top left; }
.ld-lane { position: absolute; top: 0; bottom: 0; }
.ld-lane[data-shade="true"] { background: var(--figure-lane); }
.ld-lane-head { position: absolute; top: var(--space-2); left: var(--space-2); display: flex; gap: var(--space-1-5); align-items: center; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.ld-lane-head svg { width: 0.8rem; height: 0.8rem; }
.ld-wires { position: absolute; top: 0; left: 0; z-index: 1; overflow: visible; pointer-events: none; }
.ld-wire { fill: none; stroke: var(--figure-wire); stroke-width: 1.25; }
.ld-arrow { fill: var(--figure-wire); }
.ld-wire[data-hot="true"] { stroke: var(--primary); stroke-width: 1.5; }
.ld-arrow[data-hot="true"] { fill: var(--primary); }
.ld-wire-label { position: absolute; z-index: 1; overflow: hidden; padding: 0 var(--space-1); background: var(--card); color: var(--muted-foreground); font-size: var(--fs-2); font-style: italic; line-height: var(--lh-snug); text-overflow: ellipsis; white-space: nowrap; }
.ld-node { position: absolute; z-index: 2; display: grid; grid-template-columns: var(--space-7) minmax(0, 1fr); gap: var(--space-2-5); align-items: center; padding: var(--space-2) var(--space-2-5); border: 1px solid var(--figure-card-border); background: var(--background); text-align: left; transition: border-color 120ms ease, opacity 120ms ease; }
.ld-node:hover, .ld-node[data-hot="true"] { border-color: var(--figure-node-border); }
.ld-node[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
.ld-stage[data-selecting="true"] .ld-node:not([aria-pressed="true"]):not([data-hot="true"]) { opacity: 0.45; }
.ld-icon { display: grid; place-items: center; width: var(--space-7); height: var(--space-7); background: var(--muted); color: var(--figure-icon); }
.ld-icon svg { width: 0.95rem; height: 0.95rem; }
.ld-node[data-kind="client"] .ld-icon { background: var(--primary-tint); color: var(--primary); }
.ld-text { display: grid; gap: var(--space-0-5); min-width: 0; }
.ld-label { display: -webkit-box; overflow: hidden; font-size: var(--fs-4); font-weight: var(--fw-semibold); line-height: var(--lh-tight); overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.ld-label[data-code="true"] { font-family: var(--font-mono); font-size: var(--fs-3); }
.ld-sub { overflow: hidden; color: var(--muted-foreground); font-size: var(--fs-2); line-height: var(--lh-tight); text-overflow: ellipsis; white-space: nowrap; }
.ld-more { position: absolute; top: calc(-1 * var(--space-2)); right: var(--space-2); padding: 0 var(--space-1); border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); line-height: var(--lh-snug); }
.ld-panel { display: grid; align-content: start; gap: var(--space-2); padding: var(--space-4); border: 1px solid var(--border); background: var(--card); font-size: var(--fs-3); }
.ld-panel h4 { font-size: var(--fs-5); font-weight: var(--fw-semibold); }
.ld-panel .kicker { margin-top: var(--space-2); }
.ld-panel li { line-height: var(--lh-snug); }
.ld-panel li + li { margin-top: var(--space-1); }

/* ---------- summary content (the build order in full, gaps) ---------- */
.lede { max-width: 56rem; font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); }
.lede-more { display: grid; gap: var(--space-4); max-width: 56rem; margin-top: var(--space-4); font-size: var(--fs-4); line-height: var(--lh-relaxed); color: var(--ink-soft); }
.entry-gate { display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-5); padding: var(--space-3) var(--space-4); border: 1px dashed var(--primary-border); font-size: var(--fs-3); line-height: var(--lh-relaxed); }
.entry-gate svg { color: var(--primary); margin-top: 0.2rem; }
.entry-gate .kicker { color: var(--primary); display: block; margin-bottom: var(--space-1); }
.track-wrap { margin-top: var(--space-6); overflow-x: auto; padding-bottom: var(--space-2); }
.track { --cols: 4; display: grid; grid-template-columns: repeat(var(--cols), minmax(8.5rem, 1fr)); column-gap: var(--space-3); row-gap: var(--space-6); position: relative; min-width: calc(var(--cols) * 8.5rem); }
.track::before { content: ''; position: absolute; left: 0; right: 0; top: 1.15rem; border-top: 2px solid var(--primary); }
.lane-label { grid-column: 1 / -1; margin-bottom: calc(-1 * var(--space-4)); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.stn { position: relative; display: grid; align-content: start; gap: var(--space-2); padding: 0; border: 0; background: none; text-align: left; }
.stn .num { position: relative; z-index: 1; justify-self: start; display: grid; place-items: center; min-width: 2.3rem; height: 2.3rem; border: 1px solid var(--primary); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-4); transition: background .15s ease, color .15s ease; }
.stn.gated .num::after { content: ''; position: absolute; right: -0.35rem; top: -0.35rem; width: 0.6rem; height: 0.6rem; background: var(--primary); }
.stn .card { display: grid; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); background: var(--card); min-height: 6.2rem; transition: border-color .15s ease, background .15s ease; }
.stn .card b { font-weight: var(--fw-medium); font-size: var(--fs-4); line-height: var(--lh-snug); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.stn .marks { display: flex; flex-wrap: wrap; gap: var(--space-1-5); margin-top: auto; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.stn .marks span { display: inline-flex; gap: 0.3rem; align-items: center; }
.stn .marks .gate { color: var(--primary); }
.stn:hover .card { border-color: var(--primary-border); }
.stn[aria-pressed="true"] .card { border-color: var(--primary); background: var(--primary-tint); }
.stn[aria-pressed="true"] .num { background: var(--primary); color: white; }
.stn.alongside::before { content: ''; position: absolute; left: 1.15rem; top: calc(-1 * var(--space-6)); height: var(--space-6); border-left: 1px dashed var(--muted-foreground); }
.stn.alongside .num { border-style: dashed; border-color: var(--muted-foreground); }
.inspect { margin-top: var(--space-5); border: 1px solid var(--border); background: var(--card); }
.inspect-head { display: flex; justify-content: space-between; gap: var(--space-4); align-items: flex-start; padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); }
.inspect-head h4 { margin-top: var(--space-1-5); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.walk { display: flex; gap: var(--space-1); flex: none; }
.inspect-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-6) var(--space-8); padding: var(--space-6); }
.inspect-body .why { grid-column: 1 / -1; max-width: 52rem; font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); }
.facet .kicker { display: flex; gap: var(--space-1-5); align-items: center; margin-bottom: var(--space-2); }
.facet p, .facet li { font-size: var(--fs-4); line-height: var(--lh-relaxed); }
.facet ul { display: grid; gap: var(--space-1-5); }
.facet li { display: grid; grid-template-columns: 0.9rem minmax(0, 1fr); gap: var(--space-2); }
.facet li::before { content: ''; width: 0.4rem; height: 0.4rem; margin-top: 0.6rem; background: var(--muted-foreground); }
.facet.gate .kicker { color: var(--primary); }
.facet.gate p { padding-left: var(--space-3); border-left: 2px solid var(--primary); }
.facets-side { display: grid; gap: var(--space-6); align-content: start; }
.pf-chips { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.pf-chip { display: inline-flex; gap: 0.35rem; align-items: center; padding: 0.15rem var(--space-2); border: 1px solid color-mix(in oklch, var(--destructive) 55%, var(--border)); background: none; font-family: var(--font-mono); font-size: var(--fs-2); }

.why-order { margin-top: var(--space-4); }

.why-order li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); font-size: var(--fs-4); line-height: var(--lh-relaxed); counter-increment: w; }
.why-order li::before { content: counter(w, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); padding-top: 0.2rem; }
.gaps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-8); counter-reset: g; }
.gap { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--hair); counter-increment: g; }
.gap::before { content: counter(g, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-6); color: var(--primary); line-height: var(--lh-snug); }
.gap b { display: block; font-weight: var(--fw-semibold); font-size: var(--fs-4); }
.gap p { margin-top: var(--space-1); color: var(--ink-soft); font-size: var(--fs-3); line-height: var(--lh-relaxed); }
.sum-flow { display: grid; gap: var(--space-fluid-13); }

.stub b { color: var(--foreground); font-weight: var(--fw-medium); }

/* ===================== D: bento board ===================== */
.d-page { width: min(88rem, 100%); margin: 0 auto; padding: var(--space-fluid-9) var(--space-fluid-8) var(--space-28); }
.d-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: var(--space-4) var(--space-8); }
.d-top h1 { margin-top: var(--space-2); font-size: var(--fs-display-3); line-height: var(--lh-display); font-weight: var(--fw-medium); letter-spacing: var(--ls-tighter); }
.d-top .side { display: grid; justify-items: end; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.d-top .side b { color: var(--foreground); font-weight: var(--fw-medium); }
.board { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-fluid-9); }
.tile { position: relative; display: grid; align-content: start; gap: var(--space-4); padding: var(--space-5); border: 1px solid var(--border); background: var(--card); text-align: left; min-width: 0; transition: border-color .15s ease; }
button.tile:hover { border-color: var(--primary-border); }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.tile-top .t { display: inline-flex; gap: var(--space-2); align-items: center; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.tile-top .t svg { color: var(--primary); }
.tile-big { display: flex; gap: var(--space-3); align-items: baseline; }
.tile-big b { font-family: var(--font-mono); font-size: var(--fs-display-1); font-weight: var(--fw-medium); line-height: var(--lh-none); }
.tile-big span { color: var(--muted-foreground); font-size: var(--fs-3); }
.tile-line { font-size: var(--fs-4); line-height: var(--lh-relaxed); color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .open { position: absolute; right: var(--space-4); bottom: var(--space-4); color: var(--muted-foreground); }
button.tile:hover .open { color: var(--primary); }
.t-summary { grid-column: span 8; grid-row: span 2; background: color-mix(in oklch, var(--card) 70%, var(--primary-tint)); border-color: var(--primary-border); }
.t-summary .tile-line { -webkit-line-clamp: 5; font-size: var(--fs-fluid-1); color: var(--foreground); max-width: 48rem; }
.t-summary .tile-big b { font-size: var(--fs-display-3); color: var(--primary); }
.t-gaps { grid-column: span 4; grid-row: span 2; }
.t-gaps ol { display: grid; gap: var(--space-2); counter-reset: g; }
.t-gaps li { display: grid; grid-template-columns: 1.8rem minmax(0, 1fr); font-size: var(--fs-3); line-height: var(--lh-snug); counter-increment: g; }
.t-gaps li::before { content: counter(g, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--primary); }
.t-gaps .more { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.t-architecture { grid-column: span 7; grid-row: span 2; }
.t-stack { grid-column: span 5; }
.t-features { grid-column: span 5; }
.t-pitfalls { grid-column: span 12; }
.t-pitfalls .pit-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-8); align-items: end; }
.focus-strip { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: var(--space-2); margin-top: var(--space-fluid-9); position: sticky; top: 3rem; z-index: 5; padding: var(--space-2) 0; background: var(--background); }
.fs-tile { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-2-5); align-items: center; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: var(--card); text-align: left; }
.fs-tile:hover { border-color: var(--primary-border); }
.fs-tile[aria-current="true"] { border-color: var(--primary); background: var(--primary-tint); }
.fs-tile svg { color: var(--primary); }
.fs-tile b { font-weight: var(--fw-medium); font-size: var(--fs-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fs-tile .n { font-family: var(--font-mono); color: var(--muted-foreground); }
.fs-tile.board-btn { grid-template-columns: auto minmax(0, 1fr); }
.focus-body { margin-top: var(--space-8); padding: var(--space-fluid-9); border: 1px solid var(--border); background: var(--card); }
.focus-body > .fh { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-4); align-items: end; padding-bottom: var(--space-6); margin-bottom: var(--space-8); border-bottom: 1px solid var(--border); }
.focus-body > .fh h2 { margin-top: var(--space-2); font-size: var(--fs-display-1); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.focus-body .inspect, .focus-body .ld-canvas { background: var(--background); }
.focus-body .stn .card { background: var(--background); }

/* ===================== E: spines ===================== */
.e-wrap { display: grid; grid-template-rows: auto minmax(0, 1fr); height: calc(100vh - 3rem - 3.75rem); }
.e-bar { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); align-items: baseline; padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--border); }
.e-bar h1 { font-size: var(--fs-fluid-4); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.e-bar .m { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.e-bar .m b { color: var(--foreground); font-weight: var(--fw-medium); }
.spines { display: flex; min-height: 0; }
.spine { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; width: 5.25rem; flex: none; padding: var(--space-5) 0; border: 0; border-right: 1px solid var(--border); background: var(--background); text-align: center; transition: background .15s ease; }
.spine:hover { background: var(--state-hover); }
.spine .no { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.spine .vt { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; gap: var(--space-4); align-items: center; justify-content: flex-end; padding: var(--space-5) 0; font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); white-space: nowrap; }
.spine .vt svg { transform: rotate(180deg); color: var(--primary); width: 1.1rem; height: 1.1rem; }
.spine .ft { display: grid; justify-items: center; gap: var(--space-2); }
.spine .ft b { font-family: var(--font-mono); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); }
.spine .ft .meter { color: var(--primary); }
.spine.lead { background: color-mix(in oklch, var(--background) 80%, var(--primary-tint)); }
.leaf { flex: 1; min-width: 0; overflow-y: auto; border-right: 1px solid var(--border); }
.leaf-in { padding: var(--space-fluid-9) var(--space-fluid-8) var(--space-28); max-width: 76rem; }
.leaf-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-6); align-items: end; padding-bottom: var(--space-6); border-bottom: 1px solid var(--border); }
.leaf-head .no { font-family: var(--font-sans); font-weight: var(--fw-medium); font-size: var(--fs-display-3); line-height: var(--lh-display); color: var(--primary); letter-spacing: var(--ls-tighter); }
.leaf-head h2 { font-size: var(--fs-display-1); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.leaf-head .nums { display: flex; gap: var(--space-6); }
.leaf-head .nums div { display: grid; justify-items: end; }
.leaf-head .nums b { font-family: var(--font-mono); font-size: var(--fs-display-1); font-weight: var(--fw-medium); line-height: var(--lh-none); }
.leaf-head .nums small { margin-top: var(--space-1-5); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.leaf-verdict { margin-top: var(--space-6); max-width: 56rem; font-size: var(--fs-fluid-3); line-height: var(--lh-snug); letter-spacing: var(--ls-tight); }
.leaf-verdict.long { font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); letter-spacing: normal; }
.leaf-viz { margin-top: var(--space-8); }
.leaf-body { margin-top: var(--space-fluid-10); }

/* ===================== F: chapters ===================== */
.f-wrap { display: grid; grid-template-columns: 13rem minmax(0, 1fr); }
.f-index { position: sticky; top: 3rem; align-self: start; height: calc(100vh - 3rem); display: grid; align-content: start; gap: var(--space-1); padding: var(--space-8) var(--space-4); border-right: 1px solid var(--border); }
.f-index .kicker { margin-bottom: var(--space-3); }
.f-ix { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: var(--space-2); align-items: baseline; padding: var(--space-2) var(--space-2); border: 0; border-left: 2px solid var(--border); background: none; text-align: left; color: var(--muted-foreground); }
.f-ix:hover { color: var(--foreground); }
.f-ix .no { font-family: var(--font-mono); font-size: var(--fs-2); }
.f-ix b { font-weight: var(--fw-medium); }
.f-ix small { grid-column: 2; font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.f-ix[aria-current="true"] { border-left-color: var(--primary); color: var(--foreground); }
.f-ix[aria-current="true"] .no { color: var(--primary); }
.f-ix.read { border-left-color: color-mix(in oklch, var(--primary) 35%, var(--border)); }
.f-main { min-width: 0; }
.chapter { border-bottom: 1px solid var(--border); }
.cover { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-fluid-14); align-items: center; min-height: calc(100vh - 3rem - 3.75rem); padding: var(--space-fluid-10) var(--space-fluid-8); }
.chapter:first-child .cover { background: color-mix(in oklch, var(--background) 88%, var(--primary-tint)); }
.cover .no { font-family: var(--font-sans); font-weight: var(--fw-medium); font-size: clamp(5rem, 14vw, 12rem); line-height: 0.8; letter-spacing: var(--ls-tighter); color: var(--primary); }
.cover h2 { margin-top: var(--space-6); font-size: var(--fs-display-1); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.cover .proj { margin-top: var(--space-3); }
.cover .verdict { margin-top: var(--space-6); font-size: var(--fs-fluid-3); line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 40rem; }
.cover .verdict.long { font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); letter-spacing: normal; }
.cover .cm { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin-top: var(--space-6); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.cover .cm b { color: var(--foreground); font-weight: var(--fw-medium); }
.cover .art { min-width: 0; }
.cover .art .huge { font-family: var(--font-mono); font-size: var(--fs-display-3); line-height: var(--lh-display); }
.cover .art .huge small { display: block; margin-top: var(--space-2); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.ch-body { padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-fluid-14); }
.f-next { display: inline-flex; gap: var(--space-2); align-items: center; margin-top: var(--space-8); }

/* ---------- responsive: the Width tool narrows #frame (.tablet / .narrow) ---------- */
.narrow .d-page, .narrow .leaf-in { padding: var(--space-6) var(--space-4) var(--space-28); }
.narrow .d-top h1 { font-size: 2.6rem; }
.narrow .d-top .side { justify-items: start; }
.narrow .board, .tablet .board { grid-template-columns: minmax(0, 1fr); }
.narrow .tile, .tablet .tile { grid-column: 1 !important; grid-row: auto !important; }
.narrow .t-pitfalls .pit-wrap { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
.narrow .focus-strip, .tablet .focus-strip { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
.narrow .focus-body { padding: var(--space-4); }
.narrow .gaps, .tablet .gaps, .narrow .inspect-body, .tablet .inspect-body { grid-template-columns: minmax(0, 1fr); }
.narrow .inspect-head, .narrow .inspect-body { padding: var(--space-4); }
.narrow .track { grid-template-columns: minmax(0, 1fr); min-width: 0; row-gap: var(--space-2); }
.narrow .track::before, .narrow .lane-label { display: none; }
.narrow .stn { grid-template-columns: 2.3rem minmax(0, 1fr); grid-column: 1 !important; grid-row: auto !important; }
.narrow .stn .card { min-height: 0; }
.narrow .stn.alongside { margin-left: var(--space-6); }
.narrow .stn.alongside::before { display: none; }
.narrow .ld[data-panel="true"], .tablet .ld[data-panel="true"] { grid-template-columns: minmax(0, 1fr); }
.narrow .split-legend { grid-template-columns: minmax(0, 1fr); }
.narrow .slab { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); }
.narrow .slab:nth-child(n) { margin-left: 0; }
.narrow .e-wrap { height: auto; }
.narrow .spines { flex-direction: column; }
.narrow .spine { width: auto; grid-template-rows: none; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; justify-items: start; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-right: 0; border-bottom: 1px solid var(--border); }
.narrow .spine .vt { writing-mode: horizontal-tb; transform: none; padding: 0; font-size: var(--fs-6); }
.narrow .spine .vt svg { transform: none; }
.narrow .spine .ft { grid-auto-flow: column; gap: var(--space-3); align-items: center; }
.narrow .spine .ft b { font-size: var(--fs-5); }
.narrow .leaf { overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); }
.narrow .leaf-head { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
.narrow .leaf-head .no { font-size: 3rem; }
.narrow .leaf-head .nums div { justify-items: start; }
.narrow .f-wrap, .tablet .f-wrap { grid-template-columns: minmax(0, 1fr); }
.narrow .f-index, .tablet .f-index { position: sticky; top: 3rem; z-index: 5; height: auto; display: flex; overflow-x: auto; gap: var(--space-1); padding: var(--space-2) var(--space-3); background: var(--background); border-right: 0; border-bottom: 1px solid var(--border); }
.narrow .f-index .kicker, .tablet .f-index .kicker, .narrow .f-ix small { display: none; }
.narrow .f-ix, .tablet .f-ix { flex: none; border-left: 0; border-bottom: 2px solid var(--border); }
.narrow .f-ix[aria-current="true"], .tablet .f-ix[aria-current="true"] { border-bottom-color: var(--primary); }
.narrow .cover, .tablet .cover { grid-template-columns: minmax(0, 1fr); min-height: 0; }
.narrow .cover { padding: var(--space-8) var(--space-4); }
.narrow .ch-body { padding: var(--space-6) var(--space-4) var(--space-10); }
@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .tile { grid-column: 1 !important; grid-row: auto !important; }
  .gaps, .inspect-body { grid-template-columns: minmax(0, 1fr); }
  .shell-nav { display: none; }
  .f-wrap { grid-template-columns: minmax(0, 1fr); }
  .cover { grid-template-columns: minmax(0, 1fr); }
}


/* ===================== round 3: refining E ===================== */
.r3 { display: flex; height: calc(100vh - 3rem - 3.75rem); min-height: 34rem; }
.lsp { position: relative; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; justify-items: center; gap: var(--space-4); width: 6.75rem; flex: none; padding: var(--space-5) 0 var(--space-4); border: 0; border-right: 1px solid var(--border); background: var(--background); text-align: center; transition: background .15s ease; }
.lsp:hover, .lsp:focus-visible { background: color-mix(in oklch, var(--background) 92%, var(--foreground)); }
.lsp.after { border-right: 0; border-left: 1px solid var(--border); }
.lsp .no { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.lsp .vt { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; gap: var(--space-3); align-items: center; font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); white-space: nowrap; }
.lsp .vt svg { transform: rotate(180deg); color: var(--primary); width: 1.05rem; height: 1.05rem; }
.lsp .viz { align-self: center; display: grid; justify-items: center; width: 100%; min-height: 0; overflow: hidden; padding: 0 var(--space-3); }
.lsp .ft { display: grid; justify-items: center; gap: var(--space-1-5); }
.lsp .ft b { font-family: var(--font-mono); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); line-height: var(--lh-none); }
.lsp .ft small { font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); max-width: 5.5rem; line-height: var(--lh-snug); }
.lsp .ft .meter { color: var(--primary); }
.lsp.lead .vt { color: var(--primary); }
.peek { position: absolute; z-index: 20; top: var(--space-5); left: calc(100% + 1px); display: none; width: 19rem; padding: var(--space-4); border: 1px solid var(--primary-border); background: var(--card); text-align: left; box-shadow: 0 10px 30px color-mix(in oklch, black 35%, transparent); }
.lsp.after .peek { left: auto; right: calc(100% + 1px); }
.lsp:hover .peek, .lsp:focus-visible .peek { display: grid; gap: var(--space-2); }
.peek .kicker { display: flex; justify-content: space-between; }
.peek p { font-size: var(--fs-4); line-height: var(--lh-relaxed); }
.peek small { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
/* vertical visuals */
.vline { position: relative; display: grid; gap: 5px; justify-items: start; }
.vline::before { content: ''; position: absolute; left: 0.6rem; top: 0.3rem; bottom: 0.3rem; border-left: 2px solid var(--primary); }
.vline .sq { position: relative; display: grid; place-items: center; width: 1.25rem; height: 1.25rem; border: 1px solid var(--primary); background: var(--background); font-family: var(--font-mono); font-size: 0.55rem; }
.vline .sq.gated { background: var(--primary); color: white; }
.vline .sq.along { margin-left: 1.1rem; border-style: dashed; border-color: var(--muted-foreground); }
.vslabs { display: grid; gap: 3px; width: 100%; }
.vslabs span { display: flex; justify-content: space-between; padding: 0.2rem 0.35rem; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 0.58rem; color: var(--muted-foreground); }
.vslabs span b { color: var(--foreground); font-weight: var(--fw-medium); }
.vslabs span:first-child { border-color: var(--primary-border); background: var(--primary-tint); }
.vslabs span:nth-child(2) { margin-left: 3px; } .vslabs span:nth-child(3) { margin-left: 6px; } .vslabs span:nth-child(n+4) { margin-left: 9px; }
.vsplit { display: flex; flex-direction: column; gap: 3px; width: 1.9rem; height: 11rem; }
.vsplit div { display: grid; place-items: center; min-height: 1.4rem; font-family: var(--font-mono); font-size: 0.6rem; }

    const body = key === 'summary' ? summaryFull(P) : key === 'gaps' ? gapsHTML(P) : `${finding(P, key) ? `<p class="leaf-verdict ${plain(finding(P, key)).length > 200 ? 'long' : ''}" style="margin:0 0 var(--space-8)">${inline(finding(P, key))}</p>` : ''}${fileFull(P, key)}`;

// ===================== E: five spines =====================

// ===================== F: chapters =====================

// ===================== round 3: refining E =====================
function vViz(P, key) {
  if (key === 'summary') { const { at } = placement(P.s.phases); return `<div class="vline">${P.s.phases.map((ph, i) => `<span class="sq ${ph.gate ? 'gated' : ''} ${at[i].lane === 2 ? 'along' : ''}">${pad(ph.n)}</span>`).join('')}</div>`; }
  if (key === 'stack') return `<div class="vslabs">${P.docs.stack.groups.slice(0, 7).map((g) => `<span title="${esc(g.title)}"><em style="font-style:normal">${esc(g.title.slice(0, 4))}</em><b>${g.names.length}</b></span>`).join('')}</div>`;
  if (key === 'features') { const k = P.docs.features.kinds; const t = k.reduce((a, x) => a + x.names.length, 0) || 1; return `<div class="vsplit">${k.filter((x) => x.names.length).map((x) => `<div class="${x.kind}" style="flex:${x.names.length / t}">${x.names.length}</div>`).join('')}</div>`; }
  if (key === 'architecture') {
    // One square per component: its lane across, its layer down, with the wires as straight ticks.
    const { graph, layout: L } = P.docs.architecture.diagram;
    const lanes = L.lanes.length, layers = Math.max(...L.nodes.map((n) => n.layer)) + 1;
    const cw = 14, rh = 22, sq = 10;
    const pos = (id) => { const n = L.nodes[id]; const same = L.nodes.filter((m) => m.layer === n.layer && m.lane === n.lane); return [n.lane * cw + 2 + same.indexOf(n) * 4, n.layer * rh + 4]; };
    return `<svg class="varch" viewBox="0 0 ${lanes * cw} ${layers * rh}">${L.lanes.map((l, i) => (i % 2 ? `<rect class="ln" x="${i * cw}" y="0" width="${cw}" height="${layers * rh}"/>` : '')).join('')}${graph.edges.map((e) => { const [x1, y1] = pos(e.from), [x2, y2] = pos(e.to); return `<line x1="${x1 + sq / 2}" y1="${y1 + sq / 2}" x2="${x2 + sq / 2}" y2="${y2 + sq / 2}"/>`; }).join('')}${graph.nodes.map((n) => { const [x, y] = pos(n.id); return `<rect class="${n.kind}" x="${x}" y="${y}" width="${sq}" height="${sq}"/>`; }).join('')}</svg>`;
  }

}
function statsFor(P, key) {

  return [];
}
const strip = (rows) => `<div class="stat-strip">${rows.map(([n, l]) => `<div><b>${n}</b><small>${esc(l)}</small></div>`).join('')}</div>`;
function livingSpine(P, f, i, after) {

  return `<button class="lsp ${f.key === 'summary' ? 'lead' : ''} ${after ? 'after' : ''}" data-doc="${f.key}" aria-label="${f.label}: ${n} ${esc(l)}">

}
function summaryLeaf(P) {

function renderE3(P) {

// E2: the summary is a permanent dock; the main area shows what the dock (or a spine) points at.
function renderE2(P) {
  const s = P.s; const sel = state.e2;

  const { at } = placement(s.phases);

  const dock = `<aside class="dock" aria-label="Summary">

  } else if (sel.type === 'entry' && entry) {
    const em = /^\*\*(.+?)\*\*\s*(.*)$/.exec(entry);
    main = `<p class="kicker">Before phase 01</p><div class="big-no">${ICON(I.lock)}</div><h2>Entry gate</h2><p class="why">${inline(em ? `${em[1]} ${em[2]}` : entry)}</p>`;
  } else if (sel.type === 'file' && P.docs[sel.key]) {
    main = fileLeaf(P, sel.key, P.present.findIndex((f) => f.key === sel.key));
  } else {
    const note = s.preamble.find((p) => !/^\*\*/.test(p));
    main = `<p class="eyebrow">Read this first</p><h2 style="margin-top:var(--space-3)">Summary</h2>
      <p class="sl-lede ${plain(s.exec[0] || '').length > 260 ? 'long' : ''}">${inline(s.exec[0] || '')}</p>
      <div class="lede-more" style="margin-top:var(--space-6)">${s.exec.slice(1).map((p) => `<p>${inline(p)}</p>`).join('')}</div>
      ${strip(statsFor(P, 'summary'))}
      ${s.rationale.length ? `<div style="margin-top:var(--space-10)"><div class="sec-head"><h3>Why this order</h3><span class="tally">${note ? '' : ''}${s.rationale.length} reasons</span></div>${note ? `<p class="sec-note">${inline(note)}</p>` : ''}<div class="why-order"><ol>${s.rationale.map((r) => `<li><span>${inline(r)}</span></li>`).join('')}</ol></div></div>` : ''}
      ${P.present.length > 1 ? `<div style="margin-top:var(--space-10)"><div class="sec-head"><h3>The four files</h3><span class="tally">confidence</span></div><div class="conf-row">${P.present.filter((f) => f.key !== 'summary').map((f) => `<button data-e2="file" data-key="${f.key}"><span class="kicker" style="display:flex;justify-content:space-between">${f.label}${meter(levelOf(P, f.key))}</span><b>${keyNumber(P, f.key)[0]} ${esc(keyNumber(P, f.key)[1])}</b><small>${esc(confText(levelOf(P, f.key)))} confidence</small></button>`).join('')}</div></div>` : ''}`;
  }
  return `<div class="r3">${dock}${spines}<section class="main3"><div class="main3-in">${main}</div></section></div>`;
}

function render() {
  const P = project();
  if (!P.docs[state.doc]) state.doc = 'summary';
  if (state.focus && state.focus !== 'gaps' && !P.docs[state.focus]) state.focus = null;
  if (!P.docs[state.chapter]) state.chapter = 'summary';
  if (state.phase >= P.s.phases.length) state.phase = 0;
  if (state.node != null && (!P.docs.architecture || state.node >= P.docs.architecture.diagram.graph.nodes.length)) state.node = null;
  document.getElementById('shell-proj').textContent = P.name;
  document.getElementById('shell-sub').textContent = P.version ? `${P.version} · research` : 'research';
  document.getElementById('app').innerHTML = { D: renderD, E: renderE, F: renderF, E1: renderE1, E2: renderE2, E3: renderE3 }[state.variant](P);
  fitDiagrams();
}

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400); }
function openPitfall(n) {
  const P = project();
  if (!P.docs.pitfalls) return;
  if (state.variant === 'D') state.focus = 'pitfalls';
  if (['E', 'E1', 'E3'].includes(state.variant)) state.doc = 'pitfalls';
  if (state.variant === 'E2') state.e2 = { type: 'file', key: 'pitfalls', i: 0 };
  render();
  if (state.variant === 'F') goChapter('pitfalls');
  toast(`Pitfall ${pad(n)}: ${P.docs.pitfalls.titles[n - 1]}`);
}
function goChapter(key) { state.chapter = key; render(); document.getElementById(`ch-${key}`)?.scrollIntoView({ block: 'start' }); }

document.addEventListener('click', (e) => {
  const v = e.target.closest('button.variant-tab');
  if (v) { state.variant = v.dataset.v; document.querySelectorAll('button.variant-tab').forEach((b) => b.classList.toggle('active', b === v)); window.scrollTo({ top: 0 }); render(); return; }
  const tool = e.target.closest('#sketch-tools button');
  if (tool) {
    if (tool.dataset.project) { state.project = tool.dataset.project; state.phase = 0; state.node = null; }
    if (tool.dataset.files) state.files = tool.dataset.files;
    if (tool.dataset.theme) { state.theme = tool.dataset.theme; document.documentElement.classList.toggle('dark', state.theme === 'dark'); }
    if (tool.dataset.width) { state.width = tool.dataset.width; const f = document.getElementById('frame'); f.style.maxWidth = state.width === 'full' ? '' : state.width + 'px'; f.classList.toggle('narrow-frame', state.width !== 'full'); f.classList.toggle('narrow', state.width === '375'); f.classList.toggle('tablet', state.width === '768'); }
    syncTools(); render(); return;
  }
  const e2 = e.target.closest('[data-e2]');
  if (e2) { state.e2 = { type: e2.dataset.e2, i: +(e2.dataset.i || 0), key: e2.dataset.key }; render(); document.querySelector('.main3')?.scrollTo({ top: 0 }); return; }
  const pit = e.target.closest('[data-pit]');
  if (pit) { openPitfall(+pit.dataset.pit); return; }
  const node = e.target.closest('[data-node]');
  if (node) { const id = +node.dataset.node; state.node = state.node === id ? null : id; render(); return; }
  const foc = e.target.closest('[data-focus]');
  if (foc) { state.focus = foc.dataset.focus || null; render(); window.scrollTo({ top: 0 }); return; }
  const doc = e.target.closest('[data-doc]');
  if (doc) { state.doc = doc.dataset.doc; render(); return; }
  const ch = e.target.closest('[data-chapter]');
  if (ch) { goChapter(ch.dataset.chapter); return; }
  const ph = e.target.closest('[data-phase]');
  if (ph) { state.phase = +ph.dataset.phase; render(); return; }
  const walk = e.target.closest('[data-walk]');
  if (walk) { state.phase += +walk.dataset.walk; render(); document.querySelector(`[data-walk="${walk.dataset.walk}"]`)?.focus(); return; }
  const act = e.target.closest('[data-act]');
  if (act) { state[act.dataset.act] = !state[act.dataset.act]; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.variant === 'D' && state.focus) { state.focus = null; render(); return; }
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const dir = e.key === 'ArrowRight' ? 1 : -1;
  if (e.target.closest('.track, .inspect')) {
    const n = project().s.phases.length;
    const next = Math.max(0, Math.min(n - 1, state.phase + dir));
    if (next === state.phase) return;
    e.preventDefault(); state.phase = next; render(); document.querySelector(`[data-phase="${next}"]`)?.focus(); return;
  }
  if (['E', 'E1', 'E3'].includes(state.variant) && e.target.closest('.spines, .r3')) {
    const P = project(); const i = P.present.findIndex((f) => f.key === state.doc);
    const next = P.present[Math.max(0, Math.min(P.present.length - 1, i + dir))];
    e.preventDefault(); state.doc = next.key; render(); document.querySelector(`.spine[data-doc], .leaf`)?.focus?.();
  }
});
// Chapters: the index follows the chapter whose cover is nearest the top.
addEventListener('scroll', () => {
  if (state.variant !== 'F') return;
  let cur = state.chapter;
  document.querySelectorAll('.chapter').forEach((c) => { if (c.getBoundingClientRect().top < innerHeight * 0.4) cur = c.dataset.ch; });
  if (cur !== state.chapter) {
    state.chapter = cur;
    const P = project(); const at = P.present.findIndex((x) => x.key === cur);
    document.querySelectorAll('.f-ix').forEach((b, i) => { b.setAttribute('aria-current', String(b.dataset.chapter === cur)); b.classList.toggle('read', i < at); });
  }
}, { passive: true });
addEventListener('resize', fitDiagrams);
function syncTools() {
  document.querySelectorAll('#sketch-tools button').forEach((b) => b.classList.toggle('on', b.dataset.theme === state.theme || b.dataset.width === state.width || b.dataset.project === state.project || b.dataset.files === state.files));
}
syncTools();
render();
</script>
</body>
</html>
