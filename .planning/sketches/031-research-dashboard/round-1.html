<!doctype html>
<html lang="en" class="dark">
<head>

<style>
/* Sketch 031: one Research page for the five project research files (.planning/research/), the
   summary first, then STACK, FEATURES, ARCHITECTURE and PITFALLS. This round sketches the frame
   and the summary (suggested build order, gaps to address); the four file pages get their own
   sketches (032–035) inside the winning frame. Content is the real files (data.js, generated by
   gen-data.mjs) for two projects: Labelore (close to the template) and Cinedise Portal (dense).
   A: tabs under the research head · B: side rail of the five files · C: summary as a hub, the four
   files as cards that open their own pages. */
*, *::before, *::after { box-sizing: border-box; }
:root { --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border)); --hair: color-mix(in oklch, var(--border) 60%, transparent); --panel: color-mix(in oklch, var(--muted) 55%, var(--background)); }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-5); line-height: var(--lh-normal); padding-top: 3rem; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--font-mono); font-size: 0.86em; padding: 0 0.2em; background: color-mix(in oklch, var(--muted) 70%, transparent); overflow-wrap: anywhere; }
.dark code { background: color-mix(in oklch, var(--foreground) 9%, transparent); }
strong { font-weight: var(--fw-semibold); }
svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* ---------- sketch chrome ---------- */
#variant-nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; gap: var(--space-1); align-items: center; padding: var(--space-2) var(--space-4); background: var(--background); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; overflow-x: auto; }
#variant-nav .lbl { color: var(--muted-foreground); margin-right: var(--space-2); white-space: nowrap; }
.variant-tab { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; background: none; white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; color: var(--muted-foreground); }
.variant-tab:hover { color: var(--foreground); background: var(--state-hover); }
.variant-tab.active { color: var(--primary); border-color: var(--primary-border); background: var(--primary-tint); }
#frame { margin: 0 auto; background: var(--background); min-height: 100vh; }
#frame.narrow-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

/* ---------- app shell, as shipped (simplified) ---------- */
.shell-header { display: flex; align-items: stretch; height: 3.75rem; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.shell-brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-4); min-width: 0; }
.brand-mark { width: 2.25rem; height: 2.25rem; background: var(--primary); display: grid; place-items: center; color: white; font-weight: 700; flex: none; }
.shell-brand .proj { display: grid; text-transform: none; letter-spacing: normal; font-family: var(--font-sans); min-width: 0; }
.shell-brand .proj b { font-size: var(--fs-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shell-brand .proj small { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); }
.shell-nav { display: flex; margin-left: auto; margin-right: auto; }
.shell-nav span { display: flex; align-items: center; padding: 0 var(--space-4); border-left: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
.shell-nav span:last-child { border-right: 1px solid var(--border); }
.shell-nav span.on { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }
.narrow .shell-nav { display: none; }

.page { width: min(84rem, 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1-5); color: var(--muted-foreground); font-size: var(--fs-3); }
.crumbs button { padding: 0; border: 0; background: none; color: inherit; }
.crumbs button:hover { color: var(--foreground); text-decoration: underline; }
.eyebrow { color: var(--primary); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.kicker { color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; }

/* ---------- research head ---------- */
.r-head { margin-top: var(--space-8); }
.r-head h1 { margin-top: var(--space-3); font-size: var(--fs-display-3); line-height: var(--lh-display); font-weight: var(--fw-medium); letter-spacing: var(--ls-tighter); }
.r-head.compact h1 { font-size: var(--fs-display-1); line-height: var(--lh-tight); letter-spacing: var(--ls-tight); }
.r-meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); align-items: center; margin-top: var(--space-5); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.r-meta b { color: var(--foreground); font-weight: var(--fw-medium); }
.conf-chip { display: inline-flex; gap: var(--space-2); align-items: center; padding: var(--space-1) var(--space-2); border: 1px solid var(--primary-border); color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 0.55rem; height: 0.4rem; border: 1px solid currentColor; }
.meter i.on { background: currentColor; }
.meter i.half { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.domain { display: flex; gap: var(--space-4); margin-top: var(--space-4); max-width: 46rem; padding: var(--space-3) var(--space-4); background: var(--panel); border-left: 2px solid var(--border); font-size: var(--fs-3); line-height: var(--lh-relaxed); }
.domain .kicker { color: var(--primary); padding-top: 0.15rem; }
.lede { margin-top: var(--space-6); max-width: 54rem; font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); }
.lede-more { display: grid; gap: var(--space-4); max-width: 54rem; margin-top: var(--space-4); font-size: var(--fs-4); line-height: var(--lh-relaxed); color: color-mix(in oklch, var(--foreground) 85%, var(--muted-foreground)); }
.text-btn { display: inline-flex; gap: var(--space-1-5); align-items: center; margin-top: var(--space-3); padding: var(--space-1) 0; border: 0; background: none; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.text-btn:hover { color: var(--primary); }
.text-btn svg { transition: transform .15s ease; }
.text-btn[aria-expanded="true"] svg { transform: rotate(90deg); }

/* ---------- A: tab band ---------- */
.file-tabs { display: flex; margin-top: var(--space-10); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 3rem; z-index: 5; background: var(--background); }
.file-tab { display: flex; gap: var(--space-2-5); align-items: center; padding: var(--space-3-5) var(--space-5); border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; transition: color .15s ease, background .15s ease; }
.file-tab:hover { color: var(--foreground); background: var(--state-hover); }
.file-tab[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--primary); }
.file-tab svg { width: 0.95rem; height: 0.95rem; }
.file-tab .meter { color: var(--muted-foreground); }
.file-tab[aria-selected="true"] .meter, .file-tab[aria-selected="true"] svg { color: var(--primary); }
.file-tab.first { padding-right: var(--space-6); }
.tab-sep { flex: none; width: 1px; margin: var(--space-3) var(--space-2); background: var(--border); }
.tab-body { margin-top: var(--space-10); }

/* ---------- summary: rail + main ---------- */
.sum { display: grid; grid-template-columns: 19rem minmax(0, 1fr); gap: var(--space-fluid-14); align-items: start; }
.sum.no-rail { grid-template-columns: minmax(0, 1fr); }
.rail { position: sticky; top: 7.5rem; display: grid; gap: var(--space-6); padding-right: var(--space-fluid-3); border-right: 1px solid var(--border); }
.big-box { display: flex; gap: var(--space-4); padding: var(--space-5); border: 1px solid var(--primary-border); background: var(--card); }
.big-box::before { content: ''; flex: none; width: 3px; background: var(--primary); }
.big-box .n { font-family: var(--font-mono); font-size: var(--fs-display-3); line-height: var(--lh-none); color: var(--primary); letter-spacing: var(--ls-tight); }
.big-box p { margin-top: var(--space-3); font-weight: var(--fw-semibold); }
.big-box small { display: block; margin-top: var(--space-1); color: var(--muted-foreground); font-size: var(--fs-3); }
.stats { display: grid; }
.stats div { display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-2-5) 0; border-bottom: 1px solid var(--hair); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.stats dt { color: var(--muted-foreground); }
.stats dd { text-align: right; }
.files { display: grid; gap: var(--space-1); }
.file-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: var(--background); text-align: left; transition: border-color .15s ease, background .15s ease; }
.file-row:hover { border-color: var(--primary-border); background: var(--primary-tint); }
.file-row svg { color: var(--muted-foreground); }
.file-row b { display: block; font-weight: var(--fw-medium); font-size: var(--fs-4); }
.file-row small { color: var(--muted-foreground); font-size: var(--fs-2); }
.file-row .meter { color: var(--primary); }

.main { display: grid; gap: var(--space-fluid-13); min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--space-2) var(--space-6); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); }
.sec-head h2 { font-family: var(--font-mono); font-size: var(--fs-fluid-4); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.sec-head .tally { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.sec-note { margin-top: var(--space-3); max-width: 50rem; color: var(--muted-foreground); font-size: var(--fs-3); line-height: var(--lh-relaxed); }

/* ---------- suggested build order: the track ---------- */
.entry-gate { display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-5); padding: var(--space-3) var(--space-4); border: 1px dashed var(--primary-border); font-size: var(--fs-3); line-height: var(--lh-relaxed); }
.entry-gate svg { color: var(--primary); margin-top: 0.2rem; }
.entry-gate .kicker { color: var(--primary); display: block; margin-bottom: var(--space-1); }
.track-wrap { margin-top: var(--space-6); overflow-x: auto; padding-bottom: var(--space-2); }
.track { --cols: 4; display: grid; grid-template-columns: repeat(var(--cols), minmax(8.5rem, 1fr)); column-gap: var(--space-3); row-gap: var(--space-6); position: relative; min-width: calc(var(--cols) * 8.5rem); }
.track::before { content: ''; position: absolute; left: 0; right: 0; top: 1.15rem; border-top: 1px solid var(--border); }
.lane-label { grid-column: 1 / -1; margin-bottom: calc(-1 * var(--space-4)); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.stn { position: relative; display: grid; align-content: start; gap: var(--space-2); padding: 0; border: 0; background: none; text-align: left; }
.stn .num { position: relative; z-index: 1; justify-self: start; display: grid; place-items: center; min-width: 2.3rem; height: 2.3rem; padding: 0 var(--space-1-5); border: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-4); transition: border-color .15s ease, background .15s ease, color .15s ease; }
.stn .card { display: grid; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); background: var(--card); min-height: 6.2rem; transition: border-color .15s ease, background .15s ease; }
.stn .card b { font-weight: var(--fw-medium); font-size: var(--fs-4); line-height: var(--lh-snug); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.stn .marks { display: flex; flex-wrap: wrap; gap: var(--space-1-5); margin-top: auto; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.stn .marks span { display: inline-flex; gap: 0.3rem; align-items: center; }
.stn .marks .gate { color: var(--primary); }
.stn:hover .card { border-color: var(--primary-border); }
.stn:hover .num { border-color: var(--primary-border); }
.stn[aria-pressed="true"] .card { border-color: var(--primary); background: var(--primary-tint); }
.stn[aria-pressed="true"] .num { border-color: var(--primary); background: var(--primary); color: white; }
.stn.alongside::before { content: ''; position: absolute; left: 1.15rem; top: calc(-1 * var(--space-6)); height: var(--space-6); border-left: 1px dashed var(--border); }
.stn.alongside .num { border-style: dashed; }

/* inspector for the chosen phase */
.inspect { margin-top: var(--space-5); border: 1px solid var(--border); background: var(--card); }
.inspect-head { display: flex; justify-content: space-between; gap: var(--space-4); align-items: flex-start; padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); }
.inspect-head h3 { margin-top: var(--space-1-5); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.walk { display: flex; gap: var(--space-1); flex: none; }
.icon-btn { display: grid; place-items: center; width: 2rem; height: 2rem; padding: 0; border: 1px solid var(--border); background: none; color: var(--muted-foreground); }
.icon-btn:hover:not(:disabled) { color: var(--foreground); background: var(--state-hover); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.inspect-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-6) var(--space-8); padding: var(--space-6); }
.inspect-body .why { grid-column: 1 / -1; max-width: 52rem; font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); }
.facet .kicker { display: flex; gap: var(--space-1-5); align-items: center; margin-bottom: var(--space-2); }
.facet p, .facet li { font-size: var(--fs-4); line-height: var(--lh-relaxed); }
.facet ul { display: grid; gap: var(--space-1-5); }
.facet li { display: grid; grid-template-columns: 0.9rem minmax(0, 1fr); gap: var(--space-2); }
.facet li::before { content: ''; width: 0.4rem; height: 0.4rem; margin-top: 0.6rem; background: var(--muted-foreground); }
.facet.gate .kicker { color: var(--primary); }
.facet.gate p { padding-left: var(--space-3); border-left: 2px solid var(--primary); }
.facets-side { display: grid; gap: var(--space-6); align-content: start; }
.pf-chips { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.pf-chip { display: inline-flex; gap: 0.35rem; align-items: center; padding: 0.15rem var(--space-2); border: 1px solid var(--border); background: none; font-family: var(--font-mono); font-size: var(--fs-2); }
button.pf-chip:hover { border-color: var(--primary-border); color: var(--primary); }
.flag-line { display: flex; gap: var(--space-2); align-items: baseline; }
.why-order { margin-top: var(--space-4); }
.why-order ol { display: grid; gap: var(--space-2); margin-top: var(--space-3); counter-reset: w; max-width: 54rem; }
.why-order li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); font-size: var(--fs-4); line-height: var(--lh-relaxed); counter-increment: w; }
.why-order li::before { content: counter(w, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); padding-top: 0.2rem; }

/* ---------- gaps to address ---------- */
.gaps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-8); counter-reset: g; }
.gap { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--space-3); padding: var(--space-4) 0; border-bottom: 1px solid var(--hair); counter-increment: g; }
.gap::before { content: counter(g, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-6); color: var(--primary); line-height: var(--lh-snug); }
.gap b { display: block; font-weight: var(--fw-semibold); font-size: var(--fs-4); }
.gap p { margin-top: var(--space-1); color: color-mix(in oklch, var(--foreground) 82%, var(--muted-foreground)); font-size: var(--fs-3); line-height: var(--lh-relaxed); }

/* ---------- back matter: one chip row ---------- */
.also { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding-top: var(--space-5); border-top: 1px solid var(--border); }
.also .kicker { margin-right: var(--space-2); }
.src-chip { display: inline-flex; gap: var(--space-1-5); align-items: center; padding: 0.2rem var(--space-2-5); border: 1px solid var(--border); background: none; font-size: var(--fs-3); }
.src-chip:hover { border-color: var(--primary-border); color: var(--primary); }
.src-chip small { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); }

/* ---------- a file page (placeholder body this round) ---------- */
.doc-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-6); align-items: end; }
.doc-head h2 { margin-top: var(--space-2); font-size: var(--fs-display-1); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.doc-verdict { margin-top: var(--space-5); max-width: 52rem; font-size: var(--fs-fluid-3); line-height: var(--lh-snug); letter-spacing: var(--ls-tight); }
.doc-verdict.long { font-size: var(--fs-fluid-1); line-height: var(--lh-relaxed); letter-spacing: normal; }
.doc-numbers { display: flex; gap: var(--space-8); }
.doc-numbers div { display: grid; text-align: right; }
.doc-numbers b { font-family: var(--font-mono); font-size: var(--fs-display-1); font-weight: var(--fw-medium); line-height: var(--lh-none); }
.doc-numbers div:first-child b { color: var(--primary); }
.doc-numbers small { margin-top: var(--space-1-5); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.stub { margin-top: var(--space-8); padding: var(--space-8) var(--space-6); border: 1px dashed var(--border); color: var(--muted-foreground); font-size: var(--fs-4); line-height: var(--lh-relaxed); }
.stub b { color: var(--foreground); }
.stub ul { display: grid; gap: var(--space-1); margin-top: var(--space-3); }
.stub li::before { content: '→ '; color: var(--primary); }
.pager { display: flex; justify-content: space-between; gap: var(--space-4); margin-top: var(--space-10); padding-top: var(--space-5); border-top: 1px solid var(--border); }
.pager button { display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); background: none; text-align: left; min-width: 12rem; }
.pager button:last-child { text-align: right; margin-left: auto; }
.pager button:hover { border-color: var(--primary-border); background: var(--primary-tint); }
.pager b { font-weight: var(--fw-medium); }

/* ---------- B: side rail of the five files ---------- */
.rb { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); gap: var(--space-fluid-14); align-items: start; margin-top: var(--space-10); }
.rb-rail { position: sticky; top: 4.5rem; display: grid; gap: var(--space-1); }
.rb-rail .kicker { margin: 0 0 var(--space-2); }
.rb-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-3-5); border: 1px solid transparent; border-left: 2px solid var(--border); background: none; text-align: left; transition: background .15s ease, border-color .15s ease; }
.rb-item:hover { background: var(--state-hover); }
.rb-item[aria-selected="true"] { border-left-color: var(--primary); background: var(--primary-tint); }
.rb-item svg { color: var(--muted-foreground); width: 1.05rem; height: 1.05rem; }
.rb-item[aria-selected="true"] svg { color: var(--primary); }
.rb-item b { display: block; font-weight: var(--fw-medium); }
.rb-item small { display: block; color: var(--muted-foreground); font-size: var(--fs-2); font-family: var(--font-mono); letter-spacing: var(--ls-wider); text-transform: uppercase; margin-top: 0.15rem; }
.rb-item .cnt { font-family: var(--font-mono); font-size: var(--fs-6); color: var(--muted-foreground); }
.rb-item[aria-selected="true"] .cnt { color: var(--primary); }

<script src="data.js"></script>
<script>
const ICON = (d) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I = {
  summary: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  stack: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  features: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
  architecture: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
  pitfalls: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  flask: '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
  right: '<path d="m9 18 6-6-6-6"/>', left: '<path d="m15 18-6-6 6-6"/>',
  out: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
  parallel: '<path d="M8 3v18"/><path d="M16 3v18"/>',
};
const FILES = [
  { key: 'summary', label: 'Summary', file: 'SUMMARY.md' },
  { key: 'stack', label: 'Stack', file: 'STACK.md', next: 'the decision, the recommended stack, alternatives considered', sketch: '034' },
  { key: 'features', label: 'Features', file: 'FEATURES.md', next: 'the feature landscape (expected, differentiators, anti-features), competitor feature analysis', sketch: '033' },
  { key: 'architecture', label: 'Architecture', file: 'ARCHITECTURE.md', next: 'the system overview as the lane diagram, the recommended project structure (no rationale), anti-patterns, the suggested build order as a graph', sketch: '032' },
  { key: 'pitfalls', label: 'Pitfalls', file: 'PITFALLS.md', next: 'what matters most, without a wall of text: severity, the phase each pitfall belongs to, warning signs', sketch: '035' },
];

const state = { variant: 'A', project: 'cinedise', files: 'all', theme: 'dark', width: 'full', doc: 'summary', phase: 0, more: false, why: false };
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
const plain = (s) => String(s ?? '').replace(/\*\*|`/g, '');
const pad = (n) => String(n).padStart(2, '0');
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const day = (iso) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ''); return m ? `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : iso; };

// ---------- what the page reads ----------
function project() {
  const p = window.RESEARCH[state.project];
  const docs = { ...p.docs };
  if (state.files === 'no-pitfalls') delete docs.pitfalls;
  if (state.files === 'summary-only') for (const k of ['stack', 'features', 'architecture', 'pitfalls']) delete docs[k];
  const s = docs.summary;
  // "Cinedise Portal, milestone v3.0 Studio Media Workflow" → name + milestone
  const m = /^(.+?),\s*milestone\s+(v[\d.]+)\s+(.+)$/i.exec(s.project || '');
  return { docs, s, name: m ? m[1] : s.project, version: m ? m[2] : null, milestone: m ? m[3] : null, present: FILES.filter((f) => docs[f.key]) };
}
function meter(lv) {
  const n = { HIGH: 3, 'MEDIUM-HIGH': 2.5, MEDIUM: 2, 'LOW-MEDIUM': 1.5, 'MEDIUM-LOW': 1.5, LOW: 1 }[lv] ?? 0;
  return `<span class="meter" aria-label="${esc(lv || 'unstated')} confidence">${[1, 2, 3].map((i) => `<i class="${n >= i ? 'on' : n >= i - 0.5 ? 'half' : ''}"></i>`).join('')}</span>`;
}
const confText = (lv) => (lv ? lv.toLowerCase().replace('-', '–') : 'unstated');
// A file's level: the summary's Confidence Assessment row first, then the file's own header.
function levelOf(P, key) {
  const row = P.s.areas.find((a) => a.area.toLowerCase().startsWith(key.slice(0, 5)));
  return row?.level || P.docs[key]?.confidence.level || null;
}
function keyNumber(P, key) {
  const d = P.docs[key];
  if (!d) return null;
  if (key === 'summary') return [P.s.phases.length, 'phases suggested'];
  const [label, n] = d.numbers[0];
  return [n, label];
}
// Delivers: a list, or one long "a; b; c" paragraph split at its top-level semicolons.
function deliverItems(ph) {
  if (ph.delivers.length !== 1) return ph.delivers;
  const out = []; let cur = '', depth = 0, tick = false;
  for (const ch of ph.delivers[0]) {
    if (ch === '`') tick = !tick;
    if (!tick && ch === '(') depth++;
    if (!tick && ch === ')') depth--;
    if (ch === ';' && !tick && depth === 0) { out.push(cur.trim()); cur = ''; } else cur += ch;
  }
  if (cur.trim()) out.push(cur.trim().replace(/\.$/, ''));
  return out;
}
// Track placement: a phase that runs alongside another sits under it on a second lane.
function placement(phases) {
  let col = 0; const at = {};
  phases.forEach((ph) => {
    const partner = ph.parallel != null ? phases.findIndex((x) => Number(x.n) === ph.parallel) : -1;
    if (partner >= 0 && at[partner] && at[partner].lane === 1) at[phases.indexOf(ph)] = { col: at[partner].col, lane: 2 };
    else at[phases.indexOf(ph)] = { col: ++col, lane: 1 };
  });
  return { at, cols: col, lanes: Object.values(at).some((a) => a.lane === 2) ? 2 : 1 };
}
function flagFor(P, ph) {
  const f = P.s.flags;
  const needs = f.needs.find((x) => x.phase === ph.n);
  if (needs) return { kind: 'needs', text: needs.body };
  const std = f.standard.find((x) => x.phase === ph.n);
  if (std) return { kind: 'standard', text: std.body };
  if (ph.flag) return { kind: /none|standard|skip/i.test(ph.flag) ? 'standard' : 'needs', text: ph.flag };
  return null;
}

// ---------- shared pieces ----------
function headHTML(P, { compact = false, lede = true } = {}) {
  const s = P.s;
  const title = P.milestone || P.name;
  return `
  <div class="crumbs"><span>Dashboard</span><span>/</span><span>Research</span></div>
  <section class="r-head ${compact ? 'compact' : ''}">
    <p class="eyebrow">Project research${P.version ? ` · ${esc(P.version)}` : ''} · ${P.present.length} file${P.present.length === 1 ? '' : 's'}</p>
    <h1>${esc(title)}</h1>
    <div class="r-meta">
      <span class="conf-chip">${meter(s.confidence.level)} ${esc(confText(s.confidence.level))} confidence</span>
      <span>Researched <b>${esc(day(s.researched))}</b></span>
      ${P.milestone ? `<span>Project <b>${esc(P.name)}</b></span>` : ''}
    </div>
    ${s.domain ? `<p class="domain"><span class="kicker">Domain</span><span>${inline(s.domain)}</span></p>` : ''}
    ${lede ? ledeHTML(P) : ''}
  </section>`;
}
function ledeHTML(P) {
  const [first, ...rest] = P.s.exec;
  if (!first) return '';
  return `<p class="lede">${inline(first)}</p>
    ${rest.length ? `${state.more ? `<div class="lede-more">${rest.map((p) => `<p>${inline(p)}</p>`).join('')}</div>` : ''}
    <button class="text-btn" data-act="more" aria-expanded="${state.more}">${ICON(I.right)} ${state.more ? 'Show less' : `Read the whole summary · ${rest.length} more paragraph${rest.length === 1 ? '' : 's'}`}</button>` : ''}`;
}
function railStats(P) {
  const s = P.s;
  const gated = s.phases.filter((p) => p.gate).length;
  const along = s.phases.filter((p) => p.parallel != null).length;
  const flagged = s.phases.filter((p) => flagFor(P, p)?.kind === 'needs').length;
  const conflicts = s.also.find((a) => /conflict/i.test(a.title));
  return { gated, along, flagged, conflicts };
}
function bigBox(P) {
  const { gated, along } = railStats(P);
  const sub = [gated ? `${gated} gated` : null, along ? `${along} run alongside another` : 'one after another'].filter(Boolean).join(' · ');
  return `<div class="big-box"><div><div class="n">${P.s.phases.length}</div><p>phases suggested</p><small>${sub}</small></div></div>`;
}
function statList(P) {
  const s = P.s; const st = railStats(P);
  const rows = [
    ['Gaps to address', s.gaps.length],
    ['Need deeper research', st.flagged ? `${st.flagged} phase${st.flagged === 1 ? '' : 's'}` : 'None'],
    st.conflicts ? ['Conflicts between files', 'Decide first'] : null,
    ['Summary', `${s.lines} lines`],
  ].filter(Boolean);
  return `<dl class="stats">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
}
function fileRows(P) {
  const rows = P.present.filter((f) => f.key !== 'summary');
  if (!rows.length) return '';
  return `<div><p class="kicker" style="margin-bottom:var(--space-2)">The four files</p><div class="files">${rows.map((f) => {
    const [n, label] = keyNumber(P, f.key);
    return `<button class="file-row" data-doc="${f.key}">${ICON(I[f.key])}<span><b>${f.label}</b><small>${n} ${esc(label)}</small></span>${meter(levelOf(P, f.key))}</button>`;
  }).join('')}</div></div>`;
}

function trackHTML(P) {
  const phases = P.s.phases;
  if (!phases.length) return `<p class="sec-note">This summary names no phases.</p>`;
  const { at, cols, lanes } = placement(phases);
  const stations = phases.map((ph, i) => {
    const a = at[i]; const flag = flagFor(P, ph);
    const marks = [
      ph.gate ? `<span class="gate">${ICON(I.lock)} Gate</span>` : '',
      flag?.kind === 'needs' ? `<span>${ICON(I.flask)} Research</span>` : '',
      ph.avoids.length ? `<span>${ICON(I.pitfalls)} ${ph.avoids.length}</span>` : '',

    return `<button class="stn ${a.lane === 2 ? 'alongside' : ''}" style="grid-column:${a.col};grid-row:${a.lane === 2 ? 3 : 1}" data-phase="${i}" aria-pressed="${state.phase === i}">

function inspectHTML(P) {
  const ph = P.s.phases[state.phase];
  if (!ph) return '';
  const flag = flagFor(P, ph);
  const partner = ph.parallel != null ? P.s.phases.find((x) => Number(x.n) === ph.parallel) : null;
  const items = deliverItems(ph);
  const extra = [['Uses', ph.uses], ['Implements', ph.implements], ['Addresses', ph.addresses], ['Keeps', ph.keeps]].filter(([, v]) => v);
  const pit = !!P.docs.pitfalls;
  return `<div class="inspect" aria-live="polite">
    <div class="inspect-head">
      <div><p class="kicker">Phase ${pad(ph.n)} of ${P.s.phases.length}${partner ? ` · alongside phase ${pad(partner.n)}` : ''}</p><h3>${esc(ph.name)}</h3></div>
      <div class="walk"><button class="icon-btn" data-walk="-1" aria-label="Previous phase" ${state.phase === 0 ? 'disabled' : ''}>${ICON(I.left)}</button><button class="icon-btn" data-walk="1" aria-label="Next phase" ${state.phase === P.s.phases.length - 1 ? 'disabled' : ''}>${ICON(I.right)}</button></div>
    </div>
    <div class="inspect-body">
      ${ph.rationale ? `<p class="why">${inline(ph.rationale)}</p>` : ''}
      <div class="facet"><p class="kicker">Delivers · ${items.length}</p><ul>${items.map((d) => `<li><span>${inline(d)}</span></li>`).join('')}</ul></div>
      <div class="facets-side">
        ${ph.gate ? `<div class="facet gate"><p class="kicker">${ICON(I.lock)} Gate</p><p>${inline(ph.gate)}</p></div>` : ''}

        ${extra.map(([k, v]) => `<div class="facet"><p class="kicker">${k}</p><p>${inline(v)}</p></div>`).join('')}

function buildOrderHTML(P) {
  const s = P.s; const st = railStats(P);
  const entry = s.preamble.find((p) => /^\*\*Entry gate/i.test(p));
  const note = s.preamble.find((p) => !/^\*\*/.test(p));
  const em = entry && /^\*\*(.+?)\*\*\s*(.*)$/.exec(entry);
  return `<section>
    <div class="sec-head"><h2>Suggested build order</h2><span class="tally">${s.phases.length} phases${st.gated ? ` · ${st.gated} gated` : ''}${st.along ? ` · ${st.along} alongside` : ''}${st.flagged ? ` · ${st.flagged} need research` : ''}</span></div>
    ${note ? `<p class="sec-note">${inline(note)}</p>` : ''}
    ${em ? `<div class="entry-gate">${ICON(I.lock)}<div><span class="kicker">Before phase 01</span>${inline(em[1].replace(/\.$/, ''))}. ${inline(em[2])}</div></div>` : ''}
    ${trackHTML(P)}
    ${inspectHTML(P)}
    ${s.rationale.length ? `<div class="why-order"><button class="text-btn" data-act="why" aria-expanded="${state.why}">${ICON(I.right)} Why this order · ${s.rationale.length}</button>${state.why ? `<ol>${s.rationale.map((r) => `<li><span>${inline(r)}</span></li>`).join('')}</ol>` : ''}</div>` : ''}
  </section>`;
}
function gapsHTML(P) {
  const g = P.s.gaps;
  if (!g.length) return '';
  return `<section>
    <div class="sec-head"><h2>Gaps to address</h2><span class="tally">${g.length} open · resolve during planning</span></div>
    <ol class="gaps">${g.map((x) => `<li class="gap"><div>${x.lead ? `<b>${inline(x.lead)}</b>` : ''}<p>${inline(x.body)}</p></div></li>`).join('')}</ol>
  </section>`;
}
function alsoHTML(P) {
  const chips = P.s.also.map((a) => `<button class="src-chip" data-src="${a.line}">${esc(a.title)} <small>L${a.line}</small></button>`).join('');
  return `<div class="also"><span class="kicker">Also in SUMMARY.md</span>${chips}<button class="src-chip" data-src="1">Source ${ICON(I.out)}</button></div>`;
}
function summaryMain(P) {
  return `${buildOrderHTML(P)}${gapsHTML(P)}${alsoHTML(P)}`;
}

// A file's page this round: its head (title, confidence, its finding from the summary, numbers)
// and a placeholder for the body its own sketch will design.
function docHTML(P, key, { crumbs = false } = {}) {
  const d = P.docs[key]; const f = FILES.find((x) => x.key === key);
  const kf = P.s.keyFindings[key];
  const verdict = key === 'stack' && d.headline ? d.headline : kf?.lede;
  const nums = d.numbers.filter(([, n]) => n > 0).slice(0, 3);
  const i = P.present.findIndex((x) => x.key === key);
  const prev = P.present[i - 1], next = P.present[i + 1];
  return `
  ${crumbs ? `<div class="crumbs"><span>Dashboard</span><span>/</span><button data-doc="summary">Research</button><span>/</span><span>${f.label}</span></div>` : ''}
  <section ${crumbs ? 'style="margin-top:var(--space-8)"' : ''}>
    <div class="doc-head">
      <div>
        <p class="eyebrow">${f.label} research · ${esc(f.file)}</p>
        <h2>${esc(d.title || f.label)}</h2>
        <div class="r-meta"><span class="conf-chip">${meter(levelOf(P, key))} ${esc(confText(levelOf(P, key)))} confidence</span><span>Researched <b>${esc(day(d.researched))}</b></span><span><b>${d.lines}</b> lines</span></div>
      </div>
      <div class="doc-numbers">${nums.map(([l, n]) => `<div><b>${n}</b><small>${esc(l)}</small></div>`).join('')}</div>
    </div>
    ${verdict ? `<p class="doc-verdict ${plain(verdict).length > 200 ? 'long' : ''}">${inline(verdict)}</p>` : ''}
    <div class="stub"><b>The ${f.label} page body is sketched next (${f.sketch}), inside the frame you pick here.</b><ul><li>${esc(f.next)}</li></ul></div>
    ${crumbs ? `<div class="pager">${prev ? `<button data-doc="${prev.key}"><span class="kicker">← ${prev.key === 'summary' ? 'Back to' : 'Previous'}</span><b>${prev.label}</b></button>` : ''}${next ? `<button data-doc="${next.key}"><span class="kicker">Next →</span><b>${next.label}</b></button>` : ''}</div>` : ''}
  </section>`;
}

// ---------- the three frames ----------
function renderA(P) {
  const tabs = P.present.map((f, i) => `${i === 1 ? '<span class="tab-sep"></span>' : ''}<button class="file-tab ${i === 0 ? 'first' : ''}" role="tab" data-doc="${f.key}" aria-selected="${state.doc === f.key}">${ICON(I[f.key])} ${f.label}${f.key !== 'summary' ? ` ${meter(levelOf(P, f.key))}` : ''}</button>`).join('');
  const body = state.doc === 'summary'
    ? `<div class="sum"><aside class="rail">${bigBox(P)}${statList(P)}${fileRows(P)}</aside><div class="main">${summaryMain(P)}</div></div>`
    : docHTML(P, state.doc);
  return `${headHTML(P, { lede: state.doc === 'summary' })}<div class="file-tabs" role="tablist" aria-label="Research files">${tabs}</div><div class="tab-body">${body}</div>`;
}
function renderB(P) {
  const st = railStats(P);
  const rail = P.present.map((f) => {
    const [n, label] = keyNumber(P, f.key);
    const lead = f.key === 'summary';
    return `<button class="rb-item ${lead ? 'lead' : ''}" role="tab" data-doc="${f.key}" aria-selected="${state.doc === f.key}">${ICON(I[f.key])}<span><b>${f.label}</b><small>${lead ? 'phases · gaps' : `${esc(label)} · ${esc(confText(levelOf(P, f.key)))}`}</small></span><span class="cnt">${n}</span></button>`;
  }).join('');
  const pane = state.doc === 'summary'
    ? `<div class="main">${ledeHTML(P) ? `<div style="margin-top:calc(-1 * var(--space-6))">${ledeHTML(P)}</div>` : ''}<div class="rb-tally"><span><b>${P.s.gaps.length}</b> gaps to address</span><span><b>${st.flagged}</b> phases need research</span>${st.conflicts ? `<span><b>Conflicts</b> between files · decide first</span>` : ''}</div>${summaryMain(P)}</div>`
    : docHTML(P, state.doc);
  return `${headHTML(P, { compact: true, lede: false })}<div class="rb"><nav class="rb-rail" role="tablist" aria-label="Research files"><p class="kicker">Read in this order</p>${rail}</nav><div class="rb-pane">${pane}</div></div>`;
}
function renderC(P) {
  if (state.doc !== 'summary') return docHTML(P, state.doc, { crumbs: true });
  const cards = P.present.filter((f) => f.key !== 'summary').map((f) => {
    const [n, label] = keyNumber(P, f.key);
    const kf = P.s.keyFindings[f.key];
    const line = f.key === 'stack' && P.docs.stack.headline ? P.docs.stack.headline : kf?.lede;
    return `<button class="hub-card" data-doc="${f.key}"><span class="top"><span>${ICON(I[f.key])} ${f.label}</span>${meter(levelOf(P, f.key))}</span><span class="n">${n}<small>${esc(label)}</small></span><p>${inline(plain(line || ''))}</p><span class="go">Open ${f.label} ${ICON(I.right)}</span></button>`;
  }).join('');
  const st = railStats(P);
  return `${headHTML(P)}
    <div class="r-meta" style="margin-top:var(--space-6)"><span><b>${P.s.phases.length}</b> phases suggested</span><span><b>${P.s.gaps.length}</b> gaps</span><span><b>${st.flagged}</b> need research</span>${st.conflicts ? `<span><b>Conflicts</b> · decide first</span>` : ''}</div>
    ${cards ? `<div class="hub-cards">${cards}</div>` : ''}
    <div class="hub-main">${summaryMain(P)}</div>`;
}

function render() {
  const P = project();
  if (!P.docs[state.doc]) state.doc = 'summary';
  if (state.phase >= P.s.phases.length) state.phase = 0;
  document.getElementById('shell-proj').textContent = P.name;
  document.getElementById('shell-sub').textContent = P.version ? `${P.version} · research` : 'research';
  document.getElementById('app').innerHTML = { A: renderA, B: renderB, C: renderC }[state.variant](P);
}

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }

document.addEventListener('click', (e) => {
  const v = e.target.closest('.variant-tab');
  if (v) { state.variant = v.dataset.v; document.querySelectorAll('.variant-tab').forEach((b) => b.classList.toggle('active', b === v)); render(); return; }
  const tool = e.target.closest('#sketch-tools button');
  if (tool) {
    if (tool.dataset.project) { state.project = tool.dataset.project; state.phase = 0; state.doc = 'summary'; }
    if (tool.dataset.files) state.files = tool.dataset.files;
    if (tool.dataset.theme) { state.theme = tool.dataset.theme; document.documentElement.classList.toggle('dark', state.theme === 'dark'); }
    if (tool.dataset.width) { state.width = tool.dataset.width; const f = document.getElementById('frame'); f.style.maxWidth = state.width === 'full' ? '' : state.width + 'px'; f.classList.toggle('narrow-frame', state.width !== 'full'); f.classList.toggle('narrow', state.width === '375'); f.classList.toggle('tablet', state.width === '768'); }
    syncTools(); render(); return;
  }
  const doc = e.target.closest('[data-doc]');
  if (doc) { state.doc = doc.dataset.doc; render(); if (state.variant === 'C') window.scrollTo({ top: 0 }); return; }
  const ph = e.target.closest('[data-phase]');
  if (ph) { state.phase = +ph.dataset.phase; render(); return; }
  const walk = e.target.closest('[data-walk]');
  if (walk) { state.phase += +walk.dataset.walk; render(); document.querySelector(`[data-walk="${walk.dataset.walk}"]`)?.focus(); return; }
  const act = e.target.closest('[data-act]');
  if (act) { state[act.dataset.act] = !state[act.dataset.act]; render(); return; }
  const pf = e.target.closest('[data-pitfall]');
  if (pf) { state.doc = 'pitfalls'; render(); toast(`Opens the Pitfalls page at pitfall ${pf.dataset.pitfall}`); return; }
  const src = e.target.closest('[data-src]');
  if (src) toast(`Opens SUMMARY.md in the reader at line ${src.dataset.src}`);
});
// ← → walk the phases while focus is in the track or its inspector.
document.addEventListener('keydown', (e) => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key) || !e.target.closest('.track, .inspect')) return;
  const n = project().s.phases.length;
  const next = Math.max(0, Math.min(n - 1, state.phase + (e.key === 'ArrowRight' ? 1 : -1)));
  if (next === state.phase) return;
  e.preventDefault(); state.phase = next; render();
  document.querySelector(`[data-phase="${next}"]`)?.focus();
});
function syncTools() {
  document.querySelectorAll('#sketch-tools button').forEach((b) => b.classList.toggle('on', b.dataset.theme === state.theme || b.dataset.width === state.width || b.dataset.project === state.project || b.dataset.files === state.files));
}
syncTools();
render();
</script>
</body>
</html>
