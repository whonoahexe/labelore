<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 045 — Stack and Integrations panels</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* Sketch 045: the Stack and Integrations panels (a cross-read pair, D-01) inside the 042 A frame
   (Rail + column), which is identical in every variant. Text comes from Labelore's own public map
   (.planning/codebase/) and from the made-up Tidemark fixture. A value written beside a variable name is
   withheld before the text reaches this file, so the page can only show the name and "Value not shown";
   the one private line 10-03 flags in Labelore's INTEGRATIONS (a home path) is left out. Tokens come from
   ../themes/default.css; every colour is a theme token, a colour-mix of tokens, an opacity step or a hatch.
   Squared corners, spacing from --space-* tokens, four font sizes (display h1, --fs-7, --fs-4, --fs-2). */
:root {
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --veil: color-mix(in oklch, var(--muted) 55%, transparent);
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --sq: var(--space-2-5);
  --page: calc(var(--space-8) * 40);
  --rail: calc(var(--space-8) * 9);
  --fill-1: color-mix(in oklch, var(--foreground) 4%, transparent);
  --fill-2: color-mix(in oklch, var(--foreground) 8%, transparent);
  --fill-3: color-mix(in oklch, var(--foreground) 13%, transparent);
  --fill-4: color-mix(in oklch, var(--foreground) 19%, transparent);
  --hatch: repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 6px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-4); font-weight: var(--fw-medium); line-height: var(--lh-normal); }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
h3, h4 { font-size: inherit; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--font-mono); font-size: inherit; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- sketch chrome (not part of the app) ---------- */
#sketch-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
#sketch-bar .lbl { color: var(--muted-foreground); white-space: nowrap; }
#sketch-bar .grp { display: flex; flex: none; gap: var(--space-1); align-items: center; }
#sketch-bar .grp + .grp { padding-left: var(--space-3); border-left: 1px solid var(--border); }
#sketch-bar .grp.line { flex-basis: 100%; padding-left: 0; border-left: 0; }
#sketch-bar a, #sketch-bar button { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; color: var(--muted-foreground); white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; }
#sketch-bar a:hover, #sketch-bar button:hover { color: var(--foreground); background: var(--state-hover); }
#sketch-bar .on { color: var(--foreground); border-color: var(--border); background: var(--state-hover); }
#sketch-bar .name { color: var(--muted-foreground); padding-inline: var(--space-1); }
@media (max-width: 42rem) { #sketch-bar { flex-wrap: nowrap; overflow-x: auto; } #sketch-bar .grp.line { flex-basis: auto; } }
#toast { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 99; max-width: 90vw; padding: var(--space-2) var(--space-3); background: var(--foreground); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); opacity: 0; pointer-events: none; }
#toast.on { opacity: 1; }

/* ---------- app shell header (outside the page, drawn as today) ---------- */
.app-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-fluid-3); border-bottom: 1px solid var(--border); }
.app-brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-3); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.app-brand i { width: var(--space-5); height: var(--space-5); background: var(--primary); }
.app-brand span { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.app-nav { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-left: auto; }
.app-nav a { padding: var(--space-1-5) var(--space-2-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.app-nav a[aria-current] { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }
@media (max-width: 42rem) { .app-nav { display: none; } }

/* ---------- page atoms (four sizes: display h1, heading fs-7, body fs-4, label fs-2) ---------- */
.page { display: grid; gap: var(--space-6); align-content: start; width: min(var(--page), 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); }
.crumbs [aria-current] { color: var(--foreground); }
.heading-block { display: grid; gap: var(--space-3); min-width: 0; }
.eyebrow { display: flex; gap: var(--space-2); align-items: center; color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
h1 { font-size: var(--fs-display-3); font-weight: var(--fw-semibold); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); overflow-wrap: anywhere; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); min-width: 0; }
.micro-label, .grp-h { margin: 0; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
.btn-xs { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1-5); min-height: var(--space-7); padding-inline: var(--space-3); border: 1px solid var(--border); font-family: var(--font-sans); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.btn-xs:hover { background: var(--state-hover); }
.btn-xs[aria-pressed='true'] { background: var(--muted); }
.btn-xs.icon { padding-inline: 0; width: var(--space-7); }
@media (pointer: coarse) { .btn-xs { min-height: var(--space-10); } .btn-xs.icon { width: var(--space-10); } }
.seg { display: inline-flex; }
.seg .btn-xs + .btn-xs { border-left: 0; }
.text-link { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.text-link:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: var(--space-0-5); }
.status-chip { display: inline-flex; gap: var(--space-1-5); align-items: center; width: fit-content; max-width: 100%; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--veil); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; white-space: nowrap; }
.status-chip[data-tone='complete'] { border-color: var(--primary-border); background: var(--primary-tint); color: var(--primary); }
.status-chip[data-tone='in-flight'] { border-color: var(--in-flight-border); color: var(--in-flight-fill); }
.status-chip[data-tone='quiet'] { color: var(--muted-foreground); border-style: dashed; }
.status-chip.mono { text-transform: none; letter-spacing: var(--ls-wider); }
.sq { display: inline-block; width: var(--sq); height: var(--sq); flex: none; border: 1px solid var(--border); }
.sq[data-tone='complete'] { background: var(--primary); border-color: var(--primary); }
.sq[data-tone='in-flight'] { background: var(--in-flight-fill); border-color: var(--in-flight-fill); }
.sq[data-tone='quiet'] { background: transparent; border: 1px dashed var(--muted-foreground); }
.sq[data-tone='neutral'] { background: var(--muted); border-color: var(--muted-foreground); }
.source-note { color: var(--muted-foreground); font-size: var(--fs-4); overflow-wrap: anywhere; }
.facts { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); min-width: 0; }
.facts-count { font-weight: var(--fw-semibold); }
.facts-date { color: var(--muted-foreground); }
/* the quiet "Value not shown" mark: a withheld value is never in the page */
.vns { display: inline-flex; align-items: center; gap: var(--space-1); margin-left: var(--space-1); padding: 0 var(--space-1-5); border: 1px dashed var(--muted-foreground); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; vertical-align: baseline; line-height: var(--lh-snug); }

/* ---------- the 042 A frame: rail + reading column ---------- */
.a-grid { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: var(--space-fluid-9); align-items: start; }
.a-rail { position: sticky; top: calc(var(--space-10) + var(--space-4)); display: grid; gap: var(--space-4); min-width: 0; max-height: calc(100vh - var(--space-28)); overflow-y: auto; }
.a-main { display: grid; gap: var(--space-8); min-width: 0; }
.list ol { display: grid; }
.entry { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); align-items: center; min-width: 0; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); }
a.entry:hover { background: var(--state-hover); }
.entry-li + .entry-li .entry { border-top-color: var(--border-faint); }
.entry-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--muted-foreground); }
.entry-name { min-width: 0; font-weight: var(--fw-semibold); }
.entry-key { font-family: var(--font-mono); font-weight: var(--fw-semibold); }
.entry[aria-current='page'] { border-color: var(--primary-border); background: var(--primary-tint); }
.entry[aria-current='page'] .entry-no { color: var(--primary); }
@media (max-width: 62rem) { .a-grid { grid-template-columns: minmax(0, 1fr); } .a-rail { position: static; max-height: none; overflow: visible; } }

/* ---------- the panel ---------- */
.panel { display: grid; gap: var(--space-6); min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border); }
.panel-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--primary); }
.panel-head h2 { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.panel-key { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }
.panel-stamp { flex-basis: 100%; color: var(--muted-foreground); }
.lifted { display: grid; gap: var(--space-6); min-width: 0; }

/* plain form (the generic document rendering of a section) */
.prose { max-width: 72ch; overflow-wrap: anywhere; }
.prose code, .bul code, .ptable code, .dock code, .steps code { padding: 0 var(--space-0-5); background: var(--muted); }
.bul { display: grid; gap: var(--space-1-5); max-width: 78ch; }
.bul > li { display: grid; grid-template-columns: var(--space-2-5) minmax(0, 1fr); gap: var(--space-2); align-items: baseline; overflow-wrap: anywhere; }
.bul > li::before { content: ''; width: var(--space-1-5); height: var(--space-1-5); background: var(--muted-foreground); transform: translateY(-0.1em); justify-self: center; }
.bul ul { grid-column: 2; margin-top: var(--space-1); color: var(--muted-foreground); display: grid; gap: var(--space-1); }
.steps { display: grid; gap: var(--space-1-5); max-width: 78ch; padding-left: var(--space-5); list-style: decimal; }
.g { display: grid; gap: var(--space-1-5); min-width: 0; }
.g-label { font-weight: var(--fw-semibold); }
.g-label .v { font-weight: var(--fw-medium); }
.ptable { width: 100%; border-collapse: collapse; }
.ptable th { text-align: left; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; padding: var(--space-1-5) var(--space-3) var(--space-1-5) 0; border-bottom: 1px solid var(--border); }
.ptable td { vertical-align: top; padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--border-faint); overflow-wrap: anywhere; }
.tbl-scroll { overflow-x: auto; }
pre.plain-pre { margin: 0; padding: var(--space-3); border: 1px solid var(--border); background: var(--muted); font-family: var(--font-mono); font-size: var(--fs-2); line-height: var(--lh-snug); overflow-x: auto; max-width: 100%; }
.foot-line { color: var(--muted-foreground); font-style: italic; }

/* the picture frame, dock and the closed section bars */
.pic { border: 1px solid var(--border); min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.pic-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); background: var(--veil); }
.ff-title { margin-right: auto; font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.counts-line { font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }
.pic-body { overflow: auto; padding: var(--space-4); min-width: 0; max-width: 100%; }
.pic-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: var(--fs-2); }
.pic-foot .key { display: inline-flex; align-items: center; gap: var(--space-1-5); }
.pan-note { display: none; }
@media (max-width: 42rem) { .pan-note { display: inline; } }
.dock { display: grid; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--primary-border); background: var(--primary-tint); min-width: 0; }
.dock-empty { padding: var(--space-3) var(--space-4); border: 1px dashed var(--border); color: var(--muted-foreground); }
.dock-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-3); }
.dock-head h4 { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.dock .d-x { margin-left: auto; }
.dock .xref { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding-top: var(--space-2); border-top: 1px solid var(--primary-border); }
.acc-list { display: grid; }
.acc { border-top: 1px solid var(--border); }
.acc:last-child { border-bottom: 1px solid var(--border); }
.acc > summary { display: flex; align-items: center; gap: var(--space-3); min-height: var(--space-10); cursor: pointer; list-style: none; font-weight: var(--fw-semibold); }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary:hover { background: var(--state-hover); }
.acc > summary .n { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: var(--ls-wider); }
.acc > summary svg { color: var(--muted-foreground); }
.acc[open] > summary svg { transform: rotate(90deg); }
.acc > .acc-body { display: grid; gap: var(--space-4); padding: 0 0 var(--space-5) var(--space-7); min-width: 0; }
@media (max-width: 42rem) { .acc > .acc-body { padding-left: 0; } }
.sec-legend { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.sec-chip { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--background); font-size: var(--fs-2); }
.sec-chip b { font-family: var(--font-mono); font-weight: var(--fw-semibold); }
.sec-chip:hover { background: var(--state-hover); }
.sec-chip[aria-pressed='true'] { border-color: var(--primary-border); background: var(--primary-tint); }
/* the shipped copy-command row (10-10): selectable mono command, then the button; Copied in the button */
.copy-command { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); min-width: 0; }
.copy-command-text { padding: var(--space-1-5) var(--space-2-5); background: var(--muted); font-family: var(--font-mono); font-size: var(--fs-4); font-weight: var(--fw-semibold); overflow-wrap: anywhere; user-select: all; min-width: 0; max-width: 100%; }
.copy-command-button[data-copied='true'] { color: var(--primary); }
.copy-command-button svg { width: var(--space-3-5); height: var(--space-3-5); }

/* ---------- 045: stack chips (untoned, version in mono) ---------- */
.tchip { display: inline-flex; align-items: baseline; gap: var(--space-1-5); max-width: 100%; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--background); font-size: var(--fs-2); font-weight: var(--fw-semibold); text-align: left; min-width: 0; }
.tchip .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tchip .ver { font-family: var(--font-mono); font-weight: var(--fw-medium); color: var(--muted-foreground); white-space: nowrap; }
.tchip .xr { font-family: var(--font-mono); color: var(--muted-foreground); }
.tchip:hover { background: var(--state-hover); }
.tchip[data-prim='true'] { background: var(--fill-3); border-color: var(--muted-foreground); }
.tchip[data-opt='true'] { border-style: dashed; color: var(--muted-foreground); }
.tchip[data-ghost='true'] { border-style: dashed; background: var(--hatch); color: var(--muted-foreground); cursor: default; }
.tchip[aria-pressed='true'], .el[aria-pressed='true'], .grow[aria-pressed='true'], .vtag[aria-pressed='true'], .ftile[aria-pressed='true'], .ln-node[aria-pressed='true'] { outline: 2px solid var(--primary); outline-offset: 1px; }
.vtag { display: inline-flex; align-items: center; gap: var(--space-1); max-width: 100%; padding: 0 var(--space-1-5); border: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); text-align: left; overflow-wrap: anywhere; }
.vtag:hover { background: var(--state-hover); }
.vtag[data-kind='optional'] { border-style: dashed; }
.vtag .vns { margin-left: 0; }
.tags { display: flex; flex-wrap: wrap; gap: var(--space-1); min-width: 0; }

/* ---------- A: the tower (strata) with a tooling scaffold and the platform as ground ---------- */
.tower-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 13rem); gap: var(--space-4); align-items: end; }
.tower { display: grid; gap: var(--space-1); justify-items: center; min-width: 0; }
.stratum { width: max(var(--minw, 34%), var(--w)); display: grid; gap: var(--space-1-5); padding: var(--space-2) var(--space-2-5); border: 1px solid var(--border); background: var(--fill-1); min-width: 0; }
.stratum[data-step='2'] { background: var(--fill-2); } .stratum[data-step='3'] { background: var(--fill-3); } .stratum[data-step='4'] { background: var(--fill-4); }
.stratum[data-ghost='true'] { background: var(--hatch); border-style: dashed; }
.stratum-h { display: flex; align-items: baseline; gap: var(--space-2); }
.stratum-h b { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: 1; }
.stratum .sub { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1); min-width: 0; }
.stratum .sub + .sub { padding-top: var(--space-1-5); border-top: 1px solid var(--border-faint); }
.stratum .sub .micro-label { flex-basis: 100%; }
.notes-btn { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); padding: var(--space-1) var(--space-1-5); border: 1px dashed var(--border); }
.notes-btn:hover { color: var(--foreground); }
.scaffold { display: grid; gap: var(--space-2); align-content: start; padding: var(--space-2-5); border: 1px dashed var(--muted-foreground); background: repeating-linear-gradient(90deg, var(--border-faint) 0 1px, transparent 1px var(--space-6)); min-width: 0; }
.scaffold .sub { display: flex; flex-wrap: wrap; gap: var(--space-1); }

/* ---------- A: the hub (the app in the middle, every section around it) ---------- */

.hcard { position: relative; z-index: 1; display: grid; gap: var(--space-2); align-content: start; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: var(--background); min-width: 0; }
.hcard[data-empty='true'] { background: linear-gradient(var(--background), var(--background)) padding-box; }

.hcard-h { display: flex; align-items: center; gap: var(--space-2); }
.hcard-h .micro-label { margin-right: auto; color: var(--foreground); }
.hcard-h .cnt { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); white-space: nowrap; }
.grow { position: relative; z-index: 2; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-0-5) var(--space-2); align-items: baseline; padding: var(--space-1) var(--space-1-5); margin-inline: calc(var(--space-1-5) * -1); text-align: left; }
.grow:hover { background: var(--state-hover); }
.grow .sq { transform: translateY(0.1em); }
.grow .gl { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.grow[data-absent='true'] .gl { font-weight: var(--fw-medium); color: var(--muted-foreground); }
.grow .tags { grid-column: 2; }
.hub { position: relative; z-index: 1; display: grid; gap: var(--space-2); align-content: center; padding: var(--space-3); border: 2px solid var(--foreground); background: var(--background); min-width: 0; }
.hub-name { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); overflow-wrap: anywhere; }
.hub .micro-label { display: flex; gap: var(--space-1-5); align-items: center; }
.hub-extra { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }

/* ---------- B: the element board (every package one tile) ---------- */
.board { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-5); align-items: flex-start; }
.block { display: grid; gap: var(--space-1-5); min-width: 0; }
.block .micro-label b { color: var(--foreground); }
.tiles { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.el { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: var(--space-0-5); width: 7.25rem; height: 5.75rem; padding: var(--space-1-5) var(--space-2); border: 1px solid var(--border); background: var(--background); text-align: left; min-width: 0; }
.el:hover { background: var(--state-hover); }
.el[data-fam='lang'] { background: var(--fill-4); } .el[data-fam='run'] { background: var(--fill-3); } .el[data-fam='core'] { background: var(--fill-2); } .el[data-fam='tool'] { background: var(--fill-1); }

.el-maj { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: 1; }
.el-maj[data-none='true'] { color: var(--muted-foreground); }
.el-nm { align-self: end; font-size: var(--fs-2); font-weight: var(--fw-semibold); line-height: var(--lh-snug); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.el-ver { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.el-xr { position: absolute; top: var(--space-1); right: var(--space-1-5); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.under { display: grid; gap: var(--space-2); margin-top: var(--space-5); padding-top: var(--space-3); border-top: 1px solid var(--border); }
.under-row { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: var(--space-2) var(--space-3); align-items: baseline; }
@media (max-width: 42rem) { .el { width: calc((100% - var(--space-1) * 3) / 4); min-width: 4.5rem; height: 5.25rem; padding: var(--space-1); } .tiles { width: 100%; } .block { width: 100%; } .under-row { grid-template-columns: minmax(0, 1fr); } }

/* ---------- B: the floor plan (a room per section, shared walls, empty rooms hatched) ---------- */
.plan { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-flow: row dense; border: 2px solid var(--foreground); background: var(--hatch); }
.room { grid-column: span var(--span, 2); display: grid; gap: var(--space-2); align-content: start; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: var(--background); min-width: 0; }

.ln-icon { grid-row: span 2; display: grid; place-items: center; width: var(--space-6); height: var(--space-6); background: var(--muted); color: var(--muted-foreground); }
.ln-icon svg { width: var(--space-3-5); height: var(--space-3-5); }
.ln-node[data-kind='service'] .ln-icon { background: var(--primary-tint); color: var(--primary); }
.ln-lab { font-size: var(--fs-2); font-weight: var(--fw-semibold); line-height: var(--lh-snug); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }

ted platform. No Dockerfile, no CI config, and no cloud deploy config is in the repository.","sub":[]}]}]}],"footer":"Stack analysis: 2026-11-04"},"tidemark":{"front":{"last_mapped_commit":"c4e91ab7d03f58a2b6e1790d4c35fa80be127d69","last_mapped_at":"2026-10-28","made_up_example":"true","derived_from":"gsd-core/templates/codebase/stack.md","gsd_core_version":"1.19.0"},"comment":null,"title":"Technology Stack","date":"2026-10-28","intro":[],"sections":[{"h":"Languages & Runtimes","blocks":[{"t":"label","text":"Primary","value":""},{"t":"ul","items":[{"text":"TypeScript 5.6 - all server code in `server/` and all board code in `board/`","sub":[]}]},{"t":"label","text":"Secondary","value":""},{"t":"ul","items":[{"text":"SQL - the migration scripts in `server/store/migrations/`","sub":[]},{"text":"Shell - the harbour-office tide import in `scripts/`","sub":[]}]},{"t":"label","text":"Runtime","value":""},{"t":"ul","items":[{"text":"Node.js 22 - the only runtime, server and scripts alike","sub":[]}]},{"t":"label","text":"Package Manager","value":""},{"t":"ul","items":[{"text":"npm 10","sub":[]},{"text":"Lockfile: present","sub":[]}]}]},{"h":"Frameworks","blocks":[{"t":"label","text":"Core","value":""},{"t":"ul","items":[{"text":"Express 5.1 - the berth API and the static host for the built board","sub":[]},{"text":"React 19 - the berth board in `board/`","sub":[]}]},{"t":"label","text":"Testing","value":""},{"t":"ul","items":[{"text":"Vitest 3.2 - unit and route tests","sub":[]},{"text":"Playwright 1.50 - the request-a-berth flow","sub":[]}]},{"t":"label","text":"Build/Dev","value":""},{"t":"ul","items":[{"text":"Vite 6 - board bundler and dev server","sub":[]},{"text":"tsx 4 - runs the server and scripts without a build step","sub":[]}]}]},{"h":"Key Dependencies","blocks":[{"t":"label","text":"Critical","value":""},{"t":"ul","items":[{"text":"better-sqlite3 11 - the berth and booking store, opened once per process","sub":[]},{"text":"zod 3.24 - every request body and every : system `ssh` binary spawned by `spawnMirrorRunner` in `src/server/remote-source.ts` (argument arrays, no shell)","Remote commands are fixed: path existence and directory checks, `cd`, and `exec tar -cf - .planning`, with the path value single-quoted (`buildMirrorCommands`)","Local side: `tar` extracts into a fresh temp directory (`src/planning-fs/local-fs.ts` provides the temp-dir primitives)","Auth: whatever the system `ssh` client uses (keys, agent, `~/.ssh/config`). The app does not store SSH credentials. Passwords typed in a target string are masked to `***` in `rawPath`.","Timeout and failure mapping are in `remote-source.ts` and `remote-target.ts`"]}]},{"t":"label","text":"Git (optional, local)","value":""},{"t":"ul","items":[{"text":"`git` is run via `execFile` with argument arrays for file dates and commit history:","sub":["`src/server/file-dates.ts` (cached, never throws)","`src/server/commit-times.ts` (commit log for the `CommitLog` seam)"]},{"text":"Git's absence or failure degrades the dates to unknown rather than failing the page.","sub":[]}]}]},{"h":"Data Storage","blocks":[{"t":"label","text":"Databases","value":""},{"t":"ul","items":[{"text":"None. No database client, ORM, or SQL driver is in use.","sub":[]}]},{"t":"label","text":"Project data (read-only)","value":""},{"t":"ul","items":[{"text":"Source of truth is the filesystem `.planning/` directory of each registered project. The app reads it through the `planning-fs` abstraction:","sub":["`src/planning-fs/local-fs.ts` - local filesystem","`src/planning-fs/in-memory-fs.ts` - in-memory implementation for tests","`src/planning-fs/types.ts` - interface boundary"]},{"text":"Discovery and snapshot assembly: `src/planning-repo/discovery.ts`, `src/planning-repo/assemble.ts`, `src/planning-repo/snapshot.ts`","sub":[]},{"text":"Writes are not performed against project files. The one write path is the app's own settings file (below).","sub":[]}]},{"t":"label","text":"App settings (the only file the app writes)","value":""},{"t":"ul","items":[{"text":"`settings.json` in the settings directory, resolved by `defaultSettingsDir()` in `src/server/settings-store.ts`:","sub":["`LABELORE_CONFIG_DIR` when set","`$XDG_CONFIG_HOME/labelore` when `XDG_CONFIG_HOME` is absolute","`~/.config/labelore`"]},{"text":"Stores the remembered project list. Implementation: `FileSettingsStore`. Tests use `MemorySettingsStore`.","sub":[]},{"text":"Project identity uses `identityOfTarget` (`src/server/project-registry.ts`).","sub":[]}]},{"t":"label","text":"File Storage","value":""},{"t":"ul","items":[{"text":"Local filesystem only. Static client assets are served from `./dist` in production. The sketch files are served from project directories through `src/server/sketch-files.ts`.","sub":[]},{"text":"Byte serving for file downloads: `src/server/file-bytes.ts`","sub":[]}]},{"t":"label","text":"Caching","value":""},{"t":"ul","items":[{"text":"In-memory only. Search index: `src/server/search-index.ts` (MiniSearch, rebuilt on load). Project runtime cache: `src/server/project-runtime.ts`. Shiki highlighter is created once per process in `src/rendering/markdown.ts`.","sub":[]},{"text":"No Redis, memcached, or external cache.","sub":[]}]}]},{"h":"Authentication & Identity","blocks":[{"t":"label","text":"Auth Provider","value":""},{"t":"ul","items":[{"text":"None. The server listens on `127.0.0.1` only.","sub":[]},{"text":"Request protection is a Host and Origin guard, not authentication:","sub":["`src/server/request-guard.ts` checks the `Host` header on every request (defends against DNS rebinding)","Origin is compared only against an allowed Host","Extra allowed hosts come from `LABELORE_ALLOWED_HOSTS` (`parseAllowedHosts`)","`createHostPolicy` learns the real bound port once the socket is listening"]},{"text":"A token guard exists for write-style handlers (`test/token-guard.test.ts`); the app is otherwise read-only.","sub":[]}]},{"t":"label","text":"Secrets handling","value":""},{"t":"ul","items":[{"text":"Project files are scanned for secrets, and matches are masked by `src/planning-repo/secret-mask.ts` before they reach the UI.","sub":[]},{"text":"No secrets are required by the app itself.","sub":[]}]}]},{"h":"Monitoring & Observability","blocks":[{"t":"label","text":"Error Tracking","value":""},{"t":"ul","items":[{"text":"None. No Sentry or similar client is installed.","sub":[]}]},{"t":"label","text":"Logs","value":""},{"t":"ul","items":[{"text":"Console output from the Node process. Startup prints the project path, mode, and URL (`src/server/index.ts`).","sub":[]},{"text":"Runtime log file `.labelore-server.log` in the repo root is gitignored (`*.log`).","sub":[]}]},{"t":"label","text":"Analytics","value":""},{"t":"ul","items":[{"text":"None.","sub":[]}]}]},{"h":"CI/CD & Deployment","blocks":[{"t":"label","text":"Hosting","value":""},{"t":"ul","items":[{"text":"Not hosted. Clone-and-run locally: `npm start` after `npm run build`, serving `http://127.0.0.1:4173`.","sub":[]},{"text":"Per-user service setup (systemd user unit) is referenced by the operator's own notes, not by a file in the repository.","sub":[]}]},{"t":"label","text":"CI Pipeline","value":""},{"t":"ul","items":[{"text":"None in the repository (no `.github/workflows`, no CI config files tracked by git).","sub":[]},{"text":"Local gates: `npm run typecheck`, `npm run lint`, `npm test`, `npm run test:gate` (`test/helpers/vitest-gate.mjs`), `npm run test:e2e`.","sub":[]}]},{"t":"label","text":"Cloud-session hooks (developer tooling, not app runtime)","value":""},{"t":"ul","items":[{"text":"`.claude/settings.json` wires scripts in `.claude/cloud/` (`setup.sh`, `ensure-gsd.sh`, `usage-guard.mjs`, `save-at-limit.sh`, `statusline.mjs`, `usage-state.mjs`).","sub":[]},{"text":"They install GSD and manage pause-and-push handoffs. They are not part of the application's runtime integrations.","sub":[]},{"text":"Settings read there: `LABELORE_USAGE_PAUSE_AT`, `LABELORE_PAUSE_BRANCH`, `LABELORE_USAGE_GUARD`.","sub":[]}]}]},{"h":"Environment Configuration","blocks":[{"t":"label","text":"Required env vars","value":""},{"t":"ul","items":[{"text":"None required for normal operation.","sub":[]},{"text":"Conditionally required: `LABELORE_CONFIG_DIR` when running under Vitest (`src/server/settings-store.ts`).","sub":[]}]},{"t":"label","text":"Optional env vars","value":""},{"t":"ul","items":[{"text":"`LABELORE_ALLOWED_HOSTS` - extra Host values accepted by the guard","sub":[]},{"text":"`LABELORE_CONFIG_DIR`, `XDG_CONFIG_HOME` - settings location","sub":[]},{"text":"`LABELORE_E2E_CHROME` - Chrome binary for screenshots","sub":[]},{"text":"`NODE_ENV` - production switch","sub":[]}]},{"t":"label","text":"Secrets location","value":""},{"t":"ul","items":[{"text":"No secrets are stored by the app. The `.env*` files are not read by any code (no dotenv dependency). `.npmrc` contains only `loglevel`\u0001.","sub":[]}]}]},{"h":"Webhooks & Callbacks","blocks":[{"t":"label","text":"Incoming","value":""},{"t":"ul","items":[{"text":"None. The Hono routes in `src/server/project-api.ts` and `src/server/registry-api.ts` are read endpoints for the local UI. No webhook receiver exists.","sub":[]}]},{"t":"label","text":"Outgoing","value":""},{"t":"ul","items":[{"text":"None. The app makes no outbound network calls except the SSH transport used for remote targets.","sub":[]}]}]},{"h":"File Watching","blocks":[{"t":"ul","items":[{"text":"Not implemented in v1. No `chokidar` or `fs.watch` usage was found. Refresh happens on request and through the project runtime.","sub":[]}]}]}],"footer":"Integration audit: 2026-11-04"},"tidemark":{"front":{"last_mapped_commit":"c4e91ab7d03f58a2b6e1790d4c35fa80be127d69","last_mapped_at":"2026-10-28","made_up_example":"true","derived_from":"agents/gsd-codebase-mapper.md","gsd_core_version":"1.19.0"},"comment":null,"title":"External Integrations","date":"2026-10-28","intro":[],"sections":[{"h":"APIs & External Services","blocks":[{"t":"label","text":"Tide data", const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MARK = '\u0001';
const VNS = '<span class="vns">Value not shown</span>';
// inline markdown: `code`, **bold**, *italic*; the withheld-value marker becomes the quiet mark.
const inline = (s) => {
  const codes = [];
  let t = String(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  t = esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[Number(i)])}</code>`).split(MARK).join(VNS);
};

  for (const ch of left) { if (ch === '(') depth++; masked += depth ? ' ' : ch; if (ch === ')') depth = Math.max(0, depth - 1); }

  for (let k = 1; k < words.length; k++) { if (/^(>=|<=|\^|~)?\d[\w.]*$/.test(words[k][0].replace(/`/g, ''))) { vi = k; break; } }

function liftStack(doc) {

    if (c.name.length > 32) { (L.notes[list] ||= []).push(rec); return; }
    L[list].push(rec);

  for (const sec of doc.sections) {
    const h = norm(sec.h);
    for (const g of groupsOf(sec)) {
      const lab = norm(g.label);
      if (/^languages/.test(h)) {
        if (/runtime/.test(lab) || /package manager/.test(lab)) { L.heading.run = sec.h; g.items.forEach((it) => add('run', it, `${sec.h} · ${g.label}`)); }
        else { L.heading.lang = sec.h; g.items.forEach((it) => add('lang', it, `${sec.h} · ${g.label}`, /primary/.test(lab))); }
      } else if (/^runtime/.test(h)) { L.heading.run = sec.h; g.items.forEach((it) => add('run', it, `${sec.h} · ${g.label}`)); }
      else if (/^framework/.test(h)) {
        const k = /test/.test(lab) ? 'testing' : /build|dev/.test(lab) ? 'build' : 'core';
        g.items.forEach((it) => add(k, it, `${sec.h} · ${g.label}`));

          const [left, purpose] = leftOf(it.text);

            const c = chipOf(purpose ? `${part} - ${purpose}` : part);

  });

    gr.g.items.forEach((it) => {

  [...I.secs, ...I.extras].filter((s) => s.key !== 'env').forEach((s) => I.live(s).forEach((gr) => nodes.push({ gr, kind: s.kind, sec: s })));
  const present = LANES.filter((k) => k === 'service' || nodes.some((n) => n.kind === k));
  const W = Math.max(present.length * 128, S.lnW || 780);
  const lw = Math.floor(W / present.length);
  const NH = 58; const GAP = 14; const TOP = 44;
  const col = {};
  present.forEach((k) => { col[k] = nodes.filter((n) => n.kind === k); });
  const rows = Math.max(1, ...present.map((k) => col[k].length));
  const H = TOP + rows * (NH + GAP) + 8;
  const nw = lw - 16;
  const app = { x: present.indexOf('service') * lw + 8, y: TOP + ((rows - 1) * (NH + GAP)) / 2 };
  const lanes = present.map((k, i) => `<div class="ln-lane" style="left:${i * lw}px;width:${lw}px"${i % 2 ? ' data-shade="true"' : ''}><span class="ln-head">${svg(LANE_ICON[k])}${LANE_NAME[k]}</span></div>`).join('');
  let wires = ''; let labs = ''; let html = '';
  html += `<div class="ln-node" data-kind="service" style="left:${app.x}px;top:${app.y}px;width:${nw}px;height:${NH}px"><span class="ln-icon">${svg('server')}</span><span class="ln-lab">${esc(PROJ[proj()].name)}</span><span class="ln-sub">the app</span></div>`;
  present.forEach((k, li) => col[k].forEach((n, ri) => {
    const off = k === 'service' ? (ri >= Math.floor((rows - 1) / 2) ? ri + 1 : ri) : ri;
    const x = li * lw + 8; const y = TOP + off * (NH + GAP);
    const sub = tokens(textOf(n.gr.g)).find((t) => !VAR_RE.test(t)) || n.sec.short;
    const more = Math.max(0, n.gr.g.items.length - 1);
    const hot = S.sel === n.gr.id;
    html += `<button class="ln-node" type="button" data-act="sel" data-id="${n.gr.id}" data-kind="${k}"${hot ? ' aria-pressed="true"' : ''} style="left:${x}px;top:${y}px;width:${nw}px;height:${NH}px" title="${esc(n.gr.label)}"><span class="ln-icon">${svg(n.sec.icon)}</span><span class="ln-lab">${esc(n.gr.label.replace(/\s*\(.*\)\s*$/, ''))}</span><span class="ln-sub">${esc(sub)}</span>${more ? `<span class="ln-more">+${more}</span>` : ''}</button>`;
    const ax = li > present.indexOf('service') ? app.x + nw : app.x; const ay = app.y + NH / 2;
    const bx = li > present.indexOf('service') ? x : x + nw; const by = y + NH / 2;
    const mx = li > present.indexOf('service') ? bx - 10 : bx + 10;
    if (k !== 'service') {
      wires += `<path d="M${ax} ${ay} H${mx} V${by} H${bx}"${hot ? ' data-hot="true"' : ''}/>`;
      const wl = wireLabel(n.gr);
      if (wl) labs += `<span class="ln-wlab" style="left:${li > present.indexOf('service') ? x : x}px;top:${y + NH + 1}px" title="${esc(wl)}">${esc(wl)}</span>`;
    }
  }));
  const unused = [...I.secs, ...I.extras].filter((s) => s.key !== 'env').flatMap((s) => (s.sec ? s.groups.filter((g) => g.absent).map((g) => `<button class="status-chip" type="button" data-tone="quiet" data-act="sel" data-id="${g.id}">${sq('quiet')}${esc(s.short)} · ${esc(g.label)}</button>`) : [`<span class="status-chip" data-tone="quiet">${sq('quiet')}${esc(s.short)} · not in this document</span>`])).join('');
  const varsRow = `<div class="notused"><span class="micro-label">${svg('plug')} Environment · ${I.vars.length} names</span><div class="tags">${I.vars.map(vtag).join('')}</div></div>`;
  const body = `<div class="ln-stage" id="ln-stage" style="width:${W}px;height:${H}px">${lanes}<svg class="ln-wires" width="${W}" height="${H}" aria-hidden="true">${wires}</svg>${html}${labs}</div><div class="notused"><span class="micro-label">Not used · ${(unused.match(/status-chip/g) || []).length}</span><div class="tags">${unused}</div></div>${varsRow}`;
  const foot = `<span>Lanes by kind, as the Research page draws them (012 B). One node per group in use; a wire's label is the group's Client line. Groups that say None sit under the lanes.</span><span class="pan-note">The lanes pan inside their frame.</span>`;
  return intHead(I, `${pic('Lanes by kind, as shipped', `<span class="counts-line">${nodes.length} in use · ${(unused.match(/status-chip/g) || []).length} not used</span>`, body, foot, ' id="ln-fig"')}${dockInt(I)}${sectionBars(intDoc())}`);
}

// ---------- wiring ----------
const VARIANT = { a: { stack: stackA, integrations: intA }, b: { stack: stackB, integrations: intB }, c: { stack: stackC, integrations: intC } };
['a', 'b', 'c'].forEach((v) => { VIEWS[v] = () => pageHtml(PROJ[proj()], S.panel, MINE, VARIANT[v][S.panel]()); });
function afterRender(v) {
  if (v === 'a' && S.panel === 'integrations') wireHub();
  const fig = document.getElementById('ln-fig');
  if (fig && !S.busy) {
    const w = Math.floor(fig.querySelector('.pic-body').clientWidth - 32);
    if (w > 0 && Math.abs(w - (S.lnW || 0)) > 3) { S.lnW = w; S.busy = true; render(); S.busy = false; }
  }
}
window.addEventListener('resize', () => { S.lnW = 0; render(); });
render();

</script>
</body>
</html>
