        ['Issue', `\`${h}.ts\` carries its own heading matcher and bullet splitter instead of the shared section projection.`],
        ['Files', `\`src/planning-repo/handlers/${h}.ts\``],
        ['Impact', 'A fix to the shared matcher does not reach this handler, so GSD format drift has to be fixed here as well.'],
        ['Fix approach', 'Route the section reads through `section-projection.ts` the next time this file is touched.'],
      ],
    })));
  }
  if (st().nosec) base[0].items = [];
  return base;
}
const total = () => sections().reduce((n, s) => n + s.items.length, 0);
const syncKeys = () => { if (proj() === 'labelore') PROJ.labelore.keys.concerns = String(total()); };
const toneOf = (i, n) => (i === 0 ? (n > 0 ? 'in-flight' : 'complete') : n === 0 ? 'quiet' : 'neutral');
function pullItem() {
  const s = sections();
  return (s[0].items[0] || (s.find((x) => x.label === 'Tech debt') || { items: [] }).items[0]) || null;
}
const pull = () => { const it = pullItem(); return it ? `<div class="pull"><p class="micro-label">Most dangerous</p><p>${inline(it.title)}</p></div>` : ''; };
const intro = () => (CONCERNS_DATA[proj()].intro || []).map((t) => `<p class="prose source-note">${inline(t)}</p>`).join('');
const totalLine = () => `<p class="concerns-total"><b>${total()}</b><span>concerns</span></p>`;

ACTS.more = (el) => { const id = el.dataset.id; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(); };
ACTS.sec = (el) => { const i = Number(el.dataset.i); S.openA.has(i) ? S.openA.delete(i) : S.openA.add(i); render(); };
ACTS.jump = (el) => { const i = Number(el.dataset.i); S.openA.add(i); render(); const t = document.getElementById(`sec-${i}`); if (t) t.scrollIntoView({ block: 'start' }); };
ACTS.select = (el) => { S.sel = Number(el.dataset.i); render(); };
ACTS.panel = (el) => { if (el.dataset.panel !== 'concerns') toast('044 draws Concerns'); };

// ---------- one concern: title, then the first field (clamped when it is long), Read more for the rest ----------
function concern(si, ii, it) {
  const id = `${si}:${ii}`, open = S.expanded.has(id);
  const first = it.fields[0];
  const needs = it.fields.length > 1 || (first && first[1].length > 130);
  const fields = `<dl class="cn-fields">${it.fields.map(([k, v]) => `<div>${k ? `<dt>${esc(k)}</dt>` : ''}<dd>${inline(v)}</dd></div>`).join('')}</dl>`;
  return `<li class="cn-item"><p class="cn-title">${inline(it.title)}</p>${open ? fields : first ? `<p class="cn-gist"${needs ? ' data-clamp' : ''}>${inline(first[1])}</p>` : ''}${needs ? `<button class="text-link" type="button" data-act="more" data-id="${id}" aria-expanded="${open}">${open ? 'Read less' : 'Read more'}</button>` : ''}</li>`;
}
const list = (si, s) => (s.items.length ? `<ul class="cn-list">${s.items.map((it, ii) => concern(si, ii, it)).join('')}</ul>` : `<p class="source-note cn-none">None under this heading.</p>`);
const countCell = (s, i, cls, act) => `<button class="${cls}" type="button" data-act="${act}" data-i="${i}"${act === 'select' ? ` aria-pressed="${S.sel === i}"` : ''}><span class="cc-top">${sq(toneOf(i, s.items.length))}<span class="cc-lab">${esc(s.label)}</span></span><b class="cc-n">${s.items.length}</b></button>`;
const head = () => `<header class="panel-head"><span class="panel-no">07</span><h2 id="panel-h">Concerns</h2><span class="panel-key">${total()} concerns</span></header>`;
const art = (inner) => `<article class="panel" aria-labelledby="panel-h">${head()}${inner}</article>`;

// A: a count strip over collapsible sections
function viewA() {
  const secs = sections();
  return art(`<div class="lifted">
    <div class="cn-top">${intro()}${totalLine()}
      <div class="cn-strip">${secs.map((s, i) => countCell(s, i, 'cn-cell', 'jump')).join('')}</div>
      ${pull()}</div>
    <div class="cn-secs">${secs.map((s, i) => { const open = S.openA.has(i); return `<section class="csec" id="sec-${i}" data-open="${open}"><button class="csec-sum" type="button" data-act="sec" data-i="${i}" aria-expanded="${open}">${svg(open ? 'chevd' : 'chevr')}${sq(toneOf(i, s.items.length))}<span class="t">${esc(s.h)}</span><span class="n">${s.items.length}</span></button>${open ? list(i, s) : ''}</section>`; }).join('')}</div>
  </div>`);
}

// B: a nine-cell count grid that opens one section
function viewB() {
  const secs = sections();
  const s = secs[S.sel] || secs[0];
  const i = secs.indexOf(s);
  return art(`<div class="lifted">
    <div class="cn-top">${intro()}${totalLine()}
      <div class="cn-grid">${secs.map((x, k) => countCell(x, k, 'cn-gcell', 'select')).join('')}</div></div>
    <section class="grp"><h3 class="grp-h">${esc(s.h)}<span class="n">${s.items.length}</span></h3>${list(i, s)}</section>
  </div>`);
}

// C: one ledger, the count in a gutter beside each section
function viewC() {
  const secs = sections();
  return art(`<div class="lifted">
    <div class="cn-top">${intro()}${totalLine()}${pull()}</div>
    <div class="cl">${secs.map((s, i) => `<section class="cl-sec" id="sec-${i}"><div class="cl-gut"><div class="cl-stick"><b>${s.items.length}</b>${sq(toneOf(i, s.items.length))}</div></div><div class="cl-body"><h3 class="grp-h">${esc(s.h)}</h3>${list(i, s)}</div></section>`).join('')}</div>
  </div>`);
}

const wrap = (fn) => () => { syncKeys(); return pageHtml(proj(), 'concerns', fn()); };
VIEWS.a = wrap(viewA); VIEWS.b = wrap(viewB); VIEWS.c = wrap(viewC);

// =====================================================================================
// Round 2 (D, E, F): the first screen is a picture of where and how much the concerns are.
// Every mark is one concern from the document; every position comes from a field it contains
// (the files it names, its section, its Priority). Prose is reached by selecting a mark.
// =====================================================================================
GROUP_W = (n) => Math.max(1, Math.round(n / 3));
Object.assign(S, { mark: null, secf: null, tmW: 0, busy: false });
const onState1 = onState;
onState = function () { onState1(); S.mark = null; S.secf = null; };
ACTS.mark = (el) => { S.mark = S.mark === el.dataset.id ? null : el.dataset.id; render(); };
ACTS.secf = (el) => { const i = Number(el.dataset.i); S.secf = S.secf === i ? null : i; render(); };
ACTS.close = () => { S.mark = null; render(); };
function afterRender() {
  const tm = document.querySelector('.tm');
  if (tm && !S.busy) { const w = Math.round(tm.clientWidth); if (w && Math.abs(w - S.tmW) > 3) { S.tmW = w; S.busy = true; render(); S.busy = false; } }
}
window.addEventListener('resize', () => { if (document.querySelector('.tm')) { S.tmW = 0; render(); } });

// ---------- the data every picture reads ----------
function flat() {
  const out = [];
  sections().forEach((s, si) => s.items.forEach((it, ii) => out.push({ id: `${si}:${ii}`, si, ii, it, sec: s })));
  return out;
}
const pathLike = (t) => !/\s/.test(t) && (t.includes('/') || /^[\w.-]+\.\w{1,5}$/.test(t));
function filesOfConcern(it) {
  const own = it.fields.filter(([k]) => /^files$/i.test(k));
  const src = own.length ? own : it.fields;
  const out = [];
  src.forEach(([, v]) => [...String(v).matchAll(/`([^`]+)`/g)].forEach((m) => { const t = m[1].replace(/\(.*$/, '').trim(); if (pathLike(t) && !out.includes(t)) out.push(t); }));
  return out;
}
const priOf = (it) => { const f = it.fields.find(([k]) => /^priority$/i.test(k)); const v = f ? f[1].trim().toLowerCase() : ''; return v.startsWith('high') ? 'high' : v.startsWith('medium') ? 'med' : v.startsWith('low') ? 'low' : ''; };
const topMark = () => { const s = sections(); const first = s[0].items[0] ? '0:0' : (() => { const k = s.findIndex((x) => x.label === 'Tech debt'); return k >= 0 && s[k].items[0] ? `${k}:0` : null; })(); return first; };
const mk = (c, extra = '') => `<button class="mk" type="button" data-act="mark" data-id="${c.id}" data-sec="${c.si === 0 ? 0 : 1}" data-pri="${priOf(c.it)}"${S.mark === c.id ? ' data-on="true"' : ''}${topMark() === c.id ? ' data-top="true"' : ''}${S.secf != null && S.secf !== c.si ? ' data-dim="true"' : ''} title="${esc(c.it.title.replace(/`/g, ''))}"${extra}></button>`;
const legend = () => { const secs = sections(); return `<div class="sec-legend" role="group" aria-label="Sections">${secs.map((s, i) => `<button class="sec-chip" type="button" data-act="secf" data-i="${i}" aria-pressed="${S.secf === i}">${sq(toneOf(i, s.items.length))}<span>${esc(s.label)}</span><b>${s.items.length}</b></button>`).join('')}</div>`; };
const keyRow = () => `<span class="key"><span class="mk" data-sec="0"></span>a Security concern</span><span class="key"><span class="mk" data-sec="1"></span>any other section</span><span class="key"><span class="mk" data-sec="1" data-pri="high"></span><span class="mk" data-sec="1" data-pri="med"></span><span class="mk" data-sec="1" data-pri="low"></span>Priority High, Medium, Low when the concern states one</span><span class="key"><span class="mk" data-sec="1" data-top="true"></span>the most dangerous: first Security item, else first Tech debt</span>`;
function mockDock() {
  const c = flat().find((x) => x.id === S.mark);
  if (!c) return `<div class="dock-empty">Select a mark to read that concern.</div>`;
  const files = filesOfConcern(c.it);
  return `<div class="dock"><div class="dock-head"><h4>${inline(c.it.title)}</h4><span class="source-note">${esc(c.sec.h)}${topMark() === c.id ? ' · most dangerous' : ''}</span><button class="text-link d-x" type="button" data-act="close">Close</button></div>${c.it.fields.length ? `<dl class="cn-fields">${c.it.fields.map(([k, v]) => `<div>${k ? `<dt>${esc(k)}</dt>` : ''}<dd>${inline(v)}</dd></div>`).join('')}</dl>` : ''}${files.length ? '' : '<p class="source-note">This concern names no file, so it has no place on the map.</p>'}</div>`;
}
const pic = (title, tools, body, foot) => `<figure class="pic"><div class="pic-bar"><span class="ff-title">${esc(title)}</span>${tools}</div><div class="pic-body">${body}</div><div class="pic-foot">${foot}</div></figure>`;
const art2 = (inner) => `<article class="panel" aria-labelledby="panel-h">${head()}<div class="lifted">${inner}</div></article>`;
const ledgerAcc = () => `<div class="acc-list">${sections().map((s, i) => `<details class="acc"><summary>${svg('chevr')}${sq(toneOf(i, s.items.length))}<span>${esc(s.h)}</span><span class="n">${s.items.length}</span></summary><div class="acc-body">${list(i, s)}</div></details>`).join('')}</div>`;

// =====================================================================================
// D: hotspots on the codebase (the structure treemap; each concern is a mark on the folders it names)
// =====================================================================================
function viewD() {
  const root = parseTree2(STRUCT_DATA[proj()]);
  const W = S.tmW || 780;
  const H = W >= 640 ? Math.round(W * 0.56) : 500;
  const cells = cells2(root, W, H, 3);
  const all = flat();
  const at = {};
  const none = [];
  all.forEach((c) => {
    const hit = new Set();
    filesOfConcern(c.it).forEach((f) => { const cell = cellFor2(cells, f); if (cell) hit.add(cell.path); });
    if (!hit.size) none.push(c);
    hit.forEach((p) => { (at[p] ||= []).push(c); });
  });
  const html = cells.map((c) => {
    const ms = at[c.path] || [];
    const sizeOk = c.w > 40 && c.h > 17;
    return `<div class="tm-cell" data-d="${c.depth}"${c.node.group ? ' data-group="true"' : ''}${ms.length ? ` data-heat="${ms.length >= 12 ? 3 : ms.length >= 4 ? 2 : 1}"` : ''} title="${esc(c.path.replace('*files', 'files at the top'))}" style="left:${c.x.toFixed(1)}px;top:${c.y.toFixed(1)}px;width:${c.w.toFixed(1)}px;height:${c.h.toFixed(1)}px">${sizeOk ? `<span class="tm-n">${esc(c.node.name)}</span>` : ''}${ms.length ? `<span class="hs-marks" data-leaf="${c.leaf}">${ms.map((m) => mk(m)).join('')}</span>` : ''}</div>`;
  }).join('');
  const total = all.length;
  const foot = `${keyRow()}<span>Folders are the tree in STRUCTURE (area = entries listed); a mark sits in the deepest folder named in the concern's Files field.</span>`;
  const tray = none.length ? `<div class="tray"><span class="micro-label">No file named · ${none.length}</span><span class="hs-marks" data-leaf="true">${none.map((m) => mk(m)).join('')}</span></div>` : '';
  return art2(`${pic('Where the concerns sit', `<span class="counts-line">${total} concerns</span>`, `<div class="tm" style="height:${H}px">${html}</div>${tray}`, foot)}${legend()}${mockDock()}${ledgerAcc()}`);
}

// =====================================================================================
// E: a risk board (nine piles; each concern is one segment, so dense sections stack up)
// =====================================================================================
function viewE() {
  const secs = sections();
  const all = flat();
  const top = topMark();
  const cols = secs.map((s, i) => {
    const items = all.filter((c) => c.si === i);
    const body = items.length ? items.map((c) => mk(c)).join('') : `<span class="pile-zero">0</span>`;
    return `<div class="pile-col"${S.secf != null && S.secf !== i ? ' data-dim="true"' : ''}><div class="pile">${body}</div><button class="pile-lab" type="button" data-act="secf" data-i="${i}" aria-pressed="${S.secf === i}"><b>${items.length}</b><span class="cc-top">${sq(toneOf(i, items.length))}</span><span class="pl">${esc(s.label)}</span></button></div>`;
  }).join('');
  const foot = `${keyRow()}<span>Each segment is one concern; columns are the nine sections, Security first, the rest in the document's order; a column's height is its count.</span>`;
  return art2(`${pic('The nine sections as piles', `<span class="counts-line">${all.length} concerns</span>`, `<div class="piles">${cols}</div>`, foot)}${legend().replace('class="sec-legend"', 'class="sec-legend narrow-only"')}${mockDock()}${ledgerAcc()}`);
}

// =====================================================================================
// F: a shape chart (nine spokes, Security at the top; each concern is a dot on its spoke)
// =====================================================================================
function viewF() {
  const secs = sections();
  const all = flat();
  const max = Math.max(1, ...secs.map((s) => s.items.length));
  const SIZE = 400, C = 200, R = 120;
  const ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / secs.length;
  const pt = (i, r, off = 0) => [C + r * Math.cos(ang(i) + off), C + r * Math.sin(ang(i) + off)];
  const rr = (n) => R * Math.sqrt(n / max);
  const rings = [0.25, 0.5, 0.75, 1].map((f) => `<polygon class="ring" points="${secs.map((_, i) => pt(i, R * f).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`).join('');
  const spokes = secs.map((_, i) => { const [x, y] = pt(i, R); return `<line class="spoke" x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join('');
  const poly = `<polygon class="shape" points="${secs.map((s, i) => pt(i, s.items.length ? rr(s.items.length) : 3).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
  const dots = all.map((c) => { const n = secs[c.si].items.length; const r = rr(c.ii + 1); const off = n > 10 ? (c.ii % 2 ? 0.045 : -0.045) : 0; const [x, y] = pt(c.si, r, off); return mk(c, ` style="left:${(x / SIZE * 100).toFixed(2)}%;top:${(y / SIZE * 100).toFixed(2)}%"`); }).join('');
  const labels = secs.map((s, i) => { const [x, y] = pt(i, R + 34); return `<span class="rd-lab" data-act="secf" data-i="${i}" style="left:${(x / SIZE * 100).toFixed(1)}%;top:${(y / SIZE * 100).toFixed(1)}%"><b>${s.items.length}</b><span class="rd-t">${esc(s.label)}</span></span>`; }).join('');
  const top = flat().find((c) => c.id === topMark());
  let callout = '', calloutOut = '', lead = '';
  if (top) { const [x, y] = pt(top.si, rr(top.ii + 1)); lead = `<line class="lead" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="112" y2="322"/>`; callout = `<div class="rd-call in"><p class="micro-label">Most dangerous</p><p>${inline(top.it.title)}</p></div>`; calloutOut = callout.replace('rd-call in', 'rd-call out'); }
  const ticks = [0.25, 0.5, 0.75, 1].map((f) => Math.max(1, Math.round(max * f * f))).join(' · ');
  const foot = `${keyRow()}<span>Distance from the centre is the count (square-root scale, rings at ${ticks} concerns); dots run outwards in the document's order.</span>`;
  return art2(`${pic('The shape of the concerns', `<span class="counts-line">${all.length} concerns</span>`, `<div class="radar-box"><div class="radar"><svg viewBox="0 0 ${SIZE} ${SIZE}" aria-hidden="true">${rings}${spokes}${poly}${lead}</svg>${labels}${dots}${callout}</div>${calloutOut}</div>`, foot)}${legend()}${mockDock()}${ledgerAcc()}`);
}

const wrap2 = (fn) => () => { syncKeys(); return pageHtml(proj(), 'concerns', fn()); };
VIEWS.d = wrap2(viewD); VIEWS.e = wrap2(viewE); VIEWS.f = wrap2(viewF);

render();
</script>
