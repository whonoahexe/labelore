<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 044 — Concerns panel</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
/* Sketch 044: the Concerns panel inside the 042 frame, three arrangements.
   Drawn inside the 042 A frame (Rail + column), which is identical in every variant. Text comes from
   Labelore's own public map (.planning/codebase/) and from the made-up Tidemark fixture; the longest
   real Architecture, Structure and Concerns documents set the shapes. Tokens come from ../themes/default.css;
   nothing here defines a colour of its own: every colour is a theme token or a colour-mix of tokens.
   Squared corners, spacing from --space-* tokens, four font sizes (display h1, --fs-7, --fs-4, --fs-2). */
:root {
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --veil: color-mix(in oklch, var(--muted) 55%, transparent);
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --sq: var(--space-2-5);
  --page: calc(var(--space-8) * 40);
  --rail: calc(var(--space-8) * 9);
}
:root {
  --border-faint: color-mix(in oklch, var(--border) 55%, transparent);
  --primary-border: color-mix(in oklch, var(--primary) 65%, var(--border));
  --in-flight-border: color-mix(in oklch, var(--in-flight-fill) 50%, var(--border));
  --veil: color-mix(in oklch, var(--muted) 55%, transparent);
  --font-heading: var(--font-sans);
  --icon: var(--space-4);
  --sq: var(--space-2-5);
  --page: calc(var(--space-8) * 40);
  --rail: calc(var(--space-8) * 9);
  --side: calc(var(--space-8) * 10);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-4); font-weight: var(--fw-medium); line-height: var(--lh-normal); }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--font-mono); font-size: inherit; }
[hidden] { display: none !important; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.dark .moon, .sun { display: none; }
.dark .sun { display: block; }

/* ---------- sketch chrome (not part of the app) ---------- */
#sketch-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); background: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
#sketch-bar .lbl { color: var(--muted-foreground); white-space: nowrap; }
#sketch-bar .grp { display: flex; flex: none; gap: var(--space-1); align-items: center; }
#sketch-bar .grp + .grp { padding-left: var(--space-3); border-left: 1px solid var(--border); }
#sketch-bar .grp.line { flex-basis: 100%; padding-left: 0; border-left: 0; }
#sketch-bar a, #sketch-bar button { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; color: var(--muted-foreground); white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; }
#sketch-bar a:hover, #sketch-bar button:hover { color: var(--foreground); background: var(--state-hover); }
#sketch-bar .on { color: var(--foreground); border-color: var(--border); background: var(--state-hover); }
#sketch-bar .name { color: var(--muted-foreground); padding-inline: var(--space-1); }
@media (max-width: 42rem) { #sketch-bar { flex-wrap: nowrap; overflow-x: auto; } #sketch-bar .grp.line { flex-basis: auto; } }
#toast { position: fixed; left: 50%; bottom: var(--space-4); transform: translateX(-50%); z-index: 99; max-width: 90vw; padding: var(--space-2) var(--space-3); background: var(--foreground); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); opacity: 0; pointer-events: none; }
#toast.on { opacity: 1; }

/* ---------- app shell header (outside the page, drawn as today) ---------- */
.app-head { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-fluid-3); border-bottom: 1px solid var(--border); }
.app-brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--fs-3); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.app-brand i { width: var(--space-5); height: var(--space-5); background: var(--primary); }
.app-brand span { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.app-nav { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-left: auto; }
.app-nav a { padding: var(--space-1-5) var(--space-2-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.app-nav a[aria-current] { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); }

/* ---------- page atoms (all four sizes: display h1, heading fs-7, body fs-4, label fs-2) ---------- */
.page { display: grid; gap: var(--space-6); align-content: start; width: min(var(--page), 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); }
.crumbs [aria-current] { color: var(--foreground); }
.heading-block { display: grid; gap: var(--space-3); min-width: 0; }
.eyebrow { display: flex; gap: var(--space-2); align-items: center; color: var(--primary); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
h1 { font-size: var(--fs-display-3); font-weight: var(--fw-semibold); line-height: var(--lh-display); letter-spacing: var(--ls-tighter); overflow-wrap: anywhere; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); min-width: 0; }
.micro-label, .grp-h { margin: 0; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; }
.btn-xs { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1-5); min-height: var(--space-7); padding-inline: var(--space-3); border: 1px solid var(--border); font-family: var(--font-sans); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; white-space: nowrap; }
.btn-xs:hover { background: var(--state-hover); }
.btn-xs[aria-pressed='true'] { background: var(--muted); }
.btn-xs.icon { padding-inline: 0; width: var(--space-7); }
@media (pointer: coarse) { .btn-xs { min-height: var(--space-10); } .btn-xs.icon { width: var(--space-10); } }
.seg { display: inline-flex; }
.seg .btn-xs + .btn-xs { border-left: 0; }
.text-link { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; }
.text-link:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: var(--space-0-5); }
.status-chip { display: inline-flex; gap: var(--space-1-5); align-items: center; width: fit-content; max-width: 100%; padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--veil); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); line-height: var(--lh-snug); text-transform: uppercase; white-space: nowrap; }
.status-chip[data-tone='complete'] { border-color: var(--primary-border); background: var(--primary-tint); color: var(--primary); }
.status-chip[data-tone='in-flight'] { border-color: var(--in-flight-border); color: var(--in-flight-fill); }
.status-chip[data-tone='quiet'] { color: var(--muted-foreground); border-style: dashed; }
.sq { display: inline-block; width: var(--sq); height: var(--sq); flex: none; border: 1px solid var(--border); }
.sq[data-tone='complete'] { background: var(--primary); border-color: var(--primary); }
.sq[data-tone='in-flight'] { background: var(--in-flight-fill); border-color: var(--in-flight-fill); }
.sq[data-tone='quiet'] { background: transparent; border: 1px dashed var(--muted-foreground); }
.sq[data-tone='neutral'] { background: var(--muted); border-color: var(--muted-foreground); }
.source-note { color: var(--muted-foreground); font-size: var(--fs-4); overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); min-width: 0; }
.facts-count { font-weight: var(--fw-semibold); }
.facts-date { color: var(--muted-foreground); }
.status-chip.mono { text-transform: none; letter-spacing: var(--ls-wider); }
/* ---------- the panel list (entries) ---------- */
.list ol { display: grid; }
.entry { position: relative; display: grid; align-items: center; min-width: 0; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); background: transparent; }
a.entry:hover { background: var(--state-hover); }
.entry-li + .entry-li .entry { border-top-color: var(--border-faint); }
.entry-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--muted-foreground); }
.entry-name { min-width: 0; font-weight: var(--fw-semibold); }
.entry-gist { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground); }
.entry-key { display: flex; align-items: baseline; gap: var(--space-1-5); min-width: 0; font-family: var(--font-mono); }
.entry-key b { font-size: var(--fs-4); font-weight: var(--fw-semibold); }
.entry-key i { font-style: normal; font-size: var(--fs-2); color: var(--muted-foreground); }
.entry-ghost { display: inline-flex; align-items: center; gap: var(--space-1-5); color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
[data-ghost='true'] .entry { border-style: dashed; color: var(--muted-foreground); }
[data-ghost='true'] .entry-name { font-weight: var(--fw-medium); }
.entry[aria-current='page'] { border-color: var(--primary-border); background: var(--primary-tint); }
.entry[aria-current='page'] .entry-no { color: var(--primary); }

/* ---------- the panel ---------- */
.panel { display: grid; gap: var(--space-6); min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--border); }
.panel-no { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); color: var(--primary); }
.panel-head h2 { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.panel-key { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }
/* =============== Variant A: rail + reading column =============== */
.fr .a-grid { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: var(--space-fluid-9); align-items: start; }
.fr .a-rail { position: sticky; top: calc(var(--space-10) + var(--space-4)); display: grid; gap: var(--space-4); min-width: 0; max-height: calc(100vh - var(--space-28)); overflow-y: auto; }
.fr .facts { flex-direction: column; align-items: flex-start; gap: var(--space-2); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border); }
.fr .entry { grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); grid-template-areas: 'no name key'; }
.fr .entry-no { grid-area: no; } .fr .entry-name { grid-area: name; } .fr .entry-key { grid-area: key; }
.fr .entry-gist { display: none; }
.fr .entry-key i { display: none; }
.fr [data-ghost='true'] .entry { grid-template-areas: 'no name' '. ghost'; grid-template-columns: auto minmax(0, 1fr); }
.fr .entry-ghost { grid-area: ghost; }
.fr .a-main { display: grid; gap: var(--space-8); min-width: 0; }

@media (max-width: 62rem) {
  .fr .a-grid { grid-template-columns: minmax(0, 1fr); }
  .fr .a-rail { position: static; max-height: none; overflow: visible; }
}

/* ---------- panel atoms shared by the variants (four sizes only: fs-7, fs-4, fs-2 and the h1) ---------- */
.lifted, .plain { display: grid; gap: var(--space-6); min-width: 0; }
.lifted > .grp:first-child > .grp-h { padding-top: 0; border-top: 0; }
.grp { display: grid; gap: var(--space-3); min-width: 0; align-content: start; }
.grp-h { padding-top: var(--space-3); border-top: 1px solid var(--border); display: flex; align-items: baseline; gap: var(--space-2); }
.grp-h .n { color: var(--foreground); }
.prose { max-width: 72ch; line-height: var(--lh-normal); overflow-wrap: anywhere; }
code { overflow-wrap: anywhere; }
.prose code, .leads code, .steps code, .ledger code, .swap code, .lookup code, .bul code, .t-note code, .pick code, .ptable code { padding: 0 var(--space-0-5); background: var(--muted); }
.lede { font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); max-width: 46ch; overflow-wrap: anywhere; }
.lede code { font-size: inherit; background: none; padding: 0; }
.leads { display: grid; gap: var(--space-2-5); max-width: 78ch; }
.leads dt { font-weight: var(--fw-semibold); }
.leads dd { color: var(--muted-foreground); overflow-wrap: anywhere; }
.steps { display: grid; gap: var(--space-1-5); max-width: 78ch; padding-left: var(--space-5); list-style: decimal; }
.steps li { overflow-wrap: anywhere; }
.steps ul { margin-top: var(--space-1); padding-left: var(--space-4); color: var(--muted-foreground); list-style: square; }
.bul { display: grid; gap: var(--space-1-5); max-width: 78ch; }
.bul > li { display: grid; grid-template-columns: var(--space-2-5) minmax(0, 1fr); gap: var(--space-2); align-items: baseline; overflow-wrap: anywhere; }
.bul > li::before { content: ''; width: var(--space-1-5); height: var(--space-1-5); background: var(--muted-foreground); transform: translateY(-0.1em); justify-self: center; }
.bul .f { color: var(--muted-foreground); font-weight: var(--fw-semibold); }
.bul ul { grid-column: 2; margin-top: var(--space-1); color: var(--muted-foreground); display: grid; gap: var(--space-1); }
.sub-h { font-weight: var(--fw-semibold); }
.plain-sec { display: grid; gap: var(--space-3); min-width: 0; align-content: start; }
.plain-sec .g-label { font-weight: var(--fw-semibold); }
.plain-sec .g { display: grid; gap: var(--space-1-5); min-width: 0; }
.ptable { width: 100%; border-collapse: collapse; }
.ptable th { text-align: left; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; padding: var(--space-1-5) var(--space-3) var(--space-1-5) 0; border-bottom: 1px solid var(--border); }
.ptable td { vertical-align: top; padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--border-faint); overflow-wrap: anywhere; }
.tbl-scroll { overflow-x: auto; }
pre.plain-pre { margin: 0; padding: var(--space-3); border: 1px solid var(--border); background: var(--muted); font-family: var(--font-mono); font-size: var(--fs-2); line-height: var(--lh-snug); overflow-x: auto; }

/* the component / entry ledger */
.ledger { display: grid; }
.ledger > li { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-0-5) var(--space-4); padding: var(--space-2) 0; border-bottom: 1px solid var(--border-faint); }
.ledger .l-name { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.ledger .l-body { color: var(--muted-foreground); overflow-wrap: anywhere; }
.ledger .l-file { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); overflow-wrap: anywhere; }
@media (min-width: 42rem) { .ledger > li { grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) minmax(0, 13rem); align-items: baseline; } }
.more-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; color: var(--muted-foreground); }

/* swaps: the mistake struck through, the fix beside it, the rest on open */
.swaps { display: grid; }
.swap { border-bottom: 1px solid var(--border-faint); }
.swap > summary { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-1); padding: var(--space-3) 0; cursor: pointer; list-style: none; }
.swap > summary::-webkit-details-marker { display: none; }
.swap > summary:hover { background: var(--state-hover); }
.swap s { color: var(--muted-foreground); overflow-wrap: anywhere; }
.swap .do { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.swap .arr { display: none; color: var(--muted-foreground); }
@media (min-width: 42rem) {
  .swap > summary { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.25fr); align-items: baseline; gap: var(--space-4); }
  .swap .arr { display: block; }
}
.swap-more { display: grid; gap: var(--space-2); padding: 0 0 var(--space-4); max-width: 78ch; }
.swap-more dt { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; color: var(--muted-foreground); }
.swap-more dd { overflow-wrap: anywhere; }

/* the figure frame (shipped FigureFrame: title, chips, body that scrolls inside the frame) */
.figure-frame { border: 1px solid var(--border); min-width: 0; display: grid; }
.ff-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); background: var(--veil); }
.ff-title { margin-right: auto; font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.ff-bar button.status-chip { cursor: pointer; }
.ff-bar button.status-chip[aria-pressed='true'] { background: var(--muted); }
.ff-body { overflow: auto; padding: var(--space-4); min-width: 0; max-width: 100%; }
.ff-note { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin: 0 0 var(--space-3); color: var(--muted-foreground); }
.ff-cap { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); color: var(--muted-foreground); }
.lift { position: relative; width: max-content; font-family: var(--font-mono); font-size: var(--fs-2); line-height: 1.5; }
.lift-card { position: absolute; left: calc((var(--c) + 0.5) * 1ch); top: calc((var(--r) + 0.5) * 1.5em); width: calc(var(--w) * 1ch); height: calc(var(--h) * 1.5em); border: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 75%, transparent); }
.lift-card[data-hot='true'] { border-color: var(--primary); background: var(--primary-tint); box-shadow: 0 0 0 1px var(--primary); }
.lift pre { position: relative; margin: 0; font: inherit; white-space: pre; color: var(--foreground); }
.plain-text { margin: 0; width: max-content; font-family: var(--font-mono); font-size: var(--fs-2); line-height: 1.5; white-space: pre; }

/* the clean tree (shipped CleanTree: folder chains collapse, folders fold, notes in a second column) */
.tree { display: grid; grid-template-columns: max-content max-content; justify-content: start; align-items: center; width: max-content; }
.tree > li { display: contents; }
.t-name { position: relative; display: flex; align-items: center; gap: var(--space-2); min-height: var(--space-6); padding-left: calc(var(--d) * var(--space-6)); font-family: var(--font-mono); white-space: nowrap; text-align: left; }
.t-name::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--d) * var(--space-6)); background: repeating-linear-gradient(to right, var(--border-faint) 0 1px, transparent 1px var(--space-6)); pointer-events: none; }
.t-name .nm { font-size: var(--fs-4); }
.t-name[data-folder] .nm { font-weight: var(--fw-semibold); }
.t-name svg { color: var(--muted-foreground); }
.t-name[data-folder] svg { color: var(--primary); }
.t-note { min-height: var(--space-6); display: flex; align-items: center; padding-left: var(--space-5); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); white-space: nowrap; }
button.t-name:hover .nm { text-decoration: underline; text-underline-offset: var(--space-0-5); }
.t-name[data-hot='true'] .nm, .t-name[data-sel='true'] .nm { background: var(--primary-tint); outline: 1px solid var(--primary-border); outline-offset: 2px; }
.counts-line { font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); color: var(--muted-foreground); text-transform: uppercase; }

/* the lookup: Where to add new code */
.lookup { display: grid; }
.lookup > li { display: grid; gap: var(--space-1); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-faint); }
@media (min-width: 42rem) { .lookup > li { grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: var(--space-4); } }
.lookup .when { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.lookup .where { display: grid; gap: var(--space-1); min-width: 0; overflow-wrap: anywhere; }
.lookup .where li { color: var(--muted-foreground); }
.lookup .where li:first-child { color: var(--foreground); }

/* ---------- round 2: visual-first atoms (tokens, opacity steps and hatch only; no colour of its own) ---------- */
:root {
  --fill-1: color-mix(in oklch, var(--foreground) 4%, transparent);
  --fill-2: color-mix(in oklch, var(--foreground) 8%, transparent);
  --fill-3: color-mix(in oklch, var(--foreground) 13%, transparent);
  --fill-4: color-mix(in oklch, var(--foreground) 19%, transparent);
  --hatch: repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 6px);
}
.pic { border: 1px solid var(--border); min-width: 0; display: grid; }
.pic-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); background: var(--veil); }
.pic-bar .ff-title { margin-right: auto; }
.pic-bar button.status-chip { cursor: pointer; }
.pic-bar button.status-chip[aria-pressed='true'] { background: var(--muted); }
.pic-body { overflow: auto; padding: var(--space-4); min-width: 0; max-width: 100%; }
.pic-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); color: var(--muted-foreground); }
.pic-foot .key { display: inline-flex; align-items: center; gap: var(--space-1-5); }
.trace { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; margin-bottom: var(--space-3); }
.trace .btn-xs { text-transform: none; letter-spacing: var(--ls-wider); font-family: var(--font-mono); font-weight: var(--fw-medium); }
.trace .btn-xs[aria-pressed='true'] { background: var(--primary-tint); border-color: var(--primary-border); }

/* the drawn graph: boxes are HTML at real size (text stays at its token size), arrows are an SVG overlay */
.g-wrap { position: relative; margin: 0 auto; }
.g-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.g-svg .e { stroke: var(--muted-foreground); stroke-width: 1.5; fill: none; }
.g-svg .ah { fill: var(--muted-foreground); stroke: none; }
.g-svg .edge[data-hot='true'] .e { stroke: var(--primary); stroke-width: 2.5; }
.g-svg .edge[data-hot='true'] .ah { fill: var(--primary); }
.g-svg .edge[data-dim='true'] { opacity: 0.3; }
.g-node { position: absolute; display: grid; align-content: center; gap: var(--space-0-5); padding: var(--space-1-5) var(--space-3); border: 1px solid var(--border); background: var(--fill-1); text-align: left; min-width: 0; }
.g-node:hover { background: var(--state-hover); }
.g-node .g-t { font-weight: var(--fw-semibold); overflow-wrap: anywhere; line-height: var(--lh-tight); }
.g-node .g-s { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); overflow-wrap: anywhere; line-height: var(--lh-snug); }
.g-node[data-hot='true'] { border-color: var(--primary); background: var(--primary-tint); box-shadow: 0 0 0 1px var(--primary); }
.g-node[data-dim='true'] { opacity: 0.45; }
.g-node[data-onpath='true'] { border-color: var(--primary-border); }
.g-lab { position: absolute; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); background: var(--background); padding: 0 var(--space-1); max-width: 17rem; line-height: var(--lh-snug); }
.g-badges { position: absolute; top: calc(var(--space-2) * -1 - 1px); right: var(--space-2); display: flex; gap: var(--space-1); }
.bd { display: inline-grid; place-items: center; min-width: var(--space-4-5, 1.125rem); height: 1.125rem; padding: 0 var(--space-1); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); line-height: 1; }
.bd-step { background: var(--primary); color: var(--background); }
.bd-flag { border: 1px dashed var(--muted-foreground); background: var(--background); color: var(--muted-foreground); }

/* on-demand detail dock */
.dock { display: grid; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--primary-border); background: var(--primary-tint); min-width: 0; }
.dock-empty { padding: var(--space-3) var(--space-4); border: 1px dashed var(--border); color: var(--muted-foreground); }
.dock h4 { margin: 0; font-size: inherit; font-weight: var(--fw-semibold); }
.dock .d-row { display: grid; gap: var(--space-0-5); }
.dock .d-row > span:first-child { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; color: var(--muted-foreground); }
.dock pre { margin: 0; font-family: var(--font-mono); font-size: var(--fs-2); line-height: var(--lh-snug); white-space: pre-wrap; overflow-wrap: anywhere; }
.dock .d-x { margin-left: auto; }
.dock-head { display: flex; align-items: baseline; gap: var(--space-3); }
.acc-list { display: grid; }
.acc { border-top: 1px solid var(--border); }
.acc:last-child { border-bottom: 1px solid var(--border); }
.acc > summary { display: flex; align-items: center; gap: var(--space-3); min-height: var(--space-10); cursor: pointer; list-style: none; font-weight: var(--fw-semibold); }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary:hover { background: var(--state-hover); }
.acc > summary .n { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-7); }
.acc > summary svg { color: var(--muted-foreground); }
.acc[open] > summary svg { transform: rotate(90deg); }
.acc > .acc-body { display: grid; gap: var(--space-4); padding: 0 0 var(--space-5) var(--space-7); }

/* E: the territory, layers as bands */
.bands { display: grid; gap: var(--space-0-5); }
.band { display: grid; grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr); border: 1px solid var(--border); background: var(--fill-1); }
.band[data-step='2'] { background: var(--fill-2); } .band[data-step='3'] { background: var(--fill-3); } .band[data-step='4'] { background: var(--fill-4); }
.band[data-out='true'] { background: transparent; border-style: dashed; }
.band[data-dim='true'] { opacity: 0.4; }
.band-lab { display: grid; gap: var(--space-0-5); align-content: start; padding: var(--space-2-5) var(--space-3); border-right: 1px solid var(--border); min-width: 0; }
.band-lab b { font-weight: var(--fw-semibold); overflow-wrap: anywhere; }
.band-lab code { font-size: var(--fs-2); color: var(--muted-foreground); background: none; padding: 0; }
.band-uses { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1-5); }
.use { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-1-5); border: 1px solid var(--border); background: var(--background); font-size: var(--fs-2); color: var(--muted-foreground); }
.use svg { width: var(--space-3); height: var(--space-3); }
.band-body { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-content: flex-start; padding: var(--space-2-5); min-width: 0; }
.chip-c { padding: var(--space-1) var(--space-2-5); border: 1px solid var(--border); background: var(--background); text-align: left; min-width: 0; overflow-wrap: anywhere; }
.chip-c:hover { background: var(--state-hover); }
.chip-c[aria-pressed='true'] { border-color: var(--primary); background: var(--primary-tint); }
.tile { position: relative; flex: var(--w) 1 0; min-width: 7rem; display: grid; gap: var(--space-0-5); padding: var(--space-1-5) var(--space-2); border: 1px solid var(--border); background: var(--background); text-align: left; align-content: start; }
.tile:hover { background: var(--state-hover); }
.tile[aria-pressed='true'] { border-color: var(--primary); background: var(--primary-tint); }
.tile .tn { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); overflow-wrap: break-word; word-break: break-word; }
.tile .tc { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.pins { display: flex; gap: var(--space-1); flex-wrap: wrap; }
.pin { display: inline-grid; place-items: center; min-width: 1.125rem; height: 1.125rem; padding: 0 var(--space-1); background: var(--primary); color: var(--background); font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); line-height: 1; border: 0; cursor: pointer; }
.pin[aria-pressed='true'] { outline: 2px solid var(--foreground); outline-offset: 1px; }
.pin-legend { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.pin-chip { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: 0 var(--space-2) 0 0; border: 1px solid var(--border); background: var(--background); font-size: var(--fs-2); text-align: left; }
.pin-chip .pin { height: 1.5rem; }
.pin-chip:hover { background: var(--state-hover); }
.pin-chip[aria-pressed='true'] { border-color: var(--primary); background: var(--primary-tint); }
@media (max-width: 42rem) { .band { grid-template-columns: minmax(0, 1fr); } .band-lab { border-right: 0; border-bottom: 1px solid var(--border-faint); } }

/* D: the treemap */
.tm { position: relative; width: 100%; }
.tm-cell { position: absolute; border: 1px solid var(--border); background: var(--fill-1); overflow: hidden; text-align: left; cursor: pointer; }
.tm-cell[data-d='2'] { background: var(--fill-2); } .tm-cell[data-d='3'] { background: var(--fill-3); }
.tm-cell[data-group='true'] { background: var(--hatch); }
.tm-cell:hover { outline: 2px solid var(--primary-border); outline-offset: -2px; z-index: 2; }
.tm-cell[data-sel='true'] { outline: 2px solid var(--primary); outline-offset: -2px; z-index: 3; }
.tm-n { display: block; padding: 1px 4px; font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-c { display: block; padding: 0 4px; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-pins { position: absolute; right: 2px; bottom: 2px; display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; }

/* F: sunburst and metro */
.sb-wrap { position: relative; width: 100%; max-width: 36rem; margin: 0 auto; aspect-ratio: 1; }
.sb-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sb-wrap .arc { stroke: var(--background); stroke-width: 1; cursor: pointer; fill: var(--fill-2); }
.sb-wrap .arc[data-d='2'] { fill: var(--fill-3); } .sb-wrap .arc[data-d='3'] { fill: var(--fill-4); } .sb-wrap .arc[data-d='1'] { fill: var(--fill-1); }
.sb-wrap .arc[data-group='true'] { fill: var(--border); }
.sb-wrap .arc:hover { fill: var(--primary-tint); stroke: var(--primary-border); }
.sb-wrap .arc[data-sel='true'] { fill: var(--primary-tint); stroke: var(--primary); stroke-width: 2; }
.sb-lab, .sb-pin { position: absolute; transform: translate(-50%, -50%); }
.sb-lab { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); pointer-events: none; white-space: nowrap; }
.sb-core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); pointer-events: none; }
.metro { display: grid; gap: var(--space-5); width: max-content; min-width: 100%; }
.m-row { position: relative; }
.m-name { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; color: var(--muted-foreground); margin-bottom: var(--space-1); }
.m-track { position: relative; height: 4.75rem; }
.m-line { position: absolute; left: 0; right: 0; top: 1.05rem; border-top: 5px var(--ls) var(--muted-foreground); }
.m-st { position: absolute; top: 0; transform: translateX(-50%); width: 6.5rem; display: grid; justify-items: center; gap: var(--space-1); text-align: center; }
.m-dot { width: 1.25rem; height: 1.25rem; border: 2px solid var(--foreground); background: var(--background); display: grid; place-items: center; font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); line-height: 1; }
.m-st[data-on='true'] .m-dot { background: var(--primary); border-color: var(--primary); color: var(--background); }
.m-st[data-ix='true'] .m-dot { outline: 2px solid var(--muted-foreground); outline-offset: 2px; }
.m-st .m-t { font-size: var(--fs-2); line-height: var(--lh-snug); overflow-wrap: anywhere; }
.m-link { position: absolute; width: 0; border-left: 2px dotted var(--muted-foreground); }

/* ---------- 044 round 2: marks, hotspots, piles, radar ---------- */
.mk { display: inline-block; flex: none; width: 11px; height: 11px; padding: 0; border: 1px solid var(--muted-foreground); background: var(--muted-foreground); opacity: 0.75; cursor: pointer; }
.mk[data-sec='0'] { background: var(--in-flight-fill); border-color: var(--in-flight-fill); }
.mk[data-pri='high'] { opacity: 1; } .mk[data-pri='med'] { opacity: 0.6; } .mk[data-pri='low'] { opacity: 0.38; }
.mk[data-sec='0'][data-pri=''] { opacity: 1; }
.mk:hover { outline: 2px solid var(--primary-border); outline-offset: 1px; }
.mk[data-on='true'] { outline: 2px solid var(--foreground); outline-offset: 1px; }
.mk[data-top='true'] { outline: 2px solid var(--primary); outline-offset: 2px; }
.mk[data-dim='true'] { opacity: 0.14; }
.hs-marks { position: absolute; left: 3px; right: 3px; bottom: 3px; display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-end; }
.hs-marks[data-leaf='false'] { left: auto; top: 2px; bottom: auto; justify-content: flex-end; max-width: 55%; align-content: flex-start; }
.tm-cell[data-heat='1'] { background: color-mix(in oklch, var(--in-flight-fill) 10%, transparent); }
.tm-cell[data-heat='2'] { background: color-mix(in oklch, var(--in-flight-fill) 20%, transparent); }
.tm-cell[data-heat='3'] { background: color-mix(in oklch, var(--in-flight-fill) 32%, transparent); }
.tray { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin-top: var(--space-3); padding: var(--space-2) var(--space-3); border: 1px dashed var(--border); }
.tray .hs-marks { position: static; display: flex; flex-wrap: wrap; gap: 3px; }
.sec-legend { display: flex; flex-wrap: wrap; gap: var(--space-1-5); }
.sec-chip { display: inline-flex; align-items: center; gap: var(--space-1-5); padding: var(--space-1) var(--space-2); border: 1px solid var(--border); background: var(--background); font-size: var(--fs-2); }
.sec-chip b { font-family: var(--font-mono); font-weight: var(--fw-semibold); }
.sec-chip:hover { background: var(--state-hover); }
.sec-chip[aria-pressed='true'] { border-color: var(--primary-border); background: var(--primary-tint); }
.piles { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: var(--space-1-5); align-items: end; }
.pile-col { display: grid; gap: var(--space-2); align-content: end; min-width: 0; }
.pile-col[data-dim='true'] { opacity: 0.35; }
.pile { display: flex; flex-direction: column-reverse; gap: 3px; }
.pile .mk { width: 100%; height: 13px; }
.pile-zero { height: 13px; border: 1px dashed var(--muted-foreground); display: grid; place-items: center; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); line-height: 1; }
.pile-lab { display: grid; gap: var(--space-1); justify-items: start; text-align: left; padding-top: var(--space-1-5); border-top: 1px solid var(--border); }
.pile-lab b { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: 1.1; }
.pile-lab .pl { font-size: var(--fs-2); color: var(--muted-foreground); overflow-wrap: break-word; line-height: 1.25; }
.pile-lab[aria-pressed='true'] b { color: var(--primary); }
.narrow-only { display: none; }
.radar-box { display: grid; justify-items: center; }
.radar { position: relative; width: 100%; max-width: 32rem; aspect-ratio: 1; }
.radar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.radar .ring, .radar .spoke { fill: none; stroke: var(--border); stroke-width: 1; }
.radar .shape { fill: color-mix(in oklch, var(--in-flight-fill) 16%, transparent); stroke: var(--in-flight-fill); stroke-width: 1.5; }
.radar .lead { stroke: var(--primary); stroke-width: 1.5; }
.radar .mk { position: absolute; transform: translate(-50%, -50%); }
.rd-lab { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; text-align: center; cursor: pointer; line-height: 1.1; }
.rd-lab b { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); }
.rd-t { font-size: var(--fs-2); color: var(--muted-foreground); max-width: 6.5rem; }
.rd-call.out { display: none; }
.rd-call { position: absolute; left: 0; bottom: 0; width: 28%; display: grid; gap: var(--space-1); padding: var(--space-2); border-left: 2px solid var(--primary); background: var(--background); color: var(--muted-foreground); font-size: var(--fs-2); overflow-wrap: anywhere; }
@media (max-width: 42rem) {
  .pile-lab .pl { display: none; }
  .narrow-only { display: flex; }
  .rd-t { display: none; }
  .radar .lead { display: none; }
  .rd-call.in { display: none; }
  .rd-call.out { display: grid; position: static; width: auto; margin-top: var(--space-3); }
  .radar-box { display: block; }
  .radar { max-width: none; }
}

/* ---------- 044 specifics ---------- */
.source-note { color: var(--muted-foreground); overflow-wrap: anywhere; }
.cn-top { display: grid; gap: var(--space-4); min-width: 0; }
.concerns-total { display: flex; align-items: baseline; gap: var(--space-2); }
.concerns-total b { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.pull { display: grid; gap: var(--space-1); padding: var(--space-3) var(--space-4); border-left: 2px solid var(--border); color: var(--muted-foreground); max-width: 78ch; overflow-wrap: anywhere; }

/* one concern */
.cn-list { display: grid; }
.cn-item { display: grid; gap: var(--space-1-5); justify-items: start; padding: var(--space-3) 0; border-bottom: 1px solid var(--border-faint); min-width: 0; }
.cn-title { font-weight: var(--fw-semibold); overflow-wrap: anywhere; max-width: 78ch; }
.cn-title code, .cn-gist code, .cn-fields code { padding: 0 var(--space-0-5); background: var(--muted); }
.cn-gist { color: var(--muted-foreground); max-width: 78ch; overflow-wrap: anywhere; }
.cn-gist[data-clamp] { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cn-fields { display: grid; gap: var(--space-2); max-width: 78ch; width: 100%; }
.cn-fields > div { display: grid; gap: var(--space-0-5); }
.cn-fields dt { font-family: var(--font-mono); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; color: var(--muted-foreground); }
.cn-fields dd { overflow-wrap: anywhere; }
@media (min-width: 42rem) { .cn-fields > div { grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: var(--space-4); align-items: baseline; } }
.cn-none { padding: var(--space-3) var(--space-4); border: 1px dashed var(--border); }

/* count cells: label over number */
.cc-top { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.cc-lab { color: var(--muted-foreground); overflow-wrap: anywhere; text-align: left; }
.cc-n { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }

/* A: count strip over collapsible sections */
.cn-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); border: 1px solid var(--border); border-width: 1px 0 0 1px; }
.cn-cell { display: grid; gap: var(--space-1-5); align-content: space-between; padding: var(--space-2-5) var(--space-3); border: 1px solid var(--border); border-width: 0 1px 1px 0; text-align: left; }
.cn-cell:hover { background: var(--state-hover); }
.cn-cell:first-child .cc-lab { color: var(--foreground); font-weight: var(--fw-semibold); }
.cn-secs { display: grid; }
.csec { border-top: 1px solid var(--border); scroll-margin-top: calc(var(--space-28) - var(--space-2)); }
.csec:last-child { border-bottom: 1px solid var(--border); }
.csec-sum { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: var(--space-10); }
.csec-sum:hover { background: var(--state-hover); }
.csec-sum svg { color: var(--muted-foreground); }
.csec-sum .t { font-weight: var(--fw-semibold); }
.csec-sum .n { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); }
.csec .cn-list, .csec .cn-none { margin: 0 0 var(--space-4) calc(var(--space-4) + var(--space-3)); }
.csec .cn-item:last-child { border-bottom: 0; }

/* B: nine-cell grid that opens one section */
.cn-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); border-width: 1px 0 0 1px; }
.cn-gcell { display: grid; gap: var(--space-3); align-content: space-between; min-height: calc(var(--space-10) * 2); padding: var(--space-3); border: 1px solid var(--border); border-width: 0 1px 1px 0; text-align: left; }
.cn-gcell:hover { background: var(--state-hover); }
.cn-gcell .cc-lab { color: var(--foreground); font-weight: var(--fw-semibold); }
.cn-gcell[aria-pressed='true'] { background: var(--primary-tint); box-shadow: inset 0 2px 0 var(--primary); }
.cn-gcell[aria-pressed='true'] .cc-n { color: var(--primary); }

/* C: ledger with the count in a gutter */
.cl { display: grid; }
.cl-sec { border-top: 1px solid var(--border); display: grid; grid-template-columns: var(--space-fluid-13) minmax(0, 1fr); gap: var(--space-4); }
.cl-stick { position: sticky; top: calc(var(--space-28) - var(--space-2)); display: grid; justify-items: start; gap: var(--space-2); padding-top: var(--space-3); }
.cl-stick b { font-family: var(--font-mono); font-size: var(--fs-7); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.cl-body { min-width: 0; }
.cl-body .grp-h { border-top: 0; padding-top: var(--space-3); }
.cl-body .cn-list { padding-bottom: var(--space-4); }
.cl-body .cn-none { margin-top: var(--space-3); margin-bottom: var(--space-4); }
.cl-sec:last-child .cl-body .cn-item:last-child { border-bottom: 0; }

@media (max-width: 42rem) {
  .cn-gcell { gap: var(--space-2); min-height: calc(var(--space-10) * 2); }
  .cn-gcell .cc-top, .cn-cell .cc-top { flex-direction: column; align-items: flex-start; gap: var(--space-1-5); }
  .cn-gcell .cc-lab, .cn-cell .cc-lab { font-size: var(--fs-2); overflow-wrap: break-word; hyphens: none; }
}

const CONCERNS_DATA = {"labelore":{"sections":[{"h":"Security Considerations","label":"Security","items":[{"title":"Remote project mirroring copies the whole `.planning/` tree to local disk","fields":[["Risk","`src/server/remote-source.ts` runs `tar -cf - .planning` over ssh and extracts it into a local temp directory, which holds the full planning tree, including `config.json` with its secret keys in plaintext. Secret masking happens only in memory at display time (`src/planning-repo/secret-mask.ts`). The temp copy is not masked."],["Files","`src/server/remote-source.ts` (mirror and cleanup), `src/cli/remote-target.ts` (`buildMirrorCommands`), `src/planning-fs/local-fs.ts` (`createTempDirSync`, `removeTempDirSync`), `src/planning-repo/secret-mask.ts`"],["Current mitigation","Temp directories are created mode 0700 under the OS temp dir. The remote side only runs a path check and `tar -c`, so the remote host is never written to. ssh runs with `BatchMode=yes` and no password, and remote paths are single-quoted."],["Recommendations","Document that a remote mirror leaves plaintext on local disk until the process exits. Check whether `removeTempDirSync` runs on process signals as well as on mirror replacement. A plausible cleanup gap is a crash or SIGKILL, which would leave the mirror behind. Consider masking secret keys in the mirror, or excluding `config.json` from the tar."]]},{"title":"Mirror size and time are unbounded","fields":[["Risk","The mirror has no size cap. Its only limit is a 120-second timeout (`DEFAULT_TIMEOUT_MS` in `src/server/remote-source.ts`). A large `.planning/` tree, or one containing large generated assets, can fill the local temp directory before the timeout fires."],["Files","`src/server/remote-source.ts` (line 29)"],["Current mitigation","Timeout only."],["Recommendations","Cap the tar stream by bytes, and surface a failure status when the cap is hit."]]},{"title":"Sketch HTML runs scripts from the target project","fields":[["Risk","Sketch files from a project's `.planning/` are served with `Content-Security-Policy: sandbox allow-scripts`, so their scripts run in an opaque origin. That keeps them away from the app's API, but they still execute code that a project author wrote, or that arrived through a cloned repository."],["Files","`src/server/sketch-files.ts` (`SECURITY_HEADERS`, lines 23-27; font CORS wildcard at line 157)"],["Current mitigation","Opaque origin under the sandbox directive. The `/api` request guard does not apply to these routes. Font responses are the only ones given `Access-Control-Allow-Origin: *`."],["Recommendations","Keep the opaque-origin sandbox. Add a test that asserts the header on every sketch response, including directory redirects and error responses."]]},{"title":"Raw HTML in planning markdown is sanitized with an extended schema","fields":[["Risk","The markdown pipeline runs `rehype-raw` and then `rehype-sanitize` with a schema extended from `defaultSchema`. The extension allows `className` on every element and `checked`, `disabled` and `type` on `input`. Correctness depends on sanitize running before any trusted plugin adds markup. That order is correct today (`src/rendering/markdown.ts`, lines 300-315), but nothing enforces it."],["Files","`src/rendering/markdown.ts`, `src/web/pages/artifact-page.tsx` (line 260)"],["Current mitigation","Sanitize runs before `rehypeResolvedReferences`, `rehypeSlug` and `trustedEnrichment`."],["Recommendations","Add a test that feeds `<img src=x onerror=...>`, `<a href=\"javascript:...\">` and `<script>` through the full pipeline and asserts that all three are removed. This is the regression test noted as debt above."]]},{"title":"Secret masking uses a hard-coded key list","fields":[["Risk","`SECRET_CONFIG_KEYS` in `src/planning-repo/secret-mask.ts` holds three top-level keys (`brave_search`, `firecrawl`, `exa_search`). A new secret key added by GSD would display in plaintext."],["Files","`src/planning-repo/secret-mask.ts`"],["Current mitigation","Keys are copied from GSD's own `secrets.cjs`. Nested values under a secret key are masked fail-closed."],["Recommendations","Add a test that compares the list against the GSD version the project pins, and warn in the settings page when `config.json` contains top-level keys that look like credentials but are not on the list."]]},{"title":"Host allowlist widens by environment variable","fields":[["Risk","`LABELORE_ALLOWED_HOSTS` adds extra accepted `Host` values. It is opt-in and rejects wildcards, which is correct. The API is read-only apart from settings, but a tunnel that is not intended to be public would still expose every project it can read."],["Files","`src/server/request-guard.ts` (`parseAllowedHosts`, `createHostPolicy`), `src/server/index.ts` (`HOSTNAME = '127.0.0.1'`, line 23)"],["Current mitigation","Loopback-only binding. DNS-rebinding protection on every request. No `Access-Control-*` headers."],["Recommendations","Nothing urgent. Make the server log a line at startup listing the extra hosts it accepts."]]}]},{"h":"Tech Debt","label":"Tech debt","items":[{"title":"Oversized modules","fields":[["Issue","Several files have grown well past what a reader can hold in one pass. Each mixes parsing, shaping and presentation concerns."],["Files","`src/planning-repo/handlers/research-briefing.ts` (1879 lines), `src/web/pages/artifact-page.tsx` (1476), `src/planning-repo/handlers/context-brief.ts` (1421), `src/planning-repo/handlers/project-research-lift.ts` (1227), `src/planning-repo/handlers/debug-session.ts` (1150), `src/planning-repo/handlers/ui-review-audit.ts` (1125), `src/planning-repo/handlers/verification-report.ts` (1105), `src/server/project-registry.ts` (761)"],["Impact","Changes to one artifact type are hard to review in isolation. Regex-heavy extraction in these files is difficult to audit (see Fragile Areas)."],["Fix approach","When touching one of these, extract the pure parsing step into a sibling module with its own unit tests before adding features. Do not refactor them wholesale."]]},{"title":"One handler per artifact type, bespoke parsing each time","fields":[["Issue","Each GSD artifact type has its own handler under `src/planning-repo/handlers/`. Frontmatter reading is shared (`src/planning-repo/frontmatter.ts`, `tryParseFrontmatter`), but section extraction, heading matching and regex parsing are reimplemented per handler."],["Files","`src/planning-repo/handlers/`, `src/planning-repo/frontmatter.ts`, `src/planning-repo/handlers/section-projection.ts`"],["Impact","A fix in one handler's heading or table parsing does not reach its siblings. Compatibility with GSD artifact drift (a stated project constraint) has to be fixed per file."],["Fix approach","Route new section-level parsing through `section-projection.ts` rather than adding another local regex."]]},{"title":"Documentation drift in the project instructions","fields":[["Issue","`.claude/CLAUDE.md` records the research-time stack (TypeScript 7.0.2, Hono 4.13.3, mermaid 11.17.0) and says \"Architecture not yet mapped\". `package.json` pins TypeScript 5.9.3, Hono 4.13.4 and mermaid 11.17.1."],["Files","`.claude/CLAUDE.md`, `package.json`"],["Impact","A planner or executor reading CLAUDE.md gets a stack that does not match the installed one."],["Fix approach","Regenerate the stack section from `package.json` and point the architecture section at `.planning/codebase/ARCHITECTURE.md`."]]},{"title":"Deferred human verification recorded as \"fixed\"","fields":[["Issue","`.planning/WINDOWS.md` reports `open_count: 0`, but entries 8 and 9 are `unrun-verify` items whose live visual or motion checks were deferred \"to end-of-phase human verification\". They are marked `fixed` on the strength of automated tests."],["Files","`.planning/WINDOWS.md` (rows 8 and 9), `src/web/components/route-progress.tsx`, `src/web/styles/globals.css`"],["Impact","The ledger suggests nothing is outstanding while two real-browser checks (reduced-motion behaviour of the route progress bar, and the scrollbar reveal in both themes) have never been run."],["Fix approach","Run the two checks on the live server and record the result, or reopen the entries."]]},{"title":"Regression tests recorded as debt and not written","fields":[["Issue","The v1.0 retrospective notes three regression tests that were \"noted rather than added\" and carried forward: a ReDoS timing test, a guard against `dangerouslySetInnerHTML` misuse, and a view-mode outline cap."],["Files","`.planning/RETROSPECTIVE.md` (lines 110-111, 137), `src/web/pages/artifact-page.tsx` (line 260 uses `dangerouslySetInnerHTML`)"],["Impact","The safety property the `dangerouslySetInnerHTML` guard would protect (only sanitized HTML reaches that prop) is currently held only by convention."],["Fix approach","Add the guard as a test that fails on any new `dangerouslySetInnerHTML` outside an allowlist of files."]]},{"title":"Open test-hygiene warnings","fields":[["Issue","`.planning/STATE.md` (line 202) lists five test-hygiene review warnings still open from Phase 6. WR-02 is the one it calls worth fixing first: the no-skips scan's comment blanker hides test headers that appear after `//` inside string literals."],["Files","`.planning/STATE.md`, `test/` (the no-skips scan lives in the test gate tooling, `test/helpers/vitest-gate.mjs`)"],["Impact","The no-skips gate can miss a skipped test whose header sits after a `//` in a string."],["Fix approach","Fix the blanker to tokenise string literals before stripping comments."]]}]},{"h":"Known Bugs","label":"Known bugs","items":[{"title":"Startup mode depends on `NODE_ENV`","fields":[["Symptoms","On a previous occasion the tunnel origin ran `node src/server/index.ts` with `NODE_ENV` unset. The server then served the Vite dev middleware instead of `./dist`, and the first page load took roughly 12 seconds over a 150 ms round trip."],["Files","`src/server/index.ts` (production flag is derived from `process.env.NODE_ENV === 'production'`), `package.json` (the `dev` script runs `node src/server/index.ts` directly)"],["Trigger","Running the entry file without `NODE_ENV=production` in any deployed or tunnelled context."],["Workaround","Use `npm start` (sets `NODE_ENV=production`). The root cause is recorded in `.planning/debug/knowledge-base.md` under `loading-state-regression`."],["Fix approach","Make the mode an explicit flag on the entry point, or refuse to serve the dev middleware when a non-loopback `LABELORE_ALLOWED_HOSTS` entry is set."]]}]},{"h":"Performance Bottlenecks","label":"Performance","items":[{"title":"Full snapshot rebuilt per project load (inferred)","fields":[["Problem","Loading a project reads and parses every `.planning/` file, then builds a search index and a route table. The code shape suggests this happens on each load and each refresh, with no incremental path."],["Files","`src/planning-repo/snapshot.ts`, `src/server/search-index.ts`, `src/server/artifact-index.ts`, `src/presentation/route-table.ts`"],["Cause","No file watcher ships in v1 (CLAUDE.md lists it as a future direction). Each load is a full read."],["Improvement path","Cache per-file parse results keyed by path and mtime. This would also be the seam the planned watcher needs. Measure first on a large real project; this has not been timed."]]},{"title":"Synchronous filesystem calls on the server path","fields":[["Problem","`src/server/settings-store.ts` uses `readFileSync`, `writeFileSync`, `renameSync` and `realpathSync` inside request handlers. There are 13 `*Sync` calls across `src/server/`."],["Files","`src/server/settings-store.ts`, `src/server/remote-source.ts`, `src/server/sketch-files.ts`"],["Cause","The settings file is small, so the block is short. It is still a block on the single event loop."],["Improvement path","Low priority. Move the settings read to `fs/promises` if settings grow."]]},{"title":"Remote mirror runs on the request path","fields":[["Problem","An ssh mirror of a remote project can take up to 120 seconds, and the mirror lives in the same process that serves other projects."],["Files","`src/server/remote-source.ts`"],["Cause","The mirror is awaited inside the project load."],["Improvement path","Show the cached snapshot while a refresh runs in the background, and report the refresh state separately."]]}]},{"h":"Fragile Areas","label":"Fragile areas","items":[{"title":"Regex-driven parsing of free-form markdown","fields":[["Files","`src/presentation/project-research.ts`, `src/presentation/project-research-panels.ts`, `src/rendering/plan-segments.ts`, `src/presentation/sketches.ts`, `src/presentation/references.ts`"],["Why fragile","Many patterns match prose that GSD generates, such as `Phase N` labels, `**Bold:**` leads, em-dash separated clauses and \"mitigated\" phrasing. Each is length-capped (`{1,200}`, `{40,}`), which limits backtracking, but an edit to the source artifact wording silently changes what gets extracted."],["Safe modification","Add a fixture-based test for each pattern before changing it. The fixtures live under `fixtures/`. Do not loosen a length cap without a timing test."],["Test coverage","Unit tests exist for the presentation layer. The ReDoS timing test named in the retrospective is missing."]]},{"title":"Source-text contract tests with an implicit oracle","fields":[["Files","`test/web/loading-state-contract.test.ts`, and others of the same kind"],["Why fragile","These tests assert that a file contains certain identifiers. They pass when the parts exist but are not wired together. The loading-state regression shipped while this suite was green, and the knowledge base records it (`.planning/debug/knowledge-base.md`)."],["Safe modification","Prefer behavioural tests that drive the unit with no DOM, as `test/web/route-chunk-store.test.ts` does. Do not add new source-text assertions where a behavioural test can be written."],["Test coverage","Behavioural coverage of the route chunk store is good. Source-text tests still carry the most weight in the loading and shell contracts."]]},{"title":"Frontmatter parsing","fields":[["Files","`src/planning-repo/frontmatter.ts`"],["Why fragile","`gray-matter` is called inside a try block, and the file explains that a pre-parse cache entry survives a throw. This is handled today, but the cache behaviour is subtle."],["Safe modification","Keep every call on `tryParseFrontmatter`. Do not call `matter()` directly outside that function."]]},{"title":"Settings file write path","fields":[["Files","`src/server/settings-store.ts`"],["Why fragile","Writes go to a temp file, then rename over `settings.json`, with a `.bak` copy made from the existing file. The `wx` flag and the realpath check are what prevent a symlink from redirecting the write. Either can be removed in a refactor without any test failing."],["Safe modification","Keep the realpath check and the `wx` flag together. Add a test that places a symlink at `settings.json` and asserts that the write is refused."]]}]},{"h":"Scaling Limits","label":"Scaling limits","items":[{"title":"Project count and project size","fields":[["Current capacity","Not measured. The fixture corpus (`fixtures/`) and the Labelore repository are the largest known inputs."],["Limit","Unknown. The full-read design (see Performance Bottlenecks) will grow linearly with the number of `.planning/` files."],["Scaling path","Per-file caching keyed on path and mtime, then the watcher."]]},{"title":"Remote mirror size","fields":[["Current capacity","120-second timeout, no byte cap."],["Limit","Local temp disk space, and the timeout for large trees."],["Scaling path","Byte cap, and a mirror that copies only the directories the reader needs."]]}]},{"h":"Dependencies at Risk","label":"Dependencies at risk","items":[{"title":"TypeScript and tooling version split","fields":[["Risk","The project pins `typescript` 5.9.3 while the research recorded TypeScript 7.0.2 as the dist-tag latest. Editor and lint tooling may lag if the project moves."],["Impact","Upgrading later means checking `typescript-eslint` and the editor integration together."],["Migration plan","Stay on 5.x until `typescript-eslint` has a stated 7.x support line, then upgrade both in one change."]]},{"title":"`gray-matter` and `hast-util-sanitize` version coupling","fields":[["Risk","`hast-util-sanitize` is a direct dependency and must match the schema shape that `rehype-sanitize` 6.0.0 expects. A mismatch would silently change what the schema allows."],["Impact","Sanitize could start accepting markup it currently strips."],["Migration plan","Bump the two together and run the sanitizer test (see Security Considerations) before accepting the change."]]}]},{"h":"Missing Critical Features","label":"Missing features","items":[{"title":"No runtime guard that the reader stays read-only","fields":[["Problem","The read-only boundary is enforced by convention and by `test/portability.test.ts`, which holds the list of `node:fs` importers to exactly `src/planning-fs/local-fs.ts` and `src/server/settings-store.ts`. Nothing stops a new importer from being added without that test being updated."],["Blocks","Write-back (a named future direction) will need this boundary to be explicit, not just tested."]]},{"title":"No health surface for a degraded snapshot","fields":[["Problem","Unknown or malformed GSD artifacts degrade to warnings in the snapshot (`src/planning-repo/warnings.ts`). The UI does not offer a single place to see every warning across projects."],["Blocks","Diagnosing GSD format drift across many projects requires opening each one."]]}]},{"h":"Test Coverage Gaps","label":"Test coverage gaps","items":[{"title":"Markdown sanitizer end-to-end","fields":[["What's not tested","The full pipeline's handling of hostile raw HTML and `javascript:` URLs, against the actual schema."],["Files","`src/rendering/markdown.ts`"],["Risk","A schema edit could re-enable script or event-handler attributes without any test failing."],["Priority","High"]]},{"title":"ReDoS timing on presentation regexes","fields":[["What's not tested","Pathological input timing for the regexes in `src/presentation/` and `src/rendering/plan-segments.ts`. Named as debt in `.planning/RETROSPECTIVE.md`."],["Files","`src/presentation/project-research-panels.ts`, `src/rendering/plan-segments.ts`"],["Risk","A long adversarial line in a planning file could stall the server's event loop."],["Priority","Medium"]]},{"title":"Remote mirror failure paths","fields":[["","What's not tested (not confirmed by a test search in this pass): Behaviour when `tar` is missing, when ssh exits 255 mid-stream, and when the temp directory is left behind after a crash."],["Files","`src/server/remote-source.ts`, `src/cli/remote-target.ts`"],["Risk","Leftover plaintext mirrors (see Security Considerations)."],["Priority","High"]]},{"title":"Settings symlink refusal","fields":[["","What's not tested (not confirmed by a test search in this pass): A symlink placed at `settings.json` or at the settings directory."],["Files","`src/server/settings-store.ts`"],["Risk","Writes could be redirected outside the settings directory."],["Priority","Medium"]]}]}],"intro":["Scope: the full repository, excluding `.claude/worktrees` and `node_modules`. Findings come from reading the source, the planning ledgers (`.planning/WINDOWS.md`, `.planning/RETROSPECTIVE.md`, `.planning/STATE.md`, `.planning/debug/knowledge-base.md`) and grep sweeps for risky APIs. No runtime or load testing was performed, so performance items are inferred from code shape and are marked as such."]},"tidemark":{"sections":[{"h":"Security Considerations","label":"Security","items":[{"title":"Emailed codes never expire early","fields":[["Risk","A sign-in code stays valid for a full day even after it has been used"],["Files","`server/berths/auth.ts`"],["Current mitigation","Codes are six digits and rate limited per address"],["Recommendations","Mark a code as spent on first use"]]},{"title":"Staff session cookie","fields":[["Risk","The cookie is not marked secure when the proxy terminates TLS"],["Files","`server/office/auth.ts`"],["Current mitigation","The proxy redirects every plain request"],["Recommendations","Read the forwarded protocol header and set the flag"]]}]},{"h":"Tech Debt","label":"Tech debt","items":[{"title":"Window rebuild on every refresh","fields":[["Issue","The tide job deletes and rewrites all windows instead of changing the ones that moved"],["Files","`server/tides/refresh.ts`, `server/store/index.ts`"],["Impact","A request checked during a refresh can see no window at all"],["Fix approach","Write the new windows in one transaction and swap them in"]]},{"title":"Two copies of the overlap rule","fields":[["Issue","The board repeats the clash check so it can grey out dates early"],["Files","`board/components/RequestForm/index.tsx`, `server/store/clash.ts`"],["Impact","A rule change must land in two places"],["Fix approach","Serve the blocked dates from the server and drop the copy"]]},{"title":"Staff login shared by the whole office","fields":[["Issue","One password is used by every member of staff"],["Files","`server/office/auth.ts`"],["Impact","No record of who confirmed a request"],["Fix approach","Give each staff member a code sign-in like the owners"]]}]},{"h":"Known Bugs","label":"Known bugs","items":[{"title":"Confirmation mail sent twice","fields":[["Symptoms","An owner receives two notes when the office confirms and then edits a request"],["Files","`server/office/routes.ts`"],["Trigger","Confirm a request, then change its dates within one minute"],["Workaround","Edit the dates first, then confirm"]]}]},{"h":"Performance Bottlenecks","label":"Performance","items":[{"title":"Berth list for a long date range","fields":[["Problem","A query for a whole season loads every request and filters in memory"],["Files","`server/berths/routes.ts`"],["Cause","The range filter runs after the load, not in the query"],["Improvement path","Push the range into the SQL where clause"]]},{"tit function parseTree2(text) {
