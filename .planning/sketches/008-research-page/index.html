<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 008 — RESEARCH page</title>
<link rel="stylesheet" href="../themes/default.css?v=008">
<style>
/* Sketch 008: the RESEARCH.md page view. Shell atoms copied from 006/007; every colour, size and
   space comes from ../themes/default.css. Section renderers are shared across the three variants;
   only the arrangement differs, so the comparison is about layout, not about one variant having
   better parts. 009 (figures) and 010 (audit) refine two of these parts afterwards. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: var(--fs-5); line-height: var(--lh-normal); padding-top: 3rem; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--font-mono); font-size: 0.88em; padding: 0 0.2em; background: color-mix(in oklch, var(--muted) 70%, transparent); overflow-wrap: anywhere; }
strong { font-weight: var(--fw-semibold); }
a { color: inherit; }

#variant-nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; gap: var(--space-1); align-items: center; padding: var(--space-2) var(--space-4); background: var(--background); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; overflow-x: auto; }
#variant-nav .label { color: var(--muted-foreground); margin-right: var(--space-2); white-space: nowrap; }
.variant-tab { padding: var(--space-1-5) var(--space-3); border: 1px solid transparent; background: none; white-space: nowrap; letter-spacing: inherit; text-transform: inherit; font-size: inherit; color: var(--muted-foreground); transition: all .15s ease; }
.variant-tab:hover { color: var(--foreground); background: var(--state-hover); }
.variant-tab.active { color: var(--primary); border-color: color-mix(in oklch, var(--primary) 65%, var(--border)); background: var(--primary-tint); }
.shell-header { display: flex; align-items: center; gap: var(--space-4); height: 3.75rem; padding: 0 var(--space-4); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.brand-mark { width: 2.25rem; height: 2.25rem; background: var(--primary); display: grid; place-items: center; color: white; font-weight: 700; }
#frame { margin: 0 auto; container-type: inline-size; transition: max-width .2s ease; background: var(--background); min-height: 100vh; }
#frame.narrow-frame { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.page { width: min(80rem, 100%); margin: 0 auto; padding: var(--space-fluid-10) var(--space-fluid-8) var(--space-28); display: grid; gap: var(--space-fluid-9); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--foreground); color: var(--background); padding: var(--space-2) var(--space-4); font-family: var(--font-mono); font-size: var(--fs-2); z-index: 9999; animation: fade .15s ease; }
.fade { animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

/* ---------- shared vocabulary ---------- */
.eyebrow { color: var(--primary); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-widest); text-transform: uppercase; }
.label { display: flex; gap: var(--space-2); align-items: baseline; margin-bottom: var(--space-3); color: var(--muted-foreground); font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.label.accent { color: var(--primary); }
.label .count { color: var(--muted-foreground); font-weight: var(--fw-medium); }
.label .aside { margin-left: auto; font-weight: var(--fw-medium); }
.muted { color: var(--muted-foreground); }
.mono-note { color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.panel { border: 1px solid var(--border); background: var(--card-veil); padding: var(--space-fluid-3); min-width: 0; }
.panel.accent { border-top: 3px solid var(--primary); box-shadow: 0.7rem 0.7rem 0 color-mix(in oklch, var(--muted) 65%, transparent); }
.panel.amber { border-top: 3px solid oklch(0.75 0.15 75); }
.section-heading { display: flex; gap: var(--space-4); align-items: flex-end; justify-content: space-between; min-width: 0; padding-bottom: var(--space-3); margin-bottom: var(--space-5); border-bottom: 1px solid var(--border); scroll-margin-top: 4.5rem; }
.section-heading h2 { font-family: var(--font-mono); font-size: var(--fs-fluid-3); font-weight: var(--fw-medium); letter-spacing: var(--ls-tight); }
.section-heading .num { color: var(--muted-foreground); margin-right: var(--space-3); }
.section-heading .side { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.sub { margin-top: var(--space-8); }
.sub:first-child { margin-top: 0; }
.chip { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0.1rem var(--space-1-5); border: 1px solid var(--border); font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; white-space: nowrap; color: var(--muted-foreground); background: none; line-height: 1.5; }
.chip[data-tone='accent'] { color: var(--primary); border-color: color-mix(in oklch, var(--primary) 55%, var(--border)); background: var(--primary-tint); }
.chip[data-tone='amber'] { color: oklch(0.74 0.15 75); border-color: color-mix(in oklch, oklch(0.75 0.15 75) 50%, var(--border)); }
.chip[data-tone='red'] { color: var(--destructive); border-color: var(--destructive-border); background: var(--destructive-tint); }
.chip[data-tone='ok'] { color: var(--foreground); }
.chip[data-tone='solid-red'] { color: white; background: var(--destructive); border-color: var(--destructive); }
button.chip { cursor: pointer; transition: all .15s ease; }
button.chip:hover { background: var(--state-hover); }
button.chip[aria-pressed='true'] { color: var(--foreground); border-color: var(--foreground); }
.ev { display: inline-block; margin-left: 0.15em; padding: 0 0.25em; font-family: var(--font-mono); font-size: 0.62em; line-height: 1.4; vertical-align: 0.35em; border: 1px solid var(--border); color: var(--muted-foreground); cursor: help; }
.ev[data-k='A'] { color: oklch(0.74 0.15 75); border-color: color-mix(in oklch, oklch(0.75 0.15 75) 45%, var(--border)); }
body.hide-ev .ev { display: none; }
.link-btn { padding: 0; border: 0; background: none; color: var(--muted-foreground); font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.link-btn:hover { color: var(--primary); }
.src-link { color: var(--primary); text-decoration: underline dotted; text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; }
.src-link:hover { text-decoration-style: solid; }

/* header facts */
.facts { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.facts b { color: var(--foreground); font-weight: var(--fw-medium); }
.domain-line { font-size: var(--fs-3); color: var(--muted-foreground); max-width: 72ch; }
.domain-line .k { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; margin-right: var(--space-2); opacity: .8; }
.conf-btn { display: inline-flex; gap: var(--space-1-5); align-items: center; }
.conf-pop { margin-top: var(--space-3); display: grid; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); background: var(--card); max-width: 46rem; }
.conf-row { display: grid; grid-template-columns: 10rem 7.5rem minmax(0, 1fr); gap: var(--space-3); align-items: baseline; font-size: var(--fs-3); }
.conf-row .area { font-family: var(--font-heading); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.conf-row .note { color: var(--muted-foreground); }
@container (max-width: 640px) { .conf-row { grid-template-columns: 1fr auto; } .conf-row .note { grid-column: 1 / -1; } }
.meter { display: inline-flex; gap: 2px; vertical-align: middle; }
.meter i { width: 0.55rem; height: 0.55rem; border: 1px solid var(--border); }
.meter i.on { background: var(--primary); border-color: var(--primary); }
.meter[data-l='mid'] i.on { background: oklch(0.75 0.15 75); border-color: oklch(0.75 0.15 75); }
.meter[data-l='low'] i.on { background: var(--destructive); border-color: var(--destructive); }

/* summary */
.summary-lead { font-family: var(--font-sans); font-size: var(--fs-6); line-height: var(--lh-relaxed); max-width: 70ch; }
.summary-rest { display: grid; gap: var(--space-4); margin-top: var(--space-4); color: var(--muted-foreground); font-size: var(--fs-4); max-width: 72ch; }
.reco { border-left: 3px solid var(--primary); padding: var(--space-3) var(--space-4); background: var(--primary-tint); font-size: var(--fs-4); max-width: 72ch; }
.reco .k { display: block; margin-bottom: var(--space-1); }

/* stack */
.pkg-list { list-style: none; padding: 0; display: grid; }
.pkg { display: grid; grid-template-columns: minmax(12rem, 16rem) minmax(0, 1fr); gap: var(--space-1) var(--space-5); padding: var(--space-3) 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 70%, transparent); }
.pkg:last-child { border-bottom: 0; }
.pkg .id { display: grid; gap: var(--space-1); align-content: start; }
.pkg .name { font-family: var(--font-mono); font-size: var(--fs-4); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.pkg .ver { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); }
.pkg .purpose { font-size: var(--fs-4); }
.pkg .why { margin-top: var(--space-1); color: var(--muted-foreground); font-size: var(--fs-3); }
@container (max-width: 640px) { .pkg { grid-template-columns: 1fr; } }
.stack-intro { color: var(--muted-foreground); font-size: var(--fs-3); max-width: 72ch; margin-bottom: var(--space-5); }
.alt-list { list-style: none; padding: 0; display: grid; gap: var(--space-3); }
.alt { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--space-2) var(--space-4); align-items: baseline; padding: var(--space-3); border: 1px solid var(--border); }
.alt .chosen { font-size: var(--fs-4); font-weight: var(--fw-medium); }
.alt .over { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--muted-foreground); letter-spacing: var(--ls-wider); text-transform: uppercase; }
.alt .other { font-size: var(--fs-4); color: var(--muted-foreground); display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: baseline; }
.alt .other.struck > span:first-child { text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--muted-foreground) 70%, transparent); }
.alt .trade { grid-column: 1 / -1; font-size: var(--fs-3); color: var(--muted-foreground); }
.alt[data-v='harmful'] { border-color: var(--destructive-border); }
@container (max-width: 640px) { .alt { grid-template-columns: 1fr; } }

/* audit strip */
.audit-strip { display: grid; gap: var(--space-4); }
.audit-bar { display: flex; height: 0.6rem; border: 1px solid var(--border); }
.audit-bar span { display: block; height: 100%; }
.audit-bar .ok { background: color-mix(in oklch, var(--foreground) 35%, transparent); }
.audit-bar .sus { background: oklch(0.75 0.15 75); }
.audit-bar .slop { background: var(--destructive); }
.audit-counts { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); font-family: var(--font-mono); font-size: var(--fs-2); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.audit-counts b { font-size: var(--fs-5); font-weight: var(--fw-medium); color: var(--foreground); margin-right: var(--space-1); }
.audit-counts .sus b { color: oklch(0.74 0.15 75); }
.audit-counts .slop b { color: var(--destructive); }
.removed { display: grid; gap: var(--space-2); }
.removed-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-1) var(--space-3); padding: var(--space-3); border: 1px solid var(--destructive-border); background: var(--destructive-tint); }
.removed-card .n { font-family: var(--font-mono); font-size: var(--fs-4); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--destructive); }
.removed-card .r { grid-column: 2; color: var(--muted-foreground); font-size: var(--fs-3); }
.removed-card .rb { grid-column: 2; font-size: var(--fs-3); }
.sus-row { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; }
.sus-name { font-family: var(--font-mono); font-size: var(--fs-2); padding: 0.1rem var(--space-1-5); border: 1px solid color-mix(in oklch, oklch(0.75 0.15 75) 45%, var(--border)); color: var(--foreground); }
.none-line { font-size: var(--fs-3); color: var(--muted-foreground); }
.synthetic { display: inline-block; margin-left: var(--space-2); padding: 0 var(--space-1); font-family: var(--font-mono); font-size: var(--fs-1); color: #fff; background: #7c3aed; letter-spacing: var(--ls-wider); }
.data-table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: var(--fs-3); }
.data-table th { text-align: left; padding: 0 var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--border); font-family: var(--font-heading); font-size: var(--fs-1); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); white-space: nowrap; }
.data-table td { padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); vertical-align: top; }
.data-table td.mono { font-family: var(--font-mono); white-space: nowrap; }
.data-table tr[data-v='SUS'] td:first-child { box-shadow: inset 2px 0 0 oklch(0.75 0.15 75); padding-left: var(--space-2); }
.data-table tr[data-v='SLOP'] td { text-decoration: line-through; color: var(--muted-foreground); }
.data-table tr[data-v='SLOP'] td:first-child { box-shadow: inset 2px 0 0 var(--destructive); padding-left: var(--space-2); }
.data-table tr:hover td { background: var(--state-hover); }

/* figures */
.figure { border: 1px solid var(--border); background: var(--card); min-width: 0; }
.figure-bar { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
.figure-bar .t { font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); margin-right: auto; }
.figure-body { overflow: auto; padding: var(--space-5); max-height: 34rem; }
.figure-body pre { margin: 0; font-family: 'DejaVu Sans Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.18; color: var(--foreground); width: max-content; }
.figure-body.fit pre { font-size: min(0.78rem, 1.05cqi); }
.g-line { color: color-mix(in oklch, var(--muted-foreground) 70%, transparent); }
.g-arrow { color: var(--primary); }
.figure-cap { padding: var(--space-3); border-top: 1px dashed var(--border); font-size: var(--fs-3); color: var(--muted-foreground); }
.overlay { position: fixed; inset: 0; z-index: 200; background: color-mix(in oklch, var(--background) 92%, transparent); display: grid; place-items: center; padding: var(--space-6); animation: fade .15s ease; }
.overlay .figure { width: min(100%, 90rem); max-height: 92vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.overlay .figure-body { max-height: none; }
.overlay .figure-body pre { font-size: 0.9rem; }
.tree { font-family: var(--font-mono); font-size: var(--fs-3); display: grid; }
.tree-row { display: grid; grid-template-columns: minmax(14rem, max-content) minmax(0, 1fr); gap: var(--space-4); padding: 0.2rem 0; border-bottom: 1px dotted color-mix(in oklch, var(--border) 50%, transparent); align-items: baseline; }
.tree-row:hover { background: var(--state-hover); }
.tree-name { white-space: nowrap; display: flex; align-items: baseline; }
.tree-name .guide { color: color-mix(in oklch, var(--muted-foreground) 55%, transparent); white-space: pre; }
.tree-name .dir { color: var(--primary); background: none; border: 0; padding: 0; font: inherit; }
.tree-name .dir .chev { display: inline-block; width: 1em; color: var(--muted-foreground); transition: transform .15s ease; }
.tree-name .dir[aria-expanded='false'] .chev { transform: rotate(-90deg); }
.tree-note { font-family: var(--font-sans); color: var(--muted-foreground); font-size: var(--fs-3); display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap; }
@container (max-width: 700px) { .tree-row { grid-template-columns: 1fr; gap: 0; } .tree-note { padding-left: 1.5rem; } }

/* patterns toggle */
.seg { display: inline-flex; border: 1px solid var(--border); }
.seg button { padding: var(--space-1) var(--space-3); border: 0; background: none; font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); transition: all .15s ease; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed='true'] { color: var(--primary); background: var(--primary-tint); }
.seg button:hover { background: var(--state-hover); }
.pat-list { list-style: none; padding: 0; display: grid; margin-top: var(--space-4); counter-reset: pat; }
.pat-list li { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: var(--space-2); padding: var(--space-3) 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); counter-increment: pat; }
.pat-list li:last-child { border-bottom: 0; }
.pat-list li::before { content: counter(pat, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-2); color: var(--primary); padding-top: 0.2rem; }
.pat-list.anti li::before { content: '✕'; color: var(--destructive); }
.pat-list .t { font-weight: var(--fw-medium); font-size: var(--fs-4); }
.pat-list .d { display: block; margin-top: var(--space-1); color: var(--muted-foreground); font-size: var(--fs-3); }
.pat-list .w { display: block; margin-top: var(--space-1); font-size: var(--fs-3); }
.pat-list .w::before { content: 'Use when '; font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }

/* don't hand-roll */
.hr-list { list-style: none; padding: 0; display: grid; gap: var(--space-2); }
.hr { display: grid; grid-template-columns: 11rem minmax(0, 1fr) 1.5rem minmax(0, 1fr); gap: var(--space-1) var(--space-3); align-items: baseline; padding: var(--space-3) 0; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); }
.hr:last-child { border-bottom: 0; }
.hr .p { font-family: var(--font-heading); font-size: var(--fs-2); font-weight: var(--fw-semibold); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--muted-foreground); }
.hr .dont { font-size: var(--fs-4); color: var(--muted-foreground); text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--destructive) 70%, transparent); }
.hr .arr { color: var(--primary); font-family: var(--font-mono); }
.hr .use { font-size: var(--fs-4); font-weight: var(--fw-medium); }
.hr .why { grid-column: 2 / -1; font-size: var(--fs-3); color: var(--muted-foreground); }
@container (max-width: 700px) { .hr { grid-template-columns: minmax(0, 1fr) 1.5rem minmax(0, 1fr); } .hr .p { grid-column: 1 / -1; } .hr .why { grid-column: 1 / -1; } }
.insight { margin-top: var(--space-4); padding: var(--space-3) var(--space-4); border: 1px dashed var(--border); font-size: var(--fs-3); }
.insight .k { font-family: var(--font-mono); font-size: var(--fs-1); letter-spacing: var(--ls-wider); text-transform: uppercase; color: var(--primary); margin-right: var(--space-2); }

/* pitfalls */
.pit-list { list-style: none; padding: 0; display: grid; gap: var(--space-3); }
.pit { border: 1px solid var(--border); background: var(--card-veil); }
.pit[data-sev='CRITICAL'] { border-left: 3px solid var(--destructive); }
.pit[data-sev='HIGH'] { border-left: 3px solid oklch(0.75 0.15 75); }
.pit-head { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto; gap: var(--space-3); align-items: baseline; width: 100%; padding: var(--space-3) var(--space-4); border: 0; background: none; text-align: left; }
.pit-head:hover { background: var(--state-hover); }
.pit-head .n { font-family: var(--font-mono); font-size: var(--fs-2); color: var(--muted-foreground); }
.pit-head .t { font-family: var(--font-heading); font-size: var(--fs-5); line-height: var(--lh-snug); }
.pit-head .tags { display: flex; gap: var(--space-1); }
.pit-what { padding: 0 var(--space-4) var(--space-3) calc(2.5rem + var(--space-3) + var(--space-4)); font-size: var(--fs-4); color: var(--muted-foreground); }

<script>
const state = { variant: 'a', doc: 'lab02', audit: 'real', ev: 'show', theme: 'dark', width: 'full',
  open: new Set(), pat: 'patterns', confOpen: false, collapsed: new Set(), overlay: null };

/* ---------- text helpers ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function md(src) {
  if (src == null) return '';
  const ev = [];
  let s = String(src).replace(/\[(VERIFIED|CITED|ASSUMED)(?::\s*([^\]]*))?\]/g, (_, k, v) => { ev.push([k, v || '']); return `\u0001${ev.length - 1}\u0001`; });
  s = esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/(https?:\/\/[^\s<)]+)/g, (u) => `<a class="src-link" href="${u}" target="_blank" rel="noreferrer">${u.replace(/^https?:\/\//, '').replace(/\/$/, '').slice(0, 48)}${u.length > 56 ? '…' : ''}</a>`);
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => { const [k, v] = ev[i]; const L = { VERIFIED: 'V', CITED: 'C', ASSUMED: 'A' }[k]; return `<sup class="ev" data-k="${L}" title="${esc(k.toLowerCase())}${v ? ': ' + esc(v.replace(/`/g, '')) : ''}">${L}</sup>`; });
}
const levelOf = raw => { const r = raw.toUpperCase(); if (/^HIGH/.test(r) && !/MEDIUM/.test(r.split(';')[0])) return 'high'; if (/LOW/.test(r) && !/MEDIUM-LOW|HIGH/.test(r)) return 'low'; if (/^MEDIUM-LOW/.test(r)) return 'low'; if (/^HIGH|^MEDIUM-HIGH/.test(r)) return 'high'; return 'mid'; };
const tone = { high: 'accent', mid: 'amber', low: 'red' };
const meter = lvl => { const n = { high: 3, mid: 2, low: 1 }[lvl]; return `<span class="meter" data-l="${lvl}">${[1,2,3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; };
const confLabel = d => d.confidence.level === 'mixed' ? 'Mixed' : d.confidence.raw.split(/[ —;(]/)[0];
const confLevel = d => d.confidence.level === 'mixed' ? 'mid' : levelOf(d.confidence.raw);
function audit(d) {
  const a = d.audit, syn = state.audit === 'synth' ? SYNTHETIC_AUDIT : null;
  const rows = syn ? [...a.rows, ...syn.rows] : a.rows;
  const slop = syn ? syn.slop : a.slop;
  const sus = rows.filter(r => r[5] === 'SUS').map(r => r[0]);
  return { rows, slop, sus, ok: rows.filter(r => r[5] === 'OK').length, n: rows.length, synthetic: !!syn, a };
}

function glyphs(text) {

function figure(d, which) {

function parseTree(text) {
  const rows = [];
  text.split('\n').forEach(line => {
    const m = line.match(/^([\s│├└─]*)([^#\s][^#]*?)?\s*(?:#\s*(.*))?$/);
    if (!m) return;
    if (!m[2] && m[3] && rows.length) { rows[rows.length - 1].note += ' ' + m[3].trim(); return; }
    if (!m[2]) return;
    const prefix = m[1] || '';
    const depth = Math.round([...prefix].length / 4);
    rows.push({ depth, prefix, name: m[2].trim(), note: (m[3] || '').trim(), dir: /\/$/.test(m[2].trim()) });
  });
  rows.forEach(r => { const b = r.note.match(/^(NEW|EXTEND|EXISTING)\b[:\s—-]*/); if (b) { r.badge = b[1]; r.note = r.note.slice(b[0].length); } });
  return rows;
}
function tree(d) {
  const id = d.treeId, rows = parseTree(document.getElementById(id).textContent);

    if (hideBelow != null && r.depth > hideBelow) return '';
    hideBelow = null;
    const key = id + ':' + i, closed = state.collapsed.has(key);
    if (r.dir && closed) hideBelow = r.depth;
    const bt = { NEW: 'accent', EXTEND: 'amber', EXISTING: '' }[r.badge];
    return `<div class="tree-row"><span class="tree-name"><span class="guide">${esc(r.prefix)}</span>${r.dir ? `<button class="dir" data-collapse="${key}" aria-expanded="${!closed}"><span class="chev">▾</span>${esc(r.name)}</button>` : esc(r.name)}</span>
      <span class="tree-note">${r.badge ? `<span class="chip" data-tone="${bt}">${r.badge.toLowerCase()}</span>` : ''}${md(r.note)}</span></div>`;
  }).join('');
  return `<div class="tree">${out}</div><p class="muted" style="margin-top:var(--space-3);font-size:var(--fs-3);max-width:72ch">${md(d.treeNote)}</p>`;
}

        <div class="kv"><span class="k">Researched</span><span>${d.researched}</span></div>
        <div class="kv"><span class="k">Confidence</span><span><span class="chip" data-tone="${tone[lvl]}">${esc(confLabel(d))}</span></span>
          <div class="b-conf" style="margin-top:var(--space-2)">${d.breakdown.map(b => { const l = levelOf(b.level); return `<div class="r" title="${esc(b.note.replace(/[`*]/g, ''))}"><span>${esc(b.area)}</span>${meter(l)}</div>`; }).join('')}</div></div>
        <div class="kv"><span class="k">Domain</span><span class="muted">${md(d.domain)}</span></div>
      </div>
      <nav><ol class="b-outline">${out.map(([id, t, c]) => id === 'div' ? `<li class="div">${t}</li>` : `<li><button data-jump="${id}"><span>${t}</span><span class="c">${c}</span></button></li>`).join('')}</ol></nav>
    </aside>
    <div class="b-body">
      <section id="b-sum">${summary(d, { lead: false, all: false })}<div style="margin-top:var(--space-4)">${reco(d)}</div></section>
      <section id="b-stack">${secHead('', '', 'Standard stack')}${d.stackIntro ? `<p class="stack-intro">${md(d.stackIntro)}</p>` : ''}
        <p class="label accent">Core <span class="count">${d.core.length}</span></p>${tbl(d.core)}
        <p class="label" style="margin-top:var(--space-6)">Supporting <span class="count">${d.supporting.length}</span></p>${tbl(d.supporting)}</section>
      <section id="b-alt">${secHead('', '', 'Alternatives considered')}${altList(d)}</section>
      <section id="b-audit">${secHead('', '', 'Package legitimacy audit')}${auditStrip(d)}</section>
      <section id="b-diagram">${secHead('', '', 'System architecture diagram')}${figure(d, 'diagram')}</section>
      <section id="b-tree">${secHead('', '', 'Directory structure')}${tree(d)}</section>
      <section id="b-pat">${secHead('', '', 'Patterns')}${patterns(d)}</section>
      <section id="b-hr">${secHead('', '', "Don't hand-roll")}${handroll(d)}</section>
      <section id="b-pit">${secHead('', '', 'Common pitfalls', `<button class="chip" data-expand-pits="1">Expand all</button>`)}<div class="b-pit">${pitfalls(d)}</div></section>
      <section id="b-q">${secHead('', '', d.questionsHeading)}${questions(d)}</section>
      <section id="b-env">${secHead('', '', 'Environment availability')}${envTable(d)}</section>
      <section id="b-src">${secHead('', '', 'Sources')}${sources(d, { collapsed: false })}</section>
      <section id="b-back">${secHead('', '', 'Back matter')}${backMatter(d)}<div style="margin-top:var(--space-6)">${sourceOnly(d)}</div></section>
    </div></div>`;
}

/* ================= C: dashboard ================= */
function variantC(d) {
  const A = audit(d), sev = pitSev(d), lvl = confLevel(d), nSlop = A.rows.filter(r => r[5] === 'SLOP').length;
  return `<header class="c-top">
      <p class="eyebrow">Research · ${d.phase} · ${d.project}</p>
      <h1>${esc(d.title)}</h1>
      ${header(d)}
      ${domainLine(d)}
    </header>
    <div class="c-tiles">
      <button class="c-tile" data-conf="1"><span class="k">Confidence</span><span class="v" style="font-size:var(--fs-6)">${esc(confLabel(d))}</span><span class="s">${meter(lvl)} ${d.breakdown.length} areas rated</span></button>
      <button class="c-tile" data-jump="c-stack"><span class="k">Stack entries</span><span class="v">${d.core.length + d.supporting.length}</span><span class="s">${d.core.length} core · ${d.supporting.length} supporting</span></button>
      <button class="c-tile ${nSlop ? 'bad' : A.sus.length ? 'warn' : ''}" data-jump="c-audit"><span class="k">Legitimacy</span><span class="v">${nSlop ? nSlop + '<small>removed</small>' : A.sus.length ? A.sus.length + '<small>sus</small>' : 'clean'}</span><span class="s">${A.n} checked${nSlop && A.sus.length ? ` · ${A.sus.length} sus` : ''}</span></button>
      <button class="c-tile ${sev.CRITICAL ? 'bad' : ''}" data-jump="c-pit"><span class="k">Pitfalls</span><span class="v">${d.pitfalls.length}</span><span class="s">${Object.keys(sev).length ? Object.entries(sev).map(([k, v]) => `${v} ${k.toLowerCase()}`).join(' · ') : 'unrated'}</span></button>
      <button class="c-tile ${openQ(d) ? 'warn' : ''}" data-jump="c-q"><span class="k">Open questions</span><span class="v">${openQ(d)}<small>/ ${d.questions.length}</small></span><span class="s">${openQ(d) ? 'need answers before planning' : 'all resolved'}</span></button>
      <button class="c-tile ${blocking(d) ? 'bad' : ''}" data-jump="c-env"><span class="k">Environment</span><span class="v">${missing(d)}<small>missing</small></span><span class="s">${blocking(d) ? blocking(d) + ' blocking' : 'fallbacks exist'}</span></button>
    </div>
    <section class="c-hero"><div>${summary(d)}</div><div>${reco(d)}</div></section>
    <div class="c-grid">
      <section class="panel accent w4" id="c-stack"><p class="label accent">Standard stack</p>${stack(d, { alts: false })}</section>
      <section class="panel w2 ${nSlop ? '' : A.sus.length ? 'amber' : ''}" id="c-audit" style="${nSlop ? 'border-top:3px solid var(--destructive)' : ''}"><p class="label">Package legitimacy</p>${auditStrip(d)}</section>
      <section class="panel w6"><p class="label">Alternatives considered <span class="count">${d.alternatives.length}</span></p>${altList(d)}</section>
      <section class="panel w6" id="c-arch"><p class="label">Architecture</p>${figure(d, 'diagram')}
        <div class="sub"><p class="label">Directory structure</p>${tree(d)}</div></section>
      <section class="panel"><p class="label" style="margin-bottom:0"></p>${patterns(d)}</section>
      <section class="panel"><p class="label">Don't hand-roll <span class="count">${d.handroll.length}</span></p>${handroll(d)}</section>
      <section class="panel w6" id="c-pit"><p class="label">Common pitfalls <span class="count">${d.pitfalls.length}</span></p>${pitfalls(d)}</section>
      <section class="panel amber" id="c-q"><p class="label">${esc(d.questionsHeading)}</p>${questions(d)}</section>
      <section class="panel" id="c-env"><p class="label">Environment</p>${envTable(d)}</section>
      <section class="panel w6"><p class="label">Sources</p>${sources(d)}</section>
    </div>
    <section><p class="label">Back matter</p>${backMatter(d)}</section>
    ${sourceOnly(d)}`;
}

/* ---------- shell ---------- */
const RENDER = { a: variantA, b: variantB, c: variantC };
const $root = document.getElementById('root');
function render() {
  const d = DOCS[state.doc];
  $root.innerHTML = `<div class="page fade">${RENDER[state.variant](d)}</div>` + (state.overlay ? overlay(d) : '');
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  document.body.classList.toggle('hide-ev', state.ev === 'hide');
  const f = document.getElementById('frame');
  f.style.maxWidth = state.width === 'full' ? 'none' : state.width + 'px';
  f.classList.toggle('narrow-frame', state.width !== 'full');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.toggle('active', t.dataset.variant === state.variant));
  document.querySelectorAll('#sketch-tools button').forEach(b => b.classList.toggle('on', b.dataset.doc === state.doc || b.dataset.theme === state.theme || b.dataset.width === state.width || b.dataset.audit === state.audit || b.dataset.ev === state.ev));
  trackOutline();
}
function overlay(d) {
  const text = document.getElementById(state.overlay).textContent;
  return `<div class="overlay" data-close="1"><figure class="figure"><div class="figure-bar"><span class="t">System architecture</span><button class="chip" data-close="1">Close ✕</button></div><div class="figure-body"><pre>${glyphs(text)}</pre></div></figure></div>`;
}
let obs;
function trackOutline() {
  if (obs) obs.disconnect();
  const btns = document.querySelectorAll('.b-outline button');
  if (!btns.length) return;
  obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) btns.forEach(b => b.classList.toggle('active', b.dataset.jump === e.target.id)); }), { rootMargin: '-15% 0px -75% 0px' });
  document.querySelectorAll('.b-body > section').forEach(s => obs.observe(s));
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1400); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.overlay) { state.overlay = null; render(); } });
document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const t = e.target.closest('button, [data-close]');
  if (!t) return;
  if (t.dataset.close && (e.target === t || t.tagName === 'BUTTON')) { state.overlay = null; render(); return; }
  if (t.dataset.goto) { toast('Would open ' + t.dataset.goto); return; }
  if (t.dataset.jump) { document.getElementById(t.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.overlay) { state.overlay = t.dataset.overlay; render(); return; }
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.open.clear(); state.confOpen = false; window.scrollTo(0, 0); }
  else if (t.dataset.doc) { state.doc = t.dataset.doc; state.open.clear(); state.collapsed.clear(); state.confOpen = false; }
  else if (t.dataset.audit) state.audit = t.dataset.audit;
  else if (t.dataset.ev) state.ev = t.dataset.ev;
  else if (t.dataset.theme) state.theme = t.dataset.theme;
  else if (t.dataset.width) state.width = t.dataset.width;
  else if (t.dataset.conf) state.confOpen = !state.confOpen;
  else if (t.dataset.pat) state.pat = t.dataset.pat;
  else if (t.dataset.expandPits) { const d = DOCS[state.doc]; const all = d.pitfalls.every((_, i) => state.open.has('pit' + i)); d.pitfalls.forEach((_, i) => all ? state.open.delete('pit' + i) : state.open.add('pit' + i)); }
  else if (t.dataset.open) { const k = t.dataset.open; state.open.has(k) ? state.open.delete(k) : state.open.add(k); }
  else if (t.dataset.collapse) { const k = t.dataset.collapse; state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k); }
  else return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
});
render();
</script>
</body>
</html>
