<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Labelore" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('labelore-theme');
          document.documentElement.classList.toggle('dark', storedTheme !== 'light');
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* One-time semantic-token snapshot copied from Studio Portal preset b3Dqcuo4na. */
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --card-foreground: var(--foreground);
        --popover: oklch(1 0 0);
        --popover-foreground: var(--foreground);
        --primary: oklch(0.553 0.195 38.402);
        --primary-foreground: oklch(0.98 0.016 73.684);
        --secondary: oklch(0.967 0.001 286.375);
        --secondary-foreground: oklch(0.21 0.006 285.885);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.49 0 0);
        --destructive: oklch(0.577 0.245 27.325);
        --border: oklch(0.885 0 0);
        --input: oklch(0.9 0 0);
        --ring: var(--primary);
        --sidebar: oklch(0.972 0 0);
        --sidebar-foreground: var(--foreground);
        --sidebar-primary: color-mix(in oklch, var(--primary) 11%, transparent);
        --sidebar-primary-foreground: var(--sidebar-foreground);
        --sidebar-accent: color-mix(in oklch, var(--sidebar-foreground) 6%, transparent);
        --sidebar-accent-foreground: oklch(0.205 0 0);
        --sidebar-border: oklch(0.875 0 0);
        --font-sans:
          'Space Grotesk', 'Avenir Next', Avenir, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-heading: var(--font-mono);
        --font-mono:
          'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas,
          'Liberation Mono', monospace;
        color: var(--foreground);
        background: var(--background);
        color-scheme: light;
        font-family: var(--font-sans);
        font-synthesis: none;
      }

      /* `.dark`, never `:root.dark`: at (0,1,0) this ties with globals.css `.dark`, and the later
         stylesheet wins, so this snapshot only paints before hydration. `:root.dark` (0,2,0)
         out-specified globals.css and shadowed every dark token after load (WINDOWS.md entry 7). */
      .dark {
        --background: oklch(0.125 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.215 0 0);
        --popover: oklch(0.205 0 0);
        --primary: oklch(0.47 0.157 37.304);
        --secondary: oklch(0.274 0.006 286.033);
        --secondary-foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.75 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 16%);
        --input: oklch(1 0 0 / 19%);
        --ring: oklch(0.56 0.157 37.304);
        --sidebar: oklch(0.175 0 0);
        --sidebar-accent-foreground: oklch(0.985 0 0);
        --sidebar-border: oklch(1 0 0 / 16%);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--foreground);
        background: var(--background);
        font-weight: 400;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        font-family: var(--font-heading);
      }

      h1 {
        max-width: 18ch;
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 5.6rem);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 0.95;
      }

      .lede {
        max-width: 44rem;
        margin: 1.25rem 0 0;
        color: var(--muted-foreground);
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.6;
      }

      strong {
        font-weight: 600;
      }
    </style>
    <title>Labelore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
