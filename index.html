<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('gsd-lore-theme');
          const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle(
            'dark',
            storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark),
          );
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* One-time semantic-token snapshot copied from Studio Portal preset b3Dqcuo4na. */
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.145 0 0);
        --popover: oklch(1 0 0);
        --popover-foreground: oklch(0.145 0 0);
        --primary: oklch(0.553 0.195 38.402);
        --primary-foreground: oklch(0.98 0.016 73.684);
        --secondary: oklch(0.967 0.001 286.375);
        --secondary-foreground: oklch(0.21 0.006 285.885);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --accent: oklch(0.97 0 0);
        --accent-foreground: oklch(0.205 0 0);
        --destructive: oklch(0.577 0.245 27.325);
        --border: oklch(0.922 0 0);
        --input: oklch(0.922 0 0);
        --ring: oklch(0.708 0 0);
        --chart-1: oklch(0.87 0 0);
        --chart-2: oklch(0.556 0 0);
        --chart-3: oklch(0.439 0 0);
        --chart-4: oklch(0.371 0 0);
        --chart-5: oklch(0.269 0 0);
        --radius: 0.625rem;
        --sidebar: oklch(0.985 0 0);
        --sidebar-foreground: oklch(0.145 0 0);
        --sidebar-primary: oklch(0.646 0.222 41.116);
        --sidebar-primary-foreground: oklch(0.98 0.016 73.684);
        --sidebar-accent: oklch(0.97 0 0);
        --sidebar-accent-foreground: oklch(0.205 0 0);
        --sidebar-border: oklch(0.922 0 0);
        --sidebar-ring: oklch(0.708 0 0);
        --font-sans:
          'Space Grotesk', 'Avenir Next', Avenir, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-heading:
          'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', ui-monospace, monospace;
        color: var(--foreground);
        background: var(--background);
        color-scheme: light;
        font-family: var(--font-sans);
        font-synthesis: none;
      }

      :root.dark {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0);
        --card-foreground: oklch(0.985 0 0);
        --popover: oklch(0.205 0 0);
        --popover-foreground: oklch(0.985 0 0);
        --primary: oklch(0.47 0.157 37.304);
        --primary-foreground: oklch(0.98 0.016 73.684);
        --secondary: oklch(0.274 0.006 286.033);
        --secondary-foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --accent: oklch(0.269 0 0);
        --accent-foreground: oklch(0.985 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 15%);
        --ring: oklch(0.556 0 0);
        --chart-1: oklch(0.87 0 0);
        --chart-2: oklch(0.556 0 0);
        --chart-3: oklch(0.439 0 0);
        --chart-4: oklch(0.371 0 0);
        --chart-5: oklch(0.269 0 0);
        --sidebar: oklch(0.205 0 0);
        --sidebar-foreground: oklch(0.985 0 0);
        --sidebar-primary: oklch(0.705 0.213 47.604);
        --sidebar-primary-foreground: oklch(0.98 0.016 73.684);
        --sidebar-accent: oklch(0.269 0 0);
        --sidebar-accent-foreground: oklch(0.985 0 0);
        --sidebar-border: oklch(1 0 0 / 10%);
        --sidebar-ring: oklch(0.556 0 0);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--foreground);
        background: var(--background);
        font-weight: 400;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .screen {
        width: min(74rem, 100%);
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 4rem);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--sidebar-primary);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        font-family: var(--font-heading);
      }

      h1 {
        max-width: 18ch;
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 5.6rem);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 0.95;
      }

      .lede {
        max-width: 44rem;
        margin: 1.25rem 0 0;
        color: var(--muted-foreground);
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.6;
      }

      .position-card,
      .error-card {
        margin-top: clamp(2rem, 7vw, 5rem);
        border: 1px solid var(--border);
        border-radius: 0;
        color: var(--card-foreground);
        background: var(--card);
      }

      .card-heading,
      .progress-block,
      .metadata {
        padding: clamp(1.2rem, 3vw, 2rem);
      }

      .card-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid var(--border);
      }

      .card-heading h2 {
        margin: 0;
        font-size: clamp(1.3rem, 3vw, 2rem);
        letter-spacing: -0.03em;
      }

      .status {
        flex: none;
        padding: 0.45rem 0.65rem;
        border: 1px solid var(--sidebar-primary);
        border-radius: 0;
        color: var(--sidebar-primary);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .progress-block {
        border-bottom: 1px solid var(--border);
      }

      .progress-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.8rem;
      }

      .progress-track {
        height: 0.55rem;
        overflow: hidden;
        border-radius: 0;
        background: var(--muted);
      }

      .progress-fill {
        height: 100%;
        border-radius: 0;
        background: var(--sidebar-primary);
      }

      .metadata {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: 1.5rem;
        margin: 0;
      }

      .metadata div {
        min-width: 0;
      }

      .metadata dt {
        margin-bottom: 0.35rem;
        color: var(--muted-foreground);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .metadata dd {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 0.95rem;
      }

      .error-card {
        padding: clamp(1.5rem, 4vw, 2.5rem);
        border-left: 0.35rem solid var(--destructive);
      }

      .error-card h2 {
        margin: 0 0 0.75rem;
        color: var(--destructive);
      }

      .muted {
        color: var(--muted-foreground);
      }

      .skeleton {
        min-height: 15rem;
        background: var(--muted);
        animation: pulse 1.3s ease-in-out infinite alternate;
      }

      strong {
        font-weight: 600;
      }

      @keyframes pulse {
        to {
          opacity: 0.52;
        }
      }

      @media (max-width: 36rem) {
        .card-heading {
          display: block;
        }

        .status {
          display: inline-block;
          margin-top: 1rem;
        }
      }
    </style>
    <title>GSD Lore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
